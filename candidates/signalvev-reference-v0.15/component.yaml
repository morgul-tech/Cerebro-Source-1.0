schema: cerebro-component/v1
component:
  id: signalvev-reference-v0.15
  name: Signalvev Reference Implementation Candidate v0.15 (schema/version compatibility gate)
  type: candidate
  version: 0.15.0
  status: isolated-implementation-candidate
  authority: NONE
responsibility:
  primary: >
    Build the schema/version compatibility gate that gives the Subject
    Registry's own `compatibility` field (already present on all seven
    real entries) runtime meaning: unknown version is always a typed
    HOLD, never an improvised fallback, and no version-ordering
    heuristic silently treats a newer-looking unknown version as
    probably compatible. The last of the three "Tredje bolge" (third
    wave) items named in the Human text's own maturation ordering; the
    other two (Communication Flight Recorder, Workload Identity/
    Attestation) already have coverage via v0.3/v0.9 and v0.14.
  explicitly_not:
    - Ikke en erstatning for v0.1s validate_envelope -- skjemaform blir
      fortsatt validert der.
    - Ikke et duplikat av v0.9 eller v0.14 -- de to andre "Tredje
      bolge"-elementene.
    - Ikke et duplikat av v0.1s STAGE_PREDECESSORS/ReceiptTrail --
      unknown_stage_holds anerkjennes eksplisitt som en annen akse.
    - Ikke en NATS-, WireGuard- eller tunnel-implementasjon.
    - Ikke en JetStream-aktivering.
    - Ikke en endring av Boot-, Context State- eller authority-lag.
    - Ikke en endring av v0.1s faktiske registerfil.
    - Ikke et duplikat av noen tidligere kandidat (v0.1 til -v0.14).
dependencies:
  build: []
  runtime: []
  candidate:
    - signalvev-reference-v0.1  # read-only import of load_registry() as a test-time canary (SC7)
  explicitly_no_dependency_on:
    - signalvev-reference-v0.2
    - signalvev-reference-v0.3
    - signalvev-reference-v0.4
    - signalvev-reference-v0.5
    - signalvev-reference-v0.6
    - signalvev-reference-v0.7
    - signalvev-reference-v0.8
    - signalvev-reference-v0.9
    - signalvev-reference-v0.10
    - signalvev-reference-v0.11
    - signalvev-reference-v0.12
    - signalvev-reference-v0.13
    - signalvev-reference-v0.14
interfaces:
  input:
  - >-
    compatibility_policy (str, one of the registry's five real values),
    declared_version (str), known_versions (frozenset of str),
    negotiated (bool, default False), content_type_declared (bool,
    default True)
  output:
  - >-
    ACCEPTED / TYPED_HOLD / NOT_APPLICABLE with a named reason
    (in-process only in this candidate; pure stdlib plus a read-only
    import of v0.1's load_registry())
relationship_to_prior_evidence:
  note: >
    S0/S1 remain the only behavior-real transport evidence, unrelated to
    this candidate. This candidate does not touch transport, registry
    publication tooling, or Drive at all -- it proves an offline
    version-compatibility classification property over caller-supplied
    strings and flags, a narrower claim than "this works against a real
    schema-negotiation handshake."
