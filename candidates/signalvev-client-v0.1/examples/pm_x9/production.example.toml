# BK07 PM-to-X9 binding -- PRODUCTION shape. EXAMPLE ONLY: every value below is a placeholder to be supplied by
# CURRENT_PM + the PM provider/credential custodian (PM coordinates, principals) and Runtime/Infra.
# No secret belongs here. Runtime injects provider/credential objects and fresh control-session readbacks
# in-process; OAuth and openai/session transport metadata alone never establish a role or persisted session.
[pm_x9]
mode = "PRODUCTION"
owner_ref = "CURRENT_PM"
claim_ref = "WORK_CLAIMS:<claim>"
packet_ref = "WORK_PACKETS:<packet>"
queue_ref = "READY_QUEUE:<queue>"
packet_sha256 = "<64 lowercase hex of the exact packet>"
producer_principal = "<scoped producer principal>"
x9_principal = "<scoped X9 principal>"
x9_session_ref = "<X9 receiver session ref>"
attempt_ref = "<attempt ref>"
pointer_ttl_seconds = 900
max_pending_ingress = 64
ports_factory = "providers.pm_x9_live_host:make_ports" # requires explicit enabled LiveRuntimeBindings

# Host-only runtime inputs are intentionally NOT serialized in this file:
# - current PM + X9 results from read_project_control_state (v2 caller and CURRENT_PERSISTED_SESSION)
# - provider-owned PmProjectionBinding and trusted X9 role configuration
# - existing OAuth authenticator, secret/header getter, PostgreSQL connection factory, NATS ClientConfig/connect_fn
# The PM and X9 persisted sessions must be distinct and current on the same project revision.
# A missing/stale/mismatched tuple fails closed before any event send, listener, DB call, or NATS connection.
