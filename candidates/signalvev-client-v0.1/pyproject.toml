# Metadata source for the distribution. packaging/build_dist.py reads this file and writes the wheel from a STAGED tree
# (client package + the UNCHANGED core + hash-pinned reference modules); see README.md > "Build".
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalvev-client"
version = "0.1.0"
description = "Private Core NATS client (send/listen) for the existing Signalvev D0 implementation. Isolated candidate, authority NONE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nats-py>=2.16.0,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
# Needed only when nats.credentials_file is configured (nats-py signs the server nonce with nkeys).
credentials = ["nkeys>=0.2.1"]
# Runtime dependencies for the Google Drive owner resolver; ordinary NATS installs stay lean.
drive = ["google-auth>=2,<3", "requests>=2.31,<3"]
# The BK07 protected Context transport uses the official MCP 2.0 HTTP client.
# The exact Windows/Python 3.12 wheel hashes live in requirements-bk07-runtime-win312.lock.
runtime_context = ["mcp==2.0.0", "httpx2==2.13.1"]

[project.scripts]
signalvev-client = "signalvev_client.cli:main"
signalvev-pm-x9 = "signalvev_client.pm_x9_cli:main"
signalvev-pm-x9-normal = "signalvev_client.pm_x9_normal_host:main"

[tool.setuptools]
packages = ["signalvev_client", "signalvev_sensing", "signalvev_adapters"]
include-package-data = false

[tool.setuptools.package-data]
signalvev_client = [
    "_reference_resources/RESOURCE_MANIFEST.json",
    "_reference_resources/tooling/validator/*.py",
    "_reference_resources/candidates/signalvev-reference-v0.1/*.json",
]
