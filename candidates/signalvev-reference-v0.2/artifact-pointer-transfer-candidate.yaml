# Verbatim (Human text): "Store objekter skal normalt bo hos
# state/artifact owner. Kommunikasjonen sender: artifact identity,
# location/reference, hash, content type, size, provenance, access/custody
# requirements."
required_pointer_fields:
  - artifact_identity
  - location_reference
  - hash
  - content_type
  - size
  - provenance
  - access_custody_requirements

# Verbatim (Human text, capitalized in source): "STATE STAYS HOME; DELTA
# TRAVELS."
law: "STATE STAYS HOME; DELTA TRAVELS."

# Verbatim (Human text): "File transfer maa vaere en eksplisitt primitive
# -- ikke tilfeldige Drive-links eller chatvedlegg som skjult
# transportlag."
negative_rules:
  - id: NO_HIDDEN_TRANSPORT_VIA_LINKS_OR_ATTACHMENTS
    rule: "File transfer must be an explicit primitive, not an ad hoc Drive link or chat attachment used as a hidden transport layer."
  - id: POINTER_NE_BYTES
    rule: >
      An ARTIFACT_POINTER message must carry a location/reference and a
      hash, never the artifact's actual payload bytes inline. Carrying
      bytes inline would make the message itself the state, violating
      "state stays home".
  - id: VERIFY_BEFORE_USE
    # Verbatim (X4): "Receiver verifies bytes and current access before
    # use."
    rule: "A receiver must verify the byte hash and current access/custody before treating a fetched artifact as usable."

# Cross-references subject-registry-v0.1-candidate.json
# (candidates/signalvev-reference-v0.1/) entry cerebro.v1.artifact.pointer:
# ack_semantics ["POINTER_DELIVERED_NE_ARTIFACT_READ_OR_VERIFIED"],
# idempotency_scope "artifact_identity_plus_content_hash". This candidate
# does not redefine that registry entry; it supplies the reference
# verify-then-consume implementation the registry entry presumes exists.
registry_cross_reference:
  subject: cerebro.v1.artifact.pointer
  source_file: ../signalvev-reference-v0.1/subject-registry-v0.1-candidate.json

explicitly_not:
  - Not a file storage or Drive-write implementation -- no write to Google
    Drive happens anywhere in this candidate.
  - Not a claim that any current Drive link or chat attachment in the
    wider Cerebro documentation set violates this rule; this file states
    the target contract, not an audit finding.
