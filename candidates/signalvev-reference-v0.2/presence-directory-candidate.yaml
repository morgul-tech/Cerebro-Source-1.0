  drive_id: 1qoQ0O53D5QVosQLo3-x2wsY8tGhQxXCU
  section: "1. Human-supplied Communication Stack v0.1 -> 2. Felles primitive verktoy -> PRESENCE / SERVICE DIRECTORY"
