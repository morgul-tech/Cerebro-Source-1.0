[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bk05-capsule-tool"
version = "0.1.0"
description = "Offline structural-only BK05 continuation capsule tool"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bk05-capsule = "bk05_capsule.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

