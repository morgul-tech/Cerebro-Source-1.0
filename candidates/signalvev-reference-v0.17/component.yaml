schema: cerebro-component/v1
component:
  id: signalvev-reference-v0.17
  name: Signalvev Reference Implementation Candidate v0.17 (readiness non-conflation guard)
  type: candidate
  version: 0.17.0
  status: isolated-implementation-candidate
  authority: NONE
responsibility:
  primary: >
    Build testable reference implementations of two more Section 5
    negative laws no prior candidate tests: "ONLINE != READY" and
    "TRANSPORT_AVAILABLE != WORK_ALLOWED". Distinct from v0.12's
    PresenceEnvelopeGuard (claim injection into a presence envelope) --
    this candidate proves a caller must not conflate a weaker
    presence/connectivity signal with the stronger "candidate for work"
    signal at all, a state-conflation failure mode.
  explicitly_not:
    - Ikke et duplikat av v0.12s PresenceEnvelopeGuard.
    - Ikke en oppfunnet transport-status-enum -- bruker en enkel bool.
    - Ikke en NATS-, WireGuard- eller tunnel-implementasjon.
    - Ikke en JetStream-aktivering.
    - Ikke en endring av Boot-, Context State- eller authority-lag.
    - Ikke et duplikat av noen tidligere kandidat (v0.1 til -v0.16).
dependencies:
  build: []
  runtime: []
  candidate: []
  explicitly_no_dependency_on:
    - signalvev-reference-v0.1
    - signalvev-reference-v0.2
    - signalvev-reference-v0.3
    - signalvev-reference-v0.4
    - signalvev-reference-v0.5
    - signalvev-reference-v0.6
    - signalvev-reference-v0.7
    - signalvev-reference-v0.8
    - signalvev-reference-v0.9
    - signalvev-reference-v0.10
    - signalvev-reference-v0.11
    - signalvev-reference-v0.12
    - signalvev-reference-v0.13
    - signalvev-reference-v0.14
    - signalvev-reference-v0.15
    - signalvev-reference-v0.16
interfaces:
  input:
  - >-
    presence_indicates_work_candidacy(presence_state: str, one of ONLINE
    / OFFLINE / READY / ARMED / DEGRADED / UNKNOWN);
    transport_availability_allows_work(transport_available: bool)
  output:
  - >-
    work_candidate (bool) with reason, or work_allowed (bool, always
    False) with reason (in-process only in this candidate; pure stdlib)
relationship_to_prior_evidence:
  note: >
    S0/S1 remain the only behavior-real transport evidence, unrelated to
    this candidate. This candidate does not touch transport, presence
    infrastructure, or Drive at all -- it proves two offline
    non-conflation classification properties over caller-supplied
    values, a narrower claim than "this works against a real presence
    or transport observation system."
