  upstream_document: CEREBRO-Communication-Stack-v01-FULL-HANDOFF.md
  drive_id: 1qoQ0O53D5QVosQLo3-x2wsY8tGhQxXCU
  sections:
    - "1. Human text -> 1. Hovedmodell -> L7 HUMAN COMMUNICATION"
    - "1. Human text -> 3. Communication classes v0.1 -> HUMAN_NOTICE"
    - "2. X4 runtime-fagpass -> Current runtime crosswalk (L7 Human communication row)"
    - "2. X4 runtime-fagpass -> Falsifiers for one offline reference arc (item 12)"
  component_pins:
    - label: "X4 runtime-fagpass -- complete text"
      bytes: 10397
      sha256: 0bfd76bb045f3610d9fd04d2ecb3389d9514f23a19b1bc27cb1597a7d3c4b8de
  note: >
    Pin as stated by the upstream handoff document. Not independently
