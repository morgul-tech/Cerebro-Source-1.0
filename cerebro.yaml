schema: cerebro-manifest/v1
cerebro:
  name: Cerebro
  release: null
  status: source
  source_version: 1.0.0
source:
  repository: morgul-tech/Cerebro-Source-1.0
  branch: main
  commit: null
  authority: sole
mcp:
  path: mcp/
  manifest: mcp/manifest.yaml
  standard: standards/mcp.yaml
  version: 1.0.0
  level: 1
  default_state: active
  required: true
engines:
- id: dialog
  path: engines/dialog/
  required: true
- id: context
  path: engines/context/
  required: true
- id: collaboration
  path: engines/collaboration/
  required: true
- id: project
  path: engines/project/
  required: false
- id: quality
  path: engines/quality/
  required: true
- id: presentation
  path: engines/presentation/
  required: true
modules:
- id: terminology
  path: modules/terminology/
  required: true
- id: core-rules
  path: modules/core-rules/
  required: true
- id: visual-language
  path: modules/visual-language/
  required: true
standards:
  manifest: standards/standards.yaml
  source_authority: standards/source-authority.yaml
  publication_gate: standards/publication-gate.yaml
  quality_gate: standards/quality-gate.yaml
  valider_command: standards/valider-command.yaml
  patch_package: standards/patch-package.yaml
  operational_progress: standards/operational-progress.yaml
tooling:
  builder: tooling/builder/
  validator: tooling/validator/
  loader: tooling/loader/
  publisher: tooling/publisher/
governance:
  single_source_of_truth: true
  write_once_authority: true
  implementation_disposable: true
  quality_gate_required_for_publication: true
  generated_artifacts_authoritative: false
  source_folder_required: false
  common_validation_entrypoint: valider
  control_layer: MCP
  mcp_default_state: active
integrity:
  manifest_checksum: null
source_status:
  stabilized: true
  validated: true
  release_built: false
