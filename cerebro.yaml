schema: cerebro-manifest/v1
cerebro:
  name: Cerebro
  release: null
  status: source
  source_version: 1.0.0
source:
  repository: morgul-tech/Cerebro-Source-1.0
  branch: main
  commit: null
  authority: sole
mcp:
  path: mcp/
  manifest: mcp/manifest.yaml
  standard: standards/mcp.yaml
  version: 1.1.0
  component_kind: CONTROL
  authority_scope: highest-internal-control
  default_state: active
  required: true
engines:
- id: interaction
  path: engines/interaction/
  required: true
- id: context
  path: engines/context/
  required: true
- id: project
  path: engines/project/
  required: false
- id: quality
  path: engines/quality/
  required: true
- id: presentation
  path: engines/presentation/
  required: true
modules:
- id: terminology
  path: modules/terminology/
  required: true

- id: visual-language
  path: modules/visual-language/
  required: true
standards:
  manifest: standards/standards.yaml
  source_authority: standards/source-authority.yaml
  system_lifecycle: standards/system-lifecycle.yaml
  control_architecture: standards/control-architecture.yaml
  user_operating_profile: standards/user-operating-profile.yaml
  user_operating_profile_schema: standards/user-operating-profile-schema.yaml
  system_metamodel: standards/system-metamodel.yaml
  rule_model: standards/rule-model.yaml
  canonical_definition_system: standards/canonical-definition-system.yaml
  publication_gate: standards/publication-gate.yaml
  quality_gate: standards/quality-gate.yaml
  valider_command: standards/valider-command.yaml
  patch_package: standards/patch-package.yaml
  change_architecture: standards/change-architecture.yaml
  change_delivery: standards/change-delivery.yaml
  release_platform: standards/release-platform.yaml
  operational_progress: standards/operational-progress.yaml
  project_status: standards/project-status.yaml
  adaptive_quality_workform: standards/development/adaptive-quality-workform.yaml
  wisdom_control_binding: standards/development/wisdom-control-binding.yaml
  architectural_regrounding: standards/development/architectural-regrounding.yaml
  active_source_closure: standards/active-source-closure.yaml
tooling:
  builder: tooling/builder/
  validator: tooling/validator/
  runtime_host: tooling/runtime-host/
  publisher: tooling/publisher/
  host: tooling/host/
  change: tooling/change/
  delivery: tooling/delivery/
  closure: tooling/closure/
governance:
  single_source_of_truth: true
  definitional_authority: Cerebro Source 1.0
  internal_control_authority: MCP
  write_once_authority: true
  implementation_disposable: true
  quality_gate_required_for_publication: true
  generated_artifacts_authoritative: false
  source_folder_required: false
  common_validation_entrypoint: valider
  control_layer: MCP
  mcp_default_state: active
  mcp_deactivation_effect: exit-cerebro-controlled-operation
integrity:
  manifest_checksum: null
source_status:
  stabilized: true
  validated: true
  release_built: false
