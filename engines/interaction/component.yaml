schema: cerebro-component/v1
component:
  id: interaction
  name: Interaction Engine
  type: engine
  version: 1.5.0
  status: active-source
responsibility:
  primary: >
    Tolke brukerens aktuelle intensjon, instruksjon, preferansesignaler,
    avklaringsbehov, beslutningssignaler, roller, ansvar og menneskelig
    beslutningsgrense og levere en Interaction Assessment til MCP.
boundaries:
  must:
  - interpret-current-user-intent
  - resolve-human-meaning-before-literal-token-interpretation
  - resolve-conversation-evolution-analysis-command
  - distinguish-instruction-from-preference-signal
  - identify-genuine-clarification-need
  - identify-user-decision-boundary
  - maintain-role-and-responsibility-clarity
  - steward-user-operating-profile-signals
  - interpret-project-event-only-against-valid-control-session-binding
  - distinguish-inline-detour-fork-and-control-transition
  - resolve-short-navigation-trigger-against-committed-state
  - emit-fingerprinted-control-context-intent-assessment
  - preserve-plain-consolidate-backward-compatibility
  - emit-derived-context-consolidation-result-without-control-authority
  must_not:
  - make-final-control-decision
  - own-working-mode-resolution
  - own-engine-activation
  - own-presentation-format
  - own-project-state
  - own-active-context
  - create-source-authority
  - mutate-control-context-state
  - treat-visible-navigation-phrase-as-machine-state
  - authorize-consolidation-owner-effects
dependencies:
  build:
  - terminology
  runtime:
  - context
interfaces:
  input:
  - user-utterance
  - active-goal
  - current-basis
  - runtime-context
  - effective-user-configuration
  - user-profile-write-request
  - user-profile-revoke-request
  - control-context-event-binding
  - committed-control-session-state
  output:
  - interaction-assessment
  - current-intent
  - human-meaning-assessment
  - bounded-source-xref-request
  - internally-executable-continuation-signal
  - current-instruction
  - preference-signal
  - user-profile-operation
  - effective-user-configuration-candidate
  - clarification-need
  - decision-signal
  - role-assessment
  - responsibility-assessment
  - human-boundary-assessment
  - presentation-request
  - consolidation-request
  - conversation-evolution-analysis-request
  - context-route-assessment
  - context-transition-candidate
  - navigation-trigger-resolution
  - control-context-intent-assessment
  - context-consolidation-result
contracts:
  control_context_intent:
    implementation_ref: control_context_intent.py
    schema_ref: control-context-intent-assessment.schema.json
    lifecycle: CANDIDATE
  context_consolidation:
    implementation_ref: context_consolidation.py
    result_schema_ref: context-consolidation-result.schema.json
    extends: standards/development/consolidate.yaml
    lifecycle: CANDIDATE
rules:
  path: rules.yaml
documentation:
  path: specification.md
migration:
  introduced_by: PATCH-005
  supersedes:
  - dialog
  - collaboration
version:
  component: 1.5.0
  schema: 1
