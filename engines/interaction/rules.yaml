    limit_structure_to_need: true
  statement: Interaction Engine SKAL IKKE gjøre samarbeidet mer omfattende enn nødvendig.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-019
