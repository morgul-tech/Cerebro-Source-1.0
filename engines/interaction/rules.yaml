    - analysis
    - recommendation
    - clarification
    - work
    - verification
    - completion
  statement: Interaction Engine SKAL angi gjeldende dialogtilstand.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-009
  owner: interaction
  authority: normative
  priority: normal
  condition:
    required_information_or_choice_missing: true
  action:
    create_clarification_point: true
  statement: Interaction Engine SKAL opprette et avklaringspunkt når nødvendig informasjon, valg eller bekreftelse mangler før
    videre arbeid kan fortsette.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-010
  owner: interaction
  authority: normative
  priority: normal
  condition:
    clarification_point: true
  action:
    identify:
