- id: DIA-021
  owner: interaction
  authority: normative
  priority: critical
  condition:
    operative_progress_signal: true
    valid_stop_condition: false
  action:
    emit_continuation_directive: true
  statement: NÃ¥r et operativt fremdriftssignal foreligger og ingen gyldig stoppbetingelse finnes, SKAL Interaction Engine kreve videre utfÃ¸relse av neste mÃ¥lrettede handling innenfor gjeldende autorisasjon.
