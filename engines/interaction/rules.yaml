  statement: Interaction Engine SKAL IKKE be om unødvendig status i enkel dialog.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-016
  owner: interaction
  authority: normative
  priority: high
  condition:
