    - required_user_input
  statement: Ved avklaringspunkt SKAL Interaction Engine tydelig identifisere hva som mangler og hva som kreves for videre fremdrift.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-011
  owner: interaction
  authority: normative
  priority: high
  condition:
    any:
    - basis_unclear
    - important_prerequisite_missing
    - continued_work_may_misdirect
  action:
    create_control_stop: true
  statement: Interaction Engine SKAL opprette kontrollstopp når grunnlaget er uklart, viktige forutsetninger mangler eller videre
    arbeid kan gi feil retning.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-012
  owner: interaction
  authority: normative
  priority: normal
  condition:
    control_stop_needed: false
  action:
    avoid_control_stop: true
  statement: Interaction Engine SKAL IKKE bruke kontrollstopp unødvendig.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-013
  owner: interaction
  authority: normative
  priority: normal
  condition:
    decision_detected: true
  action:
    send_to_context_engine: decision
  statement: Når en beslutning skal påvirke videre arbeid, SKAL Interaction Engine sende beslutningen til Context Engine.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-014
