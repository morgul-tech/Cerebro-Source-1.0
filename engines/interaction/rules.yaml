schema: cerebro-rule-set/v1
rules:
- id: DIA-001
  owner: interaction
  authority: normative
  priority: high
  condition:
    always: true
  action:
    evaluate:
    - complexity
    - duration
    - dependent_steps
    - continuity_need
    - misunderstanding_risk
  statement: Interaction Engine SKAL vurdere behovet for struktur ut fra kompleksitet, varighet, avhengige steg, kontinuitetsbehov
    og risiko for misforståelser.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: &id001
    - '3.1'
    - '3.2'
    - '3.3'
    - '3.4'
    - '3.5'
    - '3.7'
    - '3.9'
- id: DIA-002
  owner: interaction
  authority: normative
  priority: high
  condition:
    simple_dialog_sufficient: true
  action:
    set_working_mode: standard
  statement: Interaction Engine SKAL velge STANDARD når vanlig dialog gir tilstrekkelig resultat.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-003
  owner: interaction
  authority: normative
  priority: high
  condition:
    any:
    - shared_structure_required
    - multiple_clarifications_required
    - continuity_required
  action:
    set_working_mode: collaboration
  statement: Interaction Engine SKAL velge SAMARBEID når arbeidet krever felles struktur, flere avklaringer eller kontinuitet over
    tid.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-004
  owner: interaction
  authority: normative
  priority: high
  condition:
    any:
    - large_scope
    - multiple_dependent_parts
    - organized_progress_required
  action:
    set_working_mode: project
  statement: Interaction Engine SKAL velge PROSJEKT når arbeidet har større omfang, flere avhengige deler eller krever organisert
    fremdrift.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-005
  owner: interaction
  authority: normative
  priority: normal
  condition:
    always: true
  action:
    keep_distinct:
    - working-mode
    - dialog-state
  statement: Arbeidsmodus SKAL beskrive arbeidsnivå og SKAL IKKE brukes som betegnelse på arbeidsfase.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-006
  owner: interaction
  authority: normative
  priority: normal
  condition:
    engine_activation_improves:
    - quality
    - efficiency
  action:
    activate_relevant_engines: true
  statement: Interaction Engine SKAL aktivere relevante Engines når aktivering gir bedre kvalitet eller effektivitet.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-007
  owner: interaction
  authority: normative
  priority: normal
  condition:
    engine_activation_needed: false
  action:
    avoid_activation: true
  statement: Interaction Engine SKAL IKKE aktivere Engines unødvendig.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: DIA-008
  owner: interaction
  authority: normative
  priority: normal
  condition:
    always: true
  action:
    set_dialog_state_from:
