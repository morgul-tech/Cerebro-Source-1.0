schema: "cerebro-project-roadmap-schema/v0.1"
contract:
  id: "CONTRACT-PROJECT-ROADMAP"
  owner: "project-engine"
  target_schema: "cerebro-project-roadmap/v0.1"
  state_path: "engines/project/roadmap.yaml"
  state_scope: "working-source"
  release_inclusion: true
  state_release_inclusion: false
required_root:
  - "schema"
  - "roadmap"
roadmap_required_fields:
  - "id"
  - "project_ref"
  - "authority"
  - "status"
  - "objective"
  - "scope"
  - "phases"
  - "patches"
  - "execution"
  - "blockers"
  - "context_refs"
  - "traceability"
  - "revision"
enums:
  project_status:
    - "ACTIVE"
    - "PAUSED"
    - "BLOCKED"
    - "COMPLETED"
    - "CANCELLED"
  phase_status:
    - "PLANNED"
    - "ACTIVE"
    - "BLOCKED"
    - "COMPLETED"
    - "SKIPPED"
  milestone_status:
    - "PLANNED"
    - "ACTIVE"
    - "BLOCKED"
    - "COMPLETED"
    - "SKIPPED"
  patch_status:
    - "PLANNED"
    - "ACTIVE"
    - "LOCKED"
    - "IMPLEMENTING"
    - "IMPLEMENTED"
    - "VERIFIED"
    - "BLOCKED"
    - "DISCARDED"
  execution_status:
    - "ACTIVE"
    - "BLOCKED"
    - "PLANNED"
  blocker_status:
    - "ACTIVE"
    - "RESOLVED"
  context_requirement:
    - "REQUIRED"
    - "OPTIONAL"
invariants:
  - "roadmap_id_is_immutable"
  - "all_roadmap_object_ids_are_globally_unique"
  - "all_internal_references_resolve"
  - "exactly_one_current_execution_exists"
  - "current_phase_status_is_ACTIVE"
  - "current_patch_status_is_ACTIVE"
  - "current_milestone_status_is_ACTIVE_when_present"
  - "next_execution_exists_unless_project_is_COMPLETED"
  - "dependency_cycles_are_prohibited"
  - "required_context_references_resolve"
  - "repository_paths_are_relative"
  - "absolute_paths_are_prohibited"
  - "context_record_content_is_not_duplicated"
  - "runtime_state_is_not_embedded"
  - "conversation_history_is_not_embedded"
  - "working_state_is_excluded_from_release"
