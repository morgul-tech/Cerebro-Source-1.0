schema: cerebro-component/v1
component:
  id: project
  name: Project Engine
  type: engine
  version: 1.3.0
  status: active-source
responsibility:
  primary: Styre prosjektoppstart, mål, rammer, faser, leveranser og prosjektendringer.
boundaries:
  must:
  - forvalte-prosjektstruktur
  - forvalte-faser
  - forvalte-leveranser
  - forvalte-prosjektrevisjon
  - forvalte-distinkte-prosjektinstanser-og-default-binding
  - consume-MCP-routed-project-revision-effect
  - emit-project-owner-effect-candidate-receipt-before-persistence
  must_not:
  - velge-arbeidsmodus
  - ta-brukerbeslutninger
  - forvalte-aktiv-kontekst
  - utføre-kvalitetskontroll
dependencies:
  build:
  - terminology
  runtime:
  - interaction
  - context
  - quality
interfaces:
  input:
  - project-activation
  - goal
  - scope
  - framework
  - constraints
  - change-request
  - MCP-project-owner-effect
  output:
  - project-basis
  - phase-model
  - deliverable-register
  - revision-impact
  - project-status
  - project-instance-bootstrap-candidate
  - project-basis-revision-candidate
  - project-owner-effect-candidate-receipt
owner_effect_binding:
  implementation_ref: engines/project/project_owner_effect.py
  persistence_ref: tooling/owner_state/owner_state_persistence.py
  commit_receipt_schema_ref: mcp/owner-state-commit-receipt.schema.json
  persistence_validator_ref: tooling/validator/owner_state_persistence_validation.py
  normal_host_ref: mcp/control_resolution_host.py
  state_schema_ref: engines/project/project-basis-state.schema.json
  receipt_schema_ref: mcp/owner-effect-receipt.schema.json
  lifecycle: CANDIDATE_SEMANTIC_CONSUMER_AND_PERSISTENCE_ADAPTER_NOT_LIVE_DEPLOYED
  effect: REVISION_REQUIRED
  output_without_owner_commit: CANDIDATE_NOT_CURRENT
  normal_consumer_proven: false
  local_normal_host_harness_contract_proven: true
  live_PostgreSQL_and_remote_host_proven: false
rules:
  path: rules.yaml
documentation:
  path: specification.md
migration:
  source: MASTER_v1.1
  sections:
  - '5.1'
  - '5.2'
  - '5.3'
  - '5.4'
  - '5.5'
  - '5.6'
  - '5.7'
version:
  component: 1.3.0
  schema: 1
