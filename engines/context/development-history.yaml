    - id: HIST-LEARN-AA004-R5-FORWARD-FAILURE-SWEEP-20260811
      event_class: LEARNING_EVENT
      significance: FOUNDATIONAL
      role: EVENT
      title: Forward failure sweep broke the serial AA-004 remediation loop
      fact: AA-004 R5 initially required repeated user executions because remediation followed the first visible failure without inspecting the remaining delivery path. Before R5.5, the method changed to a forward failure sweep over the final candidate and downstream Apply path; this exposed both the current semantic assertion defect and a later CAC evidence-normalization defect, allowed both to be corrected together, and the next user execution completed directly with PATCH SUCCESS, verified canonical sync and remote equality.
      occurred_at: '2026-08-11T16:41:12+02:00'
