    - id: HIST-LEARN-STANDARD-MANIFEST-ASSERTION-ENCODING-20260811
      event_class: LEARNING_EVENT
      significance: MAJOR
      role: EVENT
      title: Windows PowerShell manifest decoding corrupted a valid semantic assertion
      fact: The first continuation-closure STANDARD candidate installed the exact UTF-8 payload bytes but failed at SOURCE_DIFF_VALIDATION because Windows PowerShell read a raw non-ASCII assertion from manifest.json through its implicit text encoding, changing the expected Norwegian text before comparison. The corrective method swept every final assertion and bound manifest assertion transport safety to the existing representation-and-serialization failure controls before redelivery.
      occurred_at: '2026-08-11T20:14:25+00:00'
      evidence_refs:
        - DCAP-ddd5ddc14a24a04b12fd
        - ATTEMPT-20260811T201412029Z-194fd11d0dca4069935b03991d1e44fe
      impact:
        introduced:
          - STANDARD_MANIFEST_ASSERTION_ENCODING_REPRESENTATION
        retired:
          - RAW_NON_ASCII_ASSERTION_WITH_IMPLICIT_CONSUMER_ENCODING
        enabled:
          - FINAL_MANIFEST_ASSERTION_TRANSPORT_SAFETY_CHECK
          - ACTUAL_CONSUMER_REPRESENTATION_VALIDATION
        learned:
          - VALID_UTF8_PAYLOAD_BYTES_DO_NOT_PROVE_MANIFEST_ASSERTION_TEXT_SURVIVES_A_DIFFERENT_CONSUMER_ENCODING
          - ALL_FINAL_ASSERTIONS_MUST_BE_VALIDATED_THROUGH_THE_SEALED_CONSUMER_REPRESENTATION
      relations:
        patch_refs: [CEREBRO-CONTINUATION-CONSUMPTION-CLOSURE-001]
        baseline_commit: 49e743b2076d1c514c07c726ebb1678551eb57be
        learning_refs: [REPRESENTATION_AND_SERIALIZATION, CEREBRO-CHANGE-CAMPAIGN-POLICY-001]
