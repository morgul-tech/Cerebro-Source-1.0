      fact: DUALITYARC Wave 02 R1 completed target-runtime validation, DEEP assurance, canonical sync and remote equality at c1ec0ddcb2cbf984ac5b0b4ac06f416a289b555f, but the post-sync success transport selected the first generic RECEIPT field from nested output. That field named the Target Runtime receipt rather than the later Delivery Kernel receipt, so strict success validation correctly rejected it. The Source change remained a verified success; only the derived success transport failed.
