    - id: HIST-LEARN-STANDARD-MANIFEST-ASSERTION-ENCODING-20260811
      event_class: LEARNING_EVENT
      significance: MAJOR
      role: EVENT
      title: Windows PowerShell manifest decoding corrupted a valid semantic assertion
      fact: The first continuation-closure STANDARD candidate installed the exact UTF-8 payload bytes but failed at SOURCE_DIFF_VALIDATION because Windows PowerShell read a raw non-ASCII assertion from manifest.json through its implicit text encoding, changing the expected Norwegian text before comparison. The corrective method swept every final assertion and bound manifest assertion transport safety to the existing representation-and-serialization failure controls before redelivery.
      occurred_at: '2026-08-11T20:14:25+00:00'
      evidence_refs:
