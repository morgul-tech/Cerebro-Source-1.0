      role: EVENT
      title: Pre-commit promotion proof masked a post-commit lifecycle-contract identity failure
      fact: Wave 02 R1 legitimately promoted the adaptive resolver contract from CANDIDATE to VALIDATED_LOGIC without changing the shadow-validated resolver implementation, but the AA-004 verifier required the current lifecycle contract blob to remain byte-identical to the earlier AA-003 candidate contract. Target Runtime ran before commit and read the baseline Git object, so it passed; after publication at c1ec0ddcb2cbf984ac5b0b4ac06f416a289b555f the canonical control-resolution selftest failed. The correction preserves exact AA-003 Git identity for resolver logic, promotion-basis contract and oracle while independently validating the current promoted contract semantics.
      occurred_at: '2026-08-12'
      evidence_refs:
        - CEREBRO_AA004_MCP_CONTROL_ACTIVATION_PROOF_AT_WAVE02_R1
        - C1EC0DD_POST_COMMIT_CONTROL_RESOLUTION_SELFTEST
        - USER-REFINE-MENNESKE-MCP-CONTROL-QUESTION-2026-08-12
      impact:
        introduced:
          - PRECOMMIT_PROMOTION_IDENTITY_FALSE_GREEN_AFTER_CONTRACT_LIFECYCLE_CHANGE
        retired:
          - CURRENT_PROMOTED_CONTRACT_MUST_EQUAL_AA003_CANDIDATE_BLOB
        enabled:
          - SEPARATE_PROMOTION_BASIS_GIT_IDENTITY_AND_CURRENT_CONTRACT_SEMANTIC_VALIDATION
          - POST_COMMIT_CONTROL_RESOLUTION_SELFTEST_PASS
