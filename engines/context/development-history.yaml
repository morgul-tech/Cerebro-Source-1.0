    - id: HIST-LEARN-SHORT-HUMAN-TRIGGER-ENFORCEMENT-GAP-20260812
      event_class: LEARNING_EVENT
      significance: FOUNDATIONAL
      role: EVENT
      title: Repeated long continuation commands exposed declaration without response-handoff enforcement
      fact: Cerebro already declared that the normal user-facing next action should be a 2-5 word trigger and that complete continuation state should remain Cerebro-owned. A later response nevertheless required the user to paste a long machine instruction containing persistence, commit and validation details. The failure proved that a policy-only rule, candidate Presentation lifecycle and static canaries were insufficient without an active binding, a deterministic final-response consumer and fail-closed handoff behavior.
      occurred_at: '2026-08-12'
      evidence_refs:
