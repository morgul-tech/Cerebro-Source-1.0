          - SOURCE_XREF_BEFORE_ABSTRACTION_GAP_CONCLUSION
        learned:
          - DECLARED_SELF_RUNNING_POLICY_MUST_BE_CONSUMED_BEFORE_RESPONSE_HANDOFF
          - INTERNALLY_EXECUTABLE_NEXT_STEP_MUST_RETURN_A_RESULT_NOT_A_USER_RETRIGGER
