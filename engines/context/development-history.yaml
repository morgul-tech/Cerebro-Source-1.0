    - id: HIST-LEARN-HUMAN-REFINE-CONTINUATION-CONSUMPTION-GAP-20260811
      event_class: LEARNING_EVENT
      significance: MAJOR
      role: EVENT
      title: Clean-session human refinement test exposed continuation consumption gap
      fact: A clean-session `refine menneske` test correctly reconstructed human meaning, separated supported interpretation from inference and identified a bounded Source question, but then returned that internally executable question to the user instead of completing the Source cross-reference. The governing self-running continuation rule already existed, so the defect was classified as incomplete consumption across Interaction and Presentation rather than missing MCP control or a need for a parallel continuation mechanism.
      occurred_at: '2026-08-11'
      evidence_refs:
        - REFINE-MENNESKE-CLEAN-SESSION-CANARY-2026-08-11
        - USER-CORRECTION-CONTINUATION-GAP-2026-08-11
