schema: cerebro-component/v1
component:
  id: context
  name: Context Engine
  type: engine
  version: 1.7.0
  status: active-source
responsibility:
  primary: Forvalte aktiv kontekst, gjeldende grunnlag, vurderinger, beslutninger, historikk, samtalelokale markører, avgrenset konsolideringskontekst og lettvekts evidens rundt Wisdom.
dependencies:
  build:
  - terminology
  runtime: []
interfaces:
  input:
  - context-update
  - decision
  - assessment
  - basis-candidate
  - history-entry
  - override
  - wisdom-signal
  - relevance-retrieval-request
  - execution-effect-feedback
  - change-failure-observation
  - consolidation-request
  - marker-create
  - control-context-event-binding
  - MCP-control-context-transition-directive
  - MCP-context-navigation-options
  - MCP-context-navigation-options-precommit-candidate
  - MCP-context-owner-effect
  output:
  - active-context
  - current-basis
  - assessment-state
  - decision-state
  - history
  - conflict
  - wisdom-evidence-profile
  - wisdom-applicability-assessment
  - applicable-wisdom-refs
  - applicable-knowledge-refs
  - applicable-history-refs
  - development-history-candidate
  - relevance-assessment
  - basis-fingerprint-input
  - effect-feedback-candidate
  - wisdom-friction-state
  - cumulative-change-learning-evidence
  - consolidation-context
  - conversation-marker
  - active-human-continuation-binding
  - control-context-project-snapshot
  - control-session-snapshot
  - control-context-transition-receipt
  - context-owner-effect-candidate-receipt
rules:
  path: rules.yaml
state:
  knowledge:
    path: knowledge.yaml
    schema: knowledge-schema.yaml
    authority: evidence-only
  wisdom_evidence:
    path: wisdom-evidence.yaml
    schema: wisdom-evidence-schema.yaml
    authority: evidence-only
  development_history:
    path: development-history.yaml
    schema: development-history-schema.yaml
    authority: evidence-only
    lifecycle: ACTIVE
  continuation_bindings:
    path: continuation-bindings.json
    schema: cerebro-human-continuation-binding-registry/v1
    authority: governing-current-state
    lifecycle: ACTIVE
    universal_state_migration:
      target_contract: standards/control-context-state-service.yaml
      target_scope: CONTROL_SESSION
      status: CANDIDATE_NOT_ACTIVATED
  control_context_contract:
    schema: engines/context/control-context-state.schema.json
    hierarchy_contract: standards/control-context-hierarchy.yaml
    state_service_contract: standards/control-context-state-service.yaml
    authority: SOURCE_CONTRACT_NOT_LIVE_STATE
    lifecycle: CANDIDATE
  control_context_live_state:
    location: EXTERNAL_PRIVATE_STATE_SERVICE
    repository_registry: PROHIBITED
    local_disk_as_universal_authority: PROHIBITED
    activation: NOT_YET_PROVEN
  owner_effect_binding:
    implementation_ref: tooling/context/control_owner_effect.py
    persistence_ref: tooling/context/control_context_owner_persistence.py
    State_Service_commit_schema_ref: mcp/state-service-commit-receipt.schema.json
    persistence_validator_ref: tooling/validator/control_context_owner_persistence_validation.py
    normal_host_ref: mcp/control_resolution_host.py
    receipt_schema_ref: mcp/owner-effect-receipt.schema.json
    lifecycle: CANDIDATE_SEMANTIC_CONSUMER_AND_PERSISTENCE_ADAPTER_NOT_LIVE_DEPLOYED
    effect: REFRESH_GOVERNING_REFS
    output_without_state_port_commit: CANDIDATE_NOT_CURRENT
    normal_consumer_proven: false
    local_normal_host_harness_contract_proven: true
    live_PostgreSQL_and_remote_host_proven: false
documentation:
  path: specification.md
migration:
  source: MASTER_v1.1
  sections:
  - 3.5.4
  - '3.6'
  - 3.6.1
  - 3.6.2
  - 3.6.3
boundaries:
  must:
  - keep-wisdom-evidence-separate-from-governing-authority
  - keep-change-learning-evidence-non-authoritative-until-explicit-consolidation
  - assess-wisdom-applicability
  - retrieve-and-rank-relevant-knowledge-wisdom-and-history
  - steward-append-only-development-history
  - keep-detailed-failure-evidence-referenced-not-duplicated-in-history
  - bind-retrieval-output-to-control-basis
  - checkpoint-material-user-insight
  - emit-bounded-effect-feedback
  - preserve-wisdom-evidence-authority-boundary
  - use-event-driven-signal-capture
  - keep-micro-signal-storage-bounded
  - keep-conversation-markers-non-authoritative-and-conversation-local
  - keep-complete-human-continuation-state-machine-owned-and-fingerprinted
  - own-control-context-tree-semantics-with-session-scoped-active-focus
  - validate-complete-candidate-before-atomic-context-transition
  - emit-fingerprinted-transition-receipt
  - apply-branch-disposition-only-after-dependent-owner-receipts-are-current
  must_not:
  - create-parallel-learning-engine
  - auto-promote-wisdom-from-signal-count
  - auto-mutate-source-from-evidence-threshold
  - persist-conversation-markers-to-source-automatically
  - give-knowledge-direct-control-authority
  - bulk-retrieve-history-by-default
  - let-history-create-control-or-policy-authority
  - let-producers-write-history-directly
  - auto-admit-effect-feedback-as-knowledge
  - create-parallel-learning-research-or-decision-engine
  - store-live-control-context-registry-in-Source
  - use-one-global-active-context-across-conversations
  - authorize-repository-write-from-project-state-transition
version:
  component: 1.7.0
  schema: 1
