schema: cerebro-component/v1
component:
  id: context
  name: Context Engine
  type: engine
  version: 1.1.0
  status: active-source
responsibility:
  primary: Forvalte aktiv kontekst, gjeldende grunnlag, vurderinger, beslutninger, historikk og lettvekts evidens rundt Wisdom.
dependencies:
  build:
  - terminology
  - core-rules
  runtime: []
interfaces:
  input:
  - context-update
  - decision
  - assessment
  - basis-candidate
  - history-entry
  - override
  - wisdom-signal
  output:
  - active-context
  - current-basis
  - assessment-state
  - decision-state
  - history
  - conflict
  - wisdom-evidence-profile
  - wisdom-friction-state
rules:
  path: rules.yaml
state:
  wisdom_evidence:
    path: wisdom-evidence.yaml
    schema: wisdom-evidence-schema.yaml
    authority: evidence-only
documentation:
  path: specification.md
migration:
  source: MASTER_v1.1
  sections:
  - 3.5.4
  - '3.6'
  - 3.6.1
  - 3.6.2
  - 3.6.3
boundaries:
  must:
  - keep-wisdom-evidence-separate-from-governing-authority
  - use-event-driven-signal-capture
  - keep-micro-signal-storage-bounded
  must_not:
  - create-parallel-learning-engine
  - auto-promote-wisdom-from-signal-count
  - auto-mutate-source-from-evidence-threshold
version:
  component: 1.1.0
  schema: 1