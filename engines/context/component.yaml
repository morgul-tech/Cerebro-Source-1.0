schema: cerebro-component/v1
component:
  id: context
  name: Context Engine
  type: engine
  version: 1.4.0
  status: active-source
responsibility:
  primary: Forvalte aktiv kontekst, gjeldende grunnlag, vurderinger, beslutninger, historikk, samtalelokale markører, avgrenset konsolideringskontekst og lettvekts evidens rundt Wisdom.
dependencies:
  build:
  - terminology
  runtime: []
interfaces:
  input:
  - context-update
  - decision
  - assessment
  - basis-candidate
  - history-entry
  - override
  - wisdom-signal
  - relevance-retrieval-request
  - execution-effect-feedback
  - change-failure-observation
  - consolidation-request
  - marker-create
  output:
  - active-context
  - current-basis
  - assessment-state
  - decision-state
  - history
  - conflict
  - wisdom-evidence-profile
  - wisdom-applicability-assessment
  - applicable-wisdom-refs
  - applicable-knowledge-refs
  - applicable-history-refs
  - development-history-candidate
  - relevance-assessment
  - basis-fingerprint-input
  - effect-feedback-candidate
  - wisdom-friction-state
  - cumulative-change-learning-evidence
  - consolidation-context
  - conversation-marker
rules:
  path: rules.yaml
state:
  knowledge:
    path: knowledge.yaml
    schema: knowledge-schema.yaml
    authority: evidence-only
  wisdom_evidence:
    path: wisdom-evidence.yaml
    schema: wisdom-evidence-schema.yaml
    authority: evidence-only
  development_history:
    path: development-history.yaml
    schema: development-history-schema.yaml
    authority: evidence-only
    lifecycle: ACTIVE
documentation:
  path: specification.md
migration:
  source: MASTER_v1.1
  sections:
  - 3.5.4
  - '3.6'
  - 3.6.1
  - 3.6.2
  - 3.6.3
boundaries:
  must:
  - keep-wisdom-evidence-separate-from-governing-authority
  - keep-change-learning-evidence-non-authoritative-until-explicit-consolidation
  - assess-wisdom-applicability
  - retrieve-and-rank-relevant-knowledge-wisdom-and-history
  - steward-append-only-development-history
  - keep-detailed-failure-evidence-referenced-not-duplicated-in-history
  - bind-retrieval-output-to-control-basis
  - checkpoint-material-user-insight
  - emit-bounded-effect-feedback
  - preserve-wisdom-evidence-authority-boundary
  - use-event-driven-signal-capture
  - keep-micro-signal-storage-bounded
  - keep-conversation-markers-non-authoritative-and-conversation-local
  must_not:
  - create-parallel-learning-engine
  - auto-promote-wisdom-from-signal-count
  - auto-mutate-source-from-evidence-threshold
  - persist-conversation-markers-to-source-automatically
  - give-knowledge-direct-control-authority
  - bulk-retrieve-history-by-default
  - let-history-create-control-or-policy-authority
  - let-producers-write-history-directly
  - auto-admit-effect-feedback-as-knowledge
  - create-parallel-learning-research-or-decision-engine
version:
  component: 1.4.0
  schema: 1
