    -
      id: "CTX-WISDOM-PSHELL-FORMATTING-SENSITIVITY-001"
      type: "WISDOM_RECORD"
      scope: "PSHELL-FORMATTING-AND-LINE-ENDINGS"
      statement: "Complex or format-sensitive PowerShell must be transported as a sealed script rather than pasted as direct multiline source."
      payload:
        maturity: "CONFIRMED_MULTI_INCIDENT"
        assessment:
          observations:
            - "Ordinary whitespace was not the primary cause of the observed failures."
            - "Backtick continuation is vulnerable to trailing whitespace."
            - "Here-string boundaries are vulnerable to partial copy and indentation mistakes."
            - "Exact multiline replacement is fragile across LF and CRLF."
            - "Git status aggregation and retained carriage returns caused validation failures unrelated to user copying."
            - "A regex using whitespace class matched across a newline and produced a false validation failure."
          analysis:
            direct_multiline_delivery:
              allowed_for:
                - "short_read_only_diagnostics"
                - "simple_low_sensitivity_commands"
              prohibited_for:
                - "source_mutation"
                - "YAML_generation"
                - "here_string_heavy_scripts"
                - "backtick_dependent_scripts"
                - "rollback_capable_patch_logic"
            required_controls:
              - "sealed_single_copy_single_paste"
              - "local_parse_before_install"
              - "atomic_install"
              - "line_ending_normalization"
              - "untracked_files_all_when_individual_paths_are_required"
              - "same_line_regex_when_newline_matching_is_not_intended"
        confidence: "HIGH"
        implementation_status: "PARTIALLY_IMPLEMENTED_BY_PATCH-001C.PRE-001"
        relevance:
          domains:
            - "PSHELL-delivery"
            - "PowerShell-5.1"
            - "line-ending-normalization"
            - "builder-validation"
          trigger_patterns:
            - "complex_multiline_script"
            - "exact_multiline_replacement"
            - "CRLF_LF_boundary"
            - "format_sensitive_PowerShell"
        traceability:
