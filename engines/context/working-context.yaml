    -
      id: "CTX-WISDOM-PIPELINE-STEERING-001"
      type: "WISDOM_RECORD"
      scope: "PIPELINE-STEERING-AND-USER-GATING"
      statement: "A recoverable command mismatch must not terminate an active pipeline when mandate and execution state uniquely identify the next valid action."
      payload:
        maturity: "CONFIRMED_MULTI_INCIDENT"
        assessment:
          observations:
            - "Literal command errors and stale references can occur while the active mandate and execution pointer remain unambiguous."
            - "Stopping on every recoverable mismatch transfers avoidable control work to the user."
            - "The command validator must not become the terminal controller of the project pipeline."
          analysis:
            primary_failure_mode: "RECOVERABLE_COMMAND_MISMATCH_TREATED_AS_TERMINAL_BLOCKER"
            required_separation:
              - "command_resolution"
              - "project_execution_control"
              - "user_input_gate"
              - "local_execution_handoff"
            preferred_behavior:
              - "normalize_recoverable_input"
              - "resolve_against_active_execution_state"
              - "continue_when_next_action_is_unique"
              - "stop_only_for_material_user_decision_or_required_local_result"
        confidence: "HIGH"
        implementation_status: "NOTE_ONLY_FOR_RUNTIME_0_1_DESIGN"
        relevance:
          domains:
            - "runtime-control"
            - "command-resolution"
            - "project-pipeline"
            - "interaction-efficiency"
          trigger_patterns:
            - "recoverable_typo"
            - "stale_command_reference"
            - "unique_active_execution_pointer"
        traceability:
