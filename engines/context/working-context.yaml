      sequence: 14
    -
      id: "CTX-WISDOM-COPY-READINESS-SIGNAL-001"
      type: "WISDOM_RECORD"
      scope: "STREAMED-CODE-COPY-READINESS"
      statement: "Visible code is not copy-ready until a terminal sentinel proves that the complete copyable block has finished rendering."
      payload:
        maturity: "CONFIRMED_MULTI_INCIDENT"
        assessment:
          observations:
            - "A code block can become visible before generation is complete."
            - "The user can copy an incomplete payload or interrupt generation while believing delivery is finished."
            - "A pre-block READY label alone can become visible before the payload is complete and therefore cannot be authoritative."
            - "One delivery was incorrectly marked ready and was later observed to be truncated."
          analysis:
            state_model:
              - "GENERATING"
              - "VISIBLE_PARTIAL"
              - "COMPLETE"
              - "COPY_READY"
            invariant: "COPY_READY_REQUIRES_TERMINAL_SENTINEL_INSIDE_THE_COPYABLE_BLOCK"
            sentinel_format: "# CEREBRO_COPY_READY:<delivery_id>"
            text_after_final_copyable_block: "PROHIBITED"
            blocks_without_terminal_sentinel: "NOT_AUTHORIZED_FOR_COPY"
        confidence: "HIGH"
        implementation_status: "SESSION_RULE_ACTIVE_SOURCE_ENFORCEMENT_PENDING"
        relevance:
          domains:
