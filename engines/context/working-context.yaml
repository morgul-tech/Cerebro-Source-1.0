    -
      id: "CTX-WISDOM-COMMAND-RESOLUTION-FIRST-001"
      type: "WISDOM_RECORD"
      scope: "COMMAND-RESOLUTION-AND-CAPABILITY-DISCOVERY"
      statement: "Hendelsen med inputen sync cerebro viste at manglende oppslag av den eksisterende cerebro_sync-kommandoen førte til feil synkretning og en unødvendig erstatningsløsning."
      payload:
        maturity: "CONFIRMED_SINGLE_INCIDENT"
        assessment:
          incident:
            date: "2026-08-06"
            initial_user_input: "sync cerebro"
            expected_first_action: "resolve_and_investigate_existing_cerebro_sync_command"
            actual_first_action: "infer_sync_semantics_without_resolving_existing_command"
            user_correction_required: true
          observations:
            - "Inputen var kort, kommando-lignende og brukte etablert Cerebro-terminologi."
            - "cerebro_sync var allerede tilgjengelig og klar for bruk."
            - "Den eksisterende kommandoen ble ikke undersøkt før synkretning ble tolket."
            - "Synk ble først tolket som kontroll eller innhenting fra GitHub i stedet for publisering fra lokal Working Source."
            - "Brukeren måtte eksplisitt forklare at lokal Working Source skulle overskrive autoritativ Source i repoet."
            - "En ny PSHELL-synkroniseringsløsning ble konstruert selv om den kanoniske løsningen allerede eksisterte."
            - "Erstatningsløsningen introduserte i tillegg en unødvendig feil med en uinitialisert failureMessage-variabel."
          analysis:
            primary_failure_mode: "EXISTING_COMMAND_NOT_RESOLVED_BEFORE_INTERPRETATION"
            contributing_factors:
              - "generic_sync_assumptions_overrode_project_specific_semantics"
              - "available_Cerebro_capability_was_not_investigated"
              - "command_like_input_was_treated_as_ordinary_natural_language"
              - "replacement_design_started_before_existing_solution_discovery"
            consequence:
              - "wrong_initial_direction"
              - "unnecessary_user_explanation"
              - "duplicated_existing_capability"
              - "avoidable_implementation_defect"
              - "increased_interaction_cost"
            preferred_future_reasoning_order:
              - "detect_command_like_project_input"
              - "resolve exact and normalized command candidates"
              - "inspect active Cerebro command definitions and available execution interfaces"
              - "prefer the existing canonical command when it satisfies the request"
              - "only infer semantics or design a replacement if command resolution fails"
            candidate_principle: "RESOLVE_EXISTING_COMMAND_BEFORE_INTERPRETING_OR_REBUILDING"
            important_distinction: "This record is analysis input and is not itself an implemented rule."
        confidence: "HIGH"
        implementation_status: "NOTE_ONLY_DEFERRED_FOR_LATER_ANALYSIS"
        relevance:
          domains:
            - "Cerebro-command-resolution"
            - "capability-discovery"
            - "Cerebro-source-sync"
            - "PSHELL-delivery"
            - "interaction-efficiency"
          trigger_patterns:
            - "short_command_like_user_input"
            - "project_specific_term_with_possible_existing_command"
            - "request_that_matches_an_available_Cerebro_operation"
          future_questions:
            - "Should Cerebro define a command-resolution-first stage before semantic inference?"
            - "Where should the authoritative command registry and aliases be exposed?"
            - "How should natural-language variants such as sync cerebro map to cerebro_sync?"
            - "How should available local commands be checked before generating replacement PSHELL?"
            - "How should command discovery failures be reported without creating unnecessary alternatives?"
        traceability:
