schema: cerebro-rule-set/v1
rules:
- id: CTX-001
  owner: context
  authority: normative
  priority: high
  condition:
    always: true
  action:
    classify_context_as:
    - assessment
    - decision
    - current-basis
    - history
  statement: Context Engine SKAL skille mellom vurderinger, beslutninger, gjeldende grunnlag og historikk.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: &id001
    - 3.5.4
    - '3.6'
    - 3.6.1
    - 3.6.2
    - 3.6.3
- id: CTX-002
  owner: context
  authority: normative
  priority: high
  condition:
    context_item_relevant_for_future_work: true
  action:
    add_to_active_context: true
  statement: Context Engine SKAL legge informasjon som er gjeldende for videre arbeid inn i aktiv kontekst.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-003
  owner: context
  authority: normative
  priority: normal
  condition:
    context_item_type_in:
    - goal
    - framework
    - decision
    - selected_solution
    - constraint
    - other_applicable_basis
  action:
    allow_active_context: true
  statement: Aktiv kontekst KAN inneholde mål, rammer, beslutninger, valgte løsninger, begrensninger og andre forhold som
    skal legges til grunn.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-004
  owner: context
  authority: normative
  priority: high
  condition:
    information_confirmed_relevant: true
  action:
    classify_as_current_basis: true
  statement: Context Engine SKAL klassifisere bekreftet relevant informasjon som skal brukes videre som gjeldende grunnlag.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-005
  owner: context
  authority: normative
  priority: high
  condition:
    information_available: true
    information_confirmed_relevant: false
  action:
    exclude_from_current_basis: true
  statement: Tilgjengelig informasjon SKAL IKKE inngå automatisk i gjeldende grunnlag.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-006
  owner: context
  authority: normative
  priority: high
  condition:
    new_information_candidate_for_active_context: true
  action:
    evaluate_before_activation: true
  statement: Context Engine SKAL vurdere informasjon før den legges inn i aktiv kontekst.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-007
  owner: context
  authority: normative
  priority: high
  condition:
    item_is_analysis_or_alternative: true
    direction_selected: false
  action:
    classify_as_assessment: true
  statement: Context Engine SKAL klassifisere analyser og alternativer som ikke er gjort gjeldende som vurderinger.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-008
  owner: context
  authority: normative
  priority: high
  condition:
    item_classification: assessment
  action:
    prohibit_decision_treatment: true
  statement: En vurdering SKAL IKKE behandles som en beslutning før retningen er valgt.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-009
  owner: context
  authority: normative
  priority: high
  condition:
    any:
    - user_choice
    - user_assistant_agreement
    - applicable_rule_or_framework
    direction_clear: true
  action:
    classify_as_decision: true
  statement: Context Engine SKAL klassifisere en valgt og avklart retning som beslutning.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-010
  owner: context
  authority: normative
  priority: high
  condition:
    decision_affects_future_work: true
  action:
    add_to_active_context: true
  statement: En beslutning som skal påvirke videre arbeid SKAL inngå i aktiv kontekst.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: CTX-011
  owner: context
  authority: normative
  priority: high
  condition:
    explicit_user_override: true
  action:
    record:
    - overridden_rule
    - new_decision
    - timestamp
    - scope
    - status
  statement: Context Engine SKAL registrere brukerens eksplisitte overstyringer med overstyrt regel, ny beslutning, tidspunkt,
    gyldighetsområde og status.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
- id: CTX-012
  owner: context
  authority: normative
  priority: normal
  condition:
    override_revoked: true
  action:
    set_override_status: revoked
  statement: Context Engine SKAL bevare en opphevet overstyring som historikk og markere den som opphevet.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
# BEGIN PATCH-003.PRE-006 CONSOLIDATE
- id: CTX-013
  owner: context
  authority: normative
  priority: high
  condition: {explicit_marker_request: true}
  action:
    create_conversation_marker: {authority: non-authoritative-reference, scope: current-conversation, stable_identity: true}
  statement: Flagg/markering av en idé SKAL opprette en stabil samtalelokal referanse uten å gjøre idéen til Wisdom, beslutning eller Source.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: CTX-014
  owner: context
  authority: normative
  priority: high
  condition: {conversation_marker_exists: true}
  action:
    prohibit_automatic_promotion: [wisdom, decision, source-authority]
  statement: En samtalemarkør SKAL forbli referanse og SKAL IKKE automatisk promoteres.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: CTX-015
  owner: context
  authority: normative
  priority: high
  condition: {consolidation_request: true}
  action:
    retrieve_by: [selected-topics, selected-markers, selected-window]
    prioritize_by_expected_decision_value: true
    bounded_dependency_escape: true
  statement: Context Engine SKAL hente etter TOPICS, MARKERS og WINDOW, prioritere etter beslutningsverdi og bare gå utenfor WINDOW for direkte materielle avhengigheter.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: CTX-016
  owner: context
  authority: normative
  priority: normal
  condition: {consolidation_window_RECENT: true}
  action:
    expand_backward_while_materially_useful: true
    stop_on: [clear-topic-boundary, major-task-transition, semantic-independence, low-expected-effect, sufficient-context]
  statement: RECENT SKAL være adaptivt og kort, og utvides bakover bare mens konteksten fortsatt kan påvirke syntesen.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: CTX-017
  owner: context
  authority: normative
  priority: high
  condition: {consolidation_context_selection: true}
  action:
    prioritize: [explicit-decisions, user-corrections, direction-changes, contradictions, strong-critique-findings, model-changing-refine-results, significant-human-feedback, machine-constraints, governing-authority-or-wisdom, unresolved-disagreement, implementation-consequences]
  statement: Begrenset analyseoppmerksomhet SKAL brukes på informasjon med høyest forventet effekt på sluttforståelsen eller beslutningen.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: CTX-018
  owner: context
  authority: normative
  priority: high
  condition: {consolidation_context_selection: true}
  action: {prohibit_recency_as_authority: true}
  statement: Nyere informasjon SKAL IKKE veie tyngre bare fordi den er nyere.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
# END PATCH-003.PRE-006 CONSOLIDATE
# BEGIN PATCH-007.PRE-005 DEVELOPMENT HISTORY + FAILURE LEARNING
- id: CTX-019
  owner: context
  authority: normative
  priority: high
  condition: {history_candidate_observed: true}
  action:
    construct_history_candidate: true
    require_MCP_admission_before_Source_persistence: true
  statement: Context Engine SKAL konstruere Development History-kandidater som evidens, mens MCP avgjør opptak før kanonisk Source-persistens.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-020
  owner: context
  authority: normative
  priority: critical
  condition: {development_history_record_published: true}
  action:
    prohibit_in_place_rewrite: true
    require_new_record_for: [CORRECTION, RETRACTION]
  statement: Publisert Development History SKAL være append-only; korreksjon og tilbaketrekking SKAL opprette nye sporbare poster.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-021
  owner: context
  authority: normative
  priority: high
  condition: {history_candidate_contains_failure_learning: true}
  action:
    reference_detailed_failure_evidence: true
    prohibit_duplicate_failure_database: true
  statement: Development History SKAL beskrive betydningen av failure learning og referere detaljert evidence, ikke duplisere Change failure knowledge.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-022
  owner: context
  authority: normative
  priority: high
  condition: {explicit_user_history_request: true}
  action:
    admit_as_user_selected_history_candidate: true
    preserve_user_selection_provenance: true
  statement: Når bruker eksplisitt markerer en hendelse som historisk, SKAL den behandles som user-selected History-kandidat med bevart provenance.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: user-directed-development, source: PATCH-007.PRE-005}
- id: CTX-023
  owner: context
  authority: normative
  priority: critical
  condition: {history_append_failed_after_primary_operation_success: true}
  action:
    preserve_primary_success: true
    defer_history_append_to_next_safe_authorized_boundary: true
  statement: Feil ved History-persistens etter verifisert primærsuksess SKAL IKKE ugyldiggjøre primærsuksessen.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-024
  owner: context
  authority: normative
  priority: normal
  condition: {development_history_retrieval: true}
  action:
    require_relevance_driven_bounded_retrieval: true
    prohibit_bulk_history_by_default: true
  statement: Development History SKAL hentes relevansdrevet og avgrenset, ikke bulk-lastet som standard.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-025
  owner: context
  authority: normative
  priority: critical
  condition: {failure_learning_is_machine_enforceable: true}
  action:
    require_change_regression_binding: true
    keep_learning_evidence_only_until_governing_contract_binding: true
  statement: Maskinhåndhevbar failure learning SKAL bindes til eksisterende Change/Builder/Validator-assurance og ikke bli stående som dokumentasjon alene.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
- id: CTX-026
  owner: context
  authority: normative
  priority: normal
  condition: {first_pass_run_success_observed: true}
  action:
    classify_as_strengthening_evidence: true
    prohibit_success_metric_as_authority: true
  statement: First-pass success og bruker-retry-count KAN brukes som strengthening evidence, men SKAL IKKE skape Source- eller policy-authority.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-007.PRE-005}
# END PATCH-007.PRE-005 DEVELOPMENT HISTORY + FAILURE LEARNING
