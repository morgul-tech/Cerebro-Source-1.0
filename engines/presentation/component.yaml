schema: cerebro-component/v1
component:
  id: presentation
  name: Presentation Engine
  type: engine
  version: 1.4.0
  status: active-source
responsibility:
  primary: Velge presentasjonsform, informasjonsstruktur, detaljnivå, output-budsjett, Styringsstatus og visuelle virkemidler.
dependencies:
  build:
  - terminology
  - visual-language
  runtime: []
interfaces:
  input:
  - information-type
  - purpose
  - working-mode
  - dialog-state
  - user-needs
  - complexity
  - status-request
  - runtime-state
  - consolidation-result
  - output-budget
  - committed-control-session-state
  - MCP-context-navigation-options
  - matching-state-service-completion-receipt
  - terminal-roadmap-projection-request
  - fresh-structured-roadmap-snapshot
  output:
  - presentation-model
  - format
  - detail-level
  - governance-status
  - visual-elements
  - information-order
  - consolidation-report
  - human-navigation-surface-candidate
  - official-roadmap-pdf
  - roadmap-projection-draft-receipt
schemas:
  human_navigation_surface_candidate: human-navigation-surface-candidate.schema.json
  MCP_navigation_options: ../../mcp/context-navigation-options.schema.json
  MCP_navigation_options_precommit_candidate: ../../mcp/context-navigation-options-candidate.schema.json
rules:
  path: rules.yaml
profiles:
  admin_bios:
    path: admin-bios.yaml
    surface_id: CEREBRO-BOOT-COMPLETION-SURFACE-001
    status: ACTIVE
  roadmap_official:
    path: roadmap-official.yaml
    surface_id: CEREBRO-ROADMAP-OFFICIAL-001
    status: ACTIVE
documentation:
  path: specification.md
migration:
  source: MASTER_v1.1
  sections:
  - '0.4'
  - '0.5'
  - 3.5.5
  - '3.8'
  - 3.8.1
  - 3.8.2
  - 3.8.3
  - 3.8.4
  - 3.8.5
boundaries:
  must:
  - compress-without-changing-semantics
  - render-only-MCP-approved-state-bound-navigation-actions
  - preserve-same-session-next-step-across-nonmaterial-detours
  - preserve-truth-strength-in-status-rendering
  - keep-semantic-glyph-and-state-instrumentation-separate
  - render-official-roadmap-from-fresh-structured-state
  - preserve-layout-F-roadmap-grammar
  - keep-A-linear-progress-strip-secondary-only
  must_not:
  - invent-or-self-approve-navigation-action
  - let-HNS-override-HCS-or-exact-shell-handoff
  - hide-internally-executable-work-behind-human-trigger
  - fabricate-telemetry-or-verification-state
  - use-right-side-status-rail-in-admin-bios
  - treat-roadmap-pdf-as-state-authority
  - publish-or-verify-provider-artifact
  - invent-roadmap-status
version:
  component: 1.4.0
  schema: 1
