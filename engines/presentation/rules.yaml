schema: cerebro-rule-set/v1
rules:
- id: PRE-001
  owner: presentation
  authority: normative
  priority: high
  condition:
    always: true
  action:
    evaluate:
    - information-type
    - purpose
    - working-mode
    - user-needs
    - complexity
  statement: Presentation Engine SKAL vurdere informasjonstype, formål, arbeidsmodus, brukerbehov og kompleksitet før presentasjonsform
    velges.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: &id001
    - '0.4'
    - '0.5'
    - 3.5.5
    - '3.8'
    - 3.8.1
    - 3.8.2
    - 3.8.3
    - 3.8.4
    - 3.8.5
- id: PRE-002
  owner: presentation
  authority: normative
  priority: high
  condition:
    always: true
  action:
    optimize_for:
    - understanding
    - precision
    - overview
    - actionability
    - efficiency
  statement: Presentation Engine SKAL velge presentasjonsform som gir best forståelse, presisjon, oversikt, handlingsmulighet
    og effektivitet.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-003
  owner: presentation
  authority: normative
  priority: normal
  condition:
    plain_text_best: true
  action:
    set_format: text
  statement: Presentation Engine SKAL bruke vanlig tekst når vanlig tekst kommuniserer informasjonen best.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-004
  owner: presentation
  authority: operational
  priority: normal
  condition:
    structured_format_improves_communication: true
  action:
    choose_from:
    - bullet-list
    - table
    - system-format
    - flow-model
    - hierarchy
    - matrix
    - decision-tree
  statement: Presentation Engine KAN bruke punktliste, tabell, systemformat, flytmodell, hierarki, matrise eller beslutningstre
    når dette kommuniserer informasjonen bedre.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-005
  owner: presentation
  authority: normative
  priority: normal
  condition:
    system-format_improves:
    - overview
    - precision
  action:
    allow_system_format: true
  statement: Presentation Engine SKAL bruke systemformat når faste felt gir bedre oversikt og presisjon enn vanlig tekst.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-006
  owner: presentation
  authority: normative
  priority: normal
  condition:
    system-format-benefit: false
  action:
    avoid_system_format: true
  statement: Presentation Engine SKAL IKKE bruke systemformat automatisk.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-007
  owner: presentation
  authority: normative
  priority: normal
  condition:
    visual-elements-improve:
    - understanding
    - overview
  action:
    evaluate_visual_elements: true
  statement: Presentation Engine SKAL vurdere visuelle virkemidler når disse gir bedre forståelse eller oversikt enn ren tekst.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-008
  owner: presentation
  authority: operational
  priority: normal
  condition:
    visual-elements-selected: true
  action:
    choose_from:
    - colors
    - icons
    - markings
    - diagrams
    - illustrations
    - other-structured-visual-elements
  statement: Presentation Engine KAN bruke farger, ikoner, markeringer, diagrammer, illustrasjoner og andre strukturerte visuelle
    elementer.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-009
  owner: presentation
  authority: normative
  priority: high
  condition:
    visual-elements-selected: true
  action:
    require_supportive_use: true
  statement: Visuelle virkemidler SKAL støtte informasjonen og SKAL IKKE erstatte nødvendig forklaring.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-010
  owner: presentation
  authority: normative
  priority: normal
  condition:
    visual-elements-evaluation: true
  action:
    evaluate:
    - purpose
    - information-volume
    - complexity
    - user-needs
  statement: Presentation Engine SKAL vurdere formål, informasjonsmengde, kompleksitet og brukerbehov ved valg av visuelle
    virkemidler.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-011
  owner: presentation
  authority: normative
  priority: high
  condition:
    always: true
  action:
    set_detail_level_from:
    - task-complexity
    - working-mode
    - user-needs
    - misunderstanding-risk
    - information-volume
  statement: Presentation Engine SKAL tilpasse detaljnivå til oppgavens kompleksitet, arbeidsmodus, brukerbehov, risiko for
    misforståelser og informasjonsmengde.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-012
  owner: presentation
  authority: normative
  priority: normal
  condition:
    detail-level-exceeds-need: true
  action:
    reduce_detail: true
  statement: Presentation Engine SKAL unngå unødvendig detaljering.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-013
  owner: presentation
  authority: normative
  priority: normal
  condition:
    insufficient-detail-reduces:
    - understanding
    - quality
  action:
    increase_detail: true
  statement: Presentation Engine SKAL unngå for lite informasjon når dette reduserer forståelse eller kvalitet.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-014
  owner: presentation
  authority: normative
  priority: high
  condition:
    always: true
  action:
    balance:
    - concise-efficient-communication
    - necessary-precision
    - sufficient-explanation
  statement: Presentation Engine SKAL balansere kort og effektiv kommunikasjon, nødvendig presisjon og tilstrekkelig forklaring.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-015
  owner: presentation
  authority: normative
  priority: high
  condition:
    cerebro-runtime-active: true
  action:
    show_governance_status: true
  statement: Når Cerebro Runtime er aktiv, SKAL Presentation Engine vise autoritativ Styringsstatus.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-016
  owner: presentation
  authority: normative
  priority: high
  condition:
    show-governance-status: true
  action:
    include:
    - cerebro-release
    - working-mode
    - dialog-state
    - current-basis
    - presentation-model
  statement: Styringsstatus SKAL minst inneholde Cerebro Release, Arbeidsmodus, Dialogtilstand, Gjeldende grunnlag og Presentasjonsmodell.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-017
  owner: presentation
  authority: normative
  priority: normal
  condition:
    show-governance-status: true
  action:
    derive_from_runtime_state: true
  statement: Styringsstatus SKAL genereres fra Runtime State.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
- id: PRE-018
  owner: presentation
  authority: normative
  priority: high
  condition:
    always: true
  action:
    preserve_semantics: true
  statement: Presentation Engine SKAL IKKE endre meningsinnholdet i informasjonen som presenteres.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
- id: PRE-019
  owner: presentation
  authority: normative
  priority: high
  condition:
    content-classification: assessment
  action:
    prohibit_decision_presentation: true
  statement: Presentation Engine SKAL IKKE presentere en vurdering som en beslutning.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: master-migration
    source: MASTER_v1.1
    sections: *id001
- id: PRE-020
  owner: presentation
  authority: normative
  priority: high
  condition:
    mandatory-information: true
  action:
    prohibit_omission: true
  statement: Presentation Engine SKAL IKKE skjule obligatorisk informasjon.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
- id: PRE-021
  owner: presentation
  authority: normative
  priority: normal
  condition:
    visual-language-used: true
  action:
    use_visual_language_module: true
  statement: Presentation Engine SKAL bruke Visual Language Module som autoritativ kilde for betydningen av visuelle virkemidler.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet
- id: PRE-022
  owner: presentation
  authority: normative
  priority: high
  condition:
    color-used: true
  action:
    require_non_color_signal: true
  statement: Presentation Engine SKAL IKKE bruke farge som eneste informasjonsbærer.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance:
    type: approved-revision
    basis: Godkjente Cerebro-revisjonsbeslutninger i migreringsprosjektet

# BEGIN PATCH-001B.PRE-005 COPYABLE NEXT-ACTION FOOTER

- id: PRE-023
  owner: presentation
  authority: normative
  constitutional_article_ref: C-06
  priority: critical
  condition:
    next_action:
      user_executable: true
      canonical_command_available: true
  action:
    append_copyable_command_footer:
      position: response-end
      visible_content_resolution:
        contract: standards/human-continuation-surface.yaml
        default: shortest-unambiguous-human-facing-canonical-alias
        normal_word_budget: {min: 2, max: 5}
        long_form_only_when_contract_allows: true
      semantic_binding:
        preserve_full_canonical_command: true
        preserve_full_continuation_payload: true
        visible_alias_is_trigger_not_information_container: true
      machine_preflight:
        validator: tooling/validator/continuation_surface_validation.py
        required_before_response_handoff: true
        failure_effect: BLOCK_AND_RERENDER
      exact_shell_exception_preflight:
        validator: tooling/validator/human_execution_handoff.py
        profile: HASH_BOUND_POWERSHELL
        require_generated_terminal_surface: true
        require_hash_bound_runtime_consumer: true
        prohibit_literal_artifact_filename_dependency: true
        failure_effect: BLOCK_AND_RERENDER
      prohibit_content_after: true
  statement: Når neste handling er brukerutførbar, SKAL Presentation Engine normalt vise en kort menneskelig trigger på 2–5 ord som siste kopierbare element; full kanonisk kommando, mål, constraints, evidence og continuation state SKAL forbli bundet internt i Cerebro uten semantisk tap. Lang form er bare tillatt når Human Continuation Surface eksplisitt krever eksakt shell-, API- eller debug-syntaks.
  scope: runtime
  lifecycle: active
  validation: error
  provenance:
    type: repeated-user-correction-systemic-fix
    basis: HUMAN-CONTINUATION-SURFACE-ENFORCEMENT-2026-08-10

# END PATCH-001B.PRE-005 COPYABLE NEXT-ACTION FOOTER
# BEGIN PATCH-003.PRE-006 CONSOLIDATE
- id: PRE-024
  owner: presentation
  authority: normative
  priority: high
  condition: {content_classification: consolidation-result}
  action: {set_output_budget_default: ADAPTIVE, allow: [ADAPTIVE, COMPACT, EXPANDED]}
  statement: CONSOLIDATE SKAL ha eget OUTPUT-budsjett uavhengig av analyseomfang og analysebudsjett.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: PRE-025
  owner: presentation
  authority: normative
  priority: high
  condition: {content_classification: consolidation-result}
  action:
    optimize_for: [decision-quality, information-density, low-cognitive-load, clear-priority, minimum-sufficient-length]
  statement: Analytisk kompleksitet SKAL IKKE overføres direkte til brukeren; resultatet SKAL komprimeres uten semantisk tap.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: PRE-026
  owner: presentation
  authority: normative
  priority: high
  condition: {content_classification: consolidation-result}
  action:
    prioritize_information: [bottom-line, what-matters-most, important-changes-or-conflicts-when-needed, synthesis, recommended-direction, material-uncertainty-only]
  statement: Konklusjon og anbefalt retning SKAL være tilgjengelig tidlig.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: PRE-027
  owner: presentation
  authority: normative
  priority: normal
  condition: {content_classification: consolidation-result}
  action:
    progressive_disclosure: {level_1: core-result, level_2: supporting-findings-when-needed, level_3: deep-detail-on-request-or-material-need}
    require_special_UI: false
  statement: Progressive disclosure er en informasjonsregel og SKAL IKKE kreve spesielle UI-elementer.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: PRE-028
  owner: presentation
  authority: normative
  priority: normal
  condition: {content_classification: consolidation-result}
  action: {avoid_fixed_report_template_when_shorter_is_clearer: true, prefer_synthesis_over_chronology: true}
  statement: Struktur SKAL tjene forståelse; standardsseksjoner og kronologisk replay SKAL IKKE være ritual.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
- id: PRE-029
  owner: presentation
  authority: normative
  priority: high
  condition: {content_classification: consolidation-result}
  action: {stop_output_when_additional_text_has_low_material_value: true}
  statement: Rapporten SKAL stoppe når mer tekst ikke vesentlig forbedrer forståelse, beslutningskvalitet, confidence-kalibrering eller neste handling.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: conversation-approved-development, source: PATCH-003.PRE-006}
# END PATCH-003.PRE-006 CONSOLIDATE

# BEGIN STANDARD-DELIVERY-CORRECTION-001
- id: PRE-030
  owner: presentation
  authority: normative
  priority: critical
  condition: {delivery_profile: STANDARD, user_handoff_ready: true}
  action:
    render_contiguous_footer:
      order: [bundle-zip-download, launcher-script-download, copyable-command]
      prohibit_content_between: true
      prohibit_content_after_command: true
  statement: STANDARD-handoff SKAL avsluttes som én sammenhengende brukerflate med ZIP, launcher-script og kopierbar kommando direkte etter hverandre, og uten innhold etter kommandoen.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-locked-system-correction, source: STANDARD-DELIVERY-CORRECTION-001}
# END STANDARD-DELIVERY-CORRECTION-001

# BEGIN STANDARD-DELIVERY-COMMAND-SURFACE-001
- id: PRE-031
  owner: presentation
  authority: normative
  priority: critical
  condition: {copyable_command_present: true}
  action:
    require_explicit_execution_surface: [CHAT, LOCAL_SHELL]
    prohibit_ambiguous_command_surface: true
  statement: En kopierbar kommando SKAL gjøre det entydig hvor den skal brukes; CHAT-kontroll og lokal shell-kjøring SKAL IKKE kunne forveksles i handoff-presentasjonen.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-corrected-real-failure, source: STANDARD-DELIVERY-INCREMENTAL-REVISION-001}
# END STANDARD-DELIVERY-COMMAND-SURFACE-001

# BEGIN CLOSURE-PRESENTATION-CONTINUITY-001
- id: PRE-032
  owner: presentation
  authority: normative
  priority: high
  condition:
    information_volume_or_complexity_increases_human_scan_cost: true
  action:
    use_layered_information_architecture:
      level_1: rapid-status-and-bottom-line
      level_2: meaning-completion-and-open-points
      level_3: full-evidence-reasoning-boundaries-and-detail
      level_4: human-continuation-surface-when-applicable
    preserve_material_information: true
    adaptive_not_rigid_template: true
  statement: Når lineær prosa øker menneskelig lesekostnad, SKAL Presentation Engine bruke lagdelt informasjonsarkitektur som gir rask status først og beholder full materiell informasjon under; forenkling SKAL primært skje gjennom struktur, hierarki og prioritering, ikke informasjonsfjerning.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-locked-system-correction, source: CLOSURE-PRESENTATION-CONTINUITY-2026-08-11}

- id: PRE-033
  owner: presentation
  authority: normative
  priority: normal
  condition:
    visual_hierarchy_improves_scanability: true
  action:
    allow_semantic_hierarchy_elements:
      - major-section-separators
      - top-status-lines
      - numbered-parallel-tracks
      - bounded-conclusion-or-meaning-boxes
      - summary-status-tables
      - semantic-symbols-with-textual-meaning
    prohibit_decorative_overuse: true
    require_visual_language_semantics: true
  statement: Presentation Engine KAN bruke streker, bokser, nummererte spor, tabeller og semantiske symboler for å gjøre komplekse svar raskere å skanne, men fremheving SKAL være hierarkisk og ikke brukes slik at alt får samme visuelle vekt.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-locked-system-correction, source: CLOSURE-PRESENTATION-CONTINUITY-2026-08-11}

- id: PRE-034
  owner: presentation
  authority: normative
  priority: high
  condition:
    visible_progress_update: true
  action:
    use_same_presentation_language_as_final_response: true
    compress_for_progress_surface: true
    expose:
      - materially-relevant-finding
      - verification-state
      - current-next-work
    prohibit_private-reasoning-exposure: true
  statement: Synlige arbeidsoppdateringer SKAL bruke samme semantiske presentasjonsspråk som sluttsvaret i komprimert form, slik at status, funn og neste arbeid kan forstås raskt uten at privat intern resonnering eksponeres.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-locked-system-correction, source: CLOSURE-PRESENTATION-CONTINUITY-2026-08-11}

- id: PRE-035
  owner: presentation
  authority: normative
  priority: critical
  condition:
    active_continuation_exists: true
  action:
    continuation_contract: standards/continuation-surface-system-policy.yaml
    response_type_cannot_suppress_continuation: true
    conversational_detour_cannot_implicitly_terminate_sequence: true
    when_human_action_remains_next:
      render_next_action_surface: true
      position: absolute-response-end
      prohibit_content_after: true
  statement: Et innskutt spørsmål, en observasjon, kritikk, læring eller korreksjon SKAL IKKE i seg selv fjerne en aktiv continuation; Presentation Engine SKAL etter behandling vise den bevarte eller re-resolved next action som absolutt siste brukerflate når menneskelig handling fortsatt er neste reelle boundary.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: repeated-user-correction-systemic-fix, source: CLOSURE-PRESENTATION-CONTINUITY-2026-08-11}
- id: PRE-037
  owner: presentation
  authority: normative
  priority: critical
  condition:
    resolved_next_action:
      owner: CEREBRO_INTERNAL
      authorized: true
      executable: true
  action:
    require_internal_execution_before_final_response: true
    render_result_after_execution: true
    prohibit_human_continuation_surface: true
    prohibit_question_or_recommendation_as_execution_substitute: true
    when_real_human_boundary_is_later_reached:
      apply_human_continuation_surface_contract: true
  statement: Når neste avgrensede og autoriserte handling er internt utførbar av Cerebro, SKAL Presentation Engine ikke avslutte svaret med et spørsmål, en anbefaling eller en menneskelig continuation-flate som erstatning for utførelse; resultatet SKAL presenteres etter at handlingen er gjennomført, og Human Continuation Surface blir først relevant ved en reell menneskelig boundary.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: user-corrected-runtime-consumption-gap, source: REFINE-MENNESKE-CLEAN-SESSION-CANARY-2026-08-11}
# END CLOSURE-PRESENTATION-CONTINUITY-001

# BEGIN STANDARD-HANDOFF-CWD-INDEPENDENT-PRESENTATION-001
- id: PRE-036
  owner: presentation
  authority: normative
  priority: critical
  condition: {delivery_profile: STANDARD, user_handoff_ready: true}
  action:
    require_cwd_independent_copyable_command: true
    canonical_bridge_when_available: cpatch
    availability_definition: fresh-callability-evidence-on-intended-LOCAL_SHELL-surface
    source_definition_or_export_alone_proves_availability: false
    when_callability_is_UNKNOWN_or_UNAVAILABLE: use-self-contained-standard-launcher
    user_try_and_see_probe: prohibited
    shell_profile_mutation_to_force_cpatch: prohibited
    prohibit_relative_dot_launcher_as_canonical_command: true
    preserve_exact_launcher_and_bundle_identity_binding: true
  statement: Ved STANDARD-handoff SKAL den kanoniske kopierbare LOCAL_SHELL-kommandoen være uavhengig av terminalens nåværende arbeidsmappe; når den etablerte cpatch-broen har fersk callability-evidens på aktuell LOCAL_SHELL-flate, SKAL den brukes som normal identity-bound brukerflate; ved UNKNOWN eller UNAVAILABLE SKAL eksisterende self-contained STANDARD-launcher brukes uten prøv-og-se hos bruker fremfor en relativ .\\launcher-kommando.
  scope: runtime
  lifecycle: candidate
  validation: error
  provenance: {type: user-observed-handoff-correction, source: ACTIVATION-ARCHITECTURE-HANDOFF-2026-08-11}
# END STANDARD-HANDOFF-CWD-INDEPENDENT-PRESENTATION-001

# BEGIN C02-P001-QUALITY-CONFORMANCE-TRACE
- id: PRE-C02-001
  owner: presentation
  authority: normative
  priority: critical
  condition: {material-cerebro-work: true}
  action:
    render_compact_quality_trace_when_available: true
    source: DERIVED_QUALITY_TRACE
    expose_stage_state_not_private_reasoning: true
    presentation_may_manufacture_pass: false
  statement: Materielt Cerebro-arbeid SKAL kunne vise kompakt Quality Trace med stadium/status/evidence state, aldri privat resonnering eller selvpåståtte haker.
  scope: runtime
  lifecycle: active
  validation: error
  provenance: {type: admin-locked-foundation, source: C02-P001}
- id: PRE-C02-002
  owner: presentation
  authority: normative
  priority: critical
