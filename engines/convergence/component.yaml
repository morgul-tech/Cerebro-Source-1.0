schema: cerebro-component/v1
component:
  id: convergence
  name: Convergence Engine
  type: engine
  version: 0.2.0
  status: LOCKED_DEFINITION

architecture:
  path: architecture.yaml
  state: LOCKED
  lock_id: C02-P002-CONVERGENCE-ARCH-LOCK-001
implementation_state: CANDIDATE_SEMANTIC_CONSUMER
operational_state: PENDING_EXECUTABLE_BINDING

responsibility:
  primary: >
    Organize authorized material work into the broadest safe work families and
    drive dependency-aware iteration toward a converged candidate with the
    minimum necessary human boundaries and redundant executions.

boundaries:
  must:
    - form-work-family-graph
    - maximize-safe-batching
    - bind-applicable-known-prevention-and-regression
    - determine-family-order-from-dependencies
    - track-pass-basis-and-invalidation
    - rerun-earliest-affected-family-after-material-change
    - collect-complete-family-defect-set-when-no-hard-stop
    - drive-final-cross-family-convergence-sweep
    - expose-convergence-state-to-MCP-and-quality
    - request-human-boundary-only-when-real
  must_not:
    - own-user-objective
    - own-Source-authority
    - own-MCP-control-decision
    - define-quality-criteria
    - execute-capabilities-directly
    - own-Temporaris
    - promote-evidence-to-authority
    - mutate-Source-by-itself

dependencies:
  runtime:
    - context
    - quality
  optional_runtime:
    - project
interfaces:
  input:
    - authorized-objective
    - mcp-control-decision
    - execution-profile
    - applicable-learning
    - quality-requirements
    - candidate-environment-state
    - execution-evidence
    - MCP-convergence-owner-effect
  output:
    - convergence-plan
    - work-family-graph
    - execution-batch
    - invalidation-set
    - revalidation-plan
    - convergence-state
    - human-boundary-request
    - convergence-owner-effect-candidate-receipt
control_integration:
  governing_control_owner: MCP
  candidate_environment: Temporaris
  quality_owner: quality
  execution_binding: LOCAL_HOST_HARNESS_CONTRACT_IMPLEMENTED_NOT_LIVE_BOUND
  architecture_lock_is_operational_execution_proof: false
  owner_effect_binding:
    implementation_ref: engines/convergence/convergence_owner_effect.py
    persistence_ref: tooling/owner_state/owner_state_persistence.py
    commit_receipt_schema_ref: mcp/owner-state-commit-receipt.schema.json
    persistence_validator_ref: tooling/validator/owner_state_persistence_validation.py
    normal_host_ref: mcp/control_resolution_host.py
    state_schema_ref: engines/convergence/convergence-owner-state.schema.json
    receipt_schema_ref: mcp/owner-effect-receipt.schema.json
    lifecycle: CANDIDATE_SEMANTIC_CONSUMER_AND_PERSISTENCE_ADAPTER_NOT_LIVE_DEPLOYED
    effect: REVALIDATE_AFFECTED
    output_without_owner_commit: CANDIDATE_NOT_CURRENT
    normal_consumer_proven: false
    local_normal_host_harness_contract_proven: true
    live_PostgreSQL_and_remote_host_proven: false
model:
  path: model.yaml
rules:
  path: rules.yaml
documentation:
  path: specification.md
