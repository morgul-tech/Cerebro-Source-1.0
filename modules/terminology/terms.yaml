schema: cerebro-terminology/v1
terms:
  cerebro:
    term: Cerebro
    aliases: [systemet, hele systemet]
    definition: Hele det styrte systemet som består av autoritativ Source, avledede Releases, Runtime, kontroll- og valideringsmekanismer, endringsverktøy og brukergrensesnitt.
  mcp:
    term: MCP
    expanded: Master Control Program
    definition: Cerebros stabile kontrollkjerne som definerer identitet, autoritet, arkitektur, prioritet og aktiveringskrav.
  engine:
    term: Engine
    definition: Aktiv komponent som mottar definert input, utfører behandling og returnerer definert output.
  module:
    term: Module
    definition: Passiv komponent som leverer regler, begreper, konfigurasjon, arbeidsmønstre eller domenekunnskap.
  tooling:
    term: Tooling
    definition: Komponenter som bygger, validerer, laster eller publiserer Cerebro.
  source:
    term: Cerebro Source
    aliases: [source, kilden]
    definition: Eneste redigerbare policyautoritet for Cerebros betydning, regler, arkitektur, standarder og kildekomponenter.
    authority_dimension: policy
  release:
    term: Cerebro Release
    aliases: [release]
    definition: Bygget, validert, versjonert og publiserbar implementasjon avledet fra Cerebro Source.
    authority_dimension: derived-implementation
  runtime:
    term: Cerebro Runtime
    aliases: [runtime, aktiv cerebro, kjørende cerebro]
    definition: Aktiv forekomst av én bestemt Cerebro Release.
  source_repository:
    term: Source repository
    aliases: [source repo, source-repoet, source github]
    definition: Git-repositoriet som publiserer Cerebro Source-historikk og branches.
  published_source_baseline:
    term: Published Source baseline
    aliases: [gjeldende source, publisert source, source baseline]
    definition: Eksakt Source-repository, branch og uforanderlig commit som er gjeldende publisert Source-referanse.
  working_source:
    term: Working Source
    aliases: [lokal source, arbeids-source]
    definition: Utpekt lokal Git-arbeidskopi for inspeksjon og forberedelse av Source-endringer.
  release_repository:
    term: Release repository
    aliases: [release repo, release-repoet, release github]
    definition: Git-repositoriet som publiserer versjonert Cerebro Release-implementasjon.
  published_release_baseline:
    term: Published Release baseline
    aliases: [gjeldende release, publisert release, release baseline, autoritativ release]
    definition: Eksakt Release-repository, branch og uforanderlig commit som er gjeldende publisert implementasjonsreferanse.
    authority_dimension: published-implementation-bytes
  working_release:
    term: Working Release
    aliases: [lokal release, arbeids-release]
    definition: Utpekt lokal Git-arbeidskopi for validering, installasjon og inspeksjon av Release-endringer.
  cerebro_workspace:
    term: Cerebro workspace
    aliases: [workspace, cerebro-mappen, arbeidsområdet]
    definition: Lokalt filområde for arbeidskopier, rapporter, backups, byggartefakter, scripts og midlertidige kjøredata; plasseringen gir ikke autoritet alene.
  git_repository:
    term: Git repository
    aliases: [repo, repository, git-repo]
    definition: Versjonskontrollert objekt med commits, referanser, historikk og lokal working tree når det er sjekket ut.
  commit:
    term: Commit
    aliases: [commit-id, sha]
    definition: Uforanderlig Git-objekt som identifiserer én eksakt repository-tilstand og dens historiske relasjon.
  synchronization:
    term: Synkronisering
    aliases: [synk, synkron, synkronisert, samme versjon]
    definition: Verifisert likhetsforhold mellom eksplisitt navngitte objekter for et deklarert scope og commit; aldri en frittstående systemstatus.
  cerebro_source_operational:
    term: CEREBRO_SOURCE_OPERATIONAL
    aliases: [cerebro operativ, cerebro fully operational, cerebro aktivert, bruker cerebro nå]
    definition: Gjeldende universelle Cerebro-status når autoritativt Source-repository, branch og eksakt commit er ferskt verifisert og den aktive samtalen styres av gjeldende boot-kritiske Cerebro-kontroller.
    default_scope: conversation-and-authoritative-source
    excludes_by_default: [local-working-source-equality, local-runtime-machine-proof]
    owner: MCP
  conversation_source_alignment:
    term: CONVERSATION_SOURCE_ALIGNMENT
    aliases: [koblet til authoritative source, koblet til authoritative main, synced with authoritative main, synkronisert med authoritative main]
    definition: Ferskt verifisert Published Source baseline kombinert med at den aktuelle samtalen er bundet til og styres av denne Source-committen.
    does_not_mean: local-working-source-filesystem-equality
    strict_non_equivalence: CEREBRO_SYNC_VERIFIED
    owner: MCP
  cerebro_sync_verified:
    term: CEREBRO_SYNC_VERIFIED
    aliases: [lokal cerebro_sync verifisert, working source sync verifisert]
    definition: Streng lokal leveranse- og likhetsstatus som bare kan etableres av fersk canonical cerebro_sync med etterfølgende uavhengig verifikasjon av at lokal Working Source og autoritativ remote er på samme commit og at working tree er ren.
    default_scope: local-working-source-and-authoritative-remote
    cannot_be_inferred_from: [CEREBRO_SOURCE_OPERATIONAL, CONVERSATION_SOURCE_ALIGNMENT]
    owner: delivery
  manifest:
    term: Cerebro Manifest
    definition: Autoritativt inngangspunkt som identifiserer releasen og komponentene som inngår i den.
  active_context:
    term: Aktiv kontekst
    definition: Informasjon som er gjeldende for videre behandling i aktiv Runtime.
  current_basis:
    term: Gjeldende grunnlag
    definition: Bekreftet informasjon som skal legges til grunn for videre arbeid.
  assessment:
    term: Vurdering
    definition: Analyse eller alternativ som undersøkes, men som ikke er gjort gjeldende.
  decision:
    term: Beslutning
    definition: Valgt retning som skal inngå i gjeldende grunnlag.
  version:
    term: Versjon
    definition: Identifisert utgave av Cerebro eller en komponent som representerer et bestemt utviklingspunkt.
  component_activation:
    term: Komponentaktivering
    definition: Handlingen hvor en registrert Engine eller Module gjøres aktiv i Cerebro Runtime.
  working_mode:
    term: Arbeidsmodus
    definition: 'Nivået av samarbeidsstruktur som benyttes: STANDARD, SAMARBEID eller PROSJEKT.'
  dialog_state:
    term: Dialogtilstand
    definition: Fasen arbeidsprosessen befinner seg i, for eksempel informasjon, analyse, avklaring, arbeid, verifisering
      eller ferdigstilling.
  recommendation:
    term: Anbefaling
    definition: Vurdert retning foreslått av assistenten. En anbefaling er ikke en beslutning.
  clarification_point:
    term: Avklaringspunkt
    definition: Punkt hvor nødvendig informasjon, valg eller bekreftelse mangler før videre arbeid kan fortsette.
  control_stop:
    term: Kontrollstopp
    definition: Midlertidig stopp når videre arbeid kan gi feil resultat uten nødvendig kontroll eller avklaring.
  operative_progress_signal:
    term: Operativt fremdriftssignal
    definition: En brukerytring som, tolket i aktiv kontekst, uttrykker at assistenten skal starte, gjenoppta eller fortsette arbeid mot det aktive målet.
    interpretation: Semantisk og kontekstavhengig; ikke begrenset til en lukket liste med ord eller formuleringer.
    requirements:
    - OFS-R001
    - OFS-R002
  human_meaning_refinement:
    term: Menneskelig meningsraffinering
    aliases: [refine menneske]
    definition: Semantisk rekonstruksjon av brukerens sannsynlige mening i lys av menneskelig, omtrentlig, kontekstavhengig, metaforisk eller tale-til-tekst-påvirket språk før ord behandles som eksakte maskintermer.
    interpretation: Operasjonen ser forsiktig mellom linjene og kan ekstrapolere et større støttet poeng; den er ikke automatisk tekstomskriving, kan ikke oppfinne intensjon og kan ikke overstyre eksplisitte rammer.
    owner: interaction
  conversation_evolution_analysis:
    term: Samtaleutviklingsanalyse
    aliases: [analyse convo, analyser convo, analyze convo]
    definition: Kronologisk analyse av hvordan et problem, forståelse, antakelser, krav, beslutninger og løsningsretning utvikler seg gjennom en samtale, med vurdering av sluttløsning, læring, effektivitet og hvordan forbedringsveien kan gjenbrukes eller automatiseres.
    default_scope: complete-current-conversation
    persistence: analysis-only-unless-explicit-CEREBRO-LAGRE
    owner: interaction
  status:
    term: Status
    aliases: [prosjektstatus, gi meg status, hvor er vi, oversikt]
    definition: Rask, prioritert og evidensbasert oversikt over Cerebro-prosjektets publiserte tilstand, aktive arbeid, neste arbeid, åpne notater og anbefalte neste steg.
    default_depth: standard
    depth_aliases:
      brief: [kort status, liten status, status kort]
      standard: [status, prosjektstatus]
      deep: [dyp status, full status, detaljert status]
  governance_status:
    term: Styringsstatus
    definition: Autoritativ statusvisning som beskriver styringsgrunnlaget for et svar når Cerebro Runtime er aktiv.
  presentation_model:
    term: Presentasjonsmodell
    definition: Valgt presentasjonsform for informasjon i et konkret svar.
  collaboration_engine:
    term: Collaboration Engine
    definition: Engine som styrer roller, ansvar, samarbeidsprinsipper og kontinuitet.
  project_engine:
    term: Project Engine
    definition: Engine som styrer prosjektgrunnlag, mål, rammer, faser, leveranser og prosjektrevisjon.
  quality_engine:
    term: Quality Engine
    definition: Engine som kontrollerer arbeidskvalitet, konsistens, kontroll og sporbarhet.
  dialog_engine:
    term: Dialog Engine
    definition: Engine som styrer arbeidsvurdering, arbeidsmodus, dialogtilstand, avklaringspunkt og kontrollstopp.
  context_engine:
    term: Context Engine
    definition: Engine som forvalter aktiv kontekst, gjeldende grunnlag, vurderinger, beslutninger og historikk.
  presentation_engine:
    term: Presentation Engine
    definition: Engine som velger format, struktur, detaljnivå, Styringsstatus og visuelle virkemidler.
status: frozen-for-source-v1.0
freeze_date: '2026-08-03'
