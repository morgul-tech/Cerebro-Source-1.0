schema: cerebro-activation/v1
activation:
  external_protocol: Oppstartsprotokoll
  entrypoint: cerebro.yaml
required_sequence:
- fetch_manifest
- verify_source
- verify_release
- load_mcp
- load_required_engines
- load_required_modules
- initialize_runtime
- activate
command_resolution:
  input: boot cerebro
  match: CASE_INSENSITIVE_EXACT_TRIMMED
  canonical_command: bootCerebro
  authority_preflight: SOURCE_FIRST
  source_ref: github:morgul-tech/Cerebro-Source-1.0/main/cerebro.yaml
  derived_input_rule: CURRENT_COMMIT_BOUND_ONLY
  stale_derived_input_effect: REJECT_INPUT_CONTINUE_CURRENT_SOURCE
rules:
- id: MCP-040
  authority: constitutional
  statement: Oppstartsprotokollen SKAL være ekstern til Cerebro.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-041
  authority: constitutional
  statement: Oppstartsprotokollen SKAL hente Cerebro Manifest fra den autoritative plasseringen.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-042
  authority: constitutional
  statement: Cerebro SKAL IKKE anses som aktiv før angitt release er hentet, validert og lastet.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-043
  authority: constitutional
  statement: Runtime Host SKAL bruke Cerebro Manifest som eneste autoritative inngangspunkt.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-044
  authority: constitutional
  statement: Runtime Host SKAL IKKE aktivere en release som ikke har bestått obligatorisk validering.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-045
  authority: constitutional
  statement: Aktivering SKAL opprette en avledet Bootstrap State for source/release-verifikasjon og kontrolloverfÃ¸ring; Runtime State tilhÃ¸rer den pÃ¥fÃ¸lgende Runtime 0.1-invokasjonen.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-046
  authority: constitutional
  statement: Kommandoen boot cerebro SKAL alltid resolve til bootCerebro gjennom Source-first authority preflight.
  provenance:
    type: approved-refinement
    basis: PATCH-006 boot authority ambiguity refinement
- id: MCP-047
  authority: constitutional
  statement: DOCX-filer, CURRENT-filnavn, bibliotekroot, samtaleminne, receipts og handoffs SKAL IKKE konkurrere med Cerebro Source om authority.
  provenance:
    type: approved-refinement
    basis: PATCH-006 boot authority ambiguity refinement
- id: MCP-048
  authority: constitutional
  statement: Stale derived state SKAL avvises som continuity-input og SKAL IKKE gjenåpne eller blokkere en verifisert gjeldende Source-state.
  provenance:
    type: approved-refinement
    basis: PATCH-006 boot authority ambiguity refinement
- id: MCP-049
  authority: constitutional
  statement: Grønn operativ status SKAL kreve en ACTIVE_CONTROL_TRANSFERRED receipt bundet til gjeldende Source-commit.
  provenance:
    type: approved-refinement
    basis: PATCH-006 boot authority ambiguity refinement
# BEGIN PATCH-002.PRE-003 HANDBOOT ACTIVATION INTEGRATION

handboot_activation:
  introduced_by: PATCH-002.PRE-003
  contract_ref: standards/runtime/handboot.yaml
  bootstrap_state_contract_ref: standards/runtime/handboot-bootstrap-state-schema.yaml
  canonical_command: bootCerebro
  aliases:
    - bootini
    - boot cerebro

  working_model:
    working_source_role: mutable_local_development_surface
    authoritative_source_role: sole_authority_and_verification_target
    publication_command: cerebro_sync
    boot_may_publish: false

  required_order:
    - fetch_and_verify_bootengine
    - fetch_authoritative_source_reference
    - verify_working_source_repository
    - align_working_source_by_safe_fast_forward
    - verify_manifest_and_required_components
    - construct_derived_bootstrap_state
    - atomically_activate_control
    - process_handoff_inside_active_cerebro
    - transfer_control

  activation_gate:
    required_state_before_handoff: ACTIVE
    required_state_after_control_transfer: ACTIVE_CONTROL_TRANSFERRED
    operational_requires_control_transfer: true
    partial_activation_allowed: false

  handoff_gate:
    handoff_may_run_before_activation: false
    handoff_must_run_inside_controlled_runtime: true
    invalid_handoff_is_boot_failure: true
    missing_handoff_is_allowed: true

  failure_state:
    bootstrap_state: INACTIVE_CONTROL_RETAINED
    operational: false
    source_preserved: true
    control_retained: true

# END PATCH-002.PRE-003 HANDBOOT ACTIVATION INTEGRATION
