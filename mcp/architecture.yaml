schema: cerebro-architecture/v1
architecture:
  components:
  - id: mcp
    type: control-core
    required: true
  - id: engines
    type: processing-layer
    required: true
  - id: modules
    type: knowledge-and-rules-layer
    required: true
  - id: tooling
    type: build-and-distribution-layer
    required: true
constraints:
  single_primary_responsibility: true
  defined_interfaces: true
  no_unregistered_components: true
rules:
- id: MCP-020
  authority: constitutional
  statement: Cerebro SKAL bestå av MCP, Engines, Modules og Tooling.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-021
  authority: constitutional
  statement: Hver komponent SKAL ha ett definert hovedansvar.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-022
  authority: constitutional
  statement: En komponent SKAL IKKE overta et hovedansvar som er tildelt en annen komponent.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-023
  authority: constitutional
  statement: Kommunikasjon mellom komponenter SKAL skje gjennom definerte grensesnitt.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-024
  authority: constitutional
  statement: Kun komponenter registrert i Cerebro Manifest SKAL inngå i en Cerebro Release.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
- id: MCP-025
  authority: constitutional
  statement: Nye toppnivåkomponenter SKAL IKKE innføres dersom kravet kan løses innenfor eksisterende arkitektur.
  provenance:
    type: approved-revision
    basis: Godkjent Cerebro-arkitektur og migrering fra MASTER_v1.1 DEL 0–2
