schema: cerebro-architecture/v1
architecture:
  top_level:
  - id: mcp
    type: CONTROL
    required: true
  - id: engines
    type: processing-layer
    required: true
  - id: modules
    type: knowledge-and-rules-layer
    required: true
  - id: tooling
    type: build-and-distribution-layer
    required: true

  component_topology:
    topology_authority: cerebro.yaml
    derivation: manifest-registration
    materialized_active_component_list: prohibited
    registration_rule: only-manifest-registered-components-enter-release
    freshness_rule: derive-from-current-pinned-source-commit

  topology_state:
    dialog: SUPERSEDED_BY_INTERACTION
    collaboration: SUPERSEDED_BY_INTERACTION
    core-rules: DECOMPOSED_AND_SUPERSEDED
    loader: SUPERSEDED_BY_RUNTIME_HOST
    runtime-host: ACTIVE

constraints:
  single_primary_responsibility: true
  defined_interfaces: true
  no_unregistered_components: true
  no_new_top_level_component_when_existing_type_suffices: true
