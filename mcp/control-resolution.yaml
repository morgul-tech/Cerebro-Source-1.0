schema: cerebro-mcp-control-resolution-contract/v1
control_resolution:
  id: CEREBRO-MCP-CONTROL-RESOLUTION-001
  version: "1.6.0"
  status: ACTIVE
  owner: MCP
  implementation_ref: mcp/control_resolution.py
  canonical: true
  live_control_authority: true
  decision_contract: MCP_CONTROL_DECISION
  execution_profile_owner: MCP
  purpose: >
    Provide the one canonical live MCP control-resolution surface that composes
    existing material/relevance control with the exact AA-003 shadow-validated
    adaptive resolver logic without moving control intelligence into Runtime or
    creating a parallel Adaptive Engine.
  constitutional_control:
    contract_ref: mcp/constitution.yaml
    normal_consumer: mcp/control_resolution.py#evaluate_constitutional_compliance
    invocation: EVERY_CANONICAL_CONTROL_RESOLUTION
    verified_material_breach_effect: BLOCK
    suspected_breach_effect: RECORD_AND_INVESTIGATE
    automatic_constitution_amendment: PROHIBITED
  promotion_basis:
    invariant: PROMOTION_MUST_REFERENCE_EXACT_SHADOW_VALIDATED_CANDIDATE_IDENTITY
    source_commit: 810a010d3a3395217b8263b3701b3e7d1c31ff33
    resolver_ref: mcp/adaptive_control_resolver.py
    resolver_git_blob_sha: c375639e0a37141e96d90da7bf00fb36d61651cf
    resolver_contract_ref: mcp/adaptive-control-resolver.yaml
    resolver_contract_git_blob_sha: a8a2b9d55a9f4af2f7439ded5c66425818b384be
    resolver_contract_identity_scope: AA003_SHADOW_VALIDATION_BASIS
    current_promoted_contract_policy:
      lifecycle_metadata_may_evolve: true
      exact_resolver_logic_may_evolve_without-new-shadow-validation: false
      required_current_semantics:
        - status-is-VALIDATED_LOGIC
        - direct-live-authority-is-false
        - canonical-live-owner-is-mcp-control-resolution
        - AA003-shadow-and-AA004-promotion-history-remain-verified
    shadow_oracle_ref: tooling/change/adaptive-control-shadow-scenarios.json
    shadow_oracle_git_blob_sha: 831f7edb0545c66e92a6cfe10d376af3e2fb278e
    shadow_patch_ref: PATCH-AA-003
    candidate_change_effect: BLOCK_PROMOTION_AND_REQUIRE_NEW_SHADOW_VALIDATION
    identity_authority: GIT_OBJECT_AT_SOURCE_COMMIT
    worktree_byte_representation_authority: PROHIBITED
  ordering:
    constitutional_control:
      first: mcp/control_resolution.py#evaluate_constitutional_compliance
      verified_material_breach_effect: BLOCK
    human_effect_fastlane:
      after: constitutional_control
      before: material_control
      only_CONTINUE_reaches_existing_material_or_adaptive_path: true
    material_control:
      invariant: MATERIAL_PREFLIGHT_BLOCK_IS_FINAL
      first: mcp/material_commitment_preflight.py
      pass_only_then: mcp/adaptive_control_resolver.py
      blocked_preflight_may_be_overridden: false
      input_or_execution_error: FAIL_CLOSED_TO_BLOCK
    non_material_control:
      path: canonical_wrapper_to_validated_adaptive_logic
    final_decision_owner: MCP
  refined_airlock_v006:
    status: ACTIVE
    control_ref: CEREBRO-REFINED-AIRLOCK-V006
    implementation_ref: mcp/control_resolution.py#resolve_refined_airlock
    authority_model: DETERMINISTIC_SUBORDINATE_ASSESSMENT
    direct_live_authority: false
    final_decision_owner: MCP
    execution_order:
      - verify-protected-promotion-basis
      - validate-project-context-binding-when-applicable
      - resolve-refined-airlock-before-first-substantive-read
      - stop-on-HOLD-PAUSED-or-CONTAMINATED
      - continue-existing-material-preflight-and-adaptive-path-only-on-READY
    seal_contract:
      exact_bindings: [allowlist, denyset, generation_ref, basis_fingerprint, capsule_ref, capsule_fingerprint]
      canonical_fingerprint_required: true
      substantive_reads_before_seal: 0
    exposure_contract:
      CONTROL_NEUTRAL: CONTINUE_NO_CONTAMINATION
      MATERIAL_SEMANTIC: CONTAMINATED_TERMINAL_NO_UNSEE
      UNKNOWN_MATERIALITY: PAUSE_SAME_ACTOR_ZERO_NEW_READS_EXTERNAL_CLASSIFICATION
      POSTSEAL: PRIMARY_FINGERPRINT_PRESERVED
    retrieval_contract:
      exact_allowlist_only: true
      missing_allowlisted_input: HOLD_NO_BROAD_SEARCH
    currentness_contract:
      resolver_must_be_external_to_blind_actor: true
      ADMINPULSE_is_blind_work_start: false
    network_contract:
      default_gate: false
      proven_causal_threat_nonpass_effect: HOLD
    prohibited:
      - new-control-engine
      - new-scheduler
      - new-truth-store
      - runtime-resident-airlock-policy
  human_effect_fastlane:
    status: ACTIVE
    control_ref: CEREBRO-HUMAN-EFFECT-FASTLANE-001
    implementation_ref: mcp/control_resolution.py#resolve_human_effect_fastlane
    authority_model: DETERMINISTIC_SUBORDINATE_ASSESSMENT
    direct_live_authority: false
    final_decision_owner: MCP
    principle: DEGRADE_CLAIM_OR_PROMOTION_BEFORE_BLOCKING_SAFE_HUMAN_EFFECT
    effect_classes: [EMPIRICAL_PREVIEW, DECISION_CANDIDATE, MATERIAL_COMMITMENT, GOVERNING_IRREVERSIBLE]
    gate_effects: [BLOCK_EFFECT, BLOCK_PROMOTION, SIDECAR, OBSERVE_LEARN, UNKNOWN]
    execution_order:
      - verify-protected-promotion-basis
      - validate-project-context-binding-when-applicable
      - enforce-constitutional-and-hard-boundary-controls
      - resolve-exact-Human-effect-and-exact-claim-causality
      - degrade-claim-or-promotion-before-blocking-safe-reversible-effect
      - preserve-existing-material-preflight-and-adaptive-control-order
    hard_non_bypass:
      - safety
      - privacy
      - security
      - authority
      - explicit-Human-limits
      - irreversible-or-material-mutation-publication
      - missing-effect-production-or-preservation-capability
      - proven-semantic-contamination-when-independence-is-claimed
    unknown_gate:
      severe_plausible_harm: BLOCK_EFFECT
      otherwise: CLAIM_DOWNGRADE_PLUS_SIDECAR_AND_CHEAPEST_DISCRIMINATOR
    repeated_same_family_human_retry_without_new_outcome_information:
      effect: BLOCK_EFFECT
      next_control_ref: CEREBRO-SOLUTION-ESCALATION-PREFLIGHT-001
    prohibited:
      - manufacture-PASS
      - upgrade-evidence
      - promote-preview-to-canon
      - let-sidecar-outcome-auto-promote-or-auto-reject
      - bypass-material-or-governing-gates
  immune_material_permit_projection:
    status: ACTIVE
    owner: MCP
    implementation_ref: mcp/control_resolution.py#project_immune_material_permit
    validation_ref: mcp/control_resolution.py#validate_projected_immune_material_permit
    authority_model: DETERMINISTIC_SUBORDINATE_PROJECTION_OF_CONSUMED_MATERIAL_EXECUTE_DECISION
    normal_consumer: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    material_consumer_identity: STANDARD_DELIVERY
    independent_attestation_for_ordinary_material: NOT_REQUIRED
    source_of_authority:
      - fresh_PASS_MATERIAL_EXECUTE_preflight_receipt
      - fresh_consumed_material_preflight_evidence
      - exact_current_Source_head
      - sealed_STANDARD_delivery_control_binding
      - exact_manifest_package_path_scope_and_producer_binding
      - current_assurance_authority_epoch
    deterministic_one_shot: true
    manual_or_prepositioned_permit: DENY
    non_MATERIAL_EXECUTE_projection: DENY
    projection_may_recompute_or_override_MCP_decision: false
    migration_and_recovery_attestation_paths: PRESERVED
  delivery_profile_resolution:
    owner: MCP
    input_namespace: delivery_profile
    output_field: execution_profile.delivery_mode
    canonical_profiles: [LIMITED, STANDARD, FULL]
    AUTO_without_capability_evidence: BLOCK
    adapter_ref: tooling/delivery/cerebro_delivery.ps1
    adapter_role: CAPABILITY_BINDING_AND_STATE_PROJECTION
    adapter_policy_recomputation: PROHIBITED
    namespace_invariant: DELIVERY_PROFILE_ARTIFACT_FORMAT_AND_ASSURANCE_PROFILE_ARE_INDEPENDENT_NAMESPACES
  validated_logic:
    ref: mcp/adaptive_control_resolver.py
    status: VALIDATED_LOGIC
    direct_live_authority: false
    direct_invocation_is_not_live_MCP_control: true
  runtime_boundary:
    Runtime_is_control_owner: false
    runtime_resident_adaptive_policy: PROHIBITED
    Runtime_remains_bounded_executor: true
  project_control_context:
    status: CANDIDATE_DURABLE_ADAPTER_AND_LOCAL_HOST_HARNESS_NOT_REMOTE_BOUND
    hierarchy_contract_ref: standards/control-context-hierarchy.yaml
    state_service_contract_ref: standards/control-context-state-service.yaml
    domain_implementation_ref: tooling/context/control_context_registry.py
    state_port_ref: tooling/context/control_context_state_port.py
    PostgreSQL_state_port_ref: tooling/context/control_context_state_postgres.py
    PostgreSQL_migration_manifest_ref: tooling/context/control_context_postgres_migrations.json
    State_Service_commit_receipt_schema_ref: mcp/state-service-commit-receipt.schema.json
    owner_state_persistence_ref: tooling/owner_state/owner_state_persistence.py
    owner_state_commit_receipt_schema_ref: mcp/owner-state-commit-receipt.schema.json
    context_owner_persistence_ref: tooling/context/control_context_owner_persistence.py
    normal_host_ref: mcp/control_resolution_host.py
    MCP_tool_adapter_ref: mcp/control_context_tools.py
    validation_ref: tooling/validator/control_context_validation.py
    Interaction_intent_ref: engines/interaction/control_context_intent.py
    Interaction_intent_schema_ref: engines/interaction/control-context-intent-assessment.schema.json
    context_consolidation_ref: engines/interaction/context_consolidation.py
    context_consolidation_result_schema_ref: engines/interaction/context-consolidation-result.schema.json
    owner_effect_router_ref: mcp/control_owner_routing.py
    owner_effect_plan_schema_ref: mcp/control-owner-effect-plan.schema.json
    owner_effect_receipt_schema_ref: mcp/owner-effect-receipt.schema.json
    owner_persistence_verification_schema_ref: mcp/owner-state-persistence-verification.schema.json
    invocation: EVERY_EXPLICITLY_PROJECT_BOUND_EVENT_IN_A_BOUND_CONSUMER
    binding_order:
      - verify-current-Source-and-protected-promotion-basis
      - validate-project-and-session-binding
      - add-context-binding-to-governing-basis
      - validate-fingerprinted-Interaction-intent-assessment-for-CONTINUE
      - run-existing-constitutional-material-and-adaptive-resolution
      - bind-Interaction-transition-candidate-to-final-MCP-decision
      - route-derived-consolidation-effects-to-existing-owners-as-subordinate-fields
      - require-State-Service-revalidation-and-compare-and-swap
      - execute-required-owner-effects-serially-through-constructor-bound-runtime-capabilities
      - re-resolve-owner-plan-after-every-durable-owner-commit
      - complete-valid-bound-event-with-noop-receipt-even-when-final-outcome-blocks-mutation
    session_focus_scope: PER_CONTROL_SESSION
    project_tree_scope: SHARED_PROJECT_INSTANCE
    missing_or_stale_binding_effect: BLOCK_BEFORE_ADAPTIVE_REASONING
    invalid_transition_effect: CANONICAL_BLOCK
    fixed_control_outcome_vocabulary_preserved: true
    normal_transition_requires_repository_permission: false
    host_consumption_proven: false
    local_normal_host_harness_contract_proven: true
    local_PostgreSQL_adapter_contract_proven: true
    local_contract_proof_is_remote_or_live_activation: false
    remote_durable_state_service_proven: false
    operational_activation_claim: PROHIBITED_UNTIL_HOST_AND_REMOTE_SERVICE_PROOF
    canonical_decision_subobjects:
      context_directive:
        authority: MCP
        state_owner: context
      owner_effects:
        authority: MCP
        mutation_owner_remains_each_existing-owner: true
        router_alone_is_consumer_proof: false
        semantic_output_without_owner_commit: CANDIDATE_NOT_CURRENT
        current_PASS_requires_injected_persistence_verifier: true
        event_payload_self_asserted_current_or_capability: INSUFFICIENT
        exact_precommit_candidate_bound_into_commit_receipt: true
      next_action:
        exactly_one: true
        alone_is_HNS_render_authority: false
        pending_required_machine_action_blocks_event_closure: true
        internally_executable_requires_injected_runtime_capability_resolver: true
    HNS_precommit_candidate:
      schema_ref: mcp/context-navigation-options-candidate.schema.json
      render_authorized: false
      State_Service_completion_activates_only_on_exact_receipt_and_state_match: true
    State_Service_mutation_attestation:
      schema: cerebro-mcp-control-resolution-attestation/v1
      binds_identity_operation_and_exact_payload: true
      self_asserted_authority_is_sufficient: false
    plain_CONSOLIDATE_backward_compatibility: REQUIRED
    cross_project_structural_join_default: PROHIBITED
  activation:
    binding_id: ADAPTIVE_MCP_CONTROL_RESOLUTION
    evidence_path: D:\Cerebro\Run\Evidence\Audits\CEREBRO_AA004_MCP_CONTROL_ACTIVATION_PROOF.json
    required_schema: cerebro-aa004-mcp-control-activation-proof/v1
    requires_existing_evidence_refresh_before_closure: true
  invariants:
    - CONSTITUTIONAL_COMPLIANCE_PRECEDES_ADAPTIVE_EXECUTION
    - PROMOTION_MUST_REFERENCE_EXACT_SHADOW_VALIDATED_CANDIDATE_IDENTITY
    - PROMOTION_BASIS_IDENTITY_AND_CURRENT_LIFECYCLE_CONTRACT_SEMANTICS_ARE_SEPARATELY_VERIFIED
    - WORKTREE_REPRESENTATION_DOES_NOT_REDEFINE_GIT_BLOB_IDENTITY
    - MATERIAL_PREFLIGHT_BLOCK_IS_FINAL
    - MATERIAL_PREFLIGHT_INPUT_OR_EXECUTION_FAILURE_FAILS_CLOSED
    - IMMUNE_PERMIT_IS_AN_EXACT_SUBORDINATE_PROJECTION_OF_FRESH_CONSUMED_MATERIAL_EXECUTE
    - IMMUNE_PERMIT_PROJECTION_CANNOT_CREATE_OR_RECOMPUTE_CONTROL_AUTHORITY
    - ORDINARY_IMMUNE_MATERIAL_DOES_NOT_REQUIRE_INDEPENDENT_ATTESTATION
    - STANDARD_DELIVERY_IS_THE_ONLY_ORDINARY_IMMUNE_PERMIT_CONSUMER
    - DIRECT_VALIDATED_LOGIC_REMAINS_NON_LIVE
    - ONE_CANONICAL_MCP_CONTROL_RESOLUTION_SURFACE
    - MCP_IS_THE_ONLY_DELIVERY_PROFILE_DECISION_OWNER
    - DELIVERY_ADAPTER_MUST_NOT_RECOMPUTE_MCP_DELIVERY_POLICY
    - DELIVERY_PROFILE_CAPABILITY_BOUNDARIES_REMAIN_DISTINCT
    - SEALED_DELIVERY_BINDING_MUST_REPRODUCE_THE_EXACT_MCP_DECISION
    - DEPENDENT_PHASE_TRANSITION_REQUIRES_PASSING_CAMPAIGN_CLOSEOUT
    - RUNTIME_RESIDENT_ADAPTIVE_CONTROL_IS_PROHIBITED
    - STATIC_ADAPTIVE_WORK_MODE_IS_PROHIBITED
    - AUTOMATION_REMAINS_SEPARATE_FROM_AUTONOMY
    - PROJECT_BOUND_EVENT_REQUIRES_VALID_PROJECT_AND_SESSION_BINDING
    - ACTIVE_CONTEXT_FOCUS_IS_SESSION_SCOPED
    - CONTEXT_TRANSITION_IS_BOUND_TO_FINAL_MCP_DECISION
    - STATE_SERVICE_REVALIDATES_MCP_DIRECTIVE_BEFORE_ATOMIC_COMMIT
    - NORMAL_PROJECT_CONTROL_REQUIRES_NO_REPOSITORY_PERMISSION
    - INTERACTION_ASSESSES_BUT_DOES_NOT_AUTHORIZE_CONTEXT_MUTATION
    - CONSOLIDATION_RESULT_IS_DERIVED_ASSESSMENT_NOT_CONTROL_DECISION
    - OWNER_EFFECTS_ARE_SUBORDINATE_TO_ONE_CANONICAL_MCP_DECISION
    - DEPENDENT_OWNER_RECEIPTS_PRECEDE_FINAL_BRANCH_DISPOSITION
    - REQUIRED_MACHINE_NEXT_ACTION_PRECEDES_EVENT_CLOSURE
    - NEXT_ACTION_FIELD_ALONE_IS_NOT_HNS_RENDER_AUTHORITY
    - NOOP_STATE_EQUALITY_WITHOUT_MATCHING_COMMIT_RECEIPT_CANNOT_ACTIVATE_HNS
    - TRUSTED_VERIFIER_AND_CAPABILITY_RESOLVER_ARE_HOST_CONSTRUCTOR_BOUND
    - OWNER_SEQUENCE_RE_RESOLVES_AFTER_EVERY_SEPARATE_COMMIT
    - LOCAL_SCRIPTED_DATABASE_PROOF_IS_NOT_LIVE_POSTGRESQL_ACTIVATION
    - REFINED_AIRLOCK_IS_SUBORDINATE_TO_ONE_CANONICAL_MCP_CONTROL_DECISION
    - CONTROL_NEUTRAL_EXPOSURE_IS_NOT_CONTAMINATION
    - MATERIAL_SEMANTIC_PRESEAL_EXPOSURE_IS_TERMINAL_CONTAMINATED
    - UNKNOWN_MATERIALITY_PAUSES_WITH_ZERO_NEW_READS
    - POSTSEAL_EXPOSURE_PRESERVES_FINGERPRINTED_PRIMARY
    - HUMAN_EFFECT_FASTLANE_IS_SUBORDINATE_TO_ONE_CANONICAL_MCP_CONTROL_DECISION
    - SAFE_REVERSIBLE_HUMAN_EFFECT_AND_CLAIM_PROMOTION_READINESS_ARE_SEPARATE_AXES
    - CLAIM_OR_PROMOTION_IS_DEGRADED_BEFORE_SAFE_REVERSIBLE_HUMAN_EFFECT_IS_BLOCKED
    - HUMAN_EFFECT_FASTLANE_NEVER_MANUFACTURES_PASS_OR_UPGRADES_EVIDENCE
    - HUMAN_EFFECT_FASTLANE_NEVER_BYPASSES_HARD_MATERIAL_OR_GOVERNING_BOUNDARIES
    - REPEATED_SAME_FAMILY_HUMAN_RETRY_REQUIRES_NEW_INFORMATION_OR_VINKELPASS
  acceptance:
    - exact_AA003_promotion_basis_is_verified
    - promotion_identity_uses_canonical_Git_object_identity_not_worktree_text_representation
    - direct_resolver_remains_non_live
    - canonical_control_surface_produces_live_MCP_CONTROL_DECISION
    - material_preflight_precedes_adaptive_resolution
    - preflight_BLOCK_cannot_be_overridden
    - incomplete_or_failed_material_preflight_fails_closed_to_canonical_BLOCK
    - fresh_consumed_MATERIAL_EXECUTE_projects_one_exact_current_Immune_permit
