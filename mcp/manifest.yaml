schema: cerebro-mcp/v1
mcp:
  name: Master Control Program
  id: mcp
  version: 1.14.0
  component_kind: CONTROL
  default_state: active
  scope: domain-independent-control
  authority_scope: highest-internal-control
  control_contract: standards/control-architecture.yaml
  decision_contract: MCP_CONTROL_DECISION
  execution_profile_owner: MCP
  defined_by: Cerebro Source 1.0
  required_extensions:
  - mcp/constitution.yaml
  - mcp/boot-architecture-control.yaml
  - mcp/execution-surface-resolution.yaml
  - standards/development/material-commitment-preflight.yaml
  - standards/development/adaptive-analysis-model.yaml
  - mcp/adaptive-control-resolver.yaml
  - mcp/control-resolution.yaml
  - mcp/integrity-control.yaml
  - standards/human-continuation-surface.yaml
  - standards/project-terminal-roadmap-projection.yaml
  - standards/continuation-surface-system-policy.yaml
  - standards/control-context-hierarchy.yaml
  - standards/control-context-state-service.yaml
  - standards/human-navigation-surface.yaml
  - mcp/assurance-continuity.yaml
  - standards/assurance-kernel.yaml
  - standards/doctor-assurance.yaml
position:
  within: Cerebro
  defined_by: Cerebro Source 1.0
  controls:
  - working_method
  - control_resolution
  - final_control_resolution
  - integrity_subresolution
  - execution_profile_resolution
  - decision_freshness_resolution
  - material_commitment_preflight
  - analysis_process
  - constitutional_compliance
  - decision_process
  - iteration
  - validation_selection
  - mode_selection
  - tool_selection
  - execution_surface_resolution
  - hierarchical_project_control
  does_not_own:
  - source_specification
  - persistent_definition_authority
  - release_definition
  - domain_rules
  - generated_implementation
  - persistent_project_state
control_adapters:
  constitutional_control:
    contract_ref: mcp/constitution.yaml
    human_representation_ref: mcp/constitution.md
    adaptive_analysis_ref: standards/development/adaptive-analysis-model.yaml
    validator_ref: tooling/validator/constitution_adaptive_lock.py
    status: ACTIVE_LOCKED
    decision_owner_for_amendment: ADMIN
    activation_evidence_required: true
    activation_binding_ref: CONSTITUTION_AND_ADAPTIVE_ANALYSIS_LOCK
    parallel_constitutional_authority: PROHIBITED
  material_commitment_preflight:
    contract_ref: standards/development/material-commitment-preflight.yaml
    implementation_ref: mcp/material_commitment_preflight.py
    context_retrieval_ref: tooling/context/relevance_engine.py
    invocation: AUTOMATIC_WHEN_MATERIAL_COMMITMENT
    non_material_path: STAGE_AWARE_NO_FULL_PREFLIGHT_REQUIRED
    runtime_reasoning_policy: PROHIBITED
    activation_evidence_required: true
    normal_machine_consumers:
    - tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    activation_probe_is_not_normal_consumer: true
  control_resolution:
    contract_ref: mcp/control-resolution.yaml
    implementation_ref: mcp/control_resolution.py
    status: ACTIVE
    canonical: true
    live_control_authority: true
    decision_contract: MCP_CONTROL_DECISION
    execution_profile_owner: MCP
    delivery_profile_decision_owner: MCP
    delivery_profile_adapter_ref: tooling/delivery/cerebro_delivery.ps1
    delivery_profile_adapter_role: CAPABILITY_BINDING_AND_STATE_PROJECTION
    sealed_delivery_binding_validation: REQUIRED_BEFORE_STANDARD_MUTATION
    campaign_closeout_phase_transition_control: MCP
    unproven_campaign_closeout_effect: BLOCK_DEPENDENT_PHASE
    material_preflight_precedence: REQUIRED
    activation_evidence_required: true
    activation_binding_ref: ADAPTIVE_MCP_CONTROL_RESOLUTION
  project_control_context:
    hierarchy_contract_ref: standards/control-context-hierarchy.yaml
    state_service_contract_ref: standards/control-context-state-service.yaml
    domain_implementation_ref: tooling/context/control_context_registry.py
    state_port_ref: tooling/context/control_context_state_port.py
    PostgreSQL_state_port_ref: tooling/context/control_context_state_postgres.py
    PostgreSQL_migration_manifest_ref: tooling/context/control_context_postgres_migrations.json
    State_Service_commit_receipt_schema_ref: mcp/state-service-commit-receipt.schema.json
    generic_owner_state_persistence_ref: tooling/owner_state/owner_state_persistence.py
    generic_owner_state_commit_receipt_schema_ref: mcp/owner-state-commit-receipt.schema.json
    context_owner_persistence_ref: tooling/context/control_context_owner_persistence.py
    normal_host_binding_ref: mcp/control_resolution_host.py
    MCP_tool_adapter_ref: mcp/control_context_tools.py
    remote_MCP_service_boundary_ref: mcp/control_context_remote_service.py
    official_MCP_SDK_binding_ref: mcp/control_context_mcp_sdk.py
    official_MCP_SDK_requirements_ref: mcp/control-context-mcp-sdk-requirements.txt
    remote_MCP_service_config_schema_ref: mcp/control-context-remote-service-config.schema.json
    provider_neutral_runtime_ref: mcp/control_context_remote_runtime.py
    provider_neutral_runtime_config_schema_ref: mcp/control-context-remote-runtime-config.schema.json
    Interaction_intent_implementation_ref: engines/interaction/control_context_intent.py
    Interaction_intent_schema_ref: engines/interaction/control-context-intent-assessment.schema.json
    context_consolidation_implementation_ref: engines/interaction/context_consolidation.py
    context_consolidation_result_schema_ref: engines/interaction/context-consolidation-result.schema.json
    owner_effect_router_ref: mcp/control_owner_routing.py
    owner_effect_plan_schema_ref: mcp/control-owner-effect-plan.schema.json
    owner_effect_receipt_ref: mcp/control_owner_effect_receipt.py
    owner_effect_receipt_schema_ref: mcp/owner-effect-receipt.schema.json
    owner_state_persistence_verification_schema_ref: mcp/owner-state-persistence-verification.schema.json
    validator_ref: tooling/validator/control_context_validation.py
    MCP_tool_adapter_validator_ref: tooling/validator/control_context_tools_validation.py
    remote_MCP_service_validator_ref: tooling/validator/control_context_remote_service_validation.py
    official_MCP_SDK_validator_ref: tooling/validator/control_context_mcp_sdk_validation.py
    provider_neutral_runtime_validator_ref: tooling/validator/control_context_remote_runtime_validation.py
    PostgreSQL_contract_validator_ref: tooling/validator/control_context_postgres_validation.py
    context_owner_persistence_validator_ref: tooling/validator/control_context_owner_persistence_validation.py
    owner_state_persistence_validator_ref: tooling/validator/owner_state_persistence_validation.py
    normal_host_binding_validator_ref: tooling/validator/control_resolution_host_validation.py
    hns_validator_ref: tooling/validator/human_navigation_surface_validation.py
    status: CANDIDATE_DURABLE_ADAPTER_LOCAL_RUNTIME_ASSEMBLED_NOT_DEPLOYED
    decision_owner: MCP
    semantic_state_owner: context
    active_focus_scope: CONTROL_SESSION
    shared_tree_scope: PROJECT_INSTANCE
    fixed_outcome_vocabulary: true
    repository_permission_required_for_normal_transition: false
    remote_state_service_activation_evidence_required: true
    host_consumer_activation_evidence_required: true
    remote_transport_and_durable_backend_deployed: false
    local_remote_authentication_and_service_contract_proven: true
    official_MCP_SDK_binding_implemented: true
    official_MCP_SDK_transport_bound: true
    local_official_MCP_SDK_protocol_proven: true
    official_MCP_SDK_validated_version: 2.0.0
    provider_neutral_runtime_assembly_implemented: true
    local_runtime_assembly_proven: true
    identity_provider_selected: false
    deployment_provider_selected: false
    local_PostgreSQL_contract_adapter_implemented: true
    local_normal_host_harness_contract_proven: true
    local_contract_evidence_is_remote_activation: false
    activation_claim_before_both_proofs: PROHIBITED
    canonical_decision_extensions:
      - context_directive
      - owner_effects
      - next_action
    Interaction_assessment_required_for_project_CONTINUE: true
    cross_project_owner_routing_requires_separately_validated_bindings: true
    owner_effect_router_is_normal_owner_consumer_proof: false
    semantic_owner_candidate_is_current_state: false
    self_asserted_persistence_evidence_satisfies_owner_gate: false
    injected_owner_persistence_verifier_required_for_current_PASS: true
    injected_runtime_capability_resolver_required_for_executable_claim: true
    owner_payload_capability_available_is_authority: false
    mutation_attestation:
      schema: cerebro-mcp-control-resolution-attestation/v1
      schema_ref: mcp/control-resolution-attestation.schema.json
      verifier_ref: mcp/control_context_tools.py
      required_for_semantic_state_mutation: true
      production_key_material_in_Source: prohibited
    HNS_projection:
      precommit_candidate_schema: cerebro-mcp-context-navigation-options-candidate/v1
      precommit_candidate_schema_ref: mcp/context-navigation-options-candidate.schema.json
      precommit_render_authorized: false
      schema: cerebro-mcp-context-navigation-options/v1
      schema_ref: mcp/context-navigation-options.schema.json
      authority: MCP
      state_basis: COMMITTED_STATE
      render_precondition: COMMIT_RECEIPT_AND_STATE_MATCH_VERIFIED
      render_authorized_before_state_service_commit: false
      presentation_self_approval: PROHIBITED
      rendered_actions_must_exactly_match_projection: true

  integrity_control:
    contract_ref: mcp/integrity-control.yaml
    implementation_ref: mcp/integrity_resolution.py
    adapter_ref: mcp/integrity_control_adapter.py
    manual_entrypoint_ref: mcp/integrity_cli.py
    Interaction_intent_ref: engines/interaction/integrity_intent.py
    Presentation_ref: engines/presentation/integrity_presentation.py
    validator_ref: tooling/validator/integrity_validation.py
    status: ACTIVE_CANDIDATE_REQUIRES_ACTIVATION_EVIDENCE
    component_kind: CONTROL_SUBRESOLUTION
    control_owner: MCP
    direct_live_authority: false
    final_control_decision_owner: MCP
    manual_entrypoints: [Integrity, Integrity Full, "MCP-loop?"]
    automatic_invocation: EXISTING_CONTROL_BOUNDARY_CONDITIONED
    activation_evidence_required: true
    activation_binding_ref: MCP_INTEGRITY_CONTROL
  adaptive_control_resolver:
    contract_ref: mcp/adaptive-control-resolver.yaml
    implementation_ref: mcp/adaptive_control_resolver.py
    status: VALIDATED_LOGIC
    direct_live_authority: false
    invoked_by: control_resolution
    reuses_control_decision_contract: MCP_CONTROL_DECISION
    reuses_execution_profile: true
    shadow_validation_patch_ref: PATCH-AA-003
    promotion_patch_ref: PATCH-AA-004
  continuation_surface:
    contract_ref: standards/human-continuation-surface.yaml
    system_policy_ref: standards/continuation-surface-system-policy.yaml
    validator_ref: tooling/validator/continuation_surface_validation.py
    active_binding_registry_ref: engines/context/continuation-bindings.json
    candidate_state_service_ref: standards/control-context-state-service.yaml
    candidate_binding_scope: CONTROL_SESSION
    live_registry_migration_status: NOT_YET_ACTIVATED
    status: ACTIVE
    decision_owner: MCP
    state_owner: context
    presentation_owner: presentation
    interpretation_consumer: interaction
    invocation: REQUIRED_BEFORE_REAL_HUMAN_BOUNDARY_RESPONSE
    resolution_invocation: continuation_surface_validation.py resolve-active-binding
    failure_effect: BLOCK_RESPONSE_HANDOFF_AND_RERENDER
    activation_evidence_required: true
    activation_binding_ref: HUMAN_CONTINUATION_SURFACE_ENFORCEMENT
    exact_shell_handoff:
      profile: HASH_BOUND_POWERSHELL
      generator_validator_ref: tooling/validator/human_execution_handoff.py
      runtime_consumer_ref: tooling/delivery/Cerebro.StandardDeliveryLauncher.ps1
      activation_binding_ref: HUMAN_EXECUTION_HANDOFF_TRANSPORT
      failure_effect: BLOCK_HANDOFF_OR_FAIL_BEFORE_SOURCE_MUTATION
  assurance_continuity:
    contract_ref: mcp/assurance-continuity.yaml
    implementation_ref: tooling/validator/assurance_continuity.py
    doctor_contract_ref: standards/doctor-assurance.yaml
    doctor_gate_ref: tooling/doctor/doctor_gate.py
    doctor_trust_ref: tooling/doctor/doctor_trust.py
    system_doctor_ref: tooling/doctor/system_doctor.py
    doctor_validator_ref: tooling/validator/doctor_validation.py
    doctor_request_schema_ref: mcp/doctor-assurance-request.schema.json
    doctor_receipt_schema_ref: mcp/doctor-assurance-receipt.schema.json
    doctor_trust_object_schema_ref: mcp/doctor-trust-object.schema.json
    doctor_trust_attestation_schema_ref: mcp/doctor-trust-attestation.schema.json
    doctor_currentness_vector_schema_ref: mcp/doctor-currentness-vector.schema.json
    system_doctor_receipt_schema_ref: mcp/system-doctor-receipt.schema.json
    status: ACTIVE
    control_owner: MCP
    normal_machine_consumers:
    - tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    required_boundaries:
    - BEFORE_MUTATION
    - BEFORE_PUBLICATION
    - BEFORE_COMPLETION_CLAIM
    failure_effect: BLOCK_BOUNDARY_OR_COMPLETION_CLAIM
    new_component: false
  terminal_roadmap_projection:
    contract_ref: standards/project-terminal-roadmap-projection.yaml
    presentation_profile_ref: engines/presentation/roadmap-official.yaml
    renderer_ref: engines/presentation/roadmap_official.py
    receipt_validator_ref: tooling/validator/continuation_surface_validation.py
    normal_consumer: HUMAN_CONTINUATION_SURFACE_ENFORCEMENT
    status: ACTIVE_SOURCE_CONTRACT_PROVIDER_EFFECT_CAPABILITY_CONDITIONED
    control_owner: MCP
    semantic_state_owner: project
    presentation_owner: presentation
    provider_publication_owner: EXECUTION_ENVIRONMENT
    background_daemon_required: false
    pdf_authority: NONE
    failure_effect: BLOCK_TERMINAL_HANDOFF_AND_COMPLETION_CLAIM
principles:
- id: MCP-P001
  statement: Analyze the task before selecting or producing a solution.
- id: MCP-P002
  statement: Use the smallest controlled step that advances the task.
- id: MCP-P003
  statement: Separate verified facts, assumptions, decisions, and proposals.
- id: MCP-P004
  statement: Prefer robust and reproducible solutions over fragile shortcuts.
- id: MCP-P005
  statement: Apply the working method consistently across all domains.
- id: MCP-P006
  statement: Validate when uncertainty, consequence, or system state makes validation useful.
- id: MCP-P007
  statement: Avoid unnecessary process when a direct answer fully satisfies the task.
state_commands:
  status:
  - mcp
  activate:
  - mcp pÃ¥
  - mcp pa
  - aktiver mcp
  deactivate:
  - mcp av
  - deaktiver mcp
state_policy:
  active_on_start: true
  user_may_deactivate: true
  deactivation_scope: current-runtime-context
  deactivation_effect: exit-cerebro-controlled-operation
  reactivation_explicit: true
  status_visible_on_request: true
