schema: cerebro-mcp-extension/v1
mcp_extension:
  id: MCP-BOOT-ARCHITECTURE-CONTROL-001
  status: ACTIVE
  authority: normative
  constitutional_basis: [C-02, C-03, C-04, C-05]
  owner: MCP
  source: Cerebro Source 1.0
  loaded_via: mcp/manifest.yaml

  purpose: >
    Resolve universal Source boot, capability-conditioned local machine verification,
    demand-driven semantic loading, and precedence over older local-machine-only
    operational wording.

  precedence:
    rule: NEWER_EXPLICIT_MCP_SUPERSESSION
    supersedes:
    - target: mcp/activation.yaml#MCP-049
      effect: SCOPE_TO_LOCAL_MACHINE_OPERATIONAL_VERIFIED
    - target: standards/runtime/handboot.yaml#operational_definition
      effect: SCOPE_TO_LOCAL_MACHINE_CAPABILITY_EXTENSION
    - target: standards/runtime/handboot.yaml#explicit_non_goals.activate_chat_conversation_without_machine_execution
      effect: REPLACE_WITH_NO_LOCAL_MACHINE_VERIFIED_CLAIM_WITHOUT_MACHINE_EXECUTION

  rules:
  - id: MCP-060
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      CEREBRO_SOURCE_OPERATIONAL is the universal green Cerebro state when current
      authoritative Source identity, exact commit and boot-critical contracts are
      freshly verified. It does not require Working Source or local runtime access.
  - id: MCP-061
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      LOCAL_MACHINE_OPERATIONAL_VERIFIED is an additional capability-conditioned
      state and requires current-commit-bound Working Source equality, runtime control
      transfer and independent machine proof.
  - id: MCP-062
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      Absence of Working Source or local runtime access on a platform where those
      capabilities are unavailable by design is EXPECTED_CAPABILITY_ABSENCE and must
      not degrade or block CEREBRO_SOURCE_OPERATIONAL.
  - id: MCP-063
    authority: normative
    constitutional_article_ref: C-05
    statement: >
      For universal Source boot, required engines and modules must be resolved and
      integrity-bound to the pinned Source commit; full semantic rule bodies are
      loaded on demand when the concrete task requires them.
  - id: MCP-064
    authority: normative
    constitutional_article_ref: C-04
    statement: >
      Boot must be evidence-minimal, commit-pinned, cache-aware, relevance-driven,
      latency-aware and capability-aware.
  - id: MCP-065
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      Freshness-dependent state must be verified fresh. Immutable validation evidence
      may be reused only when bound to the exact freshly verified Source commit and
      must never become authority.
  - id: MCP-066
    authority: normative
    constitutional_article_ref: C-04
    statement: >
      No verification may remain on the user's synchronous critical wait path unless
      its outcome can materially change the current authority, Source-integrity,
      activation, operational-status or safety decision.

  - id: MCP-067
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      An unqualified human question about whether Cerebro is operational, fully
      operational, activated, in use, connected to authoritative Source, or synced
      with authoritative main resolves first to CEREBRO_SOURCE_OPERATIONAL and the
      current conversation's Source alignment, not to local-machine verification.
  - id: MCP-068
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      CONVERSATION_SOURCE_ALIGNMENT means that the current authoritative repository,
      branch and exact Source commit were freshly verified and the current conversation
      is governed by the applicable controls from that pinned Source. It does not require
      local Working Source equality or local runtime machine proof.
  - id: MCP-069
    authority: normative
    constitutional_article_ref: C-05
    statement: >
      CEREBRO_SYNC_VERIFIED is reserved for fresh evidence from canonical cerebro_sync
      and independent local Working Source versus authoritative remote equality proof.
      Conversation Source alignment must never be promoted to this strict local-sync claim.
  - id: MCP-070
    authority: normative
    constitutional_article_ref: C-04
    statement: >
      Working Source equality, local runtime execution and machine proof are
      relevance-conditioned capability evidence. They must not be automatic caveats,
      blockers or lead reservations in ordinary conversation or Source operational-status
      answers unless the user asks for that dimension or the active task materially requires it.
  - id: MCP-071
    authority: normative
    constitutional_article_ref: C-05
    statement: >
      A known incomplete local capability may be stated separately after the primary
      conversation and Source status when it is material, but it must not negate
      CEREBRO_SOURCE_OPERATIONAL or CONVERSATION_SOURCE_ALIGNMENT.

  - id: MCP-072
    authority: normative
    constitutional_article_ref: C-04
    statement: >
      The natural-language command boot cerebro must automatically complete the
      human boot completion surface after successful universal Source boot. No
      second user command is required to request status, Constitution, architecture,
      structure or task-routing readiness.
  - id: MCP-073
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      The boot completion surface must be derived from the exact freshly pinned
      Source commit and must confirm overall Source status, every current
      constitutional article at concise human-summary level, canonical architecture
      and structure, and task-routing readiness.
  - id: MCP-074
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      Constitution confirmation during boot must resolve the canonical
      mcp/constitution.yaml from the pinned Source commit, cover all current article
      identifiers and titles, and must not use a stale, partial or parallel
      constitutional representation.
  - id: MCP-075
    authority: normative
    constitutional_article_ref: C-04
    statement: >
      Boot task-routing readiness means Cerebro is prepared to resolve applicable
      project, refine, change, patch, delivery, validation and other Source contracts
      automatically when later task context makes them relevant. It does not require
      eager loading of all semantic rule bodies during boot.
  - id: MCP-076
    authority: normative
    constitutional_article_ref: C-05
    statement: >
      The human boot completion surface is additive presentation and routing control.
      It must not redefine Source authority, existing boot gates, local-machine
      verification requirements, handboot semantics or the evidence threshold for
      CEREBRO_SYNC_VERIFIED.
  - id: MCP-077
    authority: normative
    constitutional_article_ref: C-03
    statement: >
      WORKING_SOURCE_TARGET_READY on the boot completion surface means that the
      configured Working Source target is known for later local delivery. It must
      not be interpreted as local equality, Runtime activation or sync proof.


  - id: MCP-078
    authority: normative
    constitutional_article_ref: C-05
    statement: >
      Every new Cerebro boot initializes the Context-owned SPEECH_INPUT_MODE
      BOOT_SESSION state to OFF before ordinary human-input handling. Prior
      session state, User Operating Profile, handoff, receipts, conversation
      history, model memory, patch state and cerebro_sync state may not restore
      ON; only explicit current-session human transition intent may activate it.

  bindings:
    boot_architecture: standards/boot-critical-path-architecture.yaml
    boot_completion_surface: standards/boot-critical-path-architecture.yaml#human_boot_completion_surface
    delivery_kernel: standards/delivery-kernel.yaml
    continuation_surface: standards/continuation-surface-system-policy.yaml
