schema: cerebro-standard/v0.1
standard:
  id: STD-SOURCE
  name: Cerebro Source Authority Standard
  version: 0.1.0
  status: approved
  authority: authoritative
  scope: Authority, derivation, and reproducibility rules for Cerebro Source 1.0.
  consumers:
  - runtime
  - builder
  - validator
  - standards
  - schemas
  - contracts
  - modules
  - acceptance
  - release
  - documentation
rules:
- id: STD-SOURCE-R001
  statement: Cerebro Source 1.0 is the sole authoritative definition of Cerebro.
  priority: critical
  verification:
  - cerebro.yaml identifies Cerebro Source 1.0 and sole authority.
- id: STD-SOURCE-R002
  statement: Cerebro Source 1.0 is an architectural authority and shall not be represented
    by a top-level Source folder.
  priority: critical
  verification:
  - source_folder_required is false.
- id: STD-SOURCE-R003
  statement: No implementation or generated artifact shall become authoritative.
  priority: critical
  verification:
  - generated_artifacts_authoritative is false.
- id: STD-SOURCE-R004
  statement: An authoritative rule shall be defined once; other representations shall
    be derived or generated.
  priority: critical
  verification:
  - write_once_authority is true.
- id: STD-SOURCE-R005
  statement: Disposable implementations shall be reproducible from Cerebro Source
    1.0 without loss of authoritative knowledge.
  priority: critical
  verification:
  - implementation_disposable is true.
- id: STD-SOURCE-R006
  statement: Verified Working Source synchronization shall flow from local Working Source to the authoritative Source remote; remote state may establish the publication baseline but shall not overwrite local work during synchronization.
  priority: critical
  verification:
  - synchronization uses fetch and force-with-lease without pull, reset-to-remote, or automatic merge.
