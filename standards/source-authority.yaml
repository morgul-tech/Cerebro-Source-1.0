schema: cerebro-standard/v0.1
standard:
  id: STD-SOURCE
  name: Cerebro Source Authority Standard
  version: 0.3.0
  status: approved
  authority: authoritative
  scope: Authority, derivation, reproducibility, and control-authority boundaries for Cerebro Source 1.0.
  consumers:
  - runtime
  - builder
  - validator
  - standards
  - schemas
  - contracts
  - modules
  - acceptance
  - release
  - documentation
  - mcp
rules:
- id: STD-SOURCE-R001
  statement: Cerebro Source 1.0 is the sole persistent and definitional authority for Cerebro.
  priority: critical
  verification:
  - cerebro.yaml identifies Cerebro Source 1.0 and sole authority.
- id: STD-SOURCE-R002
  statement: Cerebro Source 1.0 is an architectural authority and shall not be represented by a top-level Source folder.
  priority: critical
  verification:
  - source_folder_required is false.
- id: STD-SOURCE-R003
  statement: No implementation, Release, Runtime state, evidence, receipt, generated artifact, conversation history, or model memory shall become persistent Source authority.
  priority: critical
  verification:
  - generated_artifacts_authoritative is false.
  - runtime and release authority remain derived.
- id: STD-SOURCE-R004
  statement: An authoritative rule shall be defined once; other representations shall be derived or generated.
  priority: critical
  verification:
  - write_once_authority is true.
- id: STD-SOURCE-R005
  statement: Disposable implementations shall be reproducible from Cerebro Source 1.0 without loss of authoritative knowledge.
  priority: critical
  verification:
  - implementation_disposable is true.
- id: STD-SOURCE-R006
  statement: Verified Working Source synchronization shall flow from local Working Source to the authoritative Source remote; remote state may establish the publication baseline but shall not overwrite local work during synchronization.
  priority: critical
  verification:
  - synchronization uses fetch and force-with-lease without pull, reset-to-remote, or automatic merge.
- id: STD-SOURCE-R007
  statement: MCP is the highest internal operational control authority defined by Cerebro Source and shall not be represented as authority above Cerebro Source.
  priority: critical
  verification:
  - standards/mcp.yaml does not place MCP above Source.
  - mcp/manifest.yaml declares Source as the definition authority for MCP.
- id: STD-SOURCE-R008
  statement: Persistent definitional authority, internal operational control authority, user configuration authority, derived implementation state, and evidence authority shall be represented as distinct authority dimensions.
  priority: critical
  verification:
  - standards/system-metamodel.yaml defines separate authority scopes and ownership dimensions.
- id: STD-SOURCE-R009
  statement: A filename, library label, project root label, CURRENT marker, attachment, conversation history, or model memory shall not establish or compete for Cerebro Source authority.
  priority: critical
  verification:
  - standards/runtime/handboot.yaml resolves the sole authority before derived inputs.
- id: STD-SOURCE-R010
  statement: The natural-language command boot cerebro shall resolve case-insensitively to canonical bootCerebro and shall never trigger document-library authority selection.
  priority: critical
  verification:
  - external BootEngine declares the command alias and immutable Source-first resolution.
  - mcp/activation.yaml binds the alias to the controlled boot sequence.
- id: STD-SOURCE-R011
  statement: A receipt or handoff is applicable only when bound to the current authoritative Source commit; stale derived state shall be rejected as continuity input without reopening or blocking a verified current Source state.
  priority: critical
  verification:
  - handoff resume verifies exact Source commit and hashes.
  - boot authority preflight uses REJECT_INPUT_CONTINUE_CURRENT_SOURCE for stale derived state.
- id: STD-SOURCE-R012
  statement: CEREBRO_SOURCE_OPERATIONAL may be reported when authoritative Source identity, current branch HEAD, exact commit and boot-critical contracts are freshly verified; this universal Source state does not require local Working Source or local Runtime access.
  priority: critical
  verification:
  - mcp/boot-architecture-control.yaml defines CEREBRO_SOURCE_OPERATIONAL as the universal green Source state.
  - standards/boot-critical-path-architecture.yaml treats unavailable local capabilities as EXPECTED_CAPABILITY_ABSENCE.
- id: STD-SOURCE-R013
  statement: LOCAL_MACHINE_OPERATIONAL_VERIFIED is an additional capability-conditioned state and requires current-commit-bound Working Source equality, Runtime control transfer and independent machine evidence.
  priority: critical
  verification:
  - mcp/boot-architecture-control.yaml separates local machine verification from universal Source boot.
  - standards/boot-critical-path-architecture.yaml requires local equality, Runtime control transfer and machine proof when those capabilities are available.
