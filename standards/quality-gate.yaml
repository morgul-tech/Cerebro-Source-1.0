schema: cerebro-standard/v0.1
standard:
  id: STD-QUALITY
  name: Cerebro Quality Gate Standard
  version: 0.2.0
  status: approved
  authority: authoritative
  scope: Mandatory pre-publication quality decision for Cerebro artifacts and Source changes.
  consumers:
  - patch-installer
  - publication-gate
  - builder
  - validator
  - standards
  - repository
  - change-engine
rules:
- id: STD-QUALITY-R001
  statement: Quality Gate is the publication-readiness gate for Cerebro artifacts and is distinct from pre-decision-lock Decision Assurance.
  priority: critical
  verification:
  - Publication is blocked on any failed Quality Gate check.
- id: STD-QUALITY-R002
  statement: Quality Gate shall check syntax, structured-data parsing, manifest integrity, repository hygiene, smoke tests, selected pipeline, and approved publication paths.
  priority: critical
  verification:
  - QG-001 through QG-007 pass.
- id: STD-QUALITY-R003
  statement: Quality Gate shall generate machine-readable and human-readable reports before publication.
  priority: critical
  verification:
  - reports/quality/quality-report.json exists.
  - reports/quality/quality-report.txt exists.
- id: STD-QUALITY-R004
  statement: Quality Gate is observational and shall not create, modify, move, or delete evaluated Release or patch content.
  closes:
  - PTQ-011
  priority: critical
  verification:
  - Hashes and paths of evaluated Release and patch content are identical before and after Quality Gate evaluation.
- id: STD-QUALITY-R005
  statement: For user-executable code or downloadable artifacts, Quality Gate shall run GENERATE, REFINE, CRITIQUE, VALIDATE, verify applicable execution conditions, make a delivery-readiness decision, and only then permit DELIVER.
  priority: critical
  verification:
  - Applicable stages have explicit evidence before delivery.
  - A skipped stage is explicitly classified not applicable.
- id: STD-QUALITY-R006
  statement: Level 2 delivery shall represent artifact creation, artifact registration, user-visible surface presentation, and user access as separate states; DELIVERY_VERIFIED requires verified user access to the exact artifact through at least one declared Level 2 surface.
  priority: critical
  verification:
  - BUILD_COMPLETE does not imply DELIVERY_VERIFIED.
  - ARTIFACT_REGISTERED does not imply USER_ACCESS_VERIFIED.
  - Chat presentation and Library presentation are evaluated as distinct user-visible surfaces.
- id: STD-QUALITY-R007
  statement: Internal paths, upload identifiers, sandbox references, or tool-success signals shall not by themselves prove that a downloadable artifact is accessible to the user.
  priority: critical
  verification:
  - Delivery evidence identifies the user-visible surface actually exercised.
  - Negative user access evidence overrides conflicting internal delivery-success inference.
- id: STD-QUALITY-R008
  statement: Failure of one Level 2 presentation surface shall first permit another declared Level 2 surface to satisfy delivery when exact-artifact user access is verified; delivery-mode selection reopens only when no Level 2 surface provides verified access.
  priority: critical
  verification:
  - Chat presentation failure does not invalidate verified Library access to the exact artifact.
  - STD-PATCH-R012 is reapplied only when the selected delivery mode as a whole fails validation.
  - STD-PATCH-R013 selects PSHELL when no downloadable self-running Level 2 surface is available or verified.
- id: STD-QUALITY-R009
  statement: Delivery and execution verification claims shall be bounded to the exact capability and conditions exercised in the current conversation and execution environment.
  priority: critical
  verification:
  - Cross-conversation success is not current delivery proof.
  - Unexercised transport, runtime, execution-policy, and user-access assumptions remain unverified.
- id: STD-QUALITY-R010
  statement: Cerebro shall not describe an artifact as delivered, downloadable, clickable, user-accessible, or Level 2 verified without evidence for that exact completion claim.
  priority: critical
  verification:
  - Completion language matches recorded delivery evidence.
- id: STD-QUALITY-R011
  statement: A generated file registered in ChatGPT Library may satisfy Level 2 delivery when the user verifies that the exact artifact is present and can be opened or downloaded from Library, even if the chat attachment surface is degraded.
  priority: critical
  verification:
  - Library registration alone is insufficient without user-access evidence.
  - Verified Library access records surface=LIBRARY and chat_surface may remain DEGRADED.
  - Level 3 fallback is not required solely because the chat attachment is non-clickable when Library access is verified.
- id: STD-QUALITY-R012
  statement: Decision Assurance readiness does not imply publication readiness, and Quality Gate publication readiness does not retroactively establish decision quality.
  priority: critical
  verification:
  - Pre-decision-lock and pre-publication gates remain distinct.
- id: STD-QUALITY-R013
  statement: A material Source change governed by the Change Architecture shall not be READY_TO_LOCK until the applicable Stability Gate has passed.
  priority: critical
  verification:
  - required Change Engine campaigns completed.
  - current candidate has no failing required scenario.
  - no unresolved systemic failure family remains.
  - iteration inheritance evidence is present.
- id: STD-QUALITY-R014
  statement: Delivery of final Source bytes is separate from Change Engine assurance and does not by itself establish publication readiness.
  priority: critical
  verification:
  - LIMITED or STANDARD delivery success yields READY_FOR_LOCAL_VALIDATION, not VERIFIED.
- id: STD-QUALITY-R015
  statement: Final learning consolidation is required after operational PASS and before PATCH-005.POST-001 closure.
  priority: critical
  verification:
  - final learning distinguishes local defects, failure families, systemic defects, false hypotheses, and reusable learning.
  - CEREBRO_INTERNAL_CONTROL_REVIEW input is emitted before dependent POST-002 work.
