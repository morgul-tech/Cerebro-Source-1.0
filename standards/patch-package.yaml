schema: cerebro-standard/v0.1
standard:
  id: STD-PATCH
  name: Cerebro Patch Package Standard
  version: 1.0.0
  status: approved
  authority: authoritative
  scope: Generation, validation, execution, verification, and result reporting for Cerebro patch packages.
  consumers:
  - patch-builder
  - patch-installer
  - quality-gate
  - publication-gate
  - validator
rules:
- id: STD-PATCH-R001
  statement: Every patch shall be generated from declarative input and validated as both a directory and a packaged artifact.
  closes:
  - PTQ-016
  priority: critical
  verification:
  - The builder validates both emitted forms against the required manifest shape.
- id: STD-PATCH-R002
  statement: Every manifest file entry shall contain one safe relative source, one destination contained by its declared root, one allowed operation, and one lowercase or uppercase SHA-256 digest of exactly 64 hexadecimal characters.
  closes:
  - PTQ-003
  - PTQ-017
  priority: critical
  verification:
  - Absolute paths, parent traversal, alternate data streams, and destinations escaping the declared root are rejected as INVALID_PACKAGE.
  - Allowed operations are create, replace, and delete.
- id: STD-PATCH-R003
  statement: Verification commands shall use a constrained token-array form and reject unsupported executables, switches, shell operators, redirection, substitution, and environment expansion.
  closes:
  - PTQ-018
  priority: critical
  verification:
  - Each command is a non-empty array of literal tokens accepted by an explicit allowlist.
- id: STD-PATCH-R004
  statement: Generation shall record the expected authoritative identity and complete destination baseline, and runtime shall equal that baseline before mutation.
  closes:
  - PTQ-005
  priority: critical
  verification:
  - Missing or conflicting authoritative evidence returns UNKNOWN_AUTHORITATIVE_STATE.
  - A runtime destination baseline difference returns BASELINE_MISMATCH before mutation.
- id: STD-PATCH-R005
  statement: One exclusive execution lock shall span runtime precheck, apply, Quality Gate, publication gate, confirmation, and execution recording.
  closes:
  - PTQ-006
  - PTQ-007
  priority: critical
  verification:
  - Lock acquisition failure returns PATCH_ALREADY_RUNNING without mutation.
  - Destination baselines are verified after lock acquisition and immediately before apply.
- id: STD-PATCH-R006
  statement: Existing destinations shall be backed up before apply, and every applied mutation shall be rolled back in reverse order after any pre-confirmation failure.
  closes:
  - PTQ-004
  priority: critical
  verification:
  - Successful rollback returns FAILED_ROLLED_BACK with evidence.
  - Incomplete rollback returns FAILED_RECOVERY_REQUIRED and blocks publication.
- id: STD-PATCH-R007
  statement: Re-execution shall detect a complete target state and return ALREADY_APPLIED without mutation or publication.
  closes:
  - PTQ-008
  priority: critical
  verification:
  - Partial target state is not already applied and is evaluated against the declared baseline.
- id: STD-PATCH-R008
  statement: Missing or conflicting authoritative evidence shall return UNKNOWN_AUTHORITATIVE_STATE and block mutation and publication.
  closes:
  - PTQ-009
  priority: critical
  verification:
  - Authoritative repository, branch, and immutable commit identity are required evidence.
- id: STD-PATCH-R009
  statement: PATCH Specification v1.0 defines stable result names, exit codes, required evidence, and permitted transitions.
  closes:
  - PTQ-010
  priority: critical
  verification:
  - SUCCESS maps to 0.
  - ALREADY_APPLIED maps to 2.
  - BLOCKED_PREREQUISITE maps to 20.
  - PATCH_ALREADY_RUNNING maps to 21.
  - BASELINE_MISMATCH maps to 22.
  - UNKNOWN_AUTHORITATIVE_STATE maps to 23.
  - VALIDATION_FAILED maps to 24.
  - QUALITY_GATE_FAILED maps to 25.
  - PUBLICATION_BLOCKED maps to 26.
  - FAILED_ROLLED_BACK maps to 30.
  - FAILED_RECOVERY_REQUIRED maps to 31.
  - INVALID_PACKAGE maps to 40.
  - Permitted transitions are precheck to apply, apply to quality gate, quality gate to publication gate, publication gate to confirmation, and any pre-confirmation failure to reverse rollback.
  - Required evidence includes package identity, authoritative identity, generation baseline, runtime baseline, lock identity, backup inventory, mutation inventory, gate results, rollback result, confirmation, and execution record.
- id: STD-PATCH-R010
  statement: Automatic dependency installation is prohibited, and a missing prerequisite shall return BLOCKED_PREREQUISITE.
  priority: critical
  verification:
  - Patch tooling does not install, upgrade, or download dependencies during generation or execution.

# BEGIN PATCH-001A.PRE-010 DELIVERY-AWARE NATIVE EXECUTION RULES

- id: STD-PATCH-R011
  statement: Physical patch generation shall require explicit user authorization and a current-context delivery capability assessment.
  priority: critical
  verification:
  - Tools available only in another conversation or environment are not treated as available.
  - Artifact generation is blocked when no actual delivery path has been resolved.

- id: STD-PATCH-R012
  statement: Delivery mode shall be locked before final physical patch design and reopened only after a verified capability change, explicit user instruction, or selected-mode validation failure.
  priority: critical
  verification:
  - Delivery transport does not change patch identity, component ownership, logical architecture, or source authority.

- id: STD-PATCH-R013
  statement: When Work is unavailable or unaccepted and real downloadable self-running delivery is unavailable or unverified, PSHELL shall be selected before physical payload generation.
  priority: critical
  verification:
  - PSHELL output contains one complete copyable PowerShell payload.
  - No unrequested archive is generated.

- id: STD-PATCH-R014
  statement: Artifact creation, publication, delivery, and user accessibility shall be represented as separate states.
  priority: critical
  verification:
  - BUILD_COMPLETE does not imply DELIVERY_VERIFIED.
  - An internal file path does not prove user accessibility.

- id: STD-PATCH-R015
  statement: Native process success or failure shall be resolved from process start status and declared allowed exit codes, not from the presence of stderr output.
  priority: critical
  verification:
  - Exit code zero remains successful when stderr contains normal status output.
  - Allowed nonzero exit codes preserve command-specific meaning.
  - Unexpected exit codes fail the active operation.

- id: STD-PATCH-R016
  statement: Native stdout, stderr, exit code, allowed exit codes, process start status, classification, and timeout status shall remain separate execution evidence.
  priority: critical
  verification:
  - Process start failure is distinct from completed-process failure.
  - Stderr evidence is preserved without becoming the sole failure classifier.

- id: STD-PATCH-R017
  statement: Generated PowerShell native adapters shall support Windows PowerShell 5.1 and shall not depend on ProcessStartInfo.ArgumentList.
  priority: critical
  verification:
  - Literal argument tokens are preserved.
  - Manual construction of one native argument string is prohibited.
  - LASTEXITCODE is read immediately after native process completion.

- id: STD-PATCH-R018
  statement: Generated native execution helpers shall complete a native adapter selftest before repository assessment or mutation.
  priority: critical
  verification:
  - Tests cover stdout with exit zero.
  - Tests cover stderr with exit zero.
  - Tests cover separated stdout and stderr.
  - Tests cover one allowed nonzero exit code.
  - Tests cover one rejected exit code.
  - Tests cover a missing executable.
  - Tests cover an argument containing spaces.

- id: STD-PATCH-R019
  statement: Repository assessment shall return stable machine-readable classifications and preserve the underlying native process failure.
  priority: critical
  verification:
  - Path, Git repository, Cerebro manifest, remote, branch, and target-file failures remain distinguishable.
  - Repository invalidity is not inferred from an unreported Git execution failure.

# END PATCH-001A.PRE-010 DELIVERY-AWARE NATIVE EXECUTION RULES
