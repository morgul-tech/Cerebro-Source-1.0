schema: cerebro-relevance-retrieval/v0.1
relevance_retrieval:
  id: CEREBRO-RELEVANCE-RETRIEVAL-001
  version: "0.4"
  status: ACTIVE
  introduced_by: PATCH-006
  owner: context-engine
  purpose: >
    Retrieve and deterministically rank only materially relevant evidence-only
    Knowledge, current Context-owned Wisdom and bounded Development History,
    with explicit coverage and freshness semantics for MCP consumption.

  inputs:
    required: [current_objective, current_scope]
    optional:
      - current_failure_state
      - current_decision_state
      - tags
      - material_user_insight
      - expected_prior_learning
      - coverage_audit_complete
      - coverage_audit_refs
      - learning_projection

  semantic_normalization:
    implementation_scope: deterministic-surface-normalization-only
    creates_semantic_authority: false
    material_semantic_resolution_owner: MCP
    material_semantic_contract_ref: standards/development/material-commitment-preflight.yaml

  sources:
    knowledge: engines/context/knowledge.yaml
    wisdom: engines/context/working-context.yaml
    wisdom_evidence: engines/context/wisdom-evidence.yaml
    development_history: engines/context/development-history.yaml

  eligibility:
    knowledge:
      - status-is-ACTIVE
      - verification-state-is-VERIFIED
      - validity-scope-is-current
      - unresolved-material-contradiction-is-absent
    wisdom:
      - type-is-WISDOM_RECORD
      - id-is-present-in-working_context.current_index.current_wisdom_refs
      - record-is-not-superseded-or-revoked
      - historical-wisdom-is-not-current-by-default
    history:
      - ledger-lifecycle-is-ACTIVE
      - record-role-is-EVENT-CORRECTION-or-RETRACTION
      - record-lifecycle-is-HISTORICAL-by-definition
    inactive_history_ledger_effect: FAILED_RETRIEVAL_AND_MATERIAL_PREFLIGHT_BLOCK

  ranking:
    deterministic: true
    dimensions:
      objective_term_match: 4
      scope_term_match: 3
      explicit_tag_match: 3
      failure_or_decision_state_match: 2
      active_friction_review: 2
    minimum_score: 3
    maximum_results_per_kind: 5
    maximum_history_results: 3
    tie_break: lexical-record-id
    rule: score-orders-eligible-candidates-but-never-creates-authority

  coverage:
    lifecycle: [NOT_REQUIRED, NOT_RUN, RUNNING, COMPLETE, INCOMPLETE, FAILED, STALE]
    empty_refs_alone_proves_no_prior_learning: false
    no_relevant_prior_learning_requires:
      - retrieval-state-COMPLETE
      - coverage-state-COMPLETE
    expected_prior_learning_and_no_normal_result:
      effect: INCOMPLETE
      next_event: BOUNDED_COVERAGE_AUDIT_REQUIRED
    bounded_coverage_audit_may_complete_coverage: true

  freshness:
    basis_fingerprint_includes:
      - normalized-objective
      - normalized-scope
      - failure-or-decision-state
      - current-wisdom-index
      - applicable-evidence-refs
      - Knowledge-state-SHA256
      - Working-Context-state-SHA256
      - Wisdom-Evidence-state-SHA256
      - Development-History-state-SHA256
      - coverage-state
    changed_input_effect: INVALIDATE_PRIOR_BASIS

  output:
    required:
      - assessment_id
      - objective_ref
      - retrieval_state
      - coverage_state
      - applicable_knowledge_refs
      - applicable_wisdom_refs
      - applicable_history_refs
      - rejected_refs
      - basis_refs
      - basis_fingerprint
      - source_fingerprints
      - evidence_authority
      - human_insight_checkpoint
      - next_control_event

  control_binding:
    consumer: MCP
    normal_material_consumer_surface: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    activation_probe_alone_is_not_operational_call_path: true
    material_preflight_ref: standards/development/material-commitment-preflight.yaml
    implementation_ref: mcp/material_commitment_preflight.py
    control_state_fields:
      - applicable_knowledge_refs
      - applicable_wisdom_refs
      - applicable_history_refs
      - coverage_state
      - basis_fingerprint
    evidence_may_override_Source: false
    changed_retrieval_invalidates_prior_basis: true

  effect_feedback:
    input: execution-and-verification-result
    output: bounded-evidence-candidate
    next_event: RETRIEVAL_REASSESSMENT
    automatic_Source_mutation: false
    automatic_Knowledge_admission: false
    automatic_Wisdom_promotion: false

  prohibited:
    - bulk-history-retrieval-by-default
    - semantic-authority-inference
    - non-current-wisdom-on-normal-retrieval-path
    - empty-result-promoted-to-no-prior-learning-without-coverage
    - automatic-control-promotion
    - automatic-rule-creation
    - automatic-Source-mutation
    - parallel-Learning-Engine
    - parallel-Research-Engine
    - parallel-Decision-Engine

  source_actor_encounter:
    profile: SOURCE_PUBLIC_ENCOUNTER_V1
    opt_in: RELEVANT_NORMAL_PREFLIGHT_QUERY_ONLY
    placement: existing_selected_Knowledge_records_and_normal_preflight_retrieval
    implementation: tooling/context/relevance_engine.py#_source_learning_encounter
    consumer: mcp/material_commitment_preflight.py#resolve
    result_field: retrieval.source_learning_encounter
    selection: ONLY_ALREADY_RANKED_ELIGIBLE_KNOWLEDGE_REFS
    privacy: SOURCE_PUBLIC_NONSECRET_FIELDS_ONLY
    evidence_authority: EVIDENCE_ONLY
    control_or_provider_authority: NONE
    missing_private_stale_ambiguous_projection: NARROW_ABSENT_OR_UNKNOWN_NO_FULL_HISTORY_FALLBACK
    default_existing_output: UNCHANGED_WITHOUT_PROFILE
    provider_reader_boundary: EXISTING_NORMAL_HOST_UNCHANGED_FAIL_CLOSED
    first_consumer: D1_NEXT_GENUINE_BK11_HUMAN_OPERATOR_DECISION
    second_consumer: X9_RELEVANT_NORMAL_DEPENDENCY_ASSESSMENT
    consumer_action: Read_selected_public_application_provenance_exception_and_next_action_before_relevant_decision
    consumer_disposition: Own_APPLIED_NO_CHANGE_NOT_APPLICABLE_or_precise_owner_rest_in_existing_normal_result
    no_automatic_episode_replay_or_operator_effect: true
    no_new_registry_engine_watcher_actorwake_or_per_message_gate: true
