schema: cerebro-wisdom-control-binding/v0.1

wisdom_control_binding:
  id: CEREBRO-WISDOM-CONTROL-BINDING-001
  version: "0.4"
  status: ACTIVE
  introduced_by: PATCH-005
  kind: CONTRACT

  purpose: >
    Bind applicable current Context-owned Wisdom evidence into MCP control
    resolution without converting evidence counts, model inference or prior
    experience into Source authority.

  ownership:
    evidence_owner: context
    applicability_assessor: context
    control_resolver: MCP
    source_authority_owner: Cerebro-Source

  input:
    evidence_schema_ref: engines/context/wisdom-evidence-schema.yaml
    evidence_state_ref: engines/context/wisdom-evidence.yaml
    working_context_ref: engines/context/working-context.yaml
    current_wisdom_index: working_context.current_index.current_wisdom_refs
    authority: EVIDENCE_ONLY
    retrieval_contract_ref: standards/development/relevance-retrieval.yaml

  applicability_contract:
    required_inputs:
      - current_objective
      - current_scope
      - current_failure_or_decision_state
      - current_wisdom_refs
    rules:
      - normal-retrieval-candidate-must-be-current-index-member
      - superseded-or-revoked-record-is-ineligible
      - historical-record-is-not-current-by-default
      - current-evidence-may-narrow-applicability
      - applicability-does-not-promote-control-tier
      - absence-of-retrieval-is-not-proof-of-no-applicable-wisdom

  control_tier_binding:
    OBSERVE:
      effect: evidence-visible-no-control-effect
    ADVISORY:
      effect: include-in-control-basis-without-blocking
    PREFLIGHT:
      effect: preflight-check-required-before-selected-action
      failure_outcome: REMEDIATE_OR_REORIENT_OR_BLOCK_AS_GOVERNING_BASIS_REQUIRES
    GATE:
      effect: gate-decision-required-before-selected-action
      authoritative_basis_required: true
      signal_counts_alone_sufficient: false
      missing_authoritative_basis_effect: treat-as-non-gate-and-flag-governance-defect

  mcp_binding:
    material_preflight_ref: standards/development/material-commitment-preflight.yaml
    consumer_implementation_ref: mcp/material_commitment_preflight.py
    control_state_knowledge_field: applicable_knowledge_refs
    control_state_field: applicable_wisdom_refs
    control_state_history_field: applicable_history_refs
    control_decision_basis_includes_applicable_wisdom: true
    MCP_consumption_is_required_before_material_commitment: true
    first_normal_machine_consumer_surface: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    activation_probe_alone_is_not_consumption_proof: true
    wisdom_may_override_source: false
    wisdom_may_create_authority: false

  patch_006_binding:
    automatic_retrieval: REQUIRED
    automatic_ranking: REQUIRED
    relevance_contract_ref: standards/development/relevance-retrieval.yaml
    implementation_ref: tooling/context/relevance_engine.py
    maximum_results_per_kind: 5
    basis_fingerprint_includes_retrieved_refs: true
    changed_basis_requires_re_resolution: true
    knowledge_authority: EVIDENCE_ONLY
    automatic_control_promotion: PROHIBITED
    automatic_source_mutation: PROHIBITED

  convergence_2026_08_10:
    automatic_invocation_owner: MCP
    invocation_implementation: mcp/material_commitment_preflight.py
    current_wisdom_only: REQUIRED
    coverage_before_no-prior-learning-claim: REQUIRED
    fresh_basis_bound_material_receipt: REQUIRED
    runtime_reasoning_policy: PROHIBITED
    activation_evidence: REQUIRED_BEFORE_OPERATIONAL

  invariants:
    - Context-owns-Wisdom-evidence
    - MCP-resolves-control-effect
    - Wisdom-evidence-remains-non-authoritative
    - normal-retrieval-uses-current-Wisdom-only
    - candidate-never-silently-becomes-governing
    - GATE-requires-explicit-authoritative-basis
    - signal-count-does-not-create-governance
    - material-commitment-consumes-fresh-retrieval-basis
