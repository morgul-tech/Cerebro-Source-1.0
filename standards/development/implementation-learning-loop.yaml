schema: cerebro-implementation-learning-loop/v1
implementation_learning_loop:
  id: CEREBRO-IMPLEMENTATION-LEARNING-001
  version: "1.3"
  status: ACTIVE
  authority: Cerebro Source 1.0
  adaptive_analysis_model_ref: standards/development/adaptive-analysis-model.yaml
  constitutional_learning_boundary_ref: mcp/constitution.yaml#C-07
  structural_challenge_ref: standards/development/architectural-regrounding.yaml#foundational_trust_and_challenge

  trigger:
  - implementation-failure
  - corrective-delivery
  - repeated-user-correction
  - validator-gap
  - known-failure-family-recurrence
  - execution-context-gap
  - rule-present-behavior-recurrence
  - structural-owner-gap

  mandatory_sequence:
  - identify-reached-stage
  - classify-actual-failure-family
  - establish-Source-mutation-state
  - distinguish-observed-error-from-unreached-error-labels
  - retrieve-applicable-existing-failure-families-and-assurance-rules
  - invoke-solution-escalation-preflight-before-abandoning-remediate-for-reorient-or-new-mechanism
  - assess-whether-recurrence-indicates-activation-ownership-or-structural-gap
  - invoke-foundational-challenge-when-structural-gap-evidence-is-material
  - map-remaining-reachable-execution-stages-and-adjacent-contracts
  - inspect-final-materialized-candidate-for-additional-knowable-defects
  - assess-generalizability
  - remediate-all-knowable-applicable-defects-before-redelivery
  - add-or-strengthen-machine-regression-control
  - rebuild-from-clean-basis-when-repeated-failure-policy-requires
  - persist-generalizable-learning-in-Source

  pre_implementation_inheritance:
    mandatory_question: >
      Which prior failure families, corrections, delivery contracts and validation
      rules apply to this implementation before it is designed?
    applicable_learning_must_be_applied_before_delivery: true

  same_patch_feedback:
    generalizable_learning_discovered_during_patch: MUST_BE_INCORPORATED_BEFORE_CLOSURE
    chat_memory_only_persistence: PROHIBITED

  forward_failure_sweep:
    first_observed_failure_is_execution_stop_not_complete_defect_inventory: true
    required_scope:
    - remaining-reachable-stages
    - adjacent-producer-consumer-contracts
    - final-candidate-assertions
    - runtime-evidence-bindings
    - apply-sync-and-equality-path
    all_knowable_applicable_defects_are_corrected_together: true
    unresolved_runtime_only_uncertainty_must_be_stated: true

  structural_learning_escalation:
    rule_present_behavior_recurrence_effect: STRUCTURAL_REVIEW_REQUIRED
    repeated_failure_after_machine_prevention_effect: STRUCTURAL_REVIEW_REQUIRED
    unclear_cross_component_ownership_effect: STRUCTURAL_REVIEW_REQUIRED
    required_review_dimensions:
      - activation
      - ownership
      - orchestration
      - structure
    adding_more_policy_before_required_structural_review: PROHIBITED
    existing_structure_default_winner: false
    new_structure_default_winner: false
    resolution_ref: CEREBRO-FOUNDATIONAL-TRUST-AND-CHALLENGE-001

  solution_escalation_preflight:
    control_ref: CEREBRO-SOLUTION-ESCALATION-PREFLIGHT-001
    name: VINKELPASS
    implementation_ref: mcp/material_commitment_preflight.py#resolve_solution_escalation_preflight
    trigger: REMEDIATE_WOULD_BE_ABANDONED_FOR_REORIENT_OR_NEW_MECHANISM
    required_order:
      - classify-actual-failure-family
      - retrieve-existing-failure-families-and-assurance-rules
      - identify-cheapest-concrete-fact-that-can-change-the-decision
      - restore-causally-sufficient-missing-prerequisite-when-available
      - evaluate-existing-and-simpler-candidates-with-falsifiers
      - route-surviving-structural-case-to-existing-architectural-regrounding
    repeated_human_retry:
      same_machine_failure_family_without_new_human_outcome_information: PROHIBITED
      required_next_control: CEREBRO-SOLUTION-ESCALATION-PREFLIGHT-001
    canaries:
      - observed-error-does-not-equal-root-cause
      - missing-prerequisite-does-not-equal-architecture-defect
      - simplest-is-not-always-the-winner
      - structural-candidate-requires-simple-falsifier-or-hard-invariant
      - self-critique-alone-does-not-create-evidence
      - Human-is-not-a-diagnostic-courier
      - machine-check-count-is-sufficiency-driven-not-fixed-to-five

  recurrence:
    known_failure_family_may_recur_without_explicit_exception: false
    repeat_threshold_for_clean_rebuild: 2

  user_host:
    role: EXECUTION_ENVIRONMENT
    development_environment: false

  closure_gate:
  - failure-classification-complete
  - mutation-state-known
  - structural-review-complete-when-triggered
  - generalizable-learning-persisted-or-explicitly-rejected-with-reason
  - relevant-regression-controls-pass
