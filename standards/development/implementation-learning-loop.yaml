        reuse: [repeated_human_retry, solution_escalation_preflight, human_action_first_normal_return]
        before_repeated_Human_action: NEW_DECISION_RELEVANT_INFORMATION_AND_PREPARED_CONTINUOUS_WORK
        access_extension_or_credential_effect: NONE
      - id: POSITIVE_SAME_ARC_RECOVERY
        kind: SUPPORT
        examples: [T02_same_reviewer_continuation, DD480419_same_attempt_reconciliation, C_local_harness_fix_preserving_work]
        reuse: standards/development/reflective-adjustment-loop.yaml#wisdom_evidence_feedback
        lesson: HARVEST_SUPPORT_AND_CHECK_PLACEMENT_BEFORE_HARDER_CONTROL
        automatic_control_promotion: false
    runtime_or_new_gate: false

  human_action_first_normal_return:
    id: P22-T7-HUMAN-COMMUNICATION-ACTION-FIRST-20261008-001
    authority: NONE
    applies_at: [NORMAL_PREFLIGHT, PM_PRE_STOP, NORMAL_RETURN, ROLE_METHOD_PROJECTION]
