      unknown_environment_for_local_file_exec_gap: ONE_TARGETED_HUMAN_UI_OBSERVATION_FOR_NAMED_ACTOR_IF_NOT_AVAILABLE_BEFORE_PROVIDER_CREDENTIAL_HOST_DIAGNOSIS
      current_hybrid_window_open_or_transfer_owner: HUMAN_NO_AUTOMATIC_AGENT_WINDOW_ACTION
      cloud_disk_case_before: HUMAN_OBSERVED_A3_A4_CLOUD_SELECTION_WHILE_TASK_REQUIRED_LOCAL_DISK
      cloud_disk_case_after: PENDING_ACTUAL_LOCAL_ENVIRONMENT_AND_ACCESS_READBACK
      activation_at: [WHOLE_JOB_SELECTION, MATERIAL_DEPENDENCY_OR_ARCHITECTURE_CHANGE]
