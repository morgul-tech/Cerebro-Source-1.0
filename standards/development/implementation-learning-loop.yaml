        lesson: UPDATE_CURRENT_PICTURE_WITH_SCOPE_DATE_AND_PROVENANCE_WITHOUT_REWRITING_ORIGINALS
        later_runtime_state_from_this_case: NOT_ATTESTED
      - id: REPEATED_HUMAN_PASSWORD_BURDEN
