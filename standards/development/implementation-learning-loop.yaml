schema: cerebro-implementation-learning-loop/v1
implementation_learning_loop:
  id: CEREBRO-IMPLEMENTATION-LEARNING-001
  version: "1.35"
  status: ACTIVE
  authority: Cerebro Source 1.0
  adaptive_analysis_model_ref: standards/development/adaptive-analysis-model.yaml
  constitutional_learning_boundary_ref: mcp/constitution.yaml#C-07
  structural_challenge_ref: standards/development/architectural-regrounding.yaml#foundational_trust_and_challenge

  trigger:
  - implementation-failure
  - corrective-delivery
  - repeated-user-correction
  - validator-gap
  - known-failure-family-recurrence
  - execution-context-gap
  - rule-present-behavior-recurrence
  - structural-owner-gap

  mandatory_sequence:
  - identify-reached-stage
  - classify-actual-failure-family
  - establish-Source-mutation-state
  - distinguish-observed-error-from-unreached-error-labels
  - retrieve-applicable-existing-failure-families-and-assurance-rules
  - invoke-solution-escalation-preflight-before-abandoning-remediate-for-reorient-or-new-mechanism
  - assess-whether-recurrence-indicates-activation-ownership-or-structural-gap
  - invoke-foundational-challenge-when-structural-gap-evidence-is-material
  - map-remaining-reachable-execution-stages-and-adjacent-contracts
  - inspect-final-materialized-candidate-for-additional-knowable-defects
  - assess-generalizability
  - remediate-all-knowable-applicable-defects-before-redelivery
  - add-or-strengthen-machine-regression-control
  - rebuild-from-clean-basis-when-repeated-failure-policy-requires
  - persist-generalizable-learning-in-Source

  mandatory_sequence_scope_ref: implementation_learning_loop.selected_workwave_refinement.current_task_before_action.finish_and_repair_scope
  mandatory_sequence_scope: >
    Interpret final-candidate inspection and all knowable applicable defect repair
    within that existing selected-promise, affected-action and finish rule; do not
    create a separate perfection criterion or an unbounded improvement round.

  pre_implementation_inheritance:
    mandatory_question: >
      Which prior failure families, corrections, delivery contracts and validation
      rules apply to the actual sanitized failure and considered decision? Use
      reached stage, observed/hypothesized/unknown cause and effect, challenged
      premise, relevant contract/edition and legitimate original, not task/scope
      labels alone. The explicit v2 learning_context extends exact v1; do not add
      fields to old originals or fetch arbitrary referenced private material.
      Select advice only within current applicability, edition and exceptions;
      reject stale/irrelevant advice or counterevidence. DIRECT_KNOWN_FIX and
      legitimate bounded transient continuation retain their short ordinary path.
    applicable_learning_must_be_applied_before_delivery: true

  early_prerequisite_contributions:
    origin: P23-STANDING-VPS-EXECUTOR-BUILD-20261026-01/rev2
    order_Work: 2c7209a29f6e8999cc556fa45002848920286f18
    order_sha256: 8277c0c5772971b6891d6f73a62a2c3429c363fbe0e925dfb378f900d3dc693a
    proposal_Work: 64b02b061a9c606d2013604d5e80ae405eef8766
    proposal_sha256: 16e01f64ee5469fa27717dd12947303ef01d6c528e01f7f6455c8a8d45972494
    rule: >
      Before substantial work or effect dependent on a decisive prerequisite,
      bind the need to the actual selected target/account/ordinary entry and
      next consuming action. Use the product's existing requirements and the
      rightful environment original/edition/time: usable with valid evidence;
      necessary gap or decision-relevant uncertainty; created by installation;
      later or outside scope. Reuse already proved suitability without another
      identical install/version attestation. Give a necessary clarification or
      establishment as one usable contribution to a named qualified available
      executor, with legitimate route/custodian, consumer and concrete next
      action. Include obtaining missing legitimate access with its rightful
      owner; project mandate is not login. Do not assign mere confirmation of
      absence without an owned remedy. Use a supported establishment route
      before the new normal profile exists. Existing knowledge/preparation may
      mature before release; actual effects require their real release/access.
      Newly discovered decisive prerequisites get this same disposition then,
      not only at final installation. Independent environment and code work
      proceed in parallel; one writer only for a real shared effect. The whole
      environment need not be ready before independent development. Integrator
      uses the result for the already necessary next authorized action when
      affected evidence suffices, without another unchanged approval/check.
      Preserve first-error direction and actionable return through
      first_technical_qualification.continuation; fix capability-bootstrap cycles
      and obscured causes in their existing product/return connection. Update
      the affected existing owner original after real change/readback, retain
      unknowns and whole recipient finish. No dependency engine, status master,
      broad inventory or method gate; project/access/attempt/private/NO_RETRY
      boundaries remain distinct and intact.

  first_technical_qualification:
    origin: P23-SYNTHETIC-FIRST-METHOD-20261024-01/rev1
    principle: ARTIFICIAL_INPUT_THROUGH_REAL_ORDINARY_ROUTE_BEFORE_DEPENDENT_NORMAL_USE
    trigger: NEW_OR_MATERIALLY_CHANGED_TECHNICAL_FUNCTION_OR_CONNECTION
    sequence: >
      Apply early_prerequisite_contributions before the first substantial dependent
      work. Move the already necessary small connected trial early through the
      real selected ordinary entry/target within authorized effects, or reuse
      valid equivalent target evidence. Bind expected observation, assumption,
      edition/environment, result/return, next owner and promised recipient check.
      Unknown host facts remain UNKNOWN, never fixture properties; static/local
      doubles prove only their scope. No trial before trial or new installation gate.
    equivalent_evidence: >
      Reuse valid equivalent evidence with exact edition, route, environment,
      attribution and limits. Cover materially different entries/environments
      where relevant; do not repeat per task or actor or generalize one local PASS.
      Fault, interruption, retry and recovery checks are required only for the
      selected promise and gaps not already covered by valid evidence.
    text_only_change: >
      Direct readback and relevant link or syntax checks suffice for text-only
      changes; do not manufacture an integration test or production-use claim.
    disposition_labels:
      built_connection_trial_pending: "Bygget, koblingsprøve gjenstår"
      technically_qualified_in_scope: "Teknisk kvalifisert innen angitt omfang"
      used_in_real_work: "Brukt i virkelig arbeid"
    evidence_boundary: >
      A pending connection trial is unfinished technical delivery. Technical
      qualification applies only to the proved scope. Synthetic execution is not
      production or natural work. Actual real-work use and useful recipient effect
      need their own observations; explicitly promised usefulness remains open.
    continuation: >
      The actual error recipient preserves one short disposition in the same
      task/current: achieved work and valid proof; sanitized cause or precise
      missing causal datum with original and affected part; known-not-performed,
      known-performed or UNKNOWN current effect, separate from historical UNKNOWN;
      next covered action and owner, naming only a real new boundary. This is
      existing work content, not a universal schema or four-field ritual. The next
      ordinary dispatch/execution uses it directly. For a covered known fault
      with clear effect, repair/check the affected connection and continue without
      general GO or whole rebuild. Reconcile UNKNOWN affected effect on the same
      operation before possible duplicate effect; hold only collision. New scope,
      rights, target or materially changed risk goes to its rightful owner only.
      If cause is missing, use the legitimate existing cause route and repair the
      ordinary return connection with the affected work, not a default separate
      reader product. New bytes/session/technical identity are not a new project;
      retain valid parts, actual bindings, expiry, private/platform and NO_RETRY
      guards. Metadata is not cause, access, performed action or effect proof.
    component_control_and_reader: >
      Keep executable checks, regressions and receipts in the component's ordinary
      CODE-DOCTOR, BUILD-PROFILE, introduction and Verification B paths. Map actual
      edition/environment/entry, expected and observed results, return and limits
      into existing supported evidence and ordinary result reading. A prose rule
      or COMPLETE over selected claims is not automatic enforcement or whole-use
      proof. Missing claim, expectation, adapter or recipient coverage is a named
      mechanical gap with owner and natural trigger, never fabricated PASS.
    work_recipe_ref: recipes/SYNTHETIC-FIRST.md
    published_work_offering:
      task: P23-SYNTHETIC-FIRST-METHOD-20261024-01/rev1
      repository: morgul-tech/Cerebro-Work
      commit: 1132186f07f0c870efb7c393d74350c6ad3c7d22
      semantic_Source_origin: 4f5bff3f6b5d871a2d00b3a8d71ed076d2a61cc9
      semantic_Source_version: '1.23'
      semantic_Source_sha256: 60803ccc604e08f6e643f061b2ca2d80daddbf52f0d4b652af2e1a0e4f384a48
      scope: METADATA_ONLY_DISCOVERY_NO_AUTOMATIC_ACTOR_SELECTION_OR_USE
      recipe:
        path: recipes/SYNTHETIC-FIRST.md
        sha256: 4cbc3eb6baa7000cd6fd26b1d3056ae8f6cf05cc862441bfdad6b7aadedf1881
      workflow:
        path: recipes/WORKFLOW.md
        sha256: 660fed4858d54bee25ab489aad648cedc4c7144e3f2433e39d62860883b2231e
      normal_entry:
        path: recipes/WORKFLOW-ENTRY.md
        sha256: 0df6b3a88360ffae0cf9fefb1a87d788135fd4f62a2f405d99bbacbf9f7c930d
      short_template:
        path: recipes/KORT-OPPGAVEMAL.txt
        sha256: 64e6742240bfa60462a22ff603315640620a62314a0b1e5de6066cff0761eee2
