schema: cerebro-implementation-learning-loop/v1
implementation_learning_loop:
  id: CEREBRO-IMPLEMENTATION-LEARNING-001
  version: "1.12"
  status: ACTIVE
  authority: Cerebro Source 1.0
  adaptive_analysis_model_ref: standards/development/adaptive-analysis-model.yaml
  constitutional_learning_boundary_ref: mcp/constitution.yaml#C-07
  structural_challenge_ref: standards/development/architectural-regrounding.yaml#foundational_trust_and_challenge

  trigger:
  - implementation-failure
  - corrective-delivery
  - repeated-user-correction
  - validator-gap
  - known-failure-family-recurrence
  - execution-context-gap
  - rule-present-behavior-recurrence
  - structural-owner-gap

  mandatory_sequence:
  - identify-reached-stage
  - classify-actual-failure-family
  - establish-Source-mutation-state
  - distinguish-observed-error-from-unreached-error-labels
  - retrieve-applicable-existing-failure-families-and-assurance-rules
  - invoke-solution-escalation-preflight-before-abandoning-remediate-for-reorient-or-new-mechanism
  - assess-whether-recurrence-indicates-activation-ownership-or-structural-gap
  - invoke-foundational-challenge-when-structural-gap-evidence-is-material
  - map-remaining-reachable-execution-stages-and-adjacent-contracts
  - inspect-final-materialized-candidate-for-additional-knowable-defects
  - assess-generalizability
  - remediate-all-knowable-applicable-defects-before-redelivery
  - add-or-strengthen-machine-regression-control
  - rebuild-from-clean-basis-when-repeated-failure-policy-requires
  - persist-generalizable-learning-in-Source

  pre_implementation_inheritance:
    mandatory_question: >
      Which prior failure families, corrections, delivery contracts and validation
      rules apply to this implementation before it is designed?
    applicable_learning_must_be_applied_before_delivery: true

  ordinary_operational_reflex:
    id: CEREBRO-ORDINARY-BOUNDED-REFLEX-001
    authority: NONE
    applies_at: [NORMAL_PREFLIGHT, PM_PRE_STOP, NORMAL_RETURN, ROLE_METHOD_PROJECTION]
    existing_selection_implementation: mcp/control_resolution_host.py#BoundControlResolutionHost.select_bounded_content
    normal_preflight_consumer: mcp/control_resolution_host.py#BoundControlResolutionHost.resolve_material_commitment
    provider_trust_boundary: EXISTING_NORMAL_HOST_BOUND_PROVIDER_AND_ACCESS_READBACK
    missing_host_reader_effect: FAIL_CLOSED
    selection_rule: CURRENT_SELECTOR_AND_LEAST_SUFFICIENT_CONTENT
    selected_read_fields: [content_ref, revision, selector_kind, selector, selected_sha256, authority_ref, provenance_refs, access_scope_ref]
    caller_may_supply_provider_reader_or_prior_cache: false
    bound_host_requires: [current_provider_readback, current_access_verification, authority_provenance]
    backend_fetch_may_be_broad_but_model_projection_is_selected_only: true
    same_revision_reuse_requires: [current_provider_readback, reader_owned_prior_selection, same_content_ref, same_revision, same_selector, same_selected_sha256]
    material_delta: COMPARE_SELECTED_CONTENT_SHA_WITH_PRIOR_SELECTION
    deeper_read_requires: [task_need_ref, targeted_selector, necessary_original_authority_and_provenance]
    missing_or_stale_selector_effect: FAIL_CLOSED_NO_FULL_HISTORY_FALLBACK
    shortened_context_may_drop_necessary_original_or_authority: false
    no_new_registry_or_truth_store: true
    no_role_or_work_authority_from_method: true

  selected_workwave_refinement:
    id: P23-AE-WORKWAVE-REFINEMENT-20261014-001
    authority: NONE
    scope: EXISTING_METHOD_PATHS_ONLY
    changes_runtime_or_adds_global_gate: false
    affected_code_fit: >
      Reuse the existing executor/reviewer code-doctor function at candidate preparation
      and before release or privileged use for materially changed code and affected
      dependencies, APIs, schemas, runtime, target OS/architecture, packaging and
      launchers, or an actual failure contradicting prior evidence. Batch coherent
      edits and reuse valid checks; unchanged messages, handoffs, phases and hash reads
      do not retrigger the pass. Wrappers, generated scripts and cross-language joins
      are affected code. First use actual project configuration and installed tool
      versions for relevant parser/compiler/type/lint and command/parameter/import/API
      fit; consult version-matched primary documentation only where needed. Where
      executable without production credentials, exercise the actual harmless native
      entry/boundary and material success, failure, receipt, exit and cleanup paths;
      isolate external effects and label test doubles separately from the real wrapper.
      Syntax/help alone or a replacement-helper fixture is not runtime/entry proof.
      Use a bounded model code-doctor lens for unresolved semantic, contract or
      multi-runtime uncertainty; executor self-check is legitimate and independent
      review follows existing genuinely-changed-risk rules, not every machine pass.
      Missing tools/host access are named gaps or qualified existing alternatives,
      never fictitious PASS or automatic toolchain installation. Block only actual
      correctness, target compatibility, authority, material safety or selected-effect
      defects; defer style/refactoring wishes. The same capable executor fixes within
      mandate and rechecks affected evidence only, retaining the cumulative same-problem
      repair budget and stable finish criteria; budget never replaces needed proof.
      Return one consolidated ordinary result bound to candidate/dependency/runtime/
      configuration pins, actual commands/versions, outcomes/evidence locators and
      limits with ready next action or precise residue. No new actor, control ID,
      ledger, orchestrator, mandatory extra model/reviewer, whole-suite replay,
      review-the-review, per-step ACK, clock or unqualified integration/effect claim.
    current_task_before_action:
      confirm_binding: [owner_selected_task, revision, original_basis, reached_stage, pending_obligations, next_action]
      full_original_when: [task_or_revision_changed, basis_missing, basis_stale, basis_insufficient]
      reuse_held_basis_within_same_arc_when_current_and_sufficient: true
      before_independent_dispatch: [selected_actor_current_work, pending_intent_or_assignment, uptake, required_tool_fit]
      same_task_material_input_is_new_assignment: false
      human_method_warning: >
        When a Human warns of recurrence or process failure, reuse the active case.
        The responsible owner chooses one concrete working-method change and follows
        it through the next relevant executor action using the existing current and
        ordinary return. Advice, an order, or Source publication alone does not close
        the warning. Retain the responsible owner and next natural action until
        handling is observed; create no proof task, coordinator, or status poll.
      finish_and_repair_scope: >
        Keep the selected recipient effect and stage finish criteria stable until a
        legitimate change. Reopen only affected conditions on relevant new evidence;
        retain valid evidence and completed work. A new blocking finding must show a
        concrete breach of those criteria or necessary safe and authorized execution,
        naming the affected effect and decision consequence; hypothetical improvements
        are deferred. Actual new safety or authority evidence may stop the affected
        effect even when the prior finish criteria were incomplete. Apply this at
        existing task-entry reconciliation and material growth or recurrence, not
        every step. The cumulative repair budget follows the same problem across
        actor, handoff and task-name changes; a new organizational start does not
        reset spent effort or remaining duty. If the approach or cumulative budget
        fails, the existing responsible owner selects one coherent path within its
        mandate, a legitimately reduced scope preserving the selected effect, or a
        precise remainder or block. Budget limits never confer PASS or remove needed
        evidence. Met finish criteria lead to the agreed actual recipient action and
        stage closure, not another general improvement round. Reuse existing method,
        preflight, care, learning and return paths; add no control ID, gate, reviewer,
        per-step ACK, checklist or clock. Routine coordination stays with its existing
        owner; decisions outside mandate go to the rightful owner.
      implementation_refs: [tooling/return-bridge/task_local_profile.py#consume_resume, tooling/return-bridge/task_capacity_care.py#check_current, tooling/return-bridge/task_capacity_care.py#check_uptake]
      owner_observation_is_atomic_scheduler_lock: false
    first_failure:
      preserve: [reached_stage, mutation_state, effect_state, exact_attempt]
      decision_relevant_diagnostics: >
        Choose diagnosis for the next agreed decision. Preserve relevant lawfully
        obtained observations and bounded original failure diagnostics in the
        legitimate evidence home, including under HOLD; use a sanitized shared
        pointer. Protect secrets without withholding cause information needed by the
        rightful owner, within existing access and storage limits. If evidence is
        insufficient, cause remains UNKNOWN; request no new access or probe. Reuse
        existing A7/failure-family retrieval for affected sibling sites only; create
        no general audit or new reader.
      before_target_changing_repair: compare_challenged_validator_premise_with_actual_installed_contract
      unknown_effect: reconcile_same_attempt_before_repeat
      implementation_ref: tooling/return-bridge/work_error_reflex.py#evaluate
      human_directed_boot_model_policy:
        origin: P23-W-E4CF-BOOT-PASS-AND-CONDUCTOR-NEXT-20261015
        origin_sha256: 22eae904dd3ab239b13b59f2be8d3d6678729320219ccaccbf2578eb77255d2c
        applies_at: [HUMAN_DIRECTED_CEREBRO_BOOT_PREFLIGHT, BOOT_FIRST_FAILURE]
        selected_model: Sol_6_1
        minimum_reasoning: Medium
        Luna_lower_reasoning_or_other_substitution_requires: NEW_EXPLICIT_HUMAN_CHOICE
        before_technical_rebuild_compare_together: [actual_selected_model_and_reasoning_or_UNKNOWN, observed_error, required_sequence_and_observed_deviation]
        selected_configuration_is_served_model_proof: false
        Human_witness: REPEATED_LOW_REASONING_SEQUENCE_SHORTCUTS_AND_SOL_6_1_MEDIUM_BOOT_PASS
        evidence_limit: FIRST_HAND_OPERATIONAL_TESTIMONY_NOT_CONTROLLED_MODEL_STUDY_OR_UNIVERSAL_LUNA_FAILURE
        demonstrated_server_defect: REPAIR_ACTUAL_DEFECT_DO_NOT_EXPLAIN_AWAY_AS_MODEL
        unrelated_task_model_policy: UNCHANGED
        automatic_model_BOOT_runtime_or_provider_effect: NONE
    material_return_integrity:
      derive_from_one_final_materialized_candidate: [hashes, counts, dates, source_and_chain_mappings]
      require_explicit_alias_mapping_before_join: true
      worker_mechanical_self_check: REQUIRED
      independent_semantic_review: ONLY_FOR_GENUINELY_CHANGED_RISK
      machine_checks_prove_authority_or_consumer_use: false
    declared_owner_consumer_dependency:
      applies_only_when_current_task_declares_dependency: true
      closure_evidence: [matched_current_owner_release, next_consumer_used_linked_to_same_release]
      board_request_or_handoff_alone_closes_dependency: false
      implementation_refs: [tooling/return-bridge/task_capacity_care.py#current_owner_ports, tooling/return-bridge/task_capacity_care.py#owner_port_material_return]
      authority: NONE
    source_read_resource_reporting:
      distinguish: [read_operations, unique_source_files, unique_source_bytes, cumulative_source_bytes, emitted_or_model_context_bytes, actual_model_tokens]
      actual_model_tokens_require: DIRECT_PROVIDER_TELEMETRY
      after_material_budget: RETURN_PARTIAL_WITH_NAMED_REST
      do_not_cache_native_document_raw_bodies: true

  field_case_basis:
    disposition: SOURCE_REQUIRED_NOW
    adoption: PENDING_NATURAL_TASK
    provenance:
      selected_by: Human_P23_remaining_learning_order_20261014
      synthesis_sha256: 54808ec3568383a994b15e52588cfc47629980a749472db3ef6d84ff26ff5e1a
      human_P20_lineage: PRESERVED_THROUGH_EXISTING_QUALIFIED_ORIGIN
