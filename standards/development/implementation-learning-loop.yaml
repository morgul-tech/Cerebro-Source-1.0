      whole_job_readiness: DISPOSE_KNOWN_NECESSARY_ACCESS_DEPENDENCIES_BEFORE_CONSOLIDATED_EXECUTION
      unlock_observation: EXISTING_SESSION_BOUND_MACHINE_RECEIPT_FIRST_WITH_ACTUAL_RELEASE_FINGERPRINT_AND_FRESHNESS
