  ordinary_operational_reflex:
    id: CEREBRO-ORDINARY-BOUNDED-REFLEX-001
    authority: NONE
    applies_at: [NORMAL_PREFLIGHT, PM_PRE_STOP, NORMAL_RETURN, ROLE_METHOD_PROJECTION]
    existing_selection_implementation: mcp/control_resolution_host.py#BoundControlResolutionHost.select_bounded_content
    normal_preflight_consumer: mcp/control_resolution_host.py#BoundControlResolutionHost.resolve_material_commitment
    provider_trust_boundary: EXISTING_NORMAL_HOST_BOUND_PROVIDER_AND_ACCESS_READBACK
    missing_host_reader_effect: FAIL_CLOSED
    selection_rule: CURRENT_SELECTOR_AND_LEAST_SUFFICIENT_CONTENT
    selected_read_fields: [content_ref, revision, selector_kind, selector, selected_sha256, authority_ref, provenance_refs, access_scope_ref]
    caller_may_supply_provider_reader_or_prior_cache: false
    bound_host_requires: [current_provider_readback, current_access_verification, authority_provenance]
    backend_fetch_may_be_broad_but_model_projection_is_selected_only: true
    same_revision_reuse_requires: [current_provider_readback, reader_owned_prior_selection, same_content_ref, same_revision, same_selector, same_selected_sha256]
    material_delta: COMPARE_SELECTED_CONTENT_SHA_WITH_PRIOR_SELECTION
    deeper_read_requires: [task_need_ref, targeted_selector, necessary_original_authority_and_provenance]
    missing_or_stale_selector_effect: FAIL_CLOSED_NO_FULL_HISTORY_FALLBACK
    shortened_context_may_drop_necessary_original_or_authority: false
    no_new_registry_or_truth_store: true
    no_role_or_work_authority_from_method: true

  selected_workwave_refinement:
    id: P23-AE-WORKWAVE-REFINEMENT-20261014-001
    authority: NONE
    scope: EXISTING_METHOD_PATHS_ONLY
    changes_runtime_or_adds_global_gate: false
    adaptive_work_contract: >
      For each new Human- or owner-selected task, choose and apply a proportionate
      work contract in its existing original; an idea may first need maturation and
      does not itself authorize implementation. Make the recipient effect and finish
      observation, recoverable basis, material prerequisites, accountable whole-outcome
      owner, executor, actual effect ports and capacity, within-mandate action space,
      finite relevant stages/evidence/resources, stop rules and ordinary return clear.
      A small task may do this in a few sentences; a build uses the existing fuller
      profile, not seven files or a new approval chain. Reuse AD1's build profile for
      code work: wash/refactor what materially affects the result and apply
      first_technical_qualification early to the actual required route/target.
      Reuse valid unaffected evidence; a local materializer/entry trial covers
      only its proved seam and is not a separate gate before the target trial.
      Keep existing current/original, whole-job/ports,
      Zenon, first-failure, Code Doctor and ordinary-return boundaries; add no poll or
      proof task.
    official_workflow_0_5: >
      OFFICIAL_WORKFLOW_0_5, HUMAN_ADOPTED, NOT_FROZEN. The current coherent
      organizational method is P23-WORKFLOW05-LIVING-20261022-01/rev9,
      selected by Human/P23 under introduction order
      P23-WORKFLOW05-REV9-INTRODUCTION-20261022-01/rev1. Its exact selected
      WORKFLOW.md has SHA256
      d40968cad33e8f16fec5af593b713e4f2d7d0281cb325a12a92f2afeb0803fad.
      workflow_05_living_rev9 below is the current normative selection;
      Cerebro-Work/recipes/WORKFLOW.md and its short task template carry the
      coherent practical course. Earlier rev8 and dated clarifications remain
      historical provenance in Git; their task-specific holds, active jobs and
      publication stages do not select today's work or revoke actual effect
      boundaries. A legitimate dated owner choice selects the version for an
      actual task, not HEAD, a hash, title, current label or file placement.
      Reuse valid held basis and only relevant situational profiles. This
      introduces no automatic runtime binding, role, technical access, model
      setting, mandatory package, suite, timer, new actor or fleet read claim.
      Existing BK04/BK05 operative-v2, Verification B, lifecycle, private and
      effect contracts remain domain-specific and unchanged. Running tasks
      keep their legitimate owner/version unless a dated authorized delta
      changes the affected decision; actual newer pause/revocation still
      governs its effect. There is no active BK pause in the shared workflow.
