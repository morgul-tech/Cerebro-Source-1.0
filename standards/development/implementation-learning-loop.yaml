      adoption_boundary: ACTUAL_OWNER_VERSION_SELECTION_READ_AND_USE_NOT_AUTOMATIC_FROM_PUBLICATION
      core:
        K1: >
          Preserve one task/original and one named accountable whole-outcome
          owner, recipient effect and observable finish. Classify Human's
          intent; select actual surface, capacity, delegated profile, visible
          model choice or UNKNOWN, action space, resources and authorized
          dispatch/return/continuation routes. A small job may do this briefly.
        K2: >
          Discover the few capabilities required by the recipient finish before
          freezing the file selection. Follow decisive capabilities through
          existing Atlas/World/Source/Work entrances to the rightful owner and
          actual selected component/entry. Reuse still-valid discovery. Before
          packing, on material return and before an affected effect reconcile
          only relevant newer/concurrent delta; dated material is not current
          effect authority. Resolve the first decision-relevant unknown with
          the least lawful observation and compare simpler alternatives when
          binding uncertainty is material. Not found in a sample is not absent.
        K3: >
          Batch coherent work and relevant controls; select independence for
          changed risk or binding contract before the affected effect. Reuse
          valid unchanged evidence. Repair known local faults in the same task,
          preserving cause and relevant new checks. Scope, access, unknown
          effect and critical uncertainty hold only dependent action. Bind
          expected observation to actual evidence and its limit; no synthetic
          PASS or NO_RETRY reset by another attempt.
        K4: >
          Preserve reached work, selected basis, open effects, concrete rest and
          responsible next action at material delegation and natural breaks.
          Reconcile old writer/process/effect before takeover. Waiting requires
          an actual available authorized producer or trigger, recipient and
          next action. Integrator disposes qualified own basis, reserve, dropped
          need or precise owner rest at the real decision. No standing model
          watch, implied Human courier, new clock or assumed process survival.
        K5: >
          Deliver and integrate one coherent version with necessary material,
          actual recipient entrance, evidence, disagreement and named rest.
          Separate made/checked/published/placed/sent/received/read/used/useful.
          Reconcile own current and legitimate newer decision before use and
          unknown send/write result before repeat at the actual target port.
          The rightful owner updates/readbacks the next decision home, records
          reasoned no-change, or owns a precise write/access remainder; only
          the first two close that document transition. Silence or send alone
          transfers no responsibility. Actual runtime duplicate protection is
          not established by the phrase exactly once.
        K6: >
          Classify the actual finding and choose its existing owner/home, not
          automatically more norm. Preserve positive and negative learning and
          order-owner error. Bind sanitized failure/premise/decision, legitimate
          original/edition, applicability and counterevidence before selecting
          advice. Before sealing a new derived handoff, include relevant advice
          or a readable edition-bound reference in its manifest-bound material;
          retain original bytes/hash separately. New A7 material uses one readable
          full representation containing original and advice, not a sidecar-only
          delivery or an old held-basis short. Qualify producer and actual reader.
          A receipt alone is not the receiver's advice channel or proof of use.
          The receiver finds sufficient material through its ordinary entry in
          another task/context, then records the actual correction, justified
          preservation, effect reconciliation or advice rejection and result in
          the ordinary return. USED alone is not action. The rightful Source or
          product owner qualifies generalizable learning in the existing catalog
          and controls; Work retains event, correction and owner disposition.
          Chosen control names are not performed coverage: join valid executed
          or reused evidence, or name the relevant uncovered remainder. Catalog
          advice alone creates no mandatory control. Preserve v1/full originals,
          direct known fixes and bounded transient continuation; no universal A7
          round, remote read, new database, model change or authority/replay grant.
          At material transitions keep one explicit combined changed/unchanged/
          justified N/A disposition with unknown coverage. T7/C7/A7 and Living
          Family remain proportionate; full FIREPASS keeps its own contract.
      situational_profiles:
        P1: SMALL_KNOWN_CHANGE_PROPORTIONATE_DIRECT_CONTROL_NO_SYNTHETIC_PROOF_JOB
        P2: CODE_OPERATIONS_INTRODUCTION_OR_EFFECT_ACTUAL_ENTRY_CHAIN_RISK_ACCESS_AND_RECIPIENT_USE
        P3: PACKAGE_CONTEXT_RETURN_TAKEOVER_ACTUAL_BYTES_CURRENTNESS_WRITER_AND_LEGITIMATE_FULL_OR_QUALIFIED_SHORT_ROUTE
        P4: CREATIVE_HUMAN_PRODUCT_WHOLE_SELECTED_JOURNEY_LOCAL_DELIVERY_AND_ACTUAL_DELEGATION_PROFILE
      one_binding_decision_part:
        one_whole_owner: EXPLICIT_NAMED_OWNER_PRECEDES_NORMAL_OPERATIONAL_ROLE_NO_COMPETING_OWNERS
        X9: NORMAL_OPERATIONAL_PROJECT_ENTRY_AND_IN_SCOPE_INTEGRATION_NOT_UNDELEGATED_PORTFOLIO_OWNER
        PM: >
          Retains explicitly delegated portfolio/investment/priority/capacity
          choices, including justified investment holds and alternate plans at
          actual escalation/delegated intervention/portfolio conflict outside
          X9 mandate. Required challenge precedes new binding. A hold does not
          automatically transfer technical plan ownership; PM may lift its own
          satisfied hold, not Human pause or another owner's protection. Title
          grants no general technical plan/write/effect authority.
        Assistant_AD1: SAME_ACTOR_BOUNDED_SUPPORT_AND_NORMAL_G1_G5_LENS_NOT_NEW_OWNER_OR_UNIVERSAL_INTERMEDIARY
        Principal: UNDELEGATED_DIRECTION_SCOPE_FINISH_QUALITY_TIME_RESOURCE_COMMITMENT_AND_OUT_OF_PM_MANDATE_CONFLICT
        Human: RESERVED_EXPLICIT_PAUSE_RELEASE_MODEL_AND_OTHER_CHOICES_SILENCE_ADDS_NO_AUTHORITY
        criticism: >
          One relevant qualified challenge before material uncertain binding
          for G1 new material plan/mechanism, G2 cumulative drift/repeated
          investment before further material commitment, G3 new obligatory
          actor/port/control/dependency, G4 hard-to-reverse uncertain binding,
          or G5 promotion of local experience into shared norm. Reuse actual
          independent coverage of the same generalization; combine overlaps.
          AD1 is normal first lens; reserve requires actual qualified expertise,
          availability/access/independence, never review shopping. Own obligatory
          port/direct mandate interest/decisive own premise requires qualified
          out-of-case scrutiny. Owner disposes material dissent within mandate.
          Without qualified coverage choose already-covered lawful path, bounded
          reversible step not evading the control, or hold dependent binding.
          PM has no general dispensation. A narrow legitimate Principal exception
          preserves explicit authority, outside-case owner, reason, one bounded
          reversible action and remainder; Human pause, hard safeguards, required
          technical admission, critical unknown safety and effect authority never
          waived. Existing G1-G5 gate is retained, not expanded.
        delta_and_help: >
          Reconcile only changed decision-relevant task/scope/owner/source,
          actual environment, request/contract, recipient, writer, access,
          unknown effect, concurrent delivery, error or genuine expiry. Give
          bounded helpers one need, qualified actual basis/capacity/model/route
          and usable return; integrator actually uses it. Preserve explicit
          local delegation profiles and D/E restrictions without globalization.
          No new universal file package, model quota, minute deadline or suite.
      existing_homes:
        normative: standards/development/implementation-learning-loop.yaml#selected_workwave_refinement
        practical: Cerebro-Work/recipes/WORKFLOW.md
        specialist_routes: [READ-CHAINS, HUMAN-INTERACTION, CODE-DOCTOR, BUILD-PROFILE, ACTOR-LIFECYCLE, BK04_BK05_OPERATIVE_V2, VERIFICATION_B]
        task_current: ACTUAL_SELECTED_VERSION_ACTIVE_SCOPE_CONTEMPORARY_DELIVERIES_AND_OWNED_REST
        AGENTS: SHORT_STABLE_ENTRANCE_CORE_PLUS_ONLY_RELEVANT_PROFILES_NOT_HISTORY_MIRROR
      historical_revisions_preserved_in_git:
        rev8_selected_original_sha256: d41aa38da99af9d4697b67667c2a3869bb2e4ad2724ee0017d209f505f5201af
        Source_before_rev9: 968428ef9e66f8f60387a966ed3e07ee526c309e
      authority_or_runtime_change: NONE
