    production_maturation_and_task_model: >
      For a new or complex assignment, mature one execution-ready whole-job
      plan across affected rooms: natural packages, inputs, outputs, critical
      prerequisites, reuse, dependencies, ordering or parallelism, relevant
      model and reasoning needs, integration and named owners. Apply the
      OFFICIAL_WORKFLOW_0_5 six-step course proportionately; small known jobs
      use the existing recipe directly. X9 qualifies actual active and pending
      capacity and effect ports for the operational plan; room leaders execute
      and distribute work locally within mandate; one accountable whole-job
      owner integrates the result. PM exercises its bounded standing authority
      for named portfolio decisions, priority/capacity conflicts, whole-course
      deviations and investment holds, rather than being narrowed to exceptional
      escalation or inserted as a per-step approver. Room E may mature a plan
      where that is its selected function; this creates no universal E gate or
      required four-lane activity. Waiting responsibility does not automatically
      reserve the whole actor. Current identifies actually bound work and
      capacity that can be freed without losing the duty, plus the continuation
      owner and concrete event. A real handoff names when the old writer stops,
      who accepts the remainder, and who integrates joined package outputs.
      Diagnosis and ordinary correction are work, not automatic escalation for
      a new error. Hold only action depending on an unresolved fault or premise
      and continue valid independent work. Escalate only a named real limit of
      competence, authority or a still-unresolved critical premise, preserving
      reached work and the concrete deviation on the same task. For important
      finish claims, record expected observation, actual observation, evidence
      and its limit; the check must contain the relationship it claims to prove.
      Reject ABCD for content only when the selected contract requires exactly
      ABC; necessary helper code, tests or documentation within scope are not
      thereby forbidden.
      Keep specialty profile, actor identity, effect authority and model choice
      separate. Room E proposes the relevant specialty and any additional lens;
      the room leader selects the actual performer within mandate. Reuse an
      existing profile reference/version and minimum relevant basis. Give an
      added lens one concrete question and finish condition; stop when answered
      or no longer needed. A profile does not create an actor, role, access or
      Gartner gate.
      For each coherent package, distinguish normal profile, requested model
      and reasoning, accepted/confirmed selection, and actual observed run with
      source; retain UNKNOWN where unobserved. Use supported dispatch with both
      model and reasoning fields only at an authorized start. Omitted fields may
      preserve a prior override; text alone does not change the model. A new task
      selects again; resume of unchanged work reuses a valid choice and basis.
      Never silently inherit a stale Luna override. Normal profiles are future
      configuration guidance, not evidence that any actor model was changed.
      Luna may complete bounded packages and routine corrections; a named
      competence, authority or critical-premise limit gets a sufficient profile
      on the same task, not an endless hypothesis loop or Principal ACK per fault.
      In the ordinary return, preserve material positive and negative learning,
      including relevant order/correction contribution, actual profile effect
      or friction, and uncertainty. When fit, use a known recipe first next time;
      connect a finding to the concrete change or preserved recipe, its existing
      home, responsible owner and next natural action. Learning can remove
      unnecessary controls or lenses. No publication or proof job is required
      after every small error.
      Reuse existing scripts/tools and check Work/Atlas before creating durable
      tooling. Keep exact model profiles in the Work offering, not hardwired
      Source actor IDs or new enums. This method refinement changes no active
      actor model, app setting, dispatch, provider, session, router or runtime.
      Preserve existing writer/API settings; if actual settings are unobserved,
      keep them UNKNOWN. It adds no new authority or lifecycle effect.
    terra_interpretation_and_work_economy: >
      Ved ny eller reelt endret tildeling kan Terra 6.1 low velges for avgrenset kode-, tekst- eller skjermarbeid når grunnlaget er tilstrekkelig og årsak eller tolkningsregel er avklart. Terra medium krever en konkret, navngitt tolkningsusikkerhet; oppgavenavn, liten diff eller ukjent årsak alene begrunner ikke høyere nivå. Bruk eksisterende verktøy til kjent mekanikk. Når et reelt modellvalg foreligger, vurder tilstrekkelig kvalitet og samlet gjenstående arbeid, også innlesing, overlevering og retting. Behold samme kvalifiserte utfører når det sparer arbeid, men regn også med byrden av unødvendig historikk. Dette krever ingen egen sammenligningsrunde eller overlevering og endrer ikke ansvar eller fullmakt. Gyldig valg gjenbrukes til behovet faktisk endres. Luna HIGH står fast.
    affected_code_fit: >
      Reuse the existing executor/reviewer code-doctor function at candidate preparation
      and before release or privileged use for materially changed code and affected
      dependencies, APIs, schemas, runtime, target OS/architecture, packaging and
      launchers, or an actual failure contradicting prior evidence. Batch coherent
      edits and reuse valid checks; unchanged messages, handoffs, phases and hash reads
      do not retrigger the pass. Wrappers, generated scripts and cross-language joins
      are affected code. First use actual project configuration and installed tool
      versions for relevant parser/compiler/type/lint and command/parameter/import/API
      fit; consult version-matched primary documentation only where needed. Where
      executable without production credentials, exercise the actual harmless native
      entry/boundary and material success, failure, receipt, exit and cleanup paths;
      isolate external effects and label test doubles separately from the real wrapper.
      Syntax/help alone or a replacement-helper fixture is not runtime/entry proof.
      Use a bounded model code-doctor lens for unresolved semantic, contract or
      multi-runtime uncertainty; executor self-check is legitimate and independent
      review follows existing genuinely-changed-risk rules, not every machine pass.
      Missing tools/host access are named gaps or qualified existing alternatives,
      never fictitious PASS or automatic toolchain installation. Block only actual
      correctness, target compatibility, authority, material safety or selected-effect
      defects; defer style/refactoring wishes. The same capable executor fixes within
      mandate and rechecks affected evidence only, retaining the cumulative same-problem
      repair budget and stable finish criteria; budget never replaces needed proof.
      Return one consolidated ordinary result bound to candidate/dependency/runtime/
      configuration pins, actual commands/versions, outcomes/evidence locators and
      limits with ready next action or precise residue. No new actor, control ID,
      ledger, orchestrator, mandatory extra model/reviewer, whole-suite replay,
      review-the-review, per-step ACK, clock or unqualified integration/effect claim.
