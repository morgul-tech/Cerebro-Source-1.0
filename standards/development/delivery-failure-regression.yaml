schema: cerebro-delivery-failure-regression/v1
delivery_failure_regression:
  id: CEREBRO-DELIVERY-FAILURE-REGRESSION-001
  version: "1.2"
  status: ACTIVE
  authority: Cerebro Source 1.0
  inherits: standards/development/powershell-level3-delivery-assurance.yaml

  known_failure_families:
  - POWERSHELL_PARSER_LANGUAGE_SYNTAX
  - VARIABLE_COLON_INTERPOLATION
  - AUTOMATIC_VARIABLE_COLLISION
  - PARAMETER_DEFAULT_SCRIPT_ROOT_RESOLUTION
  - PATH_EXECUTION_CONTEXT
  - EXECUTION_POLICY_BLOCK
  - NATIVE_STDERR_MISCLASSIFICATION
  - NATIVE_STDOUT_STDERR_CONTAMINATION
  - NATIVE_EXIT_CODE_CAPTURE_ORDER
  - NULL_OR_PIPELINE_CARDINALITY
  - TRANSPORT_HASH_MISMATCH
  - WRONG_BRANCH
  - WRONG_REMOTE
  - WRONG_BASE_COMMIT
  - DIRTY_WORKTREE
  - LOCAL_AHEAD_OR_DIVERGED
  - MID_MUTATION_ROLLBACK
  - DUPLICATE_EXECUTION
  - POST_SYNC_EQUALITY_FAILURE
  - AMBIGUOUS_COPYABLE_EXECUTION_SURFACE
  - MANUAL_TERMINAL_ERROR_TRANSPORT_REGRESSION
  - FAILURE_DIAGNOSTIC_CAPSULE_MISSING
  - FAILURE_HANDOFF_STACKTRACE_LEAK
  - PATCH_ATTEMPT_HISTORY_MISSING
  - PATCH_ATTEMPT_HISTORY_INCOMPLETE
  - CONTRACT_ACTIVATION_GAP
  - DECLARED_BUT_NOT_OPERATIONAL_REGRESSION

  mandatory_pre_delivery_gates:
  - native-PowerShell-parser-zero-errors
  - no-unbraced-variable-colon-interpolation
  - no-PSScriptRoot-in-parameter-default-resolution
  - execution-policy-safe-canonical-launch-command
  - benign-native-stderr-with-exit-zero-does-not-fail
  - native-nonzero-exit-does-fail
  - stdout-stderr-remain-separate
  - exact-payload-hashes-match-manifest
  - exact-baseline-git-blobs-match-Source
  - local-disposable-git-fixture-passes
  - rollback-fixture-passes
  - duplicate-run-detection-passes
  - exactly-one-user-copyable-execution-surface
  - failure-produces-timestamped-diagnostic-capsule
  - failure-produces-stable-launcher-directory-handoff-file
  - failure-terminal-is-short-and-does-not-require-stacktrace-copy
  - success-removes-stale-failure-handoff-file
  - PATCH-FAIL-return-path-requires-file-not-manual-error-paste
  - PATCH-SUCCESS-return-path-requires-no-terminal-dump
  - attempt-history-record-created-for-pass-and-fail
  - attempt-id-created-before-bundle-verification
  - attempt-id-propagates-into-kernel-receipt
  - prior-attempt-records-are-never-deleted-by-later-success
  - contract-activation-closure-passes-before-canonical-sync
  - strict-activation-bindings-have-declaration-registration-implementation-wiring-validation
  - discovery-activation-audit-is-non-blocking
  - declared-but-not-operational-findings-are-classified-before-promotion-to-blocking

  recurrence_rule: >
    A corrective delivery must run the full relevant regression family, not only the
    check corresponding to the most recent observed error.
