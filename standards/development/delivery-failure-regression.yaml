schema: cerebro-delivery-failure-regression/v1
delivery_failure_regression:
  id: CEREBRO-DELIVERY-FAILURE-REGRESSION-001
  version: "1.5"
  status: ACTIVE
  authority: Cerebro Source 1.0
  inherits: standards/development/powershell-level3-delivery-assurance.yaml

  known_failure_families:
  - POWERSHELL_PARSER_LANGUAGE_SYNTAX
  - VARIABLE_COLON_INTERPOLATION
  - AUTOMATIC_VARIABLE_COLLISION
  - PARAMETER_DEFAULT_SCRIPT_ROOT_RESOLUTION
  - PATH_EXECUTION_CONTEXT
  - EXECUTION_POLICY_BLOCK
  - NATIVE_STDERR_MISCLASSIFICATION
  - NATIVE_STDOUT_STDERR_CONTAMINATION
  - NATIVE_EXIT_CODE_CAPTURE_ORDER
  - NULL_OR_PIPELINE_CARDINALITY
  - TRANSPORT_HASH_MISMATCH
  - WRONG_BRANCH
  - WRONG_REMOTE
  - WRONG_BASE_COMMIT
  - DIRTY_WORKTREE
  - LOCAL_AHEAD_OR_DIVERGED
  - MID_MUTATION_ROLLBACK
  - DUPLICATE_EXECUTION
  - POST_SYNC_EQUALITY_FAILURE
  - AMBIGUOUS_COPYABLE_EXECUTION_SURFACE
  - MANUAL_TERMINAL_ERROR_TRANSPORT_REGRESSION
  - FAILURE_DIAGNOSTIC_CAPSULE_MISSING
  - FAILURE_HANDOFF_STACKTRACE_LEAK
  - PATCH_ATTEMPT_HISTORY_MISSING
  - PATCH_ATTEMPT_HISTORY_INCOMPLETE
  - CONTRACT_ACTIVATION_GAP
  - DECLARED_BUT_NOT_OPERATIONAL_REGRESSION
  - ACTIVATION_CLASSIFICATION_COVERAGE_GAP
  - ACTIVATION_WIRING_PROOF_MISSING
  - CANONICAL_IMPLEMENTATION_CONFLICT
  - OPERATIONAL_RUNTIME_EVIDENCE_CONFLATION
  - FALSE_GREEN_REFERENCE_INTEGRITY
  - DIAGNOSTIC_PARALLEL_CANONICAL_STORE_REGRESSION
  - DIAGNOSTIC_BRIDGE_FAILURE_MASKS_PRIMARY
  - DIAGNOSTIC_RESOLUTION_MISSING
  - DIAGNOSTIC_HANDOFF_NOT_DERIVED_FROM_CANONICAL_TRANSPORT
  - POWERSHELL_PAYLOAD_NOT_PARSED_BEFORE_MUTATION
  - ACTIVE_SOURCE_CLOSURE_MISSING
  - ACTIVE_SOURCE_CLOSURE_FAILURE
  - ACTIVE_SOURCE_CLOSURE_VACUOUS_PASS
  - FULL_RELEASE_CLOSURE_ON_STANDARD_PATCH_CRITICAL_PATH

  mandatory_pre_delivery_gates:
  - native-PowerShell-parser-zero-errors
  - no-unbraced-variable-colon-interpolation
  - no-PSScriptRoot-in-parameter-default-resolution
  - execution-policy-safe-canonical-launch-command
  - benign-native-stderr-with-exit-zero-does-not-fail
  - native-nonzero-exit-does-fail
  - stdout-stderr-remain-separate
  - exact-payload-hashes-match-manifest
  - exact-baseline-git-blobs-match-Source
  - local-disposable-git-fixture-passes
  - rollback-fixture-passes
  - duplicate-run-detection-passes
  - exactly-one-user-copyable-execution-surface
  - failure-produces-timestamped-diagnostic-capsule
  - failure-produces-stable-launcher-directory-handoff-file
  - failure-terminal-is-short-and-does-not-require-stacktrace-copy
  - success-removes-stale-failure-handoff-file
  - PATCH-FAIL-return-path-requires-file-not-manual-error-paste
  - PATCH-SUCCESS-return-path-requires-no-terminal-dump
  - attempt-history-record-created-for-pass-and-fail
  - attempt-id-created-before-bundle-verification
  - attempt-id-propagates-into-kernel-receipt
  - prior-attempt-records-are-never-deleted-by-later-success
  - contract-activation-closure-passes-before-canonical-sync
  - strict-activation-bindings-have-declaration-registration-implementation-wiring-validation
  - discovery-activation-audit-is-non-blocking
  - declared-but-not-operational-findings-are-classified-before-promotion-to-blocking
  - every-required-standard-has-explicit-activation-classification
  - future-required-standard-without-classification-blocks
  - operational-standards-reference-strict-contracts
  - strict-contract-wiring-proof-kind-is-required
  - canonical-responsibility-conflicts-are-reported
  - explicitly-classified-nonblocking-debt-does-not-falsely-return-clean
  - activation-audit-covers-all-required-standards-not-only-implementation-references
  - reference-existence-alone-never-proves-operational
  - static-activation-proof-is-not-runtime-execution-proof
  - duplicate-standard-classification-blocks
  - classification-path-mismatch-blocks
  - all-powershell-payloads-native-parser-clean-before-mutation
  - canonical-diagnostic-tool-has-single-owner
  - no-parallel-launcher-owned-canonical-diagnostic-store
  - stable-failure-handoff-is-derived-from-canonical-transport
  - attempt-diagnostic-ref-points-to-canonical-full-capsule
  - diagnostic-bridge-failure-does-not-mask-primary-failure
  - fallback-diagnostic-seed-remains-outside-working-source
  - success-resolves-related-canonical-capsules
  - diagnostic-resolution-failure-does-not-invalidate-primary-success
  - resolved-diagnostic-evidence-is-retained
  - host-rehydration-and-standard-delivery-share-same-canonical-diagnostic-store
  - active-source-integrity-closure-runs-before-contract-activation-and-sync
  - active-source-integrity-set-is-nonempty-and-excludes-history
  - active-source-integrity-uses-existing-deterministic-validator
  - active-source-prohibited-legacy-paths-remain-enforced
  - active-source-temporary-definition-expiry-remains-enforced
  - active-source-duplicate-canonical-definition-keys-remain-enforced
  - full-system-release-closure-is-not-on-standard-patch-critical-path
  - ordinary-standard-patch-does-not-require-release-repository
  - ordinary-standard-patch-does-not-require-release-evidence-suite

  recurrence_rule: >
    A corrective delivery must run the full relevant regression family, not only the
    check corresponding to the most recent observed error.
