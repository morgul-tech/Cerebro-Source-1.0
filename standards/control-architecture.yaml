schema: cerebro-control-architecture/v0.2

control_architecture:
  id: CEREBRO-CONTROL-ARCHITECTURE-001
  version: "0.2"
  status: ACTIVE
  introduced_by: GUARDRAILS-001

  purpose: >
    Define one coherent control path from current evidence and configuration
    through command and contract resolution, canonical execution-surface
    resolution, MCP control resolution and capability binding to execution,
    recovery, verification and the next control event.

  authority:
    definitional_authority: Cerebro Source 1.0
    control_resolver: MCP
    runtime_executor: Runtime Host
    runtime_transition_owner: Runtime 0.1

  flow:
    - CONTROL_EVENT
    - CONTROL_STATE
    - COMMAND_AND_CONTRACT_RESOLUTION
    - CONTROL_RESOLUTION
    - MCP_CONTROL_DECISION
    - EXECUTION_PROFILE
    - EXECUTION_SURFACE_RESOLUTION
    - CAPABILITY_BINDING
    - EXECUTE
    - AUTONOMOUS_FAILURE_RECOVERY
    - VERIFY
    - EVIDENCE
    - HUMAN_CONTINUATION_SURFACE
    - NEXT_CONTROL_EVENT

  control_state_contract:
    kind: STATE
    authority: DERIVED
    required_fields:
      - control_state_id
      - domain
      - objective_ref
      - governing_basis_refs
      - effective_user_configuration
      - execution_profile_ref
      - applicable_wisdom_refs
      - applicable_knowledge_refs
      - progress_state
      - failure_state
      - verification_state
      - capability_state
      - human_boundary
      - basis_fingerprint

  command_and_contract_resolution:
    contract_ref: standards/human-continuation-surface.yaml
    rules:
      - resolve-established-project-command-before-generic-semantic-inference
      - load-full-continuation-state-before-execution-reasoning
      - retrieve-applicable-Cerebro-contracts-before-tool-selection
      - known-contract-must-not-be-bypassed-by-general-capability-reasoning
      - deterministic-human-alias-must-not-carry-authoritative-state
    failure_state: KNOWN_CONTRACT_BYPASS

  mcp_control_decision_contract:
    kind: CONTRACT
    resolver: MCP
    required_fields:
      - control_decision_id
      - control_state_ref
      - objective_ref
      - basis_refs
      - basis_fingerprint
      - effective_user_config_ref
      - execution_profile_ref
      - applicable_control_refs
      - outcome
      - invalidates
      - verification_requirement
      - human_boundary
      - evidence_scope
      - resolved_at
    outcomes:
      - CONTINUE
      - REMEDIATE
      - RETRY
      - REORIENT
      - USER_DECISION_REQUIRED
      - BLOCK

  execution_profile_contract:
    kind: CONFIGURATION
    authority: DERIVED
    required_fields:
      - execution_profile_id
      - working_mode
      - delivery_mode
      - autonomy
      - verification_depth
      - execution_mechanism
      - human_boundary
      - mutation_scope
      - publication_path
      - basis_fingerprint
    constraints:
      - execution-profile-is-not-runtime-profile
      - level-1-level-2-level-3-are-human-aliases-not-canonical-system-types
      - stale-profile-must-not-authorize-execution

  execution_surface_resolution:
    required_before:
      - capability-binding
      - mutation
      - recovery-path-switch
    required_fields:
      - canonical_execution_path
      - execution_surface
      - mutation_authority
      - publication_path
      - human_boundary
      - surface_basis_refs
    invariants:
      - capability-availability-must-not-select-architecture
      - wrong-surface-mutation-is-blocked-before-action
      - Cerebro-development-default-mutation-surface-is-Working-Source
      - GitHub-is-remote-publication-and-verification-surface-not-default-workspace
      - recovery-may-change-mechanism-without-changing-surface
      - surface-change-requires-explicit-control-re-resolution
    failure_state: WRONG_EXECUTION_SURFACE_SELECTION

  freshness:
    decision_basis_fingerprint_required: true
    executor_rule: current-basis-must-equal-decision-basis
    mismatch_state: STALE_CONTROL_DECISION
    mismatch_effect:
      - INVALIDATE_DECISION
      - RE_RESOLVE_CONTROL

  retry:
    requires_material_delta: true
    acceptable_delta:
      - changed_state
      - added_evidence
      - applied_remediation
      - changed_strategy
      - refined_scope

  autonomous_failure_recovery:
    principle: REPAIR_OR_FALSIFY_SUSPECTED_FAILURE_BEFORE_ESCALATION
    sequence:
      - detect-anomaly
      - compare-with-expected-state
      - classify-single-unexpected-result-as-suspect-not-authoritative
      - retry-with-material-delta
      - cross-validate-through-valid-independent-paths
      - recover-silently-when-confirmed-safe
      - escalate-only-after-consistent-independent-evidence
    evidence_thresholds:
      single_failure: LOW
      repeated_consistent_failure: MEDIUM
      independent_path_confirmation: STRONG
    constraints:
      - recovery-path-must-preserve-architectural-boundaries
      - recovery-must-not-switch-to-wrong-execution-surface
      - blind-identical-retry-loop-is-prohibited
      - user-must-not-become-default-diagnostic-controller
    escalation:
      expose_to_user_when:
        - material-user-decision-required
        - required-human-boundary-reached
        - strong-evidence-of-blocking-failure
      otherwise: CONTINUE_AUTONOMOUSLY

  reorient:
    meaning: current_path_is_invalid_and_a_materially_different_path_is_required
    requires_material_delta: true
    acceptable_delta:
      - execution_mechanism
      - implementation_identity
      - delivery_path
      - recovery_strategy
      - bounded_scope
      - execution_profile
    unchanged_path_state: REORIENTATION_INVALID_UNCHANGED_PATH

  remediation:
    meaning: repair_current_mechanism_without_replacing_the_path

  runtime_separation:
    mcp_control_decision:
      scope: pre-execution-control-policy
      owner: MCP
    runtime_transition_decision:
      scope: Runtime-0.1-invocation-transition
      owner: Runtime-0.1
    invariant: MCP_CONTROL_DECISION_IS_NOT_RUNTIME_TRANSITION_DECISION

  invariants:
    - Source-defines-control-contracts
    - MCP-resolves-active-control
    - Runtime-Host-does-not-own-control-policy
    - decision-freshness-is-verified-before-execution
    - applicable-contracts-are-resolved-before-tool-selection
    - canonical-execution-surface-is-resolved-before-capability-binding
    - mutation-on-unresolved-or-wrong-surface-is-prohibited
    - retry-requires-progress-delta
    - recovery-preserves-architectural-boundaries
    - reorient-requires-material-path-delta
    - unchanged-reorientation-is-invalid
    - control-evidence-does-not-create-Source-authority

  user_profile_resolution:
    precedence:
      - HARD_SYSTEM_AUTHORITY
      - CURRENT_EXPLICIT_USER_INSTRUCTION
      - SESSION_TASK_OVERLAY
      - PROJECT_USER_PROFILE
      - GLOBAL_USER_PROFILE
      - CEREBRO_DEFAULT
    degraded_profile_effect:
      - continue_when_safe
      - do_not_claim-normal-personalization
      - do_not-change-Source-or-project-authority

  decision_assurance_readiness:
    contract_ref: standards/development/adaptive-quality-workform.yaml
    material_lock_requires: READY_TO_LOCK
    basis_field: decision_basis_fingerprint
    stale_readiness_effect: INVALIDATE_READINESS_AND_REASSESS

  wisdom_control_binding:
    contract_ref: standards/development/wisdom-control-binding.yaml
    context_assesses_applicability: true
    MCP_resolves_control_effect: true
    evidence_authority: EVIDENCE_ONLY

  relevance_retrieval:
    contract_ref: standards/development/relevance-retrieval.yaml
    implementation_ref: tooling/context/relevance_engine.py
    context_retrieves_and_ranks: true
    MCP_resolves_control_effect: true
    control_basis_fields:
      - applicable_knowledge_refs
      - applicable_wisdom_refs
      - basis_fingerprint
    changed_retrieval_effect: INVALIDATE_DECISION_AND_RE_RESOLVE
    knowledge_authority: EVIDENCE_ONLY

  operation_supervision:
    introduced_by: PATCH-007.PRE-003
    owner: MCP
    execution_adapter_owner: tooling.host
    observations_are_evidence_only: true
    final_classification_requires_reconciliation: true
    constraints:
      - null-exit-status-is-unknown-not-failure
      - heartbeat-is-independent-of-child-stdout
      - stall-detection-does-not-force-kill
      - verified-material-poststate-may-resolve-success-with-degraded-process-observation
      - receipt-exit-poststate-disagreement-is-explicit
      - user-is-not-default-process-diagnostic-controller
    regression_ref: CTX-WISDOM-NATIVE-PROCESS-RESULT-FALSE-FAILURE-001

  diagnostic_state:
    introduced_by: PATCH-007.PRE-004
    contract_ref: standards/operational-evidence.yaml
    authority: EVIDENCE_ONLY
    persistent_store_authority: RUNTIME_DERIVED
    capture_producers:
      - standard-local-runner
      - tooling.host
      - tooling.change
      - tooling.delivery
    synthesis_implementation: tooling/host/diagnostic_capsule.py
    rehydration_owner: tooling.host
    recovery_resolution_owner: MCP
    failure_learning_consumer: tooling.change
    constraints:
      - diagnostics-are-read-only-against-working-source
      - diagnostics-classify-and-preserve-but-do-not-own-recovery-policy
      - unresolved-capsule-is-rehydrated-before-delegated-operation
      - diagnostic-capture-failure-does-not-mask-primary-failure
      - user-is-not-default-log-selector-or-diagnostic-transport-processor
      - bounded-transport-is-derived-from-the-same-local-capsule
      - direct-machine-transport-may-replace-human-transport-without-changing-capsule-semantics
    next_control_effect:
      unresolved_relevant_failure: INCLUDE_IN_EVIDENCE_BASIS_AND_RESOLVE_RECOVERY
      resolved_failure: PRESERVE_FOR_LEARNING_AND_TRACEABILITY

  operational_evidence:
    contract_ref: standards/operational-evidence.yaml
    authority: EVIDENCE_ONLY
    evidence_scope_resolution_owner: MCP
    acquisition:
      default_stage: CORE
      progression: SUFFICIENCY_DRIVEN
    constraints:
      - missing-evidence-is-not-negative-evidence
      - partial-probes-preserve-successful-results
      - evidence-freshness-is-state-aware
      - privacy-and-redaction-precede-transport
      - probe-failure-is-not-subject-failure
      - evidence-never-creates-Source-authority
    mismatch_detection:
      parent_pattern: EXPECTED_OBSERVED_STATE_MISMATCH
      wisdom_ref: CTX-WISDOM-EXPECTED-OBSERVED-STATE-MISMATCH-001
      invariant: MISMATCH_IS_DETECTION_NOT_ROOT_CAUSE

  human_insight_checkpoint:
    material_insight_effect:
      - CRITIQUE_AND_REASSESS
      - RE_RESOLVE_CONTROL
    nonmaterial_insight_effect: CONTINUE
    insight_is_automatic_authority: false
    user_correction_prevention_loop:
      sequence:
        - classify-failure
        - identify-prevention-gap
        - strengthen-guardrail
        - validate-against-failure-case
        - reduce-recurrence-probability
      response_policy:
        - avoid-redundant-retrospective-explanation
        - prioritize-prevention-over-apology-or-after-the-fact-rationalization

  effect_feedback:
    result_to_evidence_candidate: true
    next_control_event: RETRIEVAL_REASSESSMENT
    automatic_source_mutation: false
    automatic_promotion: false

  human_continuation_surface:
    contract_ref: standards/human-continuation-surface.yaml
    required_when_human_action_is_next: true
    authoritative_state_must_remain_outside_visible_alias: true

  architectural_regrounding:
    contract_ref: standards/development/architectural-regrounding.yaml
    trigger_event: MAJOR_PHASE_BOUNDARY
    required_control_state: ARCHITECTURAL_REGROUNDING_REQUIRED

  active_source_closure:
    contract_ref: standards/active-source-closure.yaml
    required_before_patch_close: true
    failure_outcome: BLOCK
    full_source_pass_required: true
