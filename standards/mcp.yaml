schema: cerebro-standard/v0.1
standard:
  id: STD-MCP
  name: Master Control Program Standard
  version: 0.3.1
  status: approved
  authority: authoritative
  scope: The domain-independent internal control layer governing active Cerebro operation.
  consumers:
  - assistant-runtime
  - cerebro-cli
  - valider
  - source-selection
  - tool-selection
  - working-method
  - runtime-host
rules:
- id: STD-MCP-R001
  statement: MCP is the highest internal operational control authority in Cerebro, is defined by Cerebro Source 1.0, and shall not be represented as authority above Source.
  priority: critical
  verification:
  - mcp/manifest.yaml declares defined_by Cerebro Source 1.0.
  - mcp/manifest.yaml declares authority_scope highest-internal-control.
- id: STD-MCP-R002
  statement: MCP shall be active by default during Cerebro-controlled operation.
  priority: critical
  verification:
  - default_state is active.
  - active_on_start is true.
- id: STD-MCP-R003
  statement: MCP shall resolve working method and control flow from Source-defined policy and current control state, but shall not replace, duplicate, or mutate Source specifications.
  priority: critical
  verification:
  - MCP ownership and non-ownership boundaries are declared.
- id: STD-MCP-R004
  statement: MCP control semantics shall apply consistently across software, construction, design, information, planning, and other task domains.
  priority: critical
  verification:
  - MCP scope is domain-independent-control.
- id: STD-MCP-R005
  statement: Explicit MCP deactivation shall end Cerebro-controlled operation for the affected runtime context; work may continue outside Cerebro control but shall not be represented as active Cerebro.
  priority: critical
  verification:
  - deactivation_effect is exit-cerebro-controlled-operation.
  - no active Cerebro state exists without its declared control resolver.
- id: STD-MCP-R006
  statement: The command mcp shall show the current MCP state in a compact terminal-style report.
  priority: high
  verification:
  - cerebro_tool.py mcp returns state and authority.
- id: STD-MCP-R007
  statement: valider shall include MCP state and MCP architecture validation.
  priority: critical
  verification:
  - valider quick and full include MCP.
- id: STD-MCP-R008
  statement: MCP shall add only as much process as the task requires.
  priority: critical
  verification:
  - MCP-P007 is present.
- id: STD-MCP-R009
  statement: MCP shall automatically resolve a fresh Material Commitment Preflight before DECIDE, LOCK, MATERIAL_EXECUTE, MATERIAL_AUTHORIZE or GOVERNING_PUBLISH, consume Context relevance output before deciding, and reject stale or incomplete preflight evidence.
  priority: critical
  verification:
  - standards/development/material-commitment-preflight.yaml is ACTIVE.
  - mcp/manifest.yaml registers the material_commitment_preflight control adapter.
  - mcp/material_commitment_preflight.py implements resolve, consume and activation-probe paths.
  - Runtime 0.1 remains free of relevance reasoning policy.
  - Standard Delivery invokes the MCP preflight as a normal material consumer before mutation and before governing publication.
  - Activation probes verify activation but do not substitute for the normal material call path.
