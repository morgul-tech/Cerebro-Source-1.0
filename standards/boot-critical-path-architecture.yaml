schema: cerebro-boot-critical-path-architecture/v1
boot_critical_path:
  id: CEREBRO-BOOT-CRITICAL-PATH-001
  version: "1.1"
  status: ACTIVE
  authority: Cerebro Source 1.0

  properties:
  - evidence-minimal
  - commit-pinned
  - cache-aware
  - relevance-driven
  - latency-aware
  - capability-aware

  universal_source_boot:
    result: CEREBRO_SOURCE_OPERATIONAL
    sequence:
    - resolve-authoritative-repository-and-branch
    - fetch-current-HEAD-fresh
    - pin-exact-Source-commit
    - verify-manifest-and-MCP-extension
    - verify-boot-critical-contract-identities
    - reuse-exact-commit-integrity-evidence-when-valid
    - deep-validate-automatically-when-invalidated
    - establish-Source-operational-state
    - detect-environment-capabilities
    - load-task-relevant-semantics-on-demand
    - emit-human-boot-completion-surface

  conversation_source_alignment:
    result: CONVERSATION_SOURCE_ALIGNMENT
    established_when:
    - current-authoritative-repository-and-branch-freshly-verified
    - exact-Source-commit-pinned
    - boot-critical-controls-active-for-current-conversation
    proves:
    - current-conversation-governed-by-pinned-Cerebro-Source
    local_working_source_equality_required: false
    local_runtime_machine_proof_required: false
    strict_local_sync_claim: CEREBRO_SYNC_VERIFIED
    strict_local_sync_claim_requires_separate_evidence: true

  freshness:
    always_fresh:
    - repository-identity
    - branch
    - current-HEAD
    - exact-commit-pin
    reusable_immutable_evidence:
      allowed: true
      authority: NONE
      requires:
      - exact-current-commit-binding
      - integrity-valid
      - validation-contract-compatible

  deep_validation_triggers:
  - Source-commit-changed
  - commit-bound-evidence-missing
  - commit-binding-mismatch
  - manifest-or-MCP-contract-changed
  - required-component-identity-changed
  - integrity-failure
  - explicit-deep-validation-request

  capability_model:
    dimensions:
    - SOURCE_REMOTE_ACCESS
    - WORKING_SOURCE_LOCAL_ACCESS
    - LOCAL_RUNTIME_EXECUTION
    - LOCAL_MACHINE_PROOF
    local_machine_extension:
      applies_only_when:
      - WORKING_SOURCE_LOCAL_ACCESS
      - LOCAL_RUNTIME_EXECUTION
      result: LOCAL_MACHINE_OPERATIONAL_VERIFIED
      machine_proof_required: true
    unavailable_by_design:
      state: EXPECTED_CAPABILITY_ABSENCE
      degrades_source_boot: false
      blocks_source_boot: false

  semantic_loading:
    boot: BOOT_CRITICAL_IDENTITIES_AND_CONTRACTS_PLUS_BOOT_COMPLETION_SUMMARIES
    task_phase: DEMAND_DRIVEN
    eager_full_rule_loading: false

  human_boot_completion_surface:
    id: CEREBRO-BOOT-COMPLETION-SURFACE-001
    invocation: AUTOMATIC_AFTER_SUCCESSFUL_UNIVERSAL_SOURCE_BOOT
    result: CEREBRO_BOOT_READY
    additional_user_command_required: false
    authority: DERIVED_FROM_PINNED_SOURCE
    purpose: >
      Complete the human boot experience by confirming current Source status,
      the complete current Constitution at human-summary level, canonical
      architecture and structure, and task-routing readiness before normal work.

    presentation:
      mode: PROGRESSIVE_CONCISE
      source_contact_update:
        timing: AFTER_EXACT_COMMIT_PIN_WHEN_RESPONSE_IS_STILL_IN_PROGRESS
        content: repository-branch-exact-commit
        duplicate_status_detail: PROHIBITED
      final_surface:
        timing: AFTER_BOOT_COMPLETION_ASSERTIONS
        sections_in_order:
        - OVERALL_STATUS
        - CONSTITUTION
        - ARCHITECTURE_AND_STRUCTURE
        - TASK_ROUTING_READINESS
        final_state: READY_FOR_USER_WORK

    overall_status:
      required:
      - CEREBRO_SOURCE_ACTIVATED
      - CEREBRO_SOURCE_OPERATIONAL
      - CONVERSATION_SOURCE_ALIGNMENT
      - authoritative-repository
      - branch
      - exact-commit
      working_source_target:
        human_label: WORKING_SOURCE_TARGET_READY
        source_ref: standards/runtime/handboot.yaml#surfaces.working_source.default_path
        meaning: configured-local-target-is-known
        proves_local_equality: false
        proves_local_runtime: false
      strict_sync_claim:
        label: CEREBRO_SYNC_VERIFIED
        emit_only_with_fresh_canonical_sync_and-independent-local-equality-evidence: true

    constitution:
      source_ref: mcp/constitution.yaml
      required_identity_fields:
      - constitution.id
      - constitution.version
      - constitution.status
      article_coverage: ALL_CURRENT_ARTICLES
      per_article_human_confirmation:
      - id
      - title
      - concise-human-meaning-derived-from-human_statement
      stale_or_partial_article_set: PROHIBITED
      parallel_constitutional_authority: PROHIBITED

    architecture_and_structure:
      source_refs:
      - cerebro.yaml
      - mcp/manifest.yaml
      - standards/control-architecture.yaml
      - standards/system-metamodel.yaml
      authority_chain:
      - Cerebro Source 1.0
      - Constitution
      - MCP
      - Standards and normative contracts
      - Engines and modules
      - Tooling and Runtime
      - Evidence, receipts and history
      required_confirmation:
      - sole-Source-definitional-authority
      - Constitution-highest-internal-control-within-Source-bounds
      - MCP-active-control-owner
      - Runtime-derived-execution-not-policy-authority
      - Evidence-proves-state-but-does-not-create-Source-authority
      - canonical-control-flow-active

    task_routing_readiness:
      state: TASK_RELEVANT_SEMANTICS_AUTOLOAD_READY
      principle: ROUTING_READY_NOT_EAGERLY_PRELOADED
      rule: >
        After boot, resolve and load the applicable Source contracts automatically
        from the pinned commit when the user's concrete task makes them relevant,
        before tool selection, mutation, or material result claims.
      routing_examples:
        PROJECT_WORK:
        - engines/project
        - applicable-project-standards
        - relevant-context-and-user-configuration
        REFINE:
        - engines/interaction
        - adaptive-analysis-controls
        - relevant-user-operating-profile-and-context
        SOURCE_CHANGE_OR_PATCH:
        - change-and-control-architecture
        - delivery-and-validation-contracts
        - canonical-sync-and-equality-proof
        - evidence-and-human-handoff-before-completion-claim
      user_repetition_of_boot_context_required: false

    completion_invariants:
    - surface-is-additive-and-does-not-redefine-existing-boot-gates
    - Source-operational-state-is-established-before-human-completion-presentation
    - local-machine-verification-remains-capability-conditioned
    - CEREBRO_SYNC_VERIFIED-remains-separately-evidenced
    - Constitution-summary-is-current-commit-bound
    - architecture-summary-is-current-commit-bound
    - task-specific-semantics-remain-demand-driven
    - boot-does-not-require-project-refine-or-patch-rules-to-be-eagerly-loaded
    - no-second-user-command-is-required-to-complete-normal-boot

  critical_path_invariant: >
    A check may block the user's synchronous boot only when its result can materially
    change the current authority, Source-integrity, activation, operational-status or
    safety decision.

  latency_evidence:
    primary_metric: HUMAN_TIME_TO_AVAILABLE_RESULT
    fields:
    - authority_resolution_ms
    - source_verification_ms
    - integrity_validation_ms
    - activation_ms
    - local_verification_ms
    - total_boot_ms
    - external_call_count
    - semantic_files_loaded
    - validation_cache_hit
    - deep_validation_triggered
    - deep_validation_reason

  safety:
  - fast-and-deep-paths-have-identical-status-evidence-requirements
  - cached-evidence-never-becomes-authority
  - stale-derived-state-never-establishes-current-status
  - local-machine-status-never-inferred-without-local-proof
