schema: cerebro-standard/v0.1
standard:
  id: STD-CHANGE-DELIVERY
  name: Cerebro Source Change Delivery Standard
  version: 0.7.0
  status: approved
  authority: authoritative
  scope: Standard human delivery of final Source bytes into local Working Source with verified bounded backup and rollback.
  consumers:
  - change-engine
  - builder
  - validator
  - quality-gate
  - source-delivery
profiles:
  LIMITED:
    legacy_alias: STANDARD_A
    name: USER_MANAGED_FILE_DELIVERY
    use_when:
    - only-existing-files-are-replaced
    - no-directory-creation-required
    - no-file-move-required
    - no-file-delete-required
    user_surface:
    - finished-files
    - exact-relative-paths
    - sha256-manifest
    script_required: false
    execution_owner: USER
    agent_local_access: PROHIBITED
    access_request_budget: 0
    artifact_format: FILES
  STANDARD:
    legacy_alias: STANDARD_B
    name: USER_LOCAL_RUNNER_DELIVERY
    use_when:
    - directories-must-be-created
    - new-files-are-added
    - files-must-be-moved
    - explicitly-superseded-files-must-be-removed
    - bounded-backup-automation-materially-reduces-risk
    user_surface:
    - exactly-one-bundle-zip
    - exactly-one-launcher-powershell
    - short-copyable-launch-command
    user_handoff_format: BUNDLE_ZIP_PLUS_LAUNCHER
    alternate_user_handoff: PROHIBITED
    execution_owner: USER_LOCAL_RUNNER
    agent_local_access: PROHIBITED
    access_request_budget: 0
    artifact_format: PAYLOAD_PLUS_INSTALLER
    script_scope:
    - preflight
    - payload-discovery
    - payload-container-extraction-when-required
    - payload-manifest-verification
    - bounded-backup
    - backup-hash-verification
    - directory-creation
    - exact-payload-installation
    - installed-state-verification
    - bounded-rollback-on-apply-failure
    - run-to-pass-orchestration
    - receipt
    prohibited_script_scope:
    - Source-content-generation
    - YAML-transformation
    - roadmap-interpretation
    - architecture-decision
    - claim-promotion
    - git-reset-hard
    - unbounded-recovery
  FULL:
    legacy_alias: STANDARD_C
    name: CONTROLLED_WORKSPACE_TRANSACTION
    use_when:
    - implementation-agent-has-direct-working-source-write-access
    - exact-change-capsule-is-available
    - bounded-machine-transaction-reduces-human-transport-risk
    user_surface:
    - approved-change-scope
    - exact-base-commit
    - delivery-receipt
    controller: tooling/delivery/delivery_controller.py
    execution_owner: AGENT_CONTROLLED
    agent_local_access: EXPLICIT_GRANT_REQUIRED
    access_request_budget: 1
    artifact_format: CONTROLLED_TRANSACTION
    required_controls:
    - capsule-and-payload-integrity-before-mutation
    - clean-exact-working-source-baseline
    - physical-prestate-backup
    - mutation-intent-journal-before-write
    - exact-declared-path-scope
    - installed-byte-verification
    - bounded-known-state-rollback
    - lossless-recovery-receipt
    prohibited:
    - implicit-publication
    - implicit-commit
    - overwrite-unknown-concurrent-state
    - delivery-controller-source-generation
selection:
  command: cerebro delivery select <limited|standard|full|auto>
  status_command: cerebro delivery status
  explanation_command: cerebro delivery explain [profile]
  implementation: tooling/delivery/cerebro_delivery.ps1
  state_schema: tooling/delivery/selection-state-schema.json
  active_state_default: D:\Cerebro\Run\active\CEREBRO_DELIVERY_SELECTION.json
  history_root_default: D:\Cerebro\Run\delivery\selections
  authority: DERIVED_RUNTIME_STATE
  semantics:
  - selection-locks-delivery-profile-not-patch-identity
  - selection-does-not-mutate-source
  - selection-does-not-apply-commit-or-publish
  - selected-profile-is-revalidated-against-patch-scope-before-payload-design
  - selected-profile-is-revalidated-again-before-delivery
  - missing-AUTO-evidence-blocks-without-silent-fallback
  - canonical-state-never-persists-legacy-profile-names
  - LIMITED-and-STANDARD-prohibit-agent-access-requests
  - FULL-permits-at-most-one-aggregated-platform-access-request
  source_binding:
  - expected-repository
  - branch-main
  - exact-source-commit
  invalidation:
  - source-commit-change
  - explicit-user-reselection
  - verified-capability-change
  - selected-profile-validation-failure
  deterministic_identity:
    field: decision_fingerprint
    inputs:
    - state-schema
    - resolved-profile
    - exact-source-commit
    - change-delivery-standard-version
compatibility_aliases:
  STANDARD_A: LIMITED
  STANDARD_B: STANDARD
  STANDARD_C: FULL
  policy:
  - aliases-are-input-only
  - aliases-resolve-to-canonical-profile-before-state-is-written
  - status-and-receipts-display-canonical-profile
  - aliases-may-be-removed-only-by-an-explicit-breaking-migration
namespace_separation:
  delivery_profile:
    values: [LIMITED, STANDARD, FULL]
    meaning: who performs local delivery and what access is allowed
  artifact_format:
    values:
    - FILES
    - PAYLOAD_PLUS_INSTALLER
    - SELF_EXTRACTING_POWERSHELL
    - CONTROLLED_TRANSACTION
    meaning: physical form of the delivery artifact
    canonical_standard_format: PAYLOAD_PLUS_INSTALLER
    legacy_artifact_formats_preserved: [SELF_EXTRACTING_POWERSHELL]
    legacy_builder_modes_preserved: [FULL, EXEC, PSHELL]
  user_handoff_format:
    values:
    - BUNDLE_ZIP_PLUS_LAUNCHER
    meaning: physical user-facing STANDARD handoff independent of internal payload composition
    canonical_standard_handoff: BUNDLE_ZIP_PLUS_LAUNCHER
    fixed_counts: {zip: 1, launcher: 1, copyable_command: 1}
    alternate_standard_handoff: prohibited
  assurance_profile:
    values: [FAST, STANDARD, DEEP]
    meaning: depth of change assurance
  invariant: DELIVERY_PROFILE_ARTIFACT_FORMAT_AND_ASSURANCE_PROFILE_ARE_INDEPENDENT_NAMESPACES
access_request_policy:
  LIMITED:
    budget: 0
    on_attempt: BLOCK_BEFORE_PLATFORM_DIALOG
  STANDARD:
    budget: 0
    on_attempt: BLOCK_BEFORE_PLATFORM_DIALOG
  FULL:
    budget: 1
    aggregation_required: true
    on_denial: FULL_BLOCKED
    retry_without_new_explicit_selection: false
  invariant: PROFILE_SELECTION_DOES_NOT_OVERRIDE_PLATFORM_SECURITY_CONTROLS
identity_domains:
  tracked_source_baseline:
    authoritative_identity: git-blob-sha
    source: git-object-database-at-exact-base-commit
    physical_worktree_sha256_is_authority: false
    rationale:
    - checkout-representation-may-differ-from-git-blob-bytes
    - CRLF-LF-conversion-must-not-create-false-baseline-failure
  physical_worktree_prestate:
    identity: runtime-sha256-of-actual-bytes
    purpose:
    - verified-backup
    - bounded-rollback
    - bounded-restore
    authority: NON_AUTHORITATIVE_EVIDENCE
  delivered_payload:
    identity: sha256-of-exact-payload-bytes
    purpose:
    - package-integrity
    - atomic-copy-verification
    - post-apply-verification
  invariant: TRACKED_GIT_IDENTITY_PHYSICAL_BACKUP_IDENTITY_AND_PAYLOAD_IDENTITY_MUST_NOT_BE_CONFLATED
backup_contract:
  required_for: STANDARD
  root_default: D:\Cerebro\Backups
  backup_identity:
  - change-id
  - timestamp
  - random-suffix
  manifest_required: true
  manifest_name: BACKUP_MANIFEST.json
  backup_is_valid_only_when:
  - every-preexisting-target-is-copied
  - every-copy-sha256-equals-recorded-pre-state
  - absent-pre-state-is-explicitly-recorded
  - manifest-is-written-and-re-readable
  mutation_journal:
    record_path_before_first_possible_mutation: true
    reason: rollback-must-cover-post-write-verification-failure
  restore:
    separate-script-required: true
    bounded-to-declared-paths: true
    overwrite_allowed_only_when-current-state-is-known: true
    known-current-states:
    - exact-payload-state
    - exact-baseline-state
    - absent-when-baseline-absent
    unknown-or-concurrent-state_effect: FAILED_RECOVERY_REQUIRED
  normal_recovery_prohibits:
  - git-reset-hard
  - repository-wide-restore
  - overwrite-of-unknown-current-bytes
  - delete-of-unknown-current-files
working_source_preflight:
  required:
  - repository-root-match
  - expected-origin
  - branch-main
  - expected-base-commit
  - clean-worktree
  - no-preexisting-staged-changes
  - payload-hashes-valid
  - tracked-target-baselines-match-git-blob-identities
  - physical-working-tree-is-clean-against-index
  failure_effect: NO_MUTATION
post_apply:
  success_state: READY_FOR_LOCAL_VALIDATION
  publication_performed: false
  verified_claim_allowed: false
  next_control:
  - validate-actual-working-source
  - quality-gate
  - cerebro_sync
  - remote-verification
standard_runner_contract:
  required_for: STANDARD
  delivery_shape: one-bundle-zip-plus-one-launcher-plus-one-short-copyable-command
  user_handoff:
    zip_count: 1
    launcher_count: 1
    command_count: 1
    internal_files_exposed_separately: false
    current_working_directory_dependency: prohibited
    cd_instruction_required: false
    launcher_resolves_bundle_from_own_location: true
    launcher_and_bundle_identity_verification_required: true
  payload_forms:
  - exact-single-file-payload
  - package-archive-with-manifest
  - deterministic-patch-payload-bound-to-exact-base
  required_actions:
  - Install
  - Validate
  - Publish
  - Restore
  - RunToPass
  install_must:
  - parse-installer-before-first-mutation
  - verify-external-payload-and-manifest-hashes
  - verify-exact-source-commit
  - extract-package-to-bounded-temporary-location-when-required
  - create-bounded-backup
  - install-only-declared-paths
  - verify-installed-state
  - rollback-on-known-state-failure
  - emit-machine-readable-receipt
  run_to_pass_must:
  - require-explicit-user-RunToPass-invocation
  - perform-Install-then-Validate-then-Publish-then-remote-verification
  - stop-on-first-governing-failure
  - not-require-repeated-user-authorization-for-the-predeclared-chain
  publish_must:
  - require-an-explicit-Publish-action-or-explicit-RunToPass-action
  - run-only-after-successful-local-validation
  - remain-user-executed
  - emit-machine-readable-sync-receipt
  prohibited:
  - download-code-at-execution-time
  - agent-local-access-request
  - implicit-publish-during-Install
  - silent-profile-fallback

artifact_surface_resolution:
  requirement: deliver-user-usable-artifacts
  resolver_owner: MCP
  principles:
  - outcome-before-mechanism
  - least-intrusive-capable-surface
  - artifact-requirement-does-not-imply-work-mode
  - artifact-generation-and-artifact-delivery-surface-are-separate-concerns
  - current-capabilities-must-be-evaluated-before-escalation
  - work-or-direct-local-access-is-not-requested-merely-because-files-are-required

direct_inline_execution:
  classification: EXECUTION_MECHANISM_EXCEPTION
  delivery_profile: NONE
  default_for_persistent_implementation: false
  allowed_when:
  - read-only-diagnostic
  - invoke-already-delivered-runner
  - process-scoped-bootstrap
  - bounded-recovery
  - artifact-surface-unavailable-and-inline-is-the-safest-bounded-fallback
  - explicit-user-request
  prohibited_as_reason:
  - patch-is-small
  - code-is-short
  - assistant-convenience
  - assumption-that-file-generation-requires-work

deliverylvl_learning_basis:
  authority: EVIDENCE_ONLY
  status: USER_CORRECTED_AND_REFINED
  observations:
  - id: DELIVERYLVL-LRN-001
    family: HUMAN_MACHINE_SEMANTIC_GAP
    conclusion: human outcome intent must be resolved before a machine mechanism is selected
  - id: DELIVERYLVL-LRN-002
    family: ARTIFACT_SURFACE_ASSUMPTION
    conclusion: producing a user-downloadable file does not by itself imply Work or agent-local access
  - id: DELIVERYLVL-LRN-003
    family: DEPENDENCY_ORDERING
    conclusion: downstream work must not execute against an unverified prerequisite capability or state
  - id: DELIVERYLVL-LRN-004
    family: INLINE_DELIVERY_MISCLASSIFICATION
    conclusion: large inline terminal implementation code is an exception mechanism and not STANDARD delivery
  operationalization:
  - PAYLOAD_PLUS_INSTALLER
  - LEAST_INTRUSIVE_CAPABLE_SURFACE
  - OUTCOME_BEFORE_MECHANISM
  - DEPENDENCY_AWARE_EXECUTION

separation:
  delivery_means: place-final-exact-bytes-at-declared-local-paths
  change_execution_means: test-validate-learn-and-resolve-readiness
  publication_means: synchronize-verified-local-Working-Source-to-authoritative-remote
  invariant: DELIVERY_DOES_NOT_IMPLY_VERIFIED
rules:
- id: STD-CHANGE-DELIVERY-R001
  statement: A tracked existing Source baseline shall be verified by Git blob identity at the exact base commit, not by SHA256 of checkout bytes.
  priority: critical
- id: STD-CHANGE-DELIVERY-R002
  statement: Backup integrity shall use SHA256 of the actual physical Working Source bytes copied at runtime.
  priority: critical
- id: STD-CHANGE-DELIVERY-R003
  statement: Payload and post-apply integrity shall use SHA256 of the exact delivered payload bytes.
  priority: critical
- id: STD-CHANGE-DELIVERY-R004
  statement: Failure receipts shall preserve the original failure detail and recovery outcome across orchestration boundaries.
  priority: critical
- id: STD-CHANGE-DELIVERY-R005
  statement: Every delivered PowerShell file shall pass target-language parsing before its first execution; parser failure blocks sandbox and Working Source mutation.
  priority: critical
- id: STD-CHANGE-DELIVERY-R006
  statement: PowerShell generation and review shall reject ambiguous variable interpolation where an unbraced variable name is immediately followed by a colon inside an expandable string.
  priority: critical
- id: STD-CHANGE-DELIVERY-R007
  statement: Direct work-mode delivery shall execute as a capsule-bound FULL transaction with a verified physical prestate and a mutation journal persisted before the first possible write.
  priority: critical
- id: STD-CHANGE-DELIVERY-R008
  statement: Successful FULL delivery shall stop at READY_FOR_LOCAL_VALIDATION and shall not commit, publish, or promote Source implicitly.
  priority: critical
- id: STD-CHANGE-DELIVERY-R009
  statement: Rollback shall overwrite or remove a target only when its current state is the verified baseline state or the exact delivered payload state; unknown concurrent state requires manual recovery.
  priority: critical
- id: STD-CHANGE-DELIVERY-R010
  statement: A terminal delivery selection shall bind the explicitly resolved profile to the exact Source commit and persist machine-readable derived state outside Source without applying, committing, or publishing a patch.
  priority: critical
- id: STD-CHANGE-DELIVERY-R011
  statement: AUTO selection shall fail closed when patch-scope and capability evidence are insufficient and shall never silently fall back to another delivery profile.
  priority: critical
- id: STD-CHANGE-DELIVERY-R012
  statement: A locked delivery selection shall be revalidated before physical payload design and before delivery, and a Source commit change shall make the active selection stale.
  priority: critical
- id: STD-CHANGE-DELIVERY-R013
  statement: LIMITED and STANDARD shall have an access-request budget of zero; work under those profiles shall produce user-executed artifacts without triggering a platform access dialog.
  priority: critical
- id: STD-CHANGE-DELIVERY-R014
  statement: FULL shall require explicit selection, aggregate any necessary platform access into at most one request, and enter FULL_BLOCKED after denial without retry or fallback.
  priority: critical
- id: STD-CHANGE-DELIVERY-R015
  statement: STANDARD delivery shall expose exactly one user-facing ZIP bundle, exactly one user-facing PowerShell launcher, and exactly one short copyable launch command; all implementation internals and receipt machinery shall remain inside the bundle or be produced at runtime.
  priority: critical
- id: STD-CHANGE-DELIVERY-R016
  statement: Delivery profile, artifact format, artifact surface, execution mechanism, and assurance profile shall remain independent namespaces; legacy builder modes FULL, EXEC, and PSHELL retain their existing artifact semantics.
  priority: critical
- id: STD-CHANGE-DELIVERY-R017
  statement: Cerebro shall resolve the user's intended outcome before selecting the technical delivery mechanism or artifact surface.
  priority: critical
- id: STD-CHANGE-DELIVERY-R018
  statement: A requirement to create or deliver user-downloadable files shall not by itself imply Work mode, agent-local access, or any more intrusive delivery surface.
  priority: critical
- id: STD-CHANGE-DELIVERY-R019
  statement: Direct inline terminal implementation code shall be an exception mechanism and shall not be selected as STANDARD merely because a patch is small, short, or convenient to express inline.
  priority: critical
- id: STD-CHANGE-DELIVERY-R020
  statement: Explicit user invocation of RunToPass shall authorize the predeclared STANDARD chain through publication and remote verification after local validation without repeated confirmation, while preserving all governing gates.
  priority: critical
- id: STD-CHANGE-DELIVERY-R021
  statement: Artifact delivery shall use the least intrusive currently available surface that can safely deliver the required artifacts; capability must be checked before escalation.
  priority: high
- id: STD-CHANGE-DELIVERY-R022
  statement: STANDARD launch shall be independent of the caller current working directory and shall not require the user to change directory before execution.
  priority: critical
- id: STD-CHANGE-DELIVERY-R023
  statement: STANDARD launcher resolution shall verify launcher identity and the matching adjacent bundle identity before execution; browser duplicate filenames shall not be selected by recency alone.
  priority: critical
- id: STD-CHANGE-DELIVERY-R024
  statement: No configuration or User Operating Profile value may select an alternate STANDARD handoff form.
  priority: critical
- id: STD-CHANGE-DELIVERY-R025
  statement: Internal payload format and user handoff format are separate namespaces; STANDARD internal payload composition may vary only inside the fixed one-ZIP one-launcher one-command user surface.
  priority: critical
- id: STD-CHANGE-DELIVERY-R026
  statement: Every copyable handoff command shall declare its execution surface unambiguously; CHAT control commands and LOCAL_SHELL execution commands shall not be presented as interchangeable.
  priority: critical
- id: STD-CHANGE-DELIVERY-R027
  statement: For known machine languages and deterministic patch formats, a candidate shall not be handed to the user after a repeated failure family until the failure boundary has been reproduced in a disposable fixture and the repaired candidate has passed the applicable parser, linter, exact-context apply preflight, scope check, and reverse or rollback preflight available for that format.
  priority: critical
- id: STD-CHANGE-DELIVERY-R028
  statement: A syntactically parseable patch is not sufficient evidence of applicability; STANDARD build assurance shall distinguish patch-format parsing from application against the intended prestate.
  priority: critical
- id: STD-CHANGE-DELIVERY-R029
  statement: When a verified candidate already exists, correction shall prefer minimum-delta revision with dependent identity recomputation and revalidation over regeneration of unchanged candidate content.
  priority: high
target_language_preflight:
  powershell:
    applies_to:
    - apply-script
    - restore-script
    - installer-entrypoint
    target_parser: System.Management.Automation.Language.Parser
    parse_required_before_first_package_script_execution: true
    all_delivered_ps1_must_parse: true
    ambiguous_variable_followed_by_colon_prohibited: true
    failure_effect: NO_MUTATION
    build_time_regression_required: true
    runtime_preflight_is_not_substitute_for_build_assurance: true
