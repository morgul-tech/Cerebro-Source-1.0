schema: cerebro-standard/v0.1
standard:
  id: STD-CHANGE-ARCHITECTURE
  name: Cerebro Change Architecture Standard
  version: 0.2.0
  status: approved
  authority: authoritative
  scope: Definition of the stable Host, versioned Change Engine, Development Lab, failure knowledge, stability gating, and non-overlapping change execution boundaries.
  consumers:
    - host
    - change-engine
    - quality-gate
    - validator
    - builder
    - project-engine
    - context-engine

architecture:
  outcome: REPLACE
  replaces:
    - bespoke-per-patch-bootstrap
    - bootstrap-owned-change-generation
    - bootstrap-owned-source-transformation
  preserves:
    - Cerebro-Source-as-sole-persistent-authority
    - MCP-as-highest-internal-control-authority
    - Release-as-derived-implementation
    - Runtime-0.1-separation
    - cerebro_sync-as-Source-publication-path

components:
  host:
    kind: TOOLING
    role: stable-minimal-local-entrypoint-and-dispatcher
    authority: NON_AUTHORITATIVE
    responsibilities:
      - resolve-working-source
      - verify-repository-identity
      - select-exact-source-commit
      - materialize-or-reuse-immutable-tooling-snapshot
      - delegate-command-with-live-output
      - dispatch-versioned-delivery-controller
      - supervise-delegated-native-operations
    prohibited:
      - parse-roadmap
      - interpret-Source-policy
      - generate-Source-content
      - mutate-Working-Source
      - own-quality-policy
      - own-publication-policy
      - own-runtime-transition-semantics
      - own-SEALED-STANDARD-Source-patch-execution

  change_engine:
    kind: TOOLING
    role: versioned-change-development-campaign-and-assurance
    authority: DERIVED_IMPLEMENTATION
    execution_surface: immutable-tooling-snapshot
    responsibilities:
      - verify-change-capsule
      - run-development-lab
      - run-adaptive-test-campaigns
      - classify-failure-families
      - perform-root-producer-analysis-support
      - maintain-derived-failure-knowledge
      - resolve-stability-gate
      - verify-exact-candidate-scope
    prohibited:
      - create-persistent-Source-authority
      - silently-promote-Wisdom
      - mutate-Source-from-Runtime
      - bypass-Quality-Gate
      - bypass-cerebro_sync
      - own-SEALED-STANDARD-publication-transport

  delivery_controller:
    kind: TOOLING
    role: full-profile-bounded-working-source-transaction
    authority: DERIVED_IMPLEMENTATION
    contract_ref: standards/change-delivery.yaml
    responsibilities:
      - verify-exact-working-source-baseline
      - persist-pre-mutation-journal
      - preserve-verified-bounded-backup
      - deliver-exact-capsule-bytes
      - enforce-declared-path-scope
      - perform-known-state-bounded-rollback
      - emit-lossless-delivery-receipt
    prohibited:
      - generate-source-content
      - choose-architecture
      - publish-or-commit-source
      - overwrite-unknown-concurrent-state
      - own-new-SEALED-STANDARD-runtime-execution

  standard_delivery_kernel:
    kind: TOOLING
    role: canonical-sealed-standard-user-local-source-patch-execution
    authority: DERIVED_IMPLEMENTATION
    contract_refs:
      - standards/delivery-kernel.yaml
      - standards/change-delivery.yaml
      - standards/change-delivery-convergence.yaml
    responsibilities:
      - verify-sealed-STANDARD-profile-and-execution-contract
      - verify-exact-working-source-and-remote-baseline
      - run-material-commitment-preflight
      - preserve-verified-bounded-backup
      - install-exact-final-payload-bytes
      - verify-installed-byte-identity
      - run-active-source-integrity-closure
      - run-contract-activation-closure-and-audit
      - invoke-canonical-cerebro_sync
      - independently-verify-local-remote-commit-equality
      - emit-deterministic-delivery-receipt
    prohibited:
      - choose-architecture
      - generate-Source-content
      - own-MCP-control-policy
      - own-Runtime-reasoning-policy
      - own-FULL-controlled-workspace-transaction-path

execution_ownership_convergence:
  introduced_by:
    - PATCH-ACTIVATION-ARCH-001
    - PATCH-ACTIVATION-ARCH-002
  invariant: ONE_CANONICAL_OWNER_PER_EXECUTION_RESPONSIBILITY
  responsibilities:
    controlled_tool_dispatch:
      canonical_owner: HOST
      implementation: tooling/host/cerebro_host.py
    change_campaign_assurance:
      canonical_owner: CHANGE_ENGINE
      implementation: tooling/change/change_engine.py
    full_working_source_transaction:
      canonical_owner: DELIVERY_CONTROLLER
      implementation: tooling/delivery/delivery_controller.py
    sealed_standard_source_patch_execution:
      canonical_owner: STANDARD_DELIVERY_KERNEL
      implementation: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
    source_publication:
      canonical_owner: CEREBRO_SYNC
      implementation: tooling/builder/templates/pshell/cerebro_sync.ps1
  separation:
    - Host-dispatch-does-not-imply-transaction-ownership
    - Change-Engine-development-does-not-imply-publication-transport-ownership
    - FULL-and-STANDARD-transaction-paths-remain-distinct
    - Delivery-Controller-does-not-publish
    - Standard-Delivery-Kernel-does-not-own-FULL-workspace-transactions
    - MCP-control-authority-remains-separate-from-execution-ownership

change_model:
  capsule:
    format: JSON
    contract_ref: standards/change-delivery.yaml
    schema_ref: tooling/change/capsule-schema.json
    content_rule: final-payload-bytes-only
    production_machine_transformation: prohibited
  repository_identity:
    tracked_identity: git-blob-sha
    candidate_identity: exact-payload-sha256
    base_identity: immutable-git-commit
  development_lab:
    source_fixture_priority:
      - exact-current-Source
      - derived-disposable-worktree
      - synthetic-fixture-as-supplement
    mutation_target: disposable-worktree-only
    working_source_mutation: prohibited
  delivery_sandbox:
    exact-delivered-payload-required: true
    user-environment-exercise_required_before_authoritative_mutation: true
  working_source:
    role: mutable-local-development-surface
    publication_path: cerebro_sync

failure_learning:
  authority: EVIDENCE_ONLY
  state_kind: DERIVED
  source_mutation_allowed: false
  iteration_inheritance_required: true
  failure_family_escalation_required: true
  repeated_related_failure_requires_root_producer_analysis: true
  unresolved_systemic_failure_blocks_dependent_development: true
  operationalization_rule:
    machine_enforceable_learning:
      - regression
      - preflight
      - validator-check
      - quality-check
      - campaign-scenario
    non_machine_enforceable_learning:
      - Wisdom-evidence
      - decision-guidance
  legacy_plc:
    disposition: EVIDENCE_ADAPTER
    parallel_authority: false

failure_learning_convergence:
  introduced_by: PATCH-007.PRE-005
  architecture_outcome: CONVERGE_EXISTING_CHANGE_CONTEXT_DIAGNOSTICS_AND_ASSURANCE
  new_top_level_component: false
  detailed_failure_evidence_owner: tooling.change
  regression_policy_ref: tooling/change/campaign-policy.yaml
  diagnostic_input_ref: tooling/host/diagnostic_capsule.py
  history_owner: context-engine
  history_ref: engines/context/development-history.yaml
  learning_flow:
    - OPERATIONAL_FAILURE_OR_SUCCESS_EVIDENCE
    - DIAGNOSTIC_OR_CAMPAIGN_NORMALIZATION
    - FAILURE_FAMILY_AND_ROOT_PRODUCER_CLASSIFICATION
    - RELEVANCE_SCOPED_REGRESSION_SELECTION
    - LEARNING_BASIS_FINGERPRINT
    - MACHINE_ENFORCEABLE_ASSURANCE_BINDING
    - DEVELOPMENT_HISTORY_CANDIDATE_WHEN_SIGNIFICANT
  positive_negative_separation:
    failure_evidence: DETAILED_DERIVED_CHANGE_KNOWLEDGE
    strengthening_evidence: CONTEXT_DEVELOPMENT_HISTORY_WHEN_SIGNIFICANT
  invalidation:
    relevant_learning_basis_change: INVALIDATE_CANDIDATE_ASSURANCE
  invariants:
    - FAILURE_EVIDENCE_REMAINS_EVIDENCE_ONLY
    - DEVELOPMENT_HISTORY_IS_NOT_A_DUPLICATE_FAILURE_DATABASE
    - KNOWN_APPLICABLE_FAILURE_FAMILY_WITH_MACHINE_ENFORCEABLE_PREVENTION_BLOCKS_HANDOFF_UNTIL_BOUND
    - USER_IS_NOT_THE_FAILURE_LEARNING_TRANSPORT_PROCESSOR
    - POSITIVE_FIRST_PASS_EVIDENCE_AND_NEGATIVE_FAILURE_EVIDENCE_REMAIN_DISTINCT

operation_supervision:
  introduced_by: PATCH-007.PRE-003
  owner: tooling.host
  authority: DERIVED_IMPLEMENTATION
  reusable_path_required: true
  contract:
    operation_journal_from_start: true
    heartbeat_independent_of_child_stdout: true
    interruptibility_is_stage_specific: true
    stall_detection_implies_force_kill: false
    unavailable_exit_status_semantics: UNKNOWN_NOT_NONZERO
    process_observation_distinct_from_subject_result: true
    reconciliation_required_before_final_classification:
      - process_observation
      - child_receipt_when_available
      - material_poststate_when_available
    allowed_resolution:
      - SUCCESS
      - SUCCESS_WITH_PROCESS_OBSERVATION_DEGRADED
      - FAIL
      - UNKNOWN
      - DISAGREEMENT_REQUIRES_RESOLUTION
  invariants:
    - NATIVE_PROCESS_RESULT_FALSE_FAILURE_IS_PROHIBITED
    - NULL_OR_UNAVAILABLE_EXIT_CODE_IS_NOT_NONZERO_FAILURE
    - PROCESS_OBSERVATION_DOES_NOT_OVERRIDE_VERIFIED_MATERIAL_POSTSTATE
    - STALL_DETECTION_DOES_NOT_IMPLY_FORCE_KILL
    - ONE_SHARED_SUPERVISION_ADAPTER_PRECEDES_GENERATED_WRAPPER_DUPLICATION

operational_evidence:
  contract_ref: standards/operational-evidence.yaml
  authority: EVIDENCE_ONLY
  producers:
    - development-lab
    - change-engine
    - delivery-controller
    - validator
  consumers:
    - stability-gate
    - final-learning-consolidation
    - diagnostics
    - MCP
  requirements:
    - preserve-partial-evidence
    - classify-probe-failure-separately-from-subject-failure
    - bind-freshness-to-relevant-state
    - redact-before-human-transport

campaigns:
  policy_ref: tooling/change/campaign-policy.yaml
  profiles:
    FAST: 1
    STANDARD: 2
    DEEP: 3
  repeated_runs_purpose:
    - state-leakage-detection
    - cleanup-defect-detection
    - idempotence-detection
    - stale-lock-detection
    - cross-run-failure-family-correlation
  one-pass-is-not-stability-proof: true

stability_gate:
  kind: GATE
  required_before: READY_TO_LOCK
  pass_requires:
    - required-campaign-count-completed
    - current-candidate-has-no-failing-required-scenario
    - no-unresolved-systemic-failure-family
    - iteration-inheritance-evidence-present
    - exact-final-serialization-validated
  failure_effect: BLOCK_DEPENDENT_DEVELOPMENT

learning_lifecycle:
  during_patch:
    authority: EVIDENCE_ONLY
    cumulative: true
    may_change-implementation: true
    may_change-architecture-only-through-regrounding: true
  final_pass_gate:
    id: FINAL_LEARNING_CONSOLIDATION
    required_before_patch_close: true
    classify:
      - local-defect
      - failure-family
      - systemic-Cerebro-defect
      - false-hypothesis
      - confirmed-reusable-learning
    output:
      - regression-promotions
      - Wisdom-candidates
      - control-review-input
  post_verified_review:
    required: true
    name: CEREBRO_INTERNAL_CONTROL_REVIEW
    blocks_POST_002_until_completed: true

legacy_bootstrap:
  patch_bootstrap:
    status: RETIRED_BY_THIS_STANDARD
    extension_allowed: false
  handboot_bootengine:
    status: LEGACY_ACTIVATION_PATH
    extension_allowed: false
    mutation_in_this_patch: false
    future_regrounding_required: true

rules:
  - id: STD-CHANGE-R001
    statement: Normal Cerebro change development shall not require a bespoke per-patch bootstrap.
    priority: critical
  - id: STD-CHANGE-R002
    statement: The Host shall remain smaller and less capable than the versioned Change Engine it dispatches.
    priority: critical
  - id: STD-CHANGE-R003
    statement: New change implementations shall execute from an immutable tooling snapshot bound to one exact Source commit.
    priority: critical
  - id: STD-CHANGE-R004
    statement: Repeated related failures shall be analyzed for a common producer before another dependent implementation iteration is permitted.
    priority: critical
  - id: STD-CHANGE-R005
    statement: Every iteration shall inherit all applicable prior failure evidence, rejected approaches, regressions, and environment facts.
    priority: critical
  - id: STD-CHANGE-R006
    statement: Machine-enforceable learning shall become executable assurance rather than documentation only.
    priority: critical
  - id: STD-CHANGE-R007
    statement: Final learning consolidation is required after operational PASS and before PATCH-005.POST-001 closure.
    priority: critical
  - id: STD-CHANGE-R008
    statement: Runtime 0.1 remains outside the mutation scope of PATCH-005.POST-001.
    priority: critical
  - id: STD-CHANGE-R009
    statement: Change assurance, diagnostics, delivery observations, and failure learning shall exchange operational evidence through STD-OPERATIONAL-EVIDENCE rather than component-specific incompatible evidence shapes.
    priority: critical
  - id: STD-CHANGE-R010
    statement: Host is the canonical controlled local entrypoint and dispatcher, not a parallel STANDARD Source patch execution owner.
    priority: critical
  - id: STD-CHANGE-R011
    statement: Change Engine owns change development, campaign assurance and failure-learning semantics, not canonical STANDARD publication transport.
    priority: critical
  - id: STD-CHANGE-R012
    statement: Delivery Controller owns the FULL bounded Working Source transaction path, while the Standard Delivery Kernel owns new sealed STANDARD user-local Source patch execution; the two paths shall remain distinct.
    priority: critical
  - id: STD-CHANGE-R013
    statement: Source publication remains owned by canonical cerebro_sync and shall not be duplicated by Host, Change Engine or Delivery Controller.
    priority: critical
