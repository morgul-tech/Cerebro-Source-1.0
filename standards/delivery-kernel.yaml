schema: cerebro-delivery-kernel-standard/v1
delivery_kernel:
  id: CEREBRO-STANDARD-DELIVERY-KERNEL-001
  version: "2.8"
  status: ACTIVE
  authority: Cerebro Source 1.0
  scope: STANDARD

  canonical_implementation: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1

  change_delivery_convergence:
    contract: standards/change-delivery-convergence.yaml
    delivery_profile: STANDARD
    sealed_manifest_profile_identity_required: true
    sealed_MCP_delivery_control_binding_required: true
    exact_MCP_binding_normal_consumer: mcp/control_resolution.py#validate_delivery_control_binding
    mutable_selection_state_at_execution: NON_GOVERNING
    explicit_launcher_invocation_is_run_to_pass_authorization: true
    legacy_cpatch_for_new_standard_packages: SUPERSEDED
    LIMITED_and_FULL_profiles: OUTSIDE_KERNEL_SCOPE

  campaign_closeout:
    contract: standards/change-campaign-closeout.yaml
    manifest_contract_required_for_milestone_closeout_delivery: true
    normal_consumer_stage: SELFTEST_CHANGE_CAMPAIGN_CLOSEOUT
    MCP_phase_transition_must_continue: true
    failure_effect: BLOCK_BEFORE_SOURCE_MUTATION

  activation_runtime_proof:
    manifest_scoped: true
    runs_only_when_activation_probes_are_declared: true
    stage: AFTER_ACTIVE_SOURCE_INTEGRITY_BEFORE_CONTRACT_ACTIVATION_CLOSURE
    stale_or_failed_evidence: BLOCK
    unrelated_standard_patch_latency: ZERO_WHEN_NO_PROBE_DECLARED
    evidence_is_derived_not_Source_authority: true
    forward_failure_sweep:
      stop_after_first_producer_failure: false
      all_declared_producers_executed: true
      all_impacted_runtime_bindings_inventoried: true
      failure_families_collected_before_block: true
      report_schema: cerebro-forward-failure-sweep/v1
    exact_candidate_target_runtime_gate:
      required_before_authoritative_source_mutation: true
      actual_CAC_consumer_required: true
      producer_consumer_compatibility_required: true
      DEEP_clean_campaigns_required: 3

  material_commitment_preflight:
    contract: standards/development/material-commitment-preflight.yaml
    implementation: mcp/material_commitment_preflight.py
    semantic_basis_source: SEALED_PACKAGE_MANIFEST
    normal_call_path:
      MATERIAL_EXECUTE: BEFORE_BACKUP_AND_SOURCE_MUTATION
      GOVERNING_PUBLISH: AFTER_SOURCE_DIFF_AND_ASC_BEFORE_ACTIVATION_PROOF_CAC_AND_SYNC
    resolve_then_consume_required: true
    bootstrap_defer:
      allowed_only_when_package_creates_canonical_preflight_implementation: true
      governing_publish_gate_after_install_required: true
    activation_probe_substitutes_for_normal_call_path: false

  immune_assurance:
    contract_ref: standards/immune-system.yaml
    continuity_ref: mcp/assurance-continuity.yaml
    kernel_implementation_ref: tooling/assurance/assurance_kernel.py
    permit_schema_ref: mcp/immune-material-permit.schema.json
    receipt_schema_ref: mcp/immune-material-receipt.schema.json
    attestation_schema_ref: mcp/immune-attestation.schema.json
    attestation_scope: MIGRATION_AND_AUTHENTICATED_RECOVERY_ONLY
    migration_schema_ref: mcp/immune-migration.schema.json
    normal_material_consumer_identity: STANDARD_DELIVERY
    state_resolution:
      BOOTSTRAP_ONLY: LEGACY_BOOTSTRAP_PERMIT
      DOCTOR_ENFORCED: LEGACY_DOCTOR_PERMIT
      FAILED_RECOVERY: DENY
      IMMUNE_MIGRATING: DENY_NORMAL_MATERIAL_RECOVERY_MODE_ONLY
      IMMUNE_ENFORCED: MCP_BOUND_ONE_SHOT_IMMUNE_PERMIT
      IMMUNE_QUARANTINED: DENY
      unknown: DENY
    authenticated_postcrash_recovery:
      executor: STANDARD_DELIVERY
      normal_apply_path_during_IMMUNE_MIGRATING: DENY
      recovery_mode: EXPLICIT_ONLY
      check_before_resume_or_rollback: REQUIRED_NO_EFFECT
      consume_after_exact_recovery_boundary: REQUIRED
      recovery_nonce_namespace: "RECOVERY:"
      rollback_requires_restored_prestate_before_kernel_return: true
      resume_requires_deterministic_install_prefix: true
      uncertain_publication_or_drift: QUARANTINE_REQUIRED
      secrets_or_secret_paths_in_receipt: PROHIBITED
    required_before_first_mutation:
      - exact current kernel state
      - exact one-shot permit
      - exact package and touched-path fingerprints
      - exact current assurance authority epoch resolved once during MCP projection
      - exact affected-scope quarantine fingerprint
      - immutable intended consequence class
      - exact producer identity distinct from StandardDelivery
      - fresh consumed MATERIAL_EXECUTE preflight receipt and consumption fingerprints
      - exact MCP control decision and sealed delivery control binding
      - StandardDelivery consumer identity
    prohibited:
      - material mutation during IMMUNE_MIGRATING
      - material mutation during IMMUNE_QUARANTINED
      - producer self certification or permit projection
      - manually dropped or prepositioned ordinary Immune permit
      - Doctor trust substitution after IMMUNE_ENFORCED
      - shadow material consumer
      - key material in Source
    candidate_boundary:
      status: ACTIVE_INGRESS853_EXACT11
      base_source_head: ceff87e29fd2295534ce3eeb8e9ec32180bb0b5b
      targetset: {modify: 11, create: 0, delete: 0}
      migration_or_cutover: UNCHANGED

  source_hygiene:
    python_validation_execution:
      bytecode_write_mode: PROHIBITED
      interpreter_no_bytecode_flag: REQUIRED
      dynamic_Source_import_must_restore_interpreter_state: true
    transient_recovery:
      allowed_before_clean_worktree_gate: true
      removable_scope: UNTRACKED___PYCACHE___PYTHON_BYTECODE_ONLY
      tracked_file_deletion: PROHIBITED
      path_escape: PROHIBITED
      cleanup_must_be_followed_by_normal_clean_worktree_gate: true
    post_python_gate:
      untracked_Source_bytecode_effect: FAIL
      applies_after:
        - MATERIAL_EXECUTE_PREFLIGHT
        - GOVERNING_PUBLISH_PREFLIGHT
        - ACTIVATION_PROBES
    invariant: SOURCE_VALIDATION_MUST_NOT_DIRTY_THE_SOURCE_IT_VALIDATES

  architecture:
    patch_specific_semantics: FINISHED_PAYLOAD_BYTES
    general_delivery_logic: SINGLE_VERSIONED_KERNEL
    runtime_source_generation: PROHIBITED
    runtime_yaml_transformation: PROHIBITED
    runtime_architecture_decision: PROHIBITED

  sealed_candidate_source_view:
    contract_ref: standards/machine-contract-composition.yaml#candidate_artifact_view
    definition: VERIFIED_BASELINE_PLUS_SEALED_MANIFEST_OPERATIONS
    selftest_source:
      declared_create_or_replace: SEALED_PAYLOAD
      declared_delete: ABSENT
      undeclared_dependency: EXACT_MANIFEST_BASE_COMMIT
    implementation: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1#New-SealedCandidateSourceView
    source_worktree_mutation: PROHIBITED
    payload_presence_as_dependency_existence: PROHIBITED
    exact_base_identity_required: true
    candidate_payload_hash_reverification_required: true
    required_candidate_selftests:
      - human-continuation-surface
      - human-execution-handoff
      - MCP-owned-delivery-profile-adapter
    delivery_adapter_selftest_requires:
      decision_owner: MCP
      adapter_policy_recomputation: false
      profile_namespace_preservation: true

  standard_user_handoff:
    bundle_zip: exactly-one
    launcher_powershell: exactly-one
    copyable_command: exactly-one
    canonical_launcher_template: tooling/delivery/Cerebro.StandardDeliveryLauncher.ps1
    human_execution_handoff:
      schema: cerebro-human-execution-handoff/v1
      profile: HASH_BOUND_POWERSHELL
      generator_validator: tooling/validator/human_execution_handoff.py
      artifact_resolution: EXACT_SHA256_AND_UNIQUE_CARDINALITY
      fingerprint_consumer: launcher-before-Source-mutation
      literal_artifact_filename_dependency: PROHIBITED
    launcher_role:
    - locate-bundle
    - consume-hash-bound-human-execution-handoff
    - verify-bundle-integrity
    - extract-bundle
    - verify-kernel-integrity
    - invoke-kernel-selftest
    - invoke-kernel-apply
    - validate-success-receipt
    - publish-bounded-success-transport-view
    - emit-output-independent-heartbeat
    - live-forward-child-stdout-and-stderr
    - validate-safe-continuation-from-clean-base
    prohibited_launcher_roles:
    - Source-content-generation
    - Git-policy-reimplementation
    - semantic-patch-transformation
    - rollback-design
    - architecture-decision
    heartbeat:
      schema: cerebro-patch-heartbeat/v1
      interval_seconds_default: 5
      independent_of_child_output: true
      live_stdout_stderr_forwarding: true
      stalled_suspected_is_observation_not_termination: true
      unknown_exit_status_preserved_as_UNKNOWN: true
      atomic_latest_state_file: heartbeat.json
      append_only_event_journal: events.jsonl
    continuation:
      schema: cerebro-delivery-continuation/v1
      allowed_mode: SAFE_RESTART_FROM_VERIFIED_BASE
      partial_transaction_resume: PROHIBITED
      exact_clean_base_required: true
      prior_attempt_and_capsule_identity_required: true
      resolved_failure_family_set_required: true
      new_attempt_identity_required: true

  work_mode_policy:
    scope: SYSTEM_WIDE
    only_user_may_initiate_work_mode: true
    assistant_may_request_work_mode: false
    assistant_may_suggest_work_mode: false
    assistant_may_propose_work_mode_as_required_path: false
    assistant_may_initiate_work_mode: false
    STANDARD_depends_on_work_mode: false
    missing_work_mode_is_blocker: false
    missing_work_mode_is_degraded_capability: false
    invariant: WORK_MODE_IS_NEVER_PART_OF_STANDARD_DELIVERY

  kernel_transaction:
    supported_operations: [create, replace, delete]
    phases:
    - native-parser-and-kernel-selftest
    - sealed-candidate-MCP-delivery-profile-adapter-selftest
    - bundle-and-payload-hash-verification
    - exact-Source-baseline-verification
    - exact-candidate-forward-failure-sweep
    - exact-candidate-Windows-target-runtime-CAC-and-DEEP-validation-before-mutation
    - verified-full-recovery-snapshot
    - bounded-physical-backup
    - exact-byte-installation
    - installed-byte-verification
    - Source-diff-validation
    - canonical-cerebro-sync
    - fresh-remote-fetch
    - local-remote-commit-equality-proof
    - clean-worktree-proof
    - deterministic-receipt

  exact_bytes_contract:
    existing_file_identity_before: git-blob-sha
    delivered_file_identity: sha256-and-git-blob-sha
    physical_backup_identity: sha256
    delete_identity_before: git-blob-sha
    delete_payload_fields: PROHIBITED
    delete_target_scope: EXACT_DECLARED_FILE_ONLY
    delete_directory_operation: PROHIBITED
    deleted_file_backup_before_mutation: REQUIRED
    deleted_file_rollback_before_sync: REQUIRED
    deleted_file_final_identity: ABSENT_AT_HEAD
    runtime_text_replacement: PROHIBITED

  local_execution_environment:
    execution_host: USER_PRIMARY_WINDOWS_MACHINE
    working_source: D:\Cerebro\Source\Cerebro_Source_v1.0
    normal_user_only: true
    privilege_escalation: PROHIBITED
    local_launcher_may_use_existing_git_credentials: true
    work_mode_required_for_local_launcher: false
    volatile_machine_facts: DISCOVER_FRESH_BEFORE_MUTATION
    missing_required_capability: STOP_BEFORE_MUTATION

  full_recovery_snapshot:
    root: D:\Cerebro\Run\Recovery\Backups
    scope: ENTIRE_WORKING_SOURCE_INCLUDING_DOT_GIT
    required_before_first_source_mutation: true
    archive_hash_required: true
    file_inventory_identity_required: true
    archive_entry_roundtrip_verification_required: true
    verified_retention_count: 10
    pruning_allowed_only_after_new_snapshot_verified: true
    unverified_snapshot_auto_delete: false
    role: CATASTROPHIC_RECOVERY_NOT_NORMAL_ROLLBACK

  native_command_contract:
    stderr_alone_is_failure: false
    failure_authority: IMMEDIATE_EXIT_CODE
    stdout_and_stderr_separate: true
    ErrorActionPreference_during_native_execution: Continue
    ErrorActionPreference_restored_after_native_execution: true

  duplicate_execution:
    if_current_Source_matches_all_final_blobs_and_declared_absences: ALREADY_APPLIED_PASS
    otherwise_if_base_changed: FAIL_CLOSED

  failure_behavior:
    before_canonical_sync: bounded-rollback
    during_or_after_canonical_sync: preserve-state-and-evidence-no-destructive-recovery

  failure_handoff:
    status: REQUIRED
    source_contract_binding: standards/change-delivery.yaml
    evidence_contract_binding: standards/operational-evidence.yaml#diagnostic_capsule_contract
    principle: USER_MUST_NOT_MANUALLY_TRANSPORT_TERMINAL_ERROR_DUMPS

    diagnostic_authority:
      canonical_tool: tooling/host/diagnostic_capsule.py
      canonical_store: LOCALAPPDATA/Cerebro/diagnostics
      lifecycle: UNRESOLVED_TO_RESOLVED
      canonical_full_capsule: capsules/<capsule_id>/full.json
      bounded_transport: capsules/<capsule_id>/transport.json
      parallel_launcher_owned_canonical_store: PROHIBITED

    bridge:
      implementation: tooling/delivery/Cerebro.StandardDiagnosticBridge.ps1
      role: STANDARD_RUNNER_TO_CANONICAL_DIAGNOSTIC_ADAPTER
      diagnostic_capture_failure_masks_primary_failure: false
      fallback_seed_outside_source_required: true

    user_handoff:
      stable_filename: CEREBRO_PATCH_FAIL.json
      placement: launcher-directory
      content: COPY_OF_CANONICAL_BOUNDED_TRANSPORT
      authority: DERIVED_VIEW
      generated_automatically_on_failure: true
      manual_terminal_copy_required: false
      fallback_when_canonical_capture_unavailable: MINIMAL_FAILURE_SEED

    attempt_history_binding:
      diagnostic_ref: CANONICAL_FULL_CAPSULE
      diagnostic_copy: IMMUTABLE_ATTEMPT_COPY
      stable_handoff_file_is_canonical_history: false

    success_resolution:
      resolve_related_unresolved_capsules: true
      resulting_commit_required: true
      stale_user_handoff_removed_only_after_resolution_success: true
      resolution_failure_invalidates_primary_patch_success: false
      resolved_failure_evidence_deleted: false

    terminal_surface:
      failure: [PATCH FAIL, FAILURE_FAMILY, DIAGNOSTIC_FILE, SOURCE_STATE]
      success: [PATCH SUCCESS, RECEIPT]
      detailed_stacktrace_on_normal_terminal: PROHIBITED

    chat_return:
      success_trigger: PATCH SUCCESS
      failure_trigger: PATCH FAIL
      failure_attachment: CEREBRO_PATCH_FAIL.json
      manual_error_paste: PROHIBITED

  success_handoff:
    status: REQUIRED
    principle: MACHINE_VALIDATES_AND_TRANSPORTS_SUCCESS_EVIDENCE_BEFORE_USER_HANDOFF
    canonical_receipt_authority: D:\Cerebro\Run\receipts
    validation_owner: canonical-launcher
    receipt_protocol:
      target_runtime_field: TARGET_RUNTIME_RECEIPT
      delivery_kernel_field: DELIVERY_RECEIPT
      legacy_human_display_field: RECEIPT
      launcher_consumes_only: DELIVERY_RECEIPT
      delivery_receipt_cardinality: EXACTLY_ONE
      composition_contract_ref: standards/machine-contract-composition.yaml
    required_validation:
      - receipt-schema-and-result
      - patch-and-attempt-identity
      - authoritative-and-working-commit-equality
      - clean-working-tree
      - cerebro-sync-executed-and-verified
      - recovery-snapshot-presence-and-archive-hash
    user_transport:
      stable_filename: CEREBRO_PATCH_SUCCESS.json
      placement: launcher-directory
      authority: DERIVED_BYTE_IDENTICAL_VIEW
      generated_automatically_on-success: true
      manual-copy-command-required: false
      terminal_pointer: UPLOAD_FILE
    post_sync_transport_failure:
      invalidates-primary-patch-success: false
      source-rollback: PROHIBITED
      terminal_state: PATCH_SUCCESS_SUCCESS_HANDOFF_FAIL
    terminal_surface:
      required:
        - PATCH_SUCCESS
        - CEREBRO_SYNC_VERIFIED
        - AUTHORITATIVE_SOURCE_EQUALS_WORKING_SOURCE
        - RESULT_COMMIT
        - RECEIPT
        - UPLOAD_FILE

  attempt_history:
    contract: standards/patch-attempt-history.yaml
    implementation_owner: canonical-launcher
    every_execution_recorded: true
    pass_and_fail_retained: true
    attempt_id_propagated_to_kernel: true
    success_transport_ref_recorded: true

  active_source_integrity_closure:
    contract: standards/active-source-closure.yaml#patch_close_integrity_closure
    implementation: tooling/validator/Cerebro.ActiveSourceIntegrityClosure.ps1
    deterministic_validator: tooling/validator/cerebro_active_source_closure.ps1
    required_before_contract_activation_closure: true
    required_before_canonical_sync: true
    history_excluded_from_active_set: true
    full_system_release_closure_on_standard_patch_path: false

  activation_closure:
    contract: standards/contract-activation-closure.yaml
    contract_version: "2.0"
    validator: tooling/validator/cerebro_contract_activation_closure.ps1
    strict_gate_before_sync: true
    classification_coverage: ALL_REQUIRED_STANDARDS
    contract_granularity: CONTRACT_LEVEL
    strict_operational_chain: true
    canonical_conflict_detection: true
    known_activation_debt_may_be_nonblocking_when_explicitly_classified: true
    reference_existence_alone_proves_operational: false
    runtime_execution_evidence_axis: SEPARATE
    inventory_output: D:\Cerebro\Run\Evidence\Audits\CEREBRO_CONTRACT_ACTIVATION_AUDIT.json

  assurance:
    existing_contract: standards/development/powershell-level3-delivery-assurance.yaml
    regression_contract: standards/development/delivery-failure-regression.yaml
