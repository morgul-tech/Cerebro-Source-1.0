schema: cerebro-patch-attempt-history/v1
patch_attempt_history:
  id: CEREBRO-PATCH-ATTEMPT-HISTORY-001
  version: "1.2"
  status: ACTIVE
  authority: Cerebro Source 1.0
  scope: SYSTEM_WIDE_STANDARD_DELIVERY

  purpose: >
    Preserve every STANDARD patch execution attempt, successful or failed, as
    immutable evidence so delivery quality, recurring failure families and
    corrective effectiveness can be analyzed over time.

  canonical_root: D:\Cerebro\Run\Evidence\Attempts

  identity:
    generated_before:
    - bundle-verification
    - selftest
    - Source-preflight
    format: UTC_TIMESTAMP_GUID
    one_user_execution_equals_one_attempt: true
    propagated_to_kernel: true

  attempt_directory:
    required:
    - attempt.json
    - events.jsonl
    conditional:
    - receipt.json
    - diagnostic.json

  event_model:
    append_only: true
    required_event_fields:
    - attempt_id
    - timestamp_utc
    - event
    canonical_events:
    - ATTEMPT_STARTED
    - BUNDLE_VERIFIED
    - SELFTEST_STARTED
    - SELFTEST_PASS
    - APPLY_STARTED
    - APPLY_PASS
    - ATTEMPT_PASS
    - ATTEMPT_FAIL

  terminal_record:
    written_for_every_attempt: true
    required_fields:
    - attempt_id
    - patch_id
    - started_at_utc
    - completed_at_utc
    - duration_ms
    - result
    - expected_base_commit
    - start_commit
    - result_commit
    - working_tree_result
    - failed_phase
    - reached_stage
    - failure_family
    - source_mutation_assessment
    - receipt_ref
    - success_transport_ref
    - diagnostic_ref
    - bundle_sha256
    - kernel_sha256

  diagnostic_evidence:
    canonical_authority: tooling/host/diagnostic_capsule.py
    diagnostic_ref_on_failure: CANONICAL_FULL_CAPSULE_PATH
    diagnostic_copy_in_attempt_directory: IMMUTABLE_COPY
    launcher_directory_CEREBRO_PATCH_FAIL_json: BOUNDED_TRANSPORT_VIEW_ONLY
    canonical_capsule_resolution_does_not_delete_attempt_history: true

  retention:
    successful_attempts: PERMANENT
    failed_attempts: PERMANENT
    overwrite_existing_attempt: PROHIBITED
    delete_prior_failure_on_later_success: PROHIBITED
    launcher_directory_failure_handoff_is_transport_only: true
    launcher_directory_success_handoff_is_transport_only: true

  success_transport:
    canonical_receipt_remains: D:\Cerebro\Run\receipts
    stable_transport_filename: CEREBRO_PATCH_SUCCESS.json
    byte_identity_required: true
    attempt_record_field: success_transport_ref
    overwrite_of_transport_view_does_not-delete-canonical-history: true

  analysis:
    group_by_patch_id: true
    supports:
    - attempt-count
    - time-to-pass
    - failure-family-frequency
    - reached-stage-frequency
    - known-failure-recurrence
    - corrective-revision-effectiveness
    - success-rate
    - activation-gap-correlation

  invariant: EVERY_PATCH_EXECUTION_BECOMES_PERMANENT_ATTEMPT_EVIDENCE
