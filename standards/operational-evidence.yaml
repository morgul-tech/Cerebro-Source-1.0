schema: cerebro-standard/v0.1
standard:
  id: STD-OPERATIONAL-EVIDENCE
  name: Cerebro Operational Evidence Standard
  version: 0.2.0
  status: approved
  authority: authoritative
  scope: Bounded machine-readable operational evidence for control, change, delivery, validation, diagnostics, recovery, and learning.
  consumers:
    - mcp
    - context-engine
    - quality-gate
    - change-engine
    - delivery-controller
    - validator
    - diagnostics

authority:
  definitional_authority: Cerebro Source 1.0
  evidence_authority: EVIDENCE_ONLY
  evidence_is_runtime_or_derived_state: true
  evidence_creates_source_authority: false
  evidence_creates_policy_authority: false

evidence_envelope:
  schema_id: cerebro-operational-evidence/v0.1
  required_fields:
    - evidence_id
    - evidence_kind
    - subject_ref
    - probe_ref
    - status
    - result
    - value
    - source
    - observed_at
    - freshness
    - confidence
    - sensitivity
    - redaction
    - error
    - basis_refs
    - producer_ref
  evidence_kinds:
    - STATE_OBSERVATION
    - PROBE_RESULT
    - VERIFICATION_RESULT
    - PROCESS_OBSERVATION
    - DELIVERY_OBSERVATION
    - DIAGNOSTIC_OBSERVATION
    - DERIVED_ASSESSMENT
  status_values:
    COMPLETE: probe_or_acquisition_completed_for_declared_scope
    PARTIAL: usable_subset_obtained_but_declared_scope_not_complete
    UNAVAILABLE: required_source_or_probe_not_available
    ERROR: probe_or_acquisition_failed
  result_values:
    PASS: observed_condition_matches_declared_expectation
    FAIL: observed_condition_conflicts_with_declared_expectation
    UNKNOWN: evidence_does_not_resolve_the_declared_question
    NOT_APPLICABLE: probe_is_not_relevant_to_the_declared_subject_or_scope
  null_semantics:
    value_may_be_null_when:
      - status_is_UNAVAILABLE
      - status_is_ERROR
      - result_is_UNKNOWN
      - result_is_NOT_APPLICABLE
    missing_or_null_value_is_not_implicit_FAIL: true

probe_contract:
  probe_definition_requires:
    - probe_ref
    - question
    - subject_scope
    - acquisition_method
    - expected_value_or_condition_when_applicable
    - freshness_policy
    - sensitivity_policy
    - failure_behavior
  observations:
    preserve_expected_and_observed_separately: true
    preserve_raw_error_bounded: true
    probe_execution_failure_is_not_subject_failure: true
    one_probe_failure_does_not_discard_successful_sibling_probes: true

freshness:
  principle: FRESHNESS_IS_STATE_AWARE_NOT_TIME_ONLY
  required_fields:
    - freshness_kind
    - basis_fingerprint
    - invalidation_triggers
  kinds:
    IMMUTABLE:
      example: exact_commit_or_content_hash
      expires_by_elapsed_time: false
    STATE_BOUND:
      invalidated_by: relevant_subject_state_change
    REMOTE_HEAD:
      refresh_before:
        - material_write
        - publication
        - authority_claim
    TIME_BOUND:
      allowed_when: evidence_is_inherently_time_sensitive
      expires_at_required: true
  stale_evidence_effect:
    - DO_NOT_TREAT_AS_CURRENT
    - REACQUIRE_IF_MATERIAL
    - PRESERVE_AS_HISTORICAL_EVIDENCE_WHEN_USEFUL

confidence:
  values:
    - VERIFIED
    - STRONG
    - MODERATE
    - LOW
    - UNKNOWN
  principle: CONFIDENCE_DESCRIBES_EVIDENCE_SUPPORT_NOT_SOURCE_AUTHORITY
  constraints:
    - confidence_must_not_override_governing_authority
    - repeated_identical_observation_is_not_independent_confirmation
    - independent_poststate_verification_may_strengthen_confidence

sufficiency:
  assessment_values:
    COMPLETE: all_required_evidence_for_the_declared_question_is_current_and_usable
    PARTIAL: some_required_evidence_is_current_and_usable_but_not_all
    INSUFFICIENT: available_evidence_cannot_support_the_required_decision_or_claim
    FAILED: acquisition_process_failed_without_a_usable_minimum_evidence_set
  relative_to:
    - decision_ref
    - verification_requirement
    - recovery_question
    - diagnostic_question
  invariants:
    - MISSING_EVIDENCE_IS_NOT_NEGATIVE_EVIDENCE
    - PARTIAL_EVIDENCE_MAY_REMAIN_USEFUL
    - MATERIAL_DECISION_REQUIRES_ITS_DECLARED_MINIMUM_EVIDENCE_SET
    - MORE_DATA_IS_NOT_BETTER_WHEN_SUFFICIENCY_IS_ALREADY_REACHED

blind_claim_observation_closure_profile:
  purpose: Bound strong blindness-dependent claims to exact current independent observation-closure evidence without changing the evidence envelope schema.
  reuses_evidence_envelope_schema: cerebro-operational-evidence/v0.1
  schema_bump_required: false
  evidence_kind: VERIFICATION_RESULT
  probe_ref: OBSERVATION_CLOSURE
  required_status: COMPLETE
  required_result: PASS
  exact_subject_binding:
    required_fields:
      - claim_ref
      - arm_ref
      - generation_ref
    wrong_subject_effect: INVALID_FOR_STRONG_BLIND_CLAIM
  freshness:
    required_kind: STATE_BOUND
    exact_current_basis_fingerprint_required: true
    stale_effect: HOLD
  value_method_floor:
    PREEXPOSURE_CONFIG_SEAL: PASS
    INDEPENDENT_NEGATIVE_CANARIES: PASS
    CONTENT_EXPOSURE_GATE: PASS
    POSTRUN_CONFORMANCE_READBACK: PASS
  producer_independence:
    producer_ref_required: true
    independent_of:
      - evaluated_actor
      - builder
      - self_certifier
    explicit_independence_verification_required: true
    repeated_identical_observation_is_independent_confirmation: false
  basis_refs_must_preserve:
    - PREEXPOSURE_CONFIG_SEAL
    - INDEPENDENT_NEGATIVE_CANARIES
    - CONTENT_EXPOSURE_GATE
    - POSTRUN_CONFORMANCE_READBACK
  nonpass_handling:
    statuses:
      - PARTIAL
      - UNAVAILABLE
      - ERROR
    results:
      - UNKNOWN
      - FAIL
    effect:
      - HOLD
      - INVALID_FOR_STRONG_BLIND_CLAIM
    blocker: required_observation_closure_evidence_absent_or_nonpass_for_blindness_dependent_claim
    preserve_historical_observations: true
  contamination:
    preseal_material_exposure_effect: CONTAMINATED
    in_place_repair_allowed: false
    fresh_arm_or_generation_required: true
  infrastructure_boundary:
    airlock_infrastructure_is_policy_authority: false
    absence_blocks_pass_when_required: true
  claim_scope_boundary:
    valid_observations_may_support_narrower_nonblind_conclusions: true
    quality_gate_pass_may_substitute_for_observation_closure: false

progressive_acquisition:
  default_mode: PROGRESSIVE
  stages:
    - CORE
    - TARGETED_EXPANSION
    - DEEP
  default_stage: CORE
  expand_when:
    - current_evidence_is_insufficient_for_material_control_resolution
    - unresolved_uncertainty_can_change_the_next_action
    - independent_cross_validation_is_required
  stop_when:
    - declared_sufficiency_is_reached
    - additional_collection_has_low_expected_decision_value
    - privacy_or_authority_boundary_blocks_further_collection
  user_role: USER_IS_NOT_DEFAULT_DIAGNOSTIC_CONTROLLER

privacy_and_redaction:
  minimization: COLLECT_ONLY_EVIDENCE_RELEVANT_TO_THE_DECLARED_QUESTION
  sensitivity_values:
    - PUBLIC
    - INTERNAL
    - SENSITIVE
    - SECRET
  redaction_modes:
    - NONE
    - MASK
    - HASH
    - SUMMARY
    - OMIT
  prohibited_in_chat_transport:
    - credentials
    - authentication_tokens
    - private_keys
    - unbounded_environment_dumps
    - SECRET_values
  bounded_transport:
    full_artifact_may_remain_local: true
    chat_or_handoff_envelope: BOUNDED_REDACTED_MACHINE_RELEVANT
    preserve_reference_to_full_artifact_when_available: true

diagnostic_capsule_contract:
  introduced_by: PATCH-007.PRE-004
  status: ACTIVE
  artifact_kind: ARTIFACT
  content_kind: EVIDENCE
  authority: EVIDENCE_ONLY
  implementation_ref: tooling/host/diagnostic_capsule.py
  purpose:
    - persist_failure_evidence_before_operation_exit
    - remove_user_from_failure_reconstruction_and_log_selection
    - rehydrate_unresolved_failure_context_automatically
    - provide_one_evidence_source_for_recovery_and_later_failure_learning
  local_store:
    authority: RUNTIME_DERIVED
    default_root: LOCALAPPDATA/Cerebro/diagnostics
    source_mutation: PROHIBITED
    structure:
      registry: registry.json
      active_pointer: active.json
      capsules: capsules/<capsule_id>/
      full_capsule: full.json
      bounded_transport: transport.json
      fallback_inbox: inbox/
    persistence:
      atomic_metadata_writes: true
      unresolved_capsules_are_retained: true
      resolved_capsules_retain_repair_traceability: true
  capsule:
    schema_id: cerebro-diagnostic-capsule/v0.1
    lifecycle:
      - UNRESOLVED
      - RESOLVED
    core_fields:
      - capsule_id
      - subject
      - failure
      - execution
      - repository_observation
      - artifacts
      - acquisition
      - evidence_refs
      - privacy
      - resolution
    failure_separation:
      probe_status_is_distinct_from_subject_result: true
      detection_is_not_root_cause: true
      diagnostic_capture_failure_does_not_replace_primary_failure: true
  automatic_capture:
    applies_to:
      - STANDARD_local_runner_failure
      - Host_supervised_operation_failure
      - Change_or_Delivery_failure_when_execution_context_is_available
    required_before_failure_exit_when_possible: true
    runner_seed_is_machine_readable: true
    canonical_synthesis_reads_working_source_only: true
    canonical_synthesis_mutates_working_source: false
    fallback:
      when_diagnostic_tool_is_unavailable_or_fails: persist_minimal_seed_outside_source
      primary_failure_remains_terminal_failure: true
  automatic_rehydration:
    owner: tooling.host
    before_delegated_cerebro_operation: true
    active_unresolved_capsule_is_loaded: true
    environment_binding:
      - CEREBRO_DIAGNOSTIC_CONTEXT_STATUS
      - CEREBRO_ACTIVE_DIAGNOSTIC_CAPSULE
      - CEREBRO_ACTIVE_DIAGNOSTIC_ID
      - CEREBRO_ACTIVE_DIAGNOSTIC_FINGERPRINT
    consumer_behavior:
      - treat_as_evidence_basis_not_policy
      - preserve_when_related_to_current_operation
      - PRE_005_may_bind_relevant_learning_and_regressions
  progressive_acquisition:
    CORE:
      - failure_stage_and_detection
      - bounded_exception_and_stack
      - exit_status_when_available
      - mutation_sync_backup_state
      - exact_local_head_and_branch
      - remote_main_head_when_available
      - machine_parsed_changed_paths
      - diff_check
      - launcher_bundle_manifest_identity_when_supplied
      - exact_operation_journal_ref_when_supplied
      - runner_transcript_when_explicitly_available
    TARGETED_EXPANSION:
      - probes_needed_to_resolve_specific_mismatch_or_failure_family
    DEEP:
      - bounded_additional_artifacts_when_material_uncertainty_remains
  transport:
    full_local_capsule_is_primary_machine_evidence: true
    bounded_transport_is_derived_view_of_same_capsule: true
    direct_machine_bridge_is_preferred_when_available: true
    human_copy_or_paste_is_fallback_transport_only: true
    user_interpretation_or_log_selection_required: false
    full_capsule_in_chat_by_default: false
  privacy:
    collect_environment_dump: false
    redact_secret_key_names: true
    redact_known_token_patterns: true
    bounded_text: true
    full_local_capsule_is_still_minimized: true
  resolution:
    successful_related_repair_may_mark_capsules_RESOLVED: true
    resolution_requires_resulting_commit: true
    resolution_does_not_delete_failure_evidence: true
  invariants:
    - PATCH_FAILURE_MUST_PERSIST_MACHINE_READABLE_EVIDENCE_BEFORE_EXIT_WHEN_POSSIBLE
    - UNRESOLVED_FAILURE_EVIDENCE_MUST_BE_AUTO_REHYDRATED_BEFORE_NEXT_CEREBRO_OPERATION
    - USER_IS_NOT_THE_DIAGNOSTIC_TRANSPORT_PROCESSOR
    - USER_MUST_NOT_RECONSTRUCT_OR_INTERPRET_FAILURE_OUTPUT
    - DIAGNOSTIC_EVIDENCE_IS_NOT_SOURCE_AUTHORITY
    - DIAGNOSTICS_CLASSIFY_AND_PRESERVE_EVIDENCE_BUT_DO_NOT_OWN_RECOVERY_POLICY
    - RESOLVED_FAILURE_RETAINS_TRACEABILITY_TO_REPAIR_AND_RESULTING_COMMIT
    - DIAGNOSTIC_CAPTURE_FAILURE_MUST_NOT_MASK_PRIMARY_OPERATION_FAILURE

mismatch_semantics:
  parent_pattern: EXPECTED_OBSERVED_STATE_MISMATCH
  wisdom_ref: CTX-WISDOM-EXPECTED-OBSERVED-STATE-MISMATCH-001
  invariant: MISMATCH_IS_DETECTION_NOT_ROOT_CAUSE
  mismatch_evidence_must_preserve:
    - expected_value_or_structure
    - observed_value_or_structure
    - comparison_mechanism
    - acquisition_source
  required_followup:
    - CLASSIFY_MISMATCH_DOMAIN
    - IDENTIFY_COMPARISON_OR_PRODUCER_MECHANISM
    - FIND_ROOT_CAUSE_OR_ROOT_PRODUCER
    - BIND_MACHINE_ENFORCEABLE_LEARNING_WHEN_AVAILABLE

rules:
  - id: STD-OP-EVID-R001
    statement: Operational evidence shall remain derived EVIDENCE_ONLY state and shall never create Source or policy authority.
    priority: critical
  - id: STD-OP-EVID-R002
    statement: Every material probe result shall preserve status, result, value, source, freshness, confidence, error, and governing basis references.
    priority: critical
  - id: STD-OP-EVID-R003
    statement: Probe execution failure, unavailable evidence, unknown evidence, and observed subject failure shall remain distinct states.
    priority: critical
  - id: STD-OP-EVID-R004
    statement: Evidence freshness shall be invalidated by relevant state change according to evidence type and shall not be reduced to elapsed time alone.
    priority: critical
  - id: STD-OP-EVID-R005
    statement: Evidence sufficiency shall be assessed relative to the exact decision, verification, recovery, or diagnostic question being resolved.
    priority: critical
  - id: STD-OP-EVID-R006
    statement: Missing evidence shall not be interpreted as negative evidence, and partial evidence shall preserve every independently usable successful observation.
    priority: critical
  - id: STD-OP-EVID-R007
    statement: Evidence acquisition shall begin with the smallest sufficient CORE set and expand only when additional evidence can materially change resolution.
    priority: high
  - id: STD-OP-EVID-R008
    statement: Privacy minimization and redaction shall occur before evidence crosses a human or transport boundary.
    priority: critical
  - id: STD-OP-EVID-R009
    statement: Credentials, authentication tokens, private keys, SECRET values, and unbounded environment dumps shall not enter the bounded chat transport envelope.
    priority: critical
  - id: STD-OP-EVID-R010
    statement: A detected expected-observed mismatch shall preserve both sides of the comparison and trigger root-producer analysis rather than terminate diagnosis at the mismatch label.
    priority: critical
  - id: STD-OP-EVID-R011
    statement: Repeated identical observations shall not be counted as independent confirmation.
    priority: high
  - id: STD-OP-EVID-R012
    statement: Evidence collection shall stop when declared sufficiency is reached unless a governing contract explicitly requires stronger independent verification.
    priority: high
