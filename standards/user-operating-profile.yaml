schema: cerebro-user-operating-profile-standard/v0.1

user_operating_profile:
  id: CEREBRO-USER-OPERATING-PROFILE-001
  version: "0.3"
  status: ACTIVE
  introduced_by: PATCH-005
  kind: CONFIGURATION

  definition: >
    User-owned persistent configuration describing stable preferences for how
    Cerebro collaborates, steers work, presents information, and involves the user.

  authority:
    authority_owner: USER
    operational_steward: interaction
    source_defines_mechanism: true
    source_owns_values: false
    profile_creates_source_authority: false

  storage:
    global_default: D:\Cerebro\User\user-operating-profile.json
    project_pattern: D:\Cerebro\User\projects\<project-id>.json
    session_task_overlay_persistent: false

  precedence:
    - HARD_SYSTEM_AUTHORITY
    - CURRENT_EXPLICIT_USER_INSTRUCTION
    - SESSION_TASK_OVERLAY
    - PROJECT_USER_PROFILE
    - GLOBAL_USER_PROFILE
    - CEREBRO_DEFAULT

  profile_states:
    - PROFILE_LOADED
    - PROFILE_ABSENT
    - PROFILE_DEGRADED

  preference_domains:
    - COLLABORATION
    - CONTROL_STEERING
    - DECISION_INTERACTION
    - INFORMATION
    - PRESENTATION
    - VISUALIZATION
    - DEVELOPMENT_WORKFORM
    - DELIVERY_ARTIFACT
    - TERMINOLOGY_COMMUNICATION
    - PROGRESS_STATUS
    - CORRECTION_LEARNING
    - RESOURCE_EFFICIENCY

  canonical_preferences:
    INFORMATION.REPETITION_POLICY:
      allowed_values:
        - DELTA_FIRST_REFERENCE_RICH
        - FULL_RECAP_ON_REQUEST
      meaning: Preserve important information while avoiding repeated restatement of unchanged context.
    PRESENTATION.NEXT_ACTION_COMMAND_SURFACE:
      allowed_values:
        - SHORT_HUMAN_TRIGGER_2_5_WORDS
      meaning: Present the normal next Cerebro action as a 2-5 word human-readable trigger while preserving the complete canonical command and continuation semantics in Cerebro-owned state; exact shell, API, or debug syntax remains an explicit Human Continuation Surface exception.
    DELIVERY_ARTIFACT.STANDARD_EXECUTION_OWNER:
      allowed_values:
        - USER_LOCAL_RUNNER
      meaning: Under STANDARD the user executes the supplied local runner and the agent does not request local access.
    DELIVERY_ARTIFACT.STANDARD_DELIVERY_LAYOUT:
      allowed_values:
        - PAYLOAD_PLUS_INSTALLER
      canonical_value: PAYLOAD_PLUS_INSTALLER
      compatibility_only: true
      governing_effect: NONE
      meaning: Compatibility key for internal STANDARD payload composition; it cannot alter the fixed user handoff of one ZIP, one launcher and one command.
    DELIVERY_ARTIFACT.STANDARD_ARTIFACT_FORMAT:
      allowed_values:
        - PAYLOAD_PLUS_INSTALLER
        - SELF_EXTRACTING_POWERSHELL
      canonical_value: PAYLOAD_PLUS_INSTALLER
      legacy_value: SELF_EXTRACTING_POWERSHELL
      compatibility_only: true
      governing_effect: NONE
      meaning: Compatibility key for legacy/internal artifact semantics; it cannot select or override the STANDARD user handoff.
    DELIVERY_ARTIFACT.STANDARD_LAUNCH_SURFACE:
      allowed_values:
        - SHORT_COPYABLE_COMMAND
      meaning: The normal user terminal surface starts the installer; implementation logic is not normally placed in the launch command.
    DELIVERY_ARTIFACT.STANDARD_ARTIFACT_SURFACE_POLICY:
      allowed_values:
        - LEAST_INTRUSIVE_CAPABLE_SURFACE
      meaning: File production and delivery use the least intrusive currently capable artifact surface and do not imply Work mode.
    DELIVERY_ARTIFACT.DIRECT_INLINE_EXECUTION_POLICY:
      allowed_values:
        - EXCEPTION_ONLY
      meaning: Direct implementation code in terminal is reserved for explicit request, diagnosis, bootstrap, bounded recovery, invocation, or a proven artifact-surface limitation.
    DELIVERY_ARTIFACT.STANDARD_AGENT_ACCESS_REQUEST_BUDGET:
      allowed_values:
        - 0
      meaning: A STANDARD task must be designed to complete without an agent platform-access dialog.
    RESOURCE_EFFICIENCY.USER_LIMIT_POLICY:
      allowed_values:
        - CONSERVE
        - BALANCED
      meaning: Treat the user's included agentic usage as an explicit planning resource.
    RESOURCE_EFFICIENCY.PRIMARY_TIME_METRIC:
      allowed_values:
        - HUMAN_TIME_TO_AVAILABLE_RESULT
      meaning: Measure elapsed time from user command until the result is visible and actionable for the user.

  usage_budget_observation:
    runtime_state_default: D:\Cerebro\Run\usage\USER_LIMIT_OBSERVATION.json
    telemetry_authority: USER_VISIBLE_OPENAI_USAGE_DASHBOARD
    agent_direct_meter_access: false
    required_fields:
      - observed_at
      - remaining_percent
      - reset_label
      - evidence_origin
      - freshness
    agent_estimate_authority: NON_AUTHORITATIVE
    conservation_controls:
      - eliminate-repeated-access-dialogs
      - prefer-delta-context-over-full-recap
      - bound-tool-output-to-decision-value
      - do-not-create-subagents-without-explicit-need
      - avoid-duplicate-tests-without-new-discriminating-value
      - use-smaller-model-when-user-selects-it-for-routine-work
    thresholds:
      GREEN: remaining_percent_greater_than_or_equal_to_50
      AMBER: remaining_percent_25_through_49
      RED: remaining_percent_less_than_25
    invariant: OBSERVED_PERCENTAGE_MUST_NOT_BE_INFERRED_FROM_AGENT_ACTIVITY

  identity_and_authorization_separation:
    user_preference_is_identity_proof: false
    user_preference_may_grant_admin: false
    future_roles:
      - GUEST
      - USER
      - ADMIN
    admin_assignment_requires:
      - verified-principal-identity
      - dedicated-authorization-contract
      - auditable-role-binding
    rationale: A stored preference can describe collaboration behavior but must not become an authentication or privilege-escalation mechanism.

  promotion:
    explicit_stable_user_preference: GLOBAL_ALLOWED
    explicit_project_preference: PROJECT_ALLOWED
    temporary_instruction: SESSION_TASK_ONLY
    repeated_pattern: CANDIDATE_ONLY
    assistant_inference_alone: PERSISTENCE_PROHIBITED

  user_controls:
    - VIEW
    - SET
    - CORRECT
    - REVOKE
    - RESET
    - SCOPE

  invariants:
    - stable-explicit-preference-persists-across-conversations
    - current-explicit-user-instruction-overrides-stored-preference-in-scope
    - inference-alone-cannot-silently-become-strong-persistent-preference
    - revoked-or-superseded-preference-is-not-effective
    - user-can-inspect-correct-and-revoke
    - scope-expansion-requires-user-evidence
    - profile-failure-does-not-change-Source-or-project-authority
    - PROFILE_DEGRADED-must-not-be-reported-as-PROFILE_LOADED
    - preference-storage-must-not-grant-or-escalate-authorization
    - standard-delivery-defaults-to-payload-plus-installer
    - standard-user-handoff-is-system-defined-and-not-profile-overridable
    - artifact-delivery-does-not-imply-work-mode
    - direct-inline-implementation-is-exception-not-default
