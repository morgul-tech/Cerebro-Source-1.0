schema: cerebro-active-source-closure/v0.2

active_source_closure:
  id: CEREBRO-ACTIVE-SOURCE-CLOSURE-001
  version: "0.2"
  status: ACTIVE
  introduced_by: PATCH-005
  kind: STANDARD

  purpose: >
    Ensure that active Source represents the current Cerebro system rather than
    an accumulation of obsolete patch scaffolding, superseded references,
    expired temporary structures, or stale generated metadata.

  scope:
    active_source: true
    history: immutable_reference_not_rewritten
    generated_artifacts: freshness_checked_when_explicitly_used_as_active_input
    patch_close_and_full_system_release_closure_are_distinct: true

  active_definition_requirements:
    - canonical_identity
    - valid_system_kind
    - authority_owner
    - operational_steward_when_applicable
    - lifecycle_state
    - active_reference_integrity

  lifecycle_states: [ACTIVE, TEMPORARY, DEPRECATED, SUPERSEDED, HISTORICAL]

  temporary_definition_contract:
    required_fields: [introduced_by, reason, owner, replacement_condition, retirement_trigger]
    at_least_one_review_bound: [latest_allowed_milestone, review_trigger]
    expired_effect: VALIDATION_FAILURE

  supersession:
    active_reference_to_superseded_definition: PROHIBITED
    superseded_definition_may_remain_in_history: true
    explicit_migration_record_allowed: true

  generated_metadata:
    required_freshness_fields: [source_commit, generated_from]
    active_authority: false
    stale_effect: VALIDATION_FAILURE_WHEN_USED_AS_ACTIVE_INPUT
    patch_close_discovery: EXPLICIT_ACTIVE_INPUTS_ONLY

  patch_close_integrity_closure:
    required_before_standard_patch_sync: true
    implementation_ref: tooling/validator/Cerebro.ActiveSourceIntegrityClosure.ps1
    deterministic_validator_ref: tooling/validator/cerebro_active_source_closure.ps1
    active_set:
      source: git-tracked-current-Source
      history_prefix: history/
      history_in_active_set: PROHIBITED
      text_source_extensions: [.yaml, .yml, .json, .ps1, .py, .md, .txt, .toml, .ini, .cfg, .csv]
      empty_active_set: VALIDATION_FAILURE
    checks:
      - expired_temporary_definition
      - active_reference_to_superseded_path
      - duplicate_canonical_definition_key
      - prohibited_active_legacy_path
      - explicit-active-generated-metadata-freshness
    mutation_allowed: false
    release_repository_required: false
    release_evidence_required: false
    failure_effect: BLOCK_BEFORE_CANONICAL_SYNC

  full_system_release_closure:
    implementation_ref: tooling/closure/closure_engine.py
    trigger_scope: [system-closure, release-closure, milestone-closure]
    ordinary_standard_patch_close_trigger: false
    required_repository_state:
      - source-clean-and-origin-main-aligned
      - release-clean-and-origin-main-aligned
    required_evidence:
      - stability-gate
      - quality-gate
      - publication-gate
      - operational-verification
      - final-learning-consolidation
      - internal-control-review
      - roadmap-reconciliation
    evidence_identity: sha256-required
    mutation_allowed: false

  deterministic_validator:
    implementation_ref: tooling/validator/cerebro_active_source_closure.ps1
    role: LOW_LEVEL_SOURCE_INTEGRITY_VALIDATOR

  patch_005_prohibited_active_paths:
    - engines/dialog/
    - engines/collaboration/
    - modules/core-rules/
    - tooling/loader/
    - standards/runtime/handboot-runtime-state-schema.yaml

  invariants:
    - active-Source-describes-current-system
    - history-is-not-rewritten-to-fake-currentness
    - generated-metadata-never-becomes-Source-authority
    - STANDARD-patch-close-requires-lightweight-Source-integrity-closure
    - full-system-release-closure-is-not-on-ordinary-patch-critical-path
    - deterministic-checks-do-not-claim-semantic-fuzzy-coherence
    - semantic-coherence-remains-Quality-and-Decision-Assurance-responsibility
