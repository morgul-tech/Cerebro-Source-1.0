schema: cerebro-human-continuation-surface/v0.1

human_continuation_surface:
  id: CEREBRO-HUMAN-CONTINUATION-SURFACE-001
  version: "0.5"
  status: ACTIVE
  authority: Cerebro Source 1.0
  introduced_by: GUARDRAILS-001

  purpose: >
    Keep the human-facing continuation command short and usable while preserving
    all authoritative continuation state in Cerebro-owned state and resolving the
    short command deterministically before execution.

  principle: USER_COMMAND_IS_A_TRIGGER_NOT_AN_INFORMATION_CONTAINER

  authority_and_precedence:
    class: HARD_SYSTEM_INVARIANT
    cannot_be_weakened_by:
      - presentation-profile
      - response-length-preference
      - user-operating-profile
      - machine-convenience
      - prior-long-form-continuation-pattern
    exact-shell-API-or-debug-exceptions_change_surface_only: true
    exceptions_do_not_transfer_continuation_state_to_user: true

  applicability:
    required_when: REAL_HUMAN_ACTION_IS_NEXT
    boundary_authority: MCP_CONTROL_DECISION
    not_applicable_when:
      - next-authorized-step-is-internally-executable
      - no-user-owned-fact-choice-authorization-safety-or-local-execution-is-required
    internally_executable_effect: CONTINUE_AUTONOMOUSLY

  human_action_surface:
    normal_word_budget:
      min: 2
      max: 5
    requirements:
      - shortest-unambiguous-human-facing-canonical-alias
      - copyable
      - action-oriented
      - no-authoritative-payload-transport
      - no-chat-memory-dependency
    long_form_allowed_only_when:
      - exact-shell-syntax-is-the-human-action
      - exact-API-or-debug-payload-is-required
      - user-explicitly-requests-full-form

  exact_shell_execution_handoff:
    schema: cerebro-human-execution-handoff/v1
    profile: HASH_BOUND_POWERSHELL
    applies_when: EXACT_LOCAL_SHELL_SYNTAX_IS_THE_HUMAN_ACTION
    generator_and_validator: tooling/validator/human_execution_handoff.py
    runtime_consumer: tooling/delivery/Cerebro.StandardDeliveryLauncher.ps1
    invariant: GENERATED_VISIBLE_COMMAND_AND_CONSUMED_ARTIFACT_IDENTITY_MUST_MATCH
    requirements:
      - visible-command-is-generated-not-hand-authored
      - launcher-and-bundle-resolve-by-exact-sha256-with-unique-cardinality
      - visible-command-does-not-depend-on-artifact-filenames
      - visible-command-uses-an-underscore-free-transport-profile
      - generated-envelope-binds-launcher-bundle-profile-and-fingerprint-parameter
      - response-candidate-contains-exactly-one-terminal-powershell-surface
      - launcher-recomputes-fingerprint-from-its-own-bytes-and-actual-bundle-before-Source-mutation
      - known-markdown-backslash-underscore-filename-escape-canary-is-rejected
    failure_effect: BLOCK_HANDOFF_OR_FAIL_BEFORE_SOURCE_MUTATION
    host_boundary: >
      Source cannot universally intercept every external chat renderer or clipboard.
      The canonical surface therefore avoids literal artifact filenames and binds
      the actual files at the runtime consumer by content identity.

  binding_contract:
    schema: cerebro-human-continuation-binding/v1
    active_registry: engines/context/continuation-bindings.json
    validator: tooling/validator/continuation_surface_validation.py
    universal_state_candidate:
      service_contract_ref: standards/control-context-state-service.yaml
      aggregate_schema_ref: engines/context/control-context-state.schema.json
      binding_scope: CONTROL_SESSION
      one_global_binding_across_conversations: PROHIBITED
      migration_status: CANDIDATE_NOT_HOST_OR_REMOTE_SERVICE_ACTIVATED
      current_active_registry_remains_governing_until_activation_proof: true
    required_fields:
      - alias
      - target_ref
      - operation
      - current_basis_ref
      - full_payload_ref
      - constraints_refs
      - evidence_refs
      - maturity
      - readiness
      - source_revision
      - required_next_behavior
      - resume_order
      - alternative_paths
      - binding_fingerprint

  response_handoff_gate:
    required_before_every_real_human_boundary_response: true
    machine_consumer: tooling/validator/continuation_surface_validation.py
    normal_surface_requires:
      - active-binding-fingerprint-valid
      - visible-alias-is-2-to-5-words
      - visible-alias-contains-no-machine-payload
      - exactly-one-visible-trigger
      - trigger-is-absolute-response-end
      - full-state-remains-reference-bound
      - active-registry-binding-resolves-and-validates
    failure_effect: BLOCK_RESPONSE_HANDOFF_AND_RERENDER
    declaration_without_machine-consumption_is_not-implemented: true

  resolution:
    sequence:
      - normalize-user-command
      - resolve-active-binding
      - load-current-basis
      - load-full-payload-and-constraints
      - verify-freshness
      - follow-supersession-chain-when-needed
      - auto-rebase-when-unambiguous
      - execute-bound-continuation
    stale_command_behavior:
      unambiguous_successor: AUTO_REBASE
      material_user_choice: USER_DECISION_REQUIRED
      unresolved: BLOCK_WITH_MINIMUM_NECESSARY_CONTEXT

  semantic_losslessness:
    invariant: USER_COMMAND_COMPRESSION_MAY_REDUCE_VISIBLE_TEXT_BUT_MUST_NOT_REDUCE_SEMANTIC_STATE
    prohibited:
      - reconstruct-authoritative-state-from-visible-alias
      - require-user-to-carry-objective-constraints-or-evidence-manually
      - depend-on-conversation-memory-for-cross-session-resume

  multiple_paths:
    rule: ONE_SHORT_COMMAND_PER_GENUINELY_DIFFERENT_USER_PATH
    do_not_create_multiple_paths_when:
      - continuation-is-uniquely-determined
      - mismatch-is-recoverable
      - Cerebro-can-normalize-or-rebase-autonomously

  cross_session:
    sequence:
      - boot
      - load-authoritative-state
      - resolve-short-command
      - resolve-bound-continuation
      - continue
    chat_memory_authority: NONE
    candidate_focus_semantics:
      shared_project_tree: true
      active_context_and_continuation_are_per_control_session: true
      one_chat_may_move_another_chats_continuation: false

  standard_delivery_binding:
    contract_ref: standards/change-delivery.yaml
    STANDARD:
      user_handoff:
        - exactly-one-bundle-zip
        - exactly-one-launcher-powershell
        - exactly-one-short-copyable-local-shell-command
      human_boundary_is_not_blocker: true
      autonomous_behavior: BUILD_TO_REQUIRED_HUMAN_EXECUTION_BOUNDARY
      prohibited:
        - stop-early-because-agent-cannot-run-users-local-powershell
        - substitute-direct-GitHub-mutation-for-local-Working-Source-delivery
        - improvise-alternate-handoff-when-contract-is-applicable

  invariants:
    - short-command-is-not-authoritative-state
    - full-state-remains-Cerebro-owned
    - applicable-contract-is-resolved-before-general-tool-reasoning
    - human-boundary-is-presented-not-misclassified-as-system-blocker
    - no-human-continuation-surface-without-real-human-boundary
    - human-does-not-encode-machine-continuation-payload
    - normal-trigger-is-2-to-5-words-not-a-compressed-machine-command
    - response-handoff-blocks-until-the-active-binding-and-visible-trigger-match
    - exact-shell-handoff-is-generated-hash-bound-and-runtime-consumed
    - rendered-intent-alone-is-not-proof-of-delivered-copy-surface
  terminal_project_roadmap_projection_gate:
    contract_ref: standards/project-terminal-roadmap-projection.yaml
    applies_when: PROJECT_ENGINEERING_TERMINAL_BOUNDARY
    normal_consumer: tooling/validator/continuation_surface_validation.py
    required_before:
      - CONTINUATION_HANDOFF
      - TERMINAL_COMPLETION_CLAIM
    required_candidate_fields:
      - terminal_project_ref
      - roadmap_projection_receipt
    receipt_schema: cerebro-project-terminal-roadmap-projection-receipt/v1
    fail_closed_if:
      - receipt_missing
      - receipt_not_PASS
      - project_ref_mismatch
      - projection_basis_mismatch
      - source_revision_mismatch
      - provider_readback_not_verified
      - stable_identity_not_verified
    pdf_authority: NONE
