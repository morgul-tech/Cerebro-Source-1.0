schema: cerebro-handboot/v0.1

handboot:
  id: CEREBRO-HANDBOOT-001
  introduced_by: PATCH-002.PRE-003
  title: controlled_boot_and_handoff_initialization
  status: LOCKED
  maturity: OPERATIONAL_MINIMUM
  delivery_level: 3

  purpose: >
    Initialize a fresh controlled Cerebro environment from local Working
    Source, verify that Working Source is aligned with the sole authoritative
    Source, activate a derived runtime, and process a valid session handoff
    only after Cerebro activation has succeeded.

  entrypoints:
    canonical: bootCerebro
    aliases:
      - bootini
      - boot cerebro

  command_resolution:
    natural_language_command: boot cerebro
    matching: CASE_INSENSITIVE_EXACT_TRIMMED
    resolved_command: bootCerebro
    start_event: Start
    required_effect: BEGIN_CONTROLLED_BOOT
    prohibited_interpretations:
      - search-library-for-a-document-named-CURRENT
      - select-authority-from-conversation-memory
      - resume-the-most-recent-failure-receipt
      - treat-root-or-project-label-as-Source-authority

  authority_resolution_preflight:
    first_and_only_persistent_candidate:
      repository: morgul-tech/Cerebro-Source-1.0
      branch: main
      entrypoint: cerebro.yaml
    non_authoritative_inputs:
      - library-documents-including-DOCX
      - filename-markers-including-CURRENT
      - conversation-history-and-model-memory
      - runtime-and-bootstrap-receipts
      - session-handoffs
      - project-root-or-library-root-labels
    rules:
      - resolve-Source-before-reading-derived-continuity-inputs
      - CURRENT-in-a-filename-confers-no-authority
      - a-derived-input-is-applicable-only-when-bound-to-current-Source-commit
      - stale-handoff-or-receipt-is-rejected-as-input-not-promoted-to-boot-blocker
      - old-failure-evidence-remains-history-and-cannot-reopen-a-closed-current-state
      - authority-ambiguity-is-a-contract-failure-not-a-document-selection-task
    stale_input_effect: REJECT_INPUT_CONTINUE_CURRENT_SOURCE
    operational_claim_requires:
      - current-Source-commit-bound-receipt
      - ACTIVE_CONTROL_TRANSFERRED
      - operational-true

  surfaces:
    working_source:
      default_path: D:\Cerebro\Source\Cerebro_Source_v1.0
      role: mutable_local_development_surface
      authority: non_authoritative
    authoritative_source:
      repository: morgul-tech/Cerebro-Source-1.0
      branch: main
      remote: origin
      role: sole_authority_and_verification_target
    bootengine:
      source: https://raw.githubusercontent.com/morgul-tech/B/main/BootEngine
      role: external_boot_orchestration
      authority_over_cerebro_source: false
    bootstrap_state:
      default_path: D:\Cerebro\Run\active\CEREBRO_BOOTSTRAP_STATE_v1.json
      role: derived_operational_state
      authority: non_authoritative
    handoff:
      default_path: D:\Cerebro\Run\handoff\CEREBRO_SESSION_HANDOFF_v1.json
      role: derived_session_continuity_input
      authority: non_authoritative

  authority_invariants:
    - github_source_is_sole_persistent_authority
    - working_source_is_never_promoted_by_boot
    - bootstrap_state_is_never_promoted_to_source
    - handoff_is_never_promoted_to_source
    - bootengine_orchestrates_but_does_not_replace_source_authority
    - source_mutation_requires_explicit_development_and_cerebro_sync
    - boot_sequence_must_not_commit_or_push
    - natural-language-boot-resolves-to-the-same-canonical-command
    - library-filename-and-memory-labels-never-create-authority
    - stale-derived-state-cannot-override-or-reopen-current-Source-state

  required_sequence:
    - sequence: 1
      state: FETCHING
      operation: fetch_and_verify_bootengine
      failure_effect: inactive_control_retained
    - sequence: 2
      state: FETCHING
      operation: fetch_authoritative_source_reference
      failure_effect: inactive_control_retained
    - sequence: 3
      state: VERIFYING
      operation: verify_working_source_repository
      failure_effect: inactive_control_retained
    - sequence: 4
      state: VERIFYING
      operation: align_working_source_by_safe_fast_forward
      failure_effect: inactive_control_retained
    - sequence: 5
      state: ANALYZING
      operation: verify_manifest_and_required_components
      failure_effect: inactive_control_retained
    - sequence: 6
      state: ANALYZING
      operation: construct_derived_bootstrap_state
      failure_effect: discard_partial_runtime_state_and_stop
    - sequence: 7
      state: ACTIVATING
      operation: atomically_activate_runtime
      failure_effect: inactive_control_retained
    - sequence: 8
      state: ACTIVATING
      operation: process_handoff_inside_active_cerebro
      failure_effect: active_without_control_transfer
    - sequence: 9
      state: COMPLETE
      operation: transfer_control
      failure_effect: active_control_retained

  source_alignment:
    required_remote: origin
    required_branch: main
    fetch_required: true
    working_tree_must_be_clean: true
    detached_head_allowed: false

    states:
      equal:
        action: continue
      local_behind:
        action: git_merge_ff_only
        allowed: true
      local_ahead:
        action: reject
        reason: local_only_commit_requires_explicit_development_review
      diverged:
        action: reject
        reason: automatic_reconciliation_forbidden

    prohibited_operations:
      - reset_hard
      - force_checkout
      - rebase
      - merge_commit
      - commit
      - push
      - force_push
      - automatic_conflict_resolution

  bootengine_validation:
    required_tokens:
      - BOOTSTRAP ENGINE
      - Configuration := IMMUTABLE
      - CurrentMaster.Repository := morgul-tech/Cerebro-Source-1.0
      - CurrentMaster.Branch := main
      - CurrentMaster.Path := cerebro.yaml
      - Command.NaturalLanguageAlias := boot cerebro
      - Authority.First := github:morgul-tech/Cerebro-Source-1.0/main/cerebro.yaml
      - FilenameMarker.CURRENT.Authority := NONE
      - StaleDerivedState.Action := REJECT_INPUT_CONTINUE_CURRENT_SOURCE
      - OperationalClaim.Requires := ACTIVE_CONTROL_TRANSFERRED_RECEIPT_AT_CURRENT_SOURCE_COMMIT
      - IDLE
      - FETCHING
      - VERIFYING
      - ANALYZING
      - ACTIVATING
      - COMPLETE
      - FAILED
      - UndefinedTransition
      - FORBIDDEN

  required_source_components:
    - cerebro.yaml
    - mcp/activation.yaml
    - standards/runtime/minimal-runtime-bootstrap.yaml
    - standards/runtime/handboot.yaml
    - standards/runtime/handboot-bootstrap-state-schema.yaml
    - standards/session-handoff.yaml
    - standards/session-handoff-schema.yaml
    - engines/context/working-context.yaml
    - engines/project/roadmap.yaml
    - tooling/builder/templates/pshell/Cerebro.Tools.psd1
    - tooling/builder/templates/pshell/Cerebro.Tools.psm1
    - tooling/builder/templates/pshell/cerebro_handoff.ps1
    - tooling/runtime-host/cerebro_resume.ps1
    - tooling/runtime-host/cerebro_boot.ps1
    - tooling/runtime-host/cerebro_machine_proof.ps1
    - tooling/runtime-host/boot_authority_selftest.py
    - tooling/validator/checks.yaml

  manifest_validation:
    entrypoint: cerebro.yaml
    schema: cerebro-manifest/v1
    required_top_level_sections:
      - cerebro
      - source
      - mcp
      - engines
      - modules
      - standards
      - tooling
      - governance
      - integrity
      - source_status

  activation_contract_validation:
    path: mcp/activation.yaml
    required_tokens:
      - external_protocol: Oppstartsprotokoll
      - entrypoint: cerebro.yaml
      - fetch_manifest
      - verify_source
      - verify_release
      - load_mcp
      - load_required_engines
      - load_required_modules
      - initialize_runtime
      - activate

  bootstrap_contract_validation:
    path: standards/runtime/minimal-runtime-bootstrap.yaml
    required_tokens:
      - persistent_authority: "Cerebro Source"
      - boot_authority: "orchestration_only"
      - resolve_authoritative_source
      - validate_required_contracts
      - construct_derived_bootstrap_state
      - activate_runtime
      - transfer_control

  runtime:
    profile: cerebro-controlled-session/v0.1
    construction_state: CONSTRUCTED_INACTIVE
    activation_success_state: ACTIVE
    control_transfer_success_state: ACTIVE_CONTROL_TRANSFERRED
    failure_state: INACTIVE_CONTROL_RETAINED
    partial_activation_allowed: false
    temporary_file_required: true
    atomic_replace_required: true

  handoff_processing:
    occurs_after_runtime_activation: true
    missing_handoff:
      disposition: NONE
      boot_may_continue: true
    valid_handoff:
      disposition: RESUMED
      resume_command: cerebro_resume
    stale_handoff:
      condition: source_commit_binding_differs_from_current_verified_source
      disposition: STALE_REJECTED
      boot_may_continue: true
      continue_basis: CURRENT_VERIFIED_SOURCE
      runtime_may_be_reported_operational_after_control_transfer: true
    invalid_handoff:
      condition: claims_current_source_but_validation_fails
      disposition: FAILED
      boot_must_fail: true
      runtime_must_not_be_reported_operational: true
    skip_switch:
      name: SkipHandoff
      allowed: true
      disposition: SKIPPED_EXPLICITLY

  operational_definition:
    required:
      - bootengine_verified
      - authoritative_source_fetched
      - working_source_aligned
      - manifest_verified
      - required_components_verified
      - bootstrap_state_active
      - handoff_resolved
      - control_transferred
      - deterministic_receipt_emitted

  receipt:
    deterministic: true
    material_fields:
      - command
      - bootengine_sha256
      - source_commit
      - runtime_profile
      - runtime_state
      - handoff_state
      - current_patch
      - canonical_command
    success_state: ACTIVE_CONTROL_TRANSFERRED
    failure_state: INACTIVE_CONTROL_RETAINED

  machine_proof:
    status: ACTIVE
    purpose: >
      Convert a successful local boot into compact transportable evidence that
      ChatGPT can cross-verify against the current authoritative Source without
      requiring direct local-machine access.
    default_on_successful_boot: true
    explicit_command: cerebro_verify
    implementation: tooling/runtime-host/cerebro_machine_proof.ps1
    proof_path: D:\Cerebro\Run\active\CEREBRO_MACHINE_PROOF_v1.json
    clipboard_transport:
      default: true
      payload: compact_machine_proof_text
      user_action: paste_once_into_chat
    independent_post_boot_verification:
      required: true
      checks:
        - fresh_fetch_origin_main
        - working_source_clean
        - working_source_commit_equals_remote_main
        - boot_result_source_commit_equals_remote_main
        - runtime_working_source_commit_equals_remote_main
        - runtime_authoritative_source_commit_equals_remote_main
        - runtime_state_ACTIVE_CONTROL_TRANSFERRED
        - runtime_operational_true
        - runtime_control_transferred_true
        - runtime_receipt_equals_boot_receipt
    success_result: PASS
    claim_enabled_for_chat_after_cross_verification:
      - CEREBRO_SOURCE_ACTIVATED
      - WORKING_SOURCE_VERIFIED
      - ACTIVE_CONTROL_TRANSFERRED
      - FULL_MACHINE_OPERATIONAL_STATUS=VERIFIED
    publication_during_normal_boot: PROHIBITED
    sync_status_separate: true
    invariants:
      - MACHINE_PROOF_IS_DERIVED_EVIDENCE_NOT_SOURCE_AUTHORITY
      - BOOT_DOES_NOT_PUBLISH
      - ONE_LOCAL_COMMAND_MAY_COMPLETE_BOOT_AND_PROOF
      - PROOF_MUST_BE_BOUND_TO_CURRENT_AUTHORITATIVE_COMMIT
      - STALE_PROOF_CANNOT_ESTABLISH_CURRENT_OPERATIONAL_STATUS

  fail_closed_conditions:
    - bootengine_fetch_failed
    - bootengine_contract_invalid
    - authoritative_source_fetch_failed
    - working_source_missing
    - working_source_dirty
    - working_source_detached
    - working_source_wrong_branch
    - working_source_local_ahead
    - working_source_diverged
    - working_source_fast_forward_failed
    - manifest_missing
    - manifest_contract_invalid
    - required_component_missing
    - activation_contract_invalid
    - bootstrap_contract_invalid
    - runtime_construction_failed
    - runtime_activation_failed
    - handoff_resume_failed
    - control_transfer_failed

  explicit_non_goals:
    - mutate_authoritative_source
    - commit_working_source
    - push_working_source
    - recover_uncommitted_development
    - reconcile_diverged_git_history
    - activate_chat_conversation_without_machine_execution
    - replace_external_bootengine
