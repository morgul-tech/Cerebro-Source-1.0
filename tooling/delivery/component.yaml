schema: cerebro-component/v1
component:
  id: delivery
  name: Cerebro Delivery Controller
  type: tooling
  version: 0.8.0
  status: active-source
responsibility:
  primary: Bind and persist the MCP-resolved Source-bound delivery profile, then deliver an assured Change Capsule into local Working Source as a bounded, journaled, recoverable transaction.
boundaries:
  must:
    - verify-exact-source-baseline
    - journal-before-first-possible-mutation
    - back-up-physical-prestate
    - enforce-declared-path-scope
    - verify-installed-payload-bytes
    - execute-declared-delete-with-baseline-identity-backup-rollback-and-final-absence-proof
    - preserve-verified-full-working-source-recovery-snapshot-before-mutation
    - discover-required-local-capabilities-before-mutation
    - preserve-lossless-failure-and-recovery-evidence
    - persist-explicit-terminal-delivery-selection-outside-source
    - invoke-canonical-MCP-control-resolution-for-delivery-profile
    - persist-MCP-control-decision-and-execution-profile-binding
    - remain-a-non-deciding-capability-binding-and-state-projection-adapter
    - bind-selection-to-exact-source-commit
    - fail-closed-when-auto-resolution-evidence-is-insufficient
    - revalidate-selected-profile-before-payload-design-and-delivery
    - canonicalize-legacy-delivery-profile-aliases
    - persist-profile-specific-access-request-budget
    - separate-delivery-profile-from-artifact-and-assurance-namespaces
    - expose-exactly-one-standard-bundle-zip
    - expose-exactly-one-standard-launcher
    - expose-exactly-one-standard-copyable-command
    - keep-standard-internal-files-inside-bundle
    - make-standard-launch-independent-of-current-working-directory
    - require-machine-verified-handoff-assurance-before-standard-user-handoff
    - treat-standard-launcher-and-bundle-as-one-identity-bound-delivery-unit
    - preserve-process-scoped-execution-policy-only
    - limit-delete-to-exact-declared-files
    - validate-success-receipt-after-canonical-sync
    - publish-byte-identical-success-transport-view-to-launcher-directory
    - emit-upload-file-pointer-without-manual-copy-step
    - consume-one-namespaced-delivery-receipt-after-nested-target-runtime-validation
    - execute-pre-mutation-selftests-against-sealed-candidate-source-view
    - consume-hash-bound-human-execution-handoff-before-source-mutation
  must_not:
    - design-or-generate-source-content
    - create-source-authority
    - publish-source
    - bypass-change-assurance
    - overwrite-unknown-concurrent-state
    - silently-fallback-to-another-delivery-profile
    - independently-resolve-or-recompute-delivery-profile-policy
    - claim-delivery-profile-decision-authority
    - request-agent-local-access-under-LIMITED-or-STANDARD
    - retry-a-denied-FULL-access-request-without-explicit-reselection
    - expose-alternate-standard-handoff
    - delete-directories-or-undeclared-paths
    - request-or-perform-privilege-escalation
    - allow-user-profile-to-override-standard-handoff
dependencies:
  runtime:
    - git
    - python
    - change-capsule-v0.2
    - powershell-5.1
interfaces:
  consumes:
    - assured-change-capsule
    - clean-working-source
    - explicit-user-delivery-selection
    - mcp-control-decision
    - mcp-execution-profile
  produces:
    - delivery-receipt
    - bounded-backup
    - mutation-journal
    - delivery-selection-state
    - delivery-selection-history
    - canonical-delivery-profile-controls
    - handoff-assurance-receipt
    - identity-bound-standard-delivery-unit
    - validated-success-transport-view
    - namespaced-delivery-receipt-pointer
    - sealed-candidate-source-view
    - human-execution-handoff-launch-proof
    - mcp-bound-delivery-capability-state
