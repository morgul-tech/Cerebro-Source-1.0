schema: cerebro-first-light-contract/v0.2
id: CEREBRO-FIRST-LIGHT-TEMPORALIS-V0
status: candidate
authority: NONE
source_authority: NONE
runtime_authority: NONE
control_authority: NONE
scheduler_authority: NONE
material_effect_authority: NONE

first_light:
  mode: REAL_FIRST_LIGHT
  residence: ON_DEMAND
  events_per_invocation: 1
  persistence: SQLITE_STANDARD_LIBRARY
  store_authority: DERIVED_EVIDENCE_ONLY
  external_material_capability_v0: NONE
  allowed_model_adapters:
    - STUB
    - RECORDED
  live_model_adapter: DEFERRED
  semantic_order_source: EXPLICIT_EVENT_IDENTITY_AND_CURRENTNESS
  wall_clock_semantic_authority: NONE
  receipt_required: true
  blind_retry: PROHIBITED
  exact_bound_replay: LAWFUL_NONBLIND_IDEMPOTENT_RECOVERY

precommit_identity:
  scope: HOST_TO_FIRST_LIGHT_SELECTED_SNAPSHOT_BOUNDARY_ONLY
  required_before_child_spawn: true
  event_identity_source: FIRST_LIGHT_RUNTIME_CANONICALIZATION
  immutable_event_binding:
    - event_id
    - event_fingerprint
    - canonical_event_sha256
    - original_event_raw_sha256
  execution_basis_binding:
    - source_commit
    - mode
    - store_identity
    - host_operation_id
    - correlation_id
    - precommit_fingerprint
  store_identity_semantics: UNDERLYING_FILE_IDENTITY
  STORE_IDENTITY_NE_PATH: true
  alias_same_underlying_store: ALLOW
  copied_replaced_wrong_store: UNKNOWN_HOLD
  unresolved_store_identity: UNKNOWN_HOLD
  event_source_changed_after_precommit: BLOCK
  source_commit_mismatch: BLOCK
  mode_mismatch: BLOCK
  observer_may_synthesize_precommit: false

recovery:
  typed_states:
    FOUND:
      meaning: EXACT_EVENT_ALREADY_FINALIZED_ON_VERIFIED_SAME_STORE
      execution: ZERO_NEW_EXECUTION
      result: RETURN_EXISTING_RECEIPT_READBACK
    ABSENT:
      meaning: EXACT_EVENT_NOT_YET_PRESENT_ON_VERIFIED_SAME_STORE
      execution: EXACT_COMPLETION_ALLOWED_ONLY_FROM_FROZEN_PRECOMMIT_TUPLE
    UNKNOWN:
      meaning: STORE_EVENT_OR_RECEIPT_IDENTITY_NOT_PROVEN
      execution: PROHIBITED
      disposition: HOLD
  blind_retry: PROHIBITED
  reconcile_service: NONE
  doctor_recovery_owner: NONE

temporalis:
  mode: SIM_TEMPORALIS
  reducer: SAME_AS_FIRST_LIGHT
  logical_clock: true
  isolated_namespace: REQUIRED
  side_effects: DENY
  denied:
    - FILESYSTEM_OUTSIDE_SIM_ROOT
    - PROCESS_SPAWN
    - NETWORK
    - SOURCE_MUTATION
    - SHARED_MUTATION
    - MATERIAL_EFFECT
  deterministic_order:
    - logical_time
    - scenario_sequence
    - event_id

event:
  required:
    - event_id
    - event_type
    - subject_ref
    - intended_consequence_class
    - payload
  identity: SHA256_CANONICAL_JSON_EXCLUDING_OBSERVATION_METADATA
  same_id_same_fingerprint: IDEMPOTENT_NO_EXECUTION
  same_id_different_fingerprint: BLOCK

truth_separation:
  execution_truth: SEPARATE
  verification_truth: SEPARATE
  process_observation: SEPARATE
  material_poststate_truth: SEPARATE
  provider_readback_proves_effect: false
  pm_admission_proves_effect: false
  exit_zero_proves_semantic_success: false
  heartbeat_proves_progress_or_success: false

closure:
  producer_scope_state: EXPLICIT
  consequence_state: EXPLICIT
  effect_proven_requires:
    - exact_prestate
    - authorized_action
    - execution_attempt
    - independent_post_effect_observation
    - required_provider_readback
    - final_currentness_recheck

invariants:
  - ONE_SHARED_REDUCER_FOR_REAL_AND_SIMULATION
  - NO_PERSISTENT_DOCTOR_ACTOR_DEPENDENCY
  - NO_NEW_SCHEDULER_SERVICE_LISTENER_OR_WORKER_POOL
  - FIRST_LIGHT_CANNOT_SELF_ATTEST
  - IMMUNE_ASSURANCE_IS_EXTERNAL_INPUT_WHEN_SEPARATELY_AUTHORIZED
  - TEMPORALIS_SIDE_EFFECTS_DENY
  - LOCAL_STORE_IS_EVIDENCE_ONLY
  - INTENDED_CONSEQUENCE_CLASS_IMMUTABLE_IN_RECEIPT_LINEAGE
  - PRECOMMIT_IDENTITY_IS_BOUNDED_NOT_UNIVERSAL
  - FOUND_NE_ABSENT_NE_UNKNOWN
  - STORE_IDENTITY_NE_PATH
