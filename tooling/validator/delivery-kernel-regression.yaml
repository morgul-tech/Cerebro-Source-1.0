schema: cerebro-delivery-kernel-regression-tool/v1
delivery_kernel_regression_tool:
  id: CEREBRO-DELIVERY-KERNEL-REGRESSION-001
  kernel: tooling/delivery/Cerebro.StandardDeliveryKernel.ps1
  mode: SelfTest
  destructive_to_Working_Source: false
  required_results:
  - POWERSHELL_PARSE_PASS
  - NATIVE_STDERR_ZERO_EXIT_PASS
  - NATIVE_NONZERO_EXIT_PASS
  - LOCAL_GIT_FIXTURE_PASS
  - BOUNDED_DELETE_ROLLBACK_PASS
  - FULL_RECOVERY_SNAPSHOT_PASS
  - PAYLOAD_HASH_PASS
  - BASELINE_MANIFEST_PASS
  - CANDIDATE_SOURCE_COMPOSITION_PASS
  - HUMAN_CONTINUATION_SURFACE_SELFTEST_PASS
  required_canaries:
  - declared-delete-requires-exact-baseline-git-blob
  - declared-delete-rejects-payload-fields
  - declared-delete-backs-up-and-restores-before-sync-failure
  - declared-delete-proves-final-absence-at-HEAD
  - delete-is-limited-to-one-exact-file-and-never-a-directory
  - full-snapshot-includes-dot-git-and-verifies-every-entry
  - local-git-fixture-includes-required-cerebro-source-root-marker
  - insufficient-normal-user-capability-stops-before-mutation
  - sealed-candidate-selftest-rejects-invalid-human-continuation-surfaces
  - nested-target-runtime-receipt-cannot-shadow-delivery-kernel-receipt
  - launcher-requires-exactly-one-DELIVERY_RECEIPT-field
  - unchanged-selftest-dependency-resolves-from-exact-manifest-baseline
  - changed-selftest-dependency-resolves-from-sealed-payload
  - deleted-selftest-dependency-is-absent-from-candidate-view
  - differential-payload-is-not-treated-as-a-complete-source-tree
