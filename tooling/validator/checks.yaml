    - internal-installer-remains-inside-ZIP
    - internal-manifest-remains-inside-ZIP
    - recovery-remains-inside-ZIP
    - launch-independent-of-current-working-directory
    - no-cd-instruction-required
    - launcher-resolves-bundle-from-own-location
    - launcher-and-bundle-identity-verified
    - ZIP-script-command-contiguous
    - command-is-absolute-response-end
    - alternate-STANDARD-handoff-prohibited
    - User-Profile-cannot-override-STANDARD-handoff
    - selector-matches-delivery-contract
    - selection-schema-matches-selector
  required_canaries:
    - standard-handoff-has-one-zip
    - standard-handoff-has-one-launcher
    - standard-handoff-has-one-command
    - standard-launch-is-cwd-independent
    - standard-launcher-bundle-binding-is-verified
    - standard-profile-override-is-rejected
