schema: cerebro-validator-checks/v1
phases:
  structure:
  - required-files
  - valid-yaml
  - component-manifest
  consistency:
  - unique-ids
  - valid-references
  - valid-dependencies
  rules:
  - owner
  - authority
  - priority
  - scope
  - lifecycle
  - language
severity:
  error: block
  warning: continue
  information: continue

# BEGIN PATCH-001A.PRE-010 NATIVE PROCESS VALIDATION

native_process_compatibility:
  introduced_by: PATCH-001A.PRE-010
  short_handle: P1A-PR10
  severity: error

  supported_hosts:
    - Windows_PowerShell_5_1
    - PowerShell_7_plus

  required_contracts:
    - literal_argument_tokens
    - separate_stdout_and_stderr
    - immediate_exit_code_capture
    - declared_allowed_exit_codes
    - native_adapter_selftest
    - structured_repository_assessment
    - explicit_repository_binding
    - execution_lock
    - rollback
    - machine_readable_result

  prohibited_patterns:
    - ProcessStartInfo_ArgumentList_dependency
    - stderr_only_failure_classification
    - ErrorActionPreference_as_exit_code_authority
    - hidden_repository_verification_error
    - delivery_without_verified_access
    - unrequested_archive_generation

  required_selftests:
    - stdout_exit_0
    - stderr_exit_0
    - separated_streams
    - allowed_exit_1
    - rejected_exit_7
    - missing_executable
    - argument_with_spaces

  git_semantics:
    git_fetch:
      allowed_exit_codes:
        - 0
      stderr_on_exit_0: informational_or_diagnostic

    git_status:
      allowed_exit_codes:
        - 0

    git_diff_quiet:
      allowed_exit_codes:
        - 0
        - 1

    git_commit:
      allowed_exit_codes:
        - 0

    git_push:
      allowed_exit_codes:
        - 0
      failure_after_commit: report_local_commit

# END PATCH-001A.PRE-010 NATIVE PROCESS VALIDATION

# BEGIN PATCH-001C.PRE-001 SEALED PSHELL VALIDATION

sealed_pshell_transport_compatibility:
  introduced_by: PATCH-001C.PRE-001
  short_handle: P1C-PR1
  severity: error

  required_contracts:
    - single_copy_single_paste
    - no_preserved_clipboard_state_dependency
    - compact_visible_transport_token
    - full_local_SHA256_derivation
    - producer_selfvalidation
    - exact_length_validation
    - full_receiver_digest_validation
    - allowed_target_root_validation
    - powershell_parse_before_install
    - atomic_install
    - rollback_or_no_mutation_on_failure
    - deterministic_machine_receipt

  prohibited_patterns:
    - explanation_inside_executable_payload
    - markdown_fence_inside_installed_script
    - manual_hash_replacement
    - stateful_multistep_clipboard_delivery
    - receiver_write_before_digest_validation
    - full_visible_digest_when_short_transport_token_is_sufficient

source_sync_recovery_validation:
  introduced_by: PATCH-001C.PRE-001
  short_handle: P1C-PR1
  severity: error

  required_contracts:
    - local_to_authoritative_direction
    - explicit_repository_binding
    - fetch_only_baseline_refresh
    - force_with_lease
    - declared_path_staging
    - remote_commit_verification
    - remaining_change_gate
    - separate_stdout_and_stderr
    - allowed_exit_code_authority

  prohibited_patterns:
    - pull_during_sync
    - reset_to_remote_during_sync
    - automatic_merge_during_sync
    - stderr_only_failure_classification
    - unverified_remote_success

# END PATCH-001C.PRE-001 SEALED PSHELL VALIDATION
# BEGIN PATCH-001C.PRE-002 CORRECTIVE DELIVERY PREFLIGHT VALIDATION

corrective_delivery_preflight_validation:
  introduced_by: PATCH-001C.PRE-002
  short_handle: P1C-PR2
  severity: error
  owner: tooling.validator

  required_contracts:
    - explicit_mandate_gate
    - current_conversation_tool_discovery
    - required_capability_resolution
    - capability_invocation_verification
    - output_surface_verification
    - user_access_verification_when_required
    - operating_conditions_lock
    - existing_local_capability_resolution
    - explicit_delivery_mode_resolution
    - preserved_WORK_SELF_RUNNING_FILE_PSHELL_modes
    - payload_class_separate_from_delivery_mode
    - serialization_separate_from_payload_class
    - delivery_lock_before_physical_serialization
    - explicit_fallback_reason_for_large_or_sensitive_inline_PSHELL

  prohibited_patterns:
    - delivery_mode_selected_without_capability_evidence
    - internal_artifact_creation_used_as_delivery_proof
    - previous_conversation_capability_used_as_current_evidence
    - user_access_required_but_not_verified
    - rejected_delivery_mode_reused_without_verified_capability_change
    - new_transport_generation_when_existing_capability_matches
    - payload_generation_before_delivery_lock
    - delivery_mode_used_as_payload_class
    - payload_class_used_as_serialization_format

# END PATCH-001C.PRE-002 CORRECTIVE DELIVERY PREFLIGHT VALIDATION
# BEGIN PATCH-001C MINIMAL RUNTIME BOOTSTRAP VALIDATION

minimal_runtime_bootstrap_validation:
  introduced_by: PATCH-001C
  contract_ref: standards/runtime/minimal-runtime-bootstrap.yaml
  severity: error
  owner: tooling.validator

  required_authority_assertions:
    - source_is_single_persistent_authority
    - runtime_is_derived
    - release_is_derived
    - boot_is_orchestration_only
    - runtime_cannot_promote_state_to_source

  required_order:
    - resolve_authoritative_source
    - load_minimal_runtime_inputs
    - validate_required_contracts
    - construct_derived_runtime_state
    - activate_runtime
    - transfer_control

  required_atomicity:
    - no_partial_activation
    - no_partial_control_transfer
    - failed_runtime_state_is_discarded
    - failure_preserves_source
    - failure_retains_boot_control

  required_receipt_fields:
    - runtime_version
    - source_identity
    - source_validation_state
    - runtime_construction_state
    - activation_state
    - control_transfer_state
    - failure_stage
    - failure_code

  prohibited:
    - runtime_as_persistent_authority
    - release_as_persistent_authority
    - runtime_state_promoted_to_source
    - activation_before_validation
    - control_transfer_before_activation
    - parallel_bootstrap_authority
    - broad_bootengine_redesign_under_PATCH_001C
    - Runtime_0_1_implementation_under_PATCH_001C

# END PATCH-001C MINIMAL RUNTIME BOOTSTRAP VALIDATION