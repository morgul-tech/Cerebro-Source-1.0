    - full-local-and-bounded-transport-are-views-of-one-capsule
    - unresolved-diagnostic-context-is-auto-rehydrated-before-delegation
    - diagnostics-do-not-own-recovery-policy
    - primary-failure-survives-diagnostic-capture-failure
    - probe-failure-remains-distinct-from-subject-failure
    - successful-related-repair-retains-resolution-commit-traceability
    - user-is-not-required-to-select-or-interpret-failure-logs
  required_canaries:
