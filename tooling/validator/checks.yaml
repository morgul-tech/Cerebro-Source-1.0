known_language_failure_loop_prevention:
  introduced_by: STANDARD-DELIVERY-FAILURE-LOOP-HARDENING-001
  severity: error
  owner: tooling.validator
  contract_ref: standards/change-delivery.yaml
  applies_when:
    - machine-language-or-deterministic-patch-format
    - repeated-failure-family-or-user-retry-required
  required_evidence:
    - failure-boundary-reproduced-in-disposable-fixture
    - repaired-candidate-tested-before-human-retry
    - parser-or-format-check-passed-when-available
    - exact-context-application-preflight-passed-when-applicable
    - unified-diff-non-eof-change-hunks-have-trailing-context
    - declared-scope-check-passed
    - semantic-structural-placement-check-passed-for-structured-reference-insertions
    - structured-reference-cardinality-checks-use-line-or-scope-anchored-matching
    - final-structured-document-validity-check-passed-after-installed-state
    - reverse-or-rollback-preflight-passed-when-applicable
  distinctions:
    - patch-format-parse-is-not-patch-applicability
    - token-presence-is-not-structural-placement-proof
    - substring-count-is-not-structural-cardinality-proof
    - nested-indentation-does-not-satisfy-parent-scope-cardinality
    - known-language-syntax-errors-should-be-machine-eliminated-before-handoff
  correction_strategy:
    preferred: MINIMUM_DELTA_REUSE_REVERIFY_RESEAL
    full_regeneration: ONLY_WHEN_REQUIRED_BY_INVALIDATED_BASIS_OR_MATERIAL_SCOPE_CHANGE
  prohibited:
    - repeated-human-retry-without-strengthened-machine-assurance
    - READY-claim-based-only-on-patch-stat-or-numstat
    - silent-regeneration-of-unchanged-known-good-artifacts

