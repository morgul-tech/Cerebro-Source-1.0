schema: cerebro-component/v1
component:
  id: validator
  name: Validator
  type: tooling
  version: 1.2.0
  status: active-source
responsibility:
  primary: Kontrollere struktur, konsistens, regler og release-integritet.
boundaries:
  must:
  - validate-structure
  - validate-consistency
  - validate-rules
  - block-on-error
  - validate-exact-candidate-in-required-target-runtime
  - produce-target-runtime-validation-receipt
  - validate-human-continuation-binding-and-final-response-surface
  must_not:
  - modify-source
  - silently-ignore-errors
  - authorize-candidate-source-through-runtime-host
  - publish-or-mutate-authoritative-source
dependencies:
  build: []
  runtime: []
interfaces:
  consumes:
  - cerebro-source
  - candidate-release
  - exact-candidate-source
  - target-runtime-profile
  produces:
  - validation-report
  - errors
  - warnings
  - information
  - target-runtime-validation-receipt
  - human-continuation-surface-activation-proof
documentation:
  path: README.md
version:
  component: 1.2.0
  schema: 1
