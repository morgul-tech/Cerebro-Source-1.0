schema: cerebro-change-campaign-policy/v0.1
policy:
  id: CEREBRO-CHANGE-CAMPAIGN-POLICY-001
  version: 0.7.0
  authority: SOURCE_DEFINED_POLICY
  regression_catalog_owner: tooling.change
profiles:
  FAST:
    required_clean_campaigns: 1
    use_when: low-consequence-bounded-change
  STANDARD:
    required_clean_campaigns: 2
    use_when: material-change-or-moderate-uncertainty
  DEEP:
    required_clean_campaigns: 3
    use_when: architecture-high-impact-high-uncertainty-or-reorientation
common_required_scenarios:
- exact-capsule-integrity
- exact-base-commit
- target-baseline
- final-serialized-structured-parse
- code-syntax
- exact-changed-path-scope
- git-diff-check
- machine-protocol-status-parse
- target-language-parse-when-executable-delivery-applies
learning_controls:
  iteration_inheritance: required
  diagnostic_rehydration: required_when_available
  family_correlation: required
  relevance_scoped_regression_selection: required
  learning_basis_fingerprint: required
  changed_learning_basis_effect: INVALIDATE_CANDIDATE_ASSURANCE
  systemic_threshold_distinct_campaigns: 2
  unresolved_systemic_effect: BLOCK
  current_candidate_failure_effect: BLOCK
  known_applicable_family_without_machine_check_effect: BLOCK
  positive_success_evidence_separate_from_failure_evidence: true
  user_is_not_learning_transport_processor: true
  changed_source_paths_require_full_dependent_evidence_impact_closure_before_handoff: required
  producer_output_schema_must_be_executed_against_every_mandatory_consumer_before_handoff: required
  exact_candidate_contract_activation_closure_before_handoff: required
  target_runtime_pre_handoff_validation_when_required: required
  candidate_source_validation_by_runtime_host: prohibited
  missing_required_target_runtime_execution_effect: BLOCK
  delivered_entrypoint_must_be_location_independent: required
  unstated_artifact_placement_preconditions: prohibited
  copyable_command_must_resolve_and_verify_actual_artifact_paths: required
  copyable_exact_shell_command_must_be_generator_owned_and_response_candidate_validated: required
  standard_launcher_and_bundle_must_be_resolved_by_exact_content_hash_not_visible_filename: required
  standard_launcher_must_consume_handoff_fingerprint_before_source_mutation: required
  intended_markdown_source_is_not_proof_of_rendered_or_copied_execution_surface: required
  human_execution_as_knowable_delivery_gap_discovery_mechanism: prohibited
  native_process_stderr_must_not_override_exit_code_semantics: required
  evidence_materialization_must_be_idempotent: required
  runtime_evidence_fingerprint_ordering_must_be_consumer_compatible: required
  wrapper_failure_family_must_preserve_nested_root_cause: required
  cross_language_identity_ordering_must_be_explicit_ordinal: required
  first_failure_remediation_requires_forward_failure_sweep: required
  first_observed_failure_is_not_complete_defect_inventory: required
  forward_failure_sweep_requires_remaining_reachable_stages_and_adjacent_contracts: required
  knowable_downstream_defects_must_be_remediated_before_redelivery: required
  all_manifest_assertions_must_execute_against_final_generated_candidate_before_handoff: required
  runtime_evidence_consumer_normalization_must_cover_prehandoff_and_apply_paths: required
  standard_manifest_assertion_text_must_survive_actual_consumer_encoding: required
  non_ascii_manifest_assertion_text_requires_json_unicode_escape_or_explicit_utf8_consumer: required
campaign_closeout:
  contract_ref: standards/change-campaign-closeout.yaml
  owner: tooling.change
  collect_incrementally: required
  final_gate_before_dependent_phase: required
  fixed_patch_count_trigger: prohibited
  dimensions: [intent_to_result, rule_to_normal_consumer, state_and_learning, next_phase_readiness]
  unknown_or_unclassified_debt_effect: BLOCK
  validator_executor: tooling/validator/change_campaign_closeout.py
  MCP_phase_transition_consumption: required
  Standard_Delivery_normal_consumer: required
repeated_run_focus:
- stale-state
- cleanup
- idempotence
- state-leakage
- order-dependency
- recurring-failure-family
language_specific_regressions:
  powershell:
  - ambiguous-variable-colon-interpolation
  - native-stderr-not-failure-authority
  - target-parser-preflight-before-execution
failure_family_catalog:
  STANDARD_MANIFEST_ASSERTION_ENCODING_REPRESENTATION:
    traits: [structured_text, standard_delivery]
    detection_contains: [REQUIRED_TEXT_MISSING, MANIFEST_ASSERTION_ENCODING_REPRESENTATION]
    prevention_refs: [ASCII_SAFE_OR_JSON_UNICODE_ESCAPED_MANIFEST_ASSERTIONS, ACTUAL_CONSUMER_ENCODING_VALIDATION]
    regression_refs: [REG-STANDARD-MANIFEST-ASSERTION-ENCODING]
    machine_checks: [MANIFEST_ASSERTION_TEXT_TRANSPORT_SAFETY, FINAL_MANIFEST_ACTUAL_CONSUMER_REPRESENTATION]
  POWERSHELL_AUTOMATIC_VARIABLE_COLLISION:
    traits: [powershell]
    detection_contains: [POWERSHELL_AUTOMATIC_VARIABLE_COLLISION]
    prevention_refs: [STATIC_AUTOMATIC_VARIABLE_COLLISION_SCAN]
    regression_refs: [REG-PS-AUTOMATIC-VARIABLE-COLLISION]
    machine_checks: [POWERSHELL_AUTOMATIC_VARIABLE_COLLISION]
  PATCH_ANCHOR_LINE_ENDING_REPRESENTATION:
    traits: [structured_text, standard_delivery]
    detection_contains: [LINE_ENDING_MISMATCH, PATCH_ANCHOR_LINE_ENDING_REPRESENTATION]
    prevention_refs: [LINE_ENDING_REPRESENTATION_INDEPENDENT_MATCHING]
    regression_refs: [REG-LINE-ENDINGS-REPRESENTATION-INDEPENDENT]
    machine_checks: [LINE_ENDING_REPRESENTATION_INDEPENDENCE]
  NATIVE_PROCESS_RESULT_FALSE_FAILURE:
    traits: [native_process]
    detection_contains: [NATIVE_PROCESS_RESULT_FALSE_FAILURE, PROCESS_EXIT_STATUS_UNAVAILABLE]
    prevention_refs: [NULL_EXIT_IS_UNKNOWN_NOT_NONZERO, MATERIAL_POSTSTATE_RECONCILIATION]
    regression_refs: [REG-NATIVE-PROCESS-RESULT-RECONCILIATION]
    machine_checks: [NATIVE_PROCESS_RESULT_RECONCILIATION]
  POWERSHELL_COMMAND_SHADOWING_NATIVE_EXECUTABLE:
    traits: [powershell, native_process]
    detection_contains: [POWERSHELL_COMMAND_SHADOWING_NATIVE_EXECUTABLE]
    prevention_refs: [RESOLVE_NATIVE_EXECUTABLE_AS_APPLICATION]
    regression_refs: [REG-PS-NATIVE-COMMAND-SHADOWING]
    machine_checks: [NATIVE_EXECUTABLE_APPLICATION_RESOLUTION]
  POWERSHELL_RUNTIME_SEMANTIC_COLLISION:
    traits: [powershell]
    detection_contains: [POWERSHELL_RUNTIME_SEMANTIC_COLLISION]
    prevention_refs: [RUNTIME_SEMANTIC_ASSURANCE_PROFILE]
    regression_refs: [REG-PS-RUNTIME-SEMANTIC]
    machine_checks: [POWERSHELL_RUNTIME_SEMANTICS]
  GENERATED_POWERSHELL_TOKEN_BOUNDARY_COLLAPSE:
    traits: [powershell, standard_delivery]
    detection_contains: [MissingInInForeach, MissingInInForeachLoop, GENERATED_POWERSHELL_TOKEN_BOUNDARY_COLLAPSE]
    prevention_refs: [NO_AGGRESSIVE_POWERSHELL_MINIFICATION, FINAL_LAUNCHER_PARSE]
    regression_refs: [REG-PS-TOKEN-BOUNDARY]
    machine_checks: [POWERSHELL_PARSE, TOKEN_BOUNDARY_PRESERVATION]
  VALIDATOR_SIDE_EFFECT_CONTAMINATES_WORKING_SOURCE:
    traits: [python, validator]
    detection_contains: [VALIDATOR_SIDE_EFFECT_CONTAMINATES_WORKING_SOURCE, __pycache__]
    prevention_refs: [SIDE_EFFECT_FREE_VALIDATION, VALIDATOR_RESIDUE_GUARD]
    regression_refs: [REG-VALIDATOR-SIDE-EFFECT-FREE]
    machine_checks: [VALIDATOR_SIDE_EFFECT_FREE]
  GENERATED_POWERSHELL_REGEX_ESCAPE_INVALID:
    traits: [powershell, standard_delivery]
    detection_contains: [InvalidRegularExpression, GENERATED_POWERSHELL_REGEX_ESCAPE_INVALID]
    prevention_refs: [LITERAL_STRING_REPLACE_FOR_PATH_SEPARATOR]
    regression_refs: [REG-PS-REGEX-RUNTIME-VALIDITY]
    machine_checks: [POWERSHELL_REGEX_RUNTIME_VALIDITY]
  VALIDATION_PROBE_RESULT_COLLAPSE:
    traits: [validator, diagnostics]
    detection_contains: [HOST_PYTHON_AST_PARSE_FAILED, VALIDATION_PROBE_RESULT_COLLAPSE]
    prevention_refs: [PRESERVE_PROBE_STDOUT_STDERR_EXIT, PROBE_FAILURE_NOT_SUBJECT_FAILURE]
    regression_refs: [REG-PROBE-RESULT-SEPARATION]
    machine_checks: [PROBE_RESULT_SEPARATION]
  DETERMINISTIC_PATCH_SCOPE_AMBIGUITY:
    traits: [structured_text]
    detection_contains: [SEMANTIC_PLACEMENT_MISMATCH, DECISION_REF_GLOBAL_COUNT_INVALID, DETERMINISTIC_PATCH_SCOPE_AMBIGUITY]
    prevention_refs: [STRUCTURAL_SCOPE_IDENTITY, EXACT_LINE_OR_SCOPE_CARDINALITY]
    regression_refs: [REG-STRUCTURAL-PLACEMENT-CARDINALITY]
    machine_checks: [STRUCTURAL_PLACEMENT_AND_CARDINALITY]
  MANIFEST_CONTRACT_CONSUMER_MISMATCH:
    traits: [standard_delivery]
    detection_contains: [MANIFEST_CONTRACT_CONSUMER_MISMATCH]
    prevention_refs: [SEALED_MANIFEST_CONSUMER_COMPATIBILITY]
    regression_refs: [REG-MANIFEST-CONSUMER-COMPATIBILITY]
    machine_checks: [SEALED_BUNDLE_MANIFEST_CONSUMER_COMPATIBILITY]
  KNOWN_FAILURE_FAMILY_PREVENTION_NOT_INHERITED:
    traits: [standard_delivery]
    detection_contains: [KNOWN_FAILURE_FAMILY_PREVENTION_NOT_INHERITED]
    prevention_refs: [APPLICABLE_FAILURE_FAMILY_INHERITANCE]
    regression_refs: [REG-KNOWN-FAMILY-INHERITANCE]
    machine_checks: [APPLICABLE_FAILURE_REGRESSION_BINDING]
  HANDOFF_CAPABILITY_EXISTENCE_CALLABILITY_COLLAPSE:
    traits: [powershell, standard_delivery]
    detection_contains: [CommandNotFoundException, HANDOFF_CAPABILITY_EXISTENCE_CALLABILITY_COLLAPSE]
    prevention_refs: [FRESH_EXECUTION_SURFACE_CALLABILITY_EVIDENCE_OR_SELF_CONTAINED_FALLBACK]
    regression_refs: [REG-STANDARD-HANDOFF-CALLABILITY]
    machine_checks: [OPTIONAL_HANDOFF_COMMAND_CALLABILITY_OR_FALLBACK]
  ACTIVATION_EVIDENCE_DEPENDENCY_NOT_REFRESHED:
    traits: [structured_text, standard_delivery]
    detection_contains: [CONTRACT_ACTIVATION_GAP, RUNTIME_EVIDENCE_STALE, ACTIVATION_EVIDENCE_DEPENDENCY_NOT_REFRESHED]
    prevention_refs: [CHANGED_RUNTIME_EVIDENCE_BASIS_REQUIRES_PROBE_REFRESH_BEFORE_CONTRACT_ACTIVATION_CLOSURE]
    regression_refs: [REG-ACTIVATION-EVIDENCE-BASIS-REFRESH]
    machine_checks: [ACTIVATION_EVIDENCE_DEPENDENCY_REFRESH]
  DEPENDENCY_IMPACT_CLOSURE_INCOMPLETE_BEFORE_HANDOFF:
    traits: [structured_text, standard_delivery, validator]
    detection_contains: [DEPENDENCY_IMPACT_CLOSURE_INCOMPLETE_BEFORE_HANDOFF, RUNTIME_EVIDENCE_STALE, CONTRACT_ACTIVATION_GAP]
    prevention_refs: [CHANGED_SOURCE_PATHS_REQUIRE_FULL_DEPENDENT_EVIDENCE_IMPACT_CLOSURE_BEFORE_HANDOFF]
    regression_refs: [REG-FULL-DEPENDENT-EVIDENCE-IMPACT-CLOSURE]
    machine_checks: [FULL_CHANGED_PATH_DEPENDENCY_IMPACT_CLOSURE, EXACT_CANDIDATE_CONTRACT_ACTIVATION_CLOSURE]
  PRODUCER_OUTPUT_SCHEMA_CONSUMER_MISMATCH:
    traits: [standard_delivery, validator]
    detection_contains: [PRODUCER_OUTPUT_SCHEMA_CONSUMER_MISMATCH, activation_gap_count, property cannot be found]
    prevention_refs: [PRODUCER_OUTPUT_SCHEMA_MUST_BE_EXECUTED_AGAINST_EVERY_MANDATORY_CONSUMER_BEFORE_HANDOFF]
    regression_refs: [REG-PRODUCER-CONSUMER-OUTPUT-COMPATIBILITY]
    machine_checks: [PRODUCER_CONSUMER_OUTPUT_SCHEMA_COMPATIBILITY]
  REQUIRED_TARGET_RUNTIME_NOT_EXECUTED_BEFORE_HANDOFF:
    traits: [standard_delivery, validator, target_runtime]
    detection_contains: [REQUIRED_TARGET_RUNTIME_NOT_EXECUTED_BEFORE_HANDOFF, TARGET_RUNTIME_VALIDATION_REQUIRED]
    prevention_refs: [TARGET_RUNTIME_PRE_HANDOFF_VALIDATION_WHEN_REQUIRED]
    regression_refs: [REG-TARGET-RUNTIME-PRE-HANDOFF-VALIDATION]
    machine_checks: [TARGET_RUNTIME_EXECUTION_RECEIPT, TARGET_RUNTIME_RECEIPT_CANDIDATE_BINDING]
positive_strengthening_metrics:
  fields: [user_execution_attempt, first_pass_success, resolved_failure_capsule_count, resulting_commit]
  authority: EVIDENCE_ONLY
  history_candidate_when: [FIRST_PASS_SUCCESS, REPEAT_FIRST_PASS_SUCCESS, MATERIAL_RELIABILITY_STRENGTHENING]
