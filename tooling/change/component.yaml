schema: cerebro-component/v1
component:
  id: change
  name: Cerebro Change Engine
  type: tooling
  version: 0.4.0
  status: active-source
responsibility:
  primary: Execute non-authoritative change assurance from immutable tooling snapshots before Working Source publication.
boundaries:
  must:
  - verify-capsule
  - use-exact-source-baseline
  - separate-git-baseline-from-physical-backup-identity
  - use-disposable-development-worktrees
  - inherit-applicable-failure-knowledge
  - classify-failure-families
  - block-on-unresolved-systemic-failure
  - resolve-stability-gate
  - auto-ingest-rehydrated-diagnostic-evidence
  - select-relevance-scoped-regression-bindings
  - bind-learning-basis-fingerprint-to-campaign-report
  - keep-positive-strengthening-evidence-separate-from-failure-events
  must_not:
  - create-source-authority
  - silently-promote-wisdom
  - mutate-runtime-0-1
  - bypass-quality-gate
  - bypass-cerebro-sync
dependencies:
  build: []
  runtime:
  - git
  - python
  - PyYAML
interfaces:
  consumes:
  - change-capsule
  - exact-source-repository
  - derived-failure-knowledge
  - operational-diagnostic-evidence
  - source-defined-campaign-policy
  produces:
  - campaign-report
  - derived-failure-knowledge
  - stability-gate-decision
  - assured-change-capsule-for-delivery
  - applicable-regression-bindings
  - learning-basis-fingerprint
version:
  component: 0.4.0
  schema: 1
assurance:
  known_failure_family_regressions:
  - representation-and-serialization
  - native-stderr-misclassification
  - identity-domain-conflation
  - powershell-target-language-parse-gap
  catalog_ref: tooling/change/campaign-policy.yaml
  invariant: KNOWN_APPLICABLE_FAILURE_FAMILY_WITH_MACHINE_ENFORCEABLE_PREVENTION_MUST_BE_BLOCKED_BEFORE_HANDOFF
