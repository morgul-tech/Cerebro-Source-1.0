schema: cerebro-component/v1
component:
  id: host
  name: Cerebro Host
  type: tooling
  version: 0.5.0
  status: active-source
responsibility:
  primary: Provide one small stable local entrypoint that verifies Source identity, selects an exact immutable tooling snapshot, and delegates execution.
boundaries:
  must:
    - verify-source-repository-binding
    - bind-to-exact-source-commit
    - dispatch-from-immutable-tooling-snapshot
    - preserve-delegate-argv-verbatim-after-component-selector-including-option-prefixed-first-token
    - preserve-live-child-output
    - dispatch-change-delivery-closure-and-diagnostics-capabilities
    - rehydrate-latest-unresolved-diagnostic-context-before-delegation
    - supervise-delegated-native-processes-through-one-reusable-path
    - persist-operation-journal-before-delegate-execution
    - emit-heartbeat-independent-of-child-stdout
    - preserve-process-observation-separately-from-material-poststate
    - keep-stall-detection-non-destructive-by-default
    - classify-unavailable-exit-status-as-unknown-not-nonzero
  must_not:
    - mutate-working-source
    - parse-roadmap
    - generate-source-content
    - own-quality-policy
    - own-publication-policy
    - own-runtime-transition-policy
dependencies:
  build: []
  runtime:
    - git
    - python
interfaces:
  consumes:
    - working-source-location
    - exact-source-commit
    - command
  produces:
    - delegated-process-result
    - operation-journal
    - process-observation
    - heartbeat-evidence
    - rehydrated-diagnostic-context-binding
    - diagnostic-capability-result
version:
  component: 0.1.0
  schema: 1
