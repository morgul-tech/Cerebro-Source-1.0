schema: cerebro-component/v1
component:
  id: host
  name: Cerebro Host
  type: tooling
  version: 0.10.0
  status: active-source
responsibility:
  primary: >-
    Provide the stable local host entrypoint and the single shared tooling.host
    process-supervision mechanism, including typed basis-bound Runtime2
    supervision that emits neutral process evidence without selecting work,
    control flow or semantic success, plus thin read-only Human Admin status/info
    dispatch into a separate presentation-owned projection consumer.
boundaries:
  must:
    - verify-source-repository-binding
    - bind-to-exact-source-commit
    - dispatch-from-immutable-tooling-snapshot
    - preserve-delegate-argv-verbatim-after-component-selector-including-option-prefixed-first-token
    - preserve-live-child-output
    - dispatch-change-delivery-closure-diagnostics-and-first-light-capabilities
    - dispatch-read-only-human-admin-status-and-info-without-owning-projection-truth
    - rehydrate-latest-unresolved-diagnostic-context-before-delegation
    - precommit-first-light-event-and-invocation-identity-before-child-start
    - supervise-delegated-native-processes-through-one-reusable-path
    - accept-typed-runtime2-supervision-request
    - bind-runtime2-supervision-to-exact-invocation-event-plan-node-and-execution-basis
    - persist-runtime2-pre-start-journal-before-process-start
    - resolve-and-recheck-exact-executable-before-process-start
    - use-direct-argv-with-shell-disabled
    - build-runtime2-child-environment-only-from-frozen-environment-binding
    - bind-runtime2-cwd-io-heartbeat-timeout-and-termination-policies
    - emit-heartbeat-independent-of-child-stdout-and-progress
    - preserve-process-observation-separately-from-material-poststate
    - classify-unavailable-exit-status-as-unknown-not-failure
    - preserve-start-failure-separately-from-process-exit
    - keep-stall-detection-non-destructive-by-default
    - require-explicit-safe-termination-policy-before-forced-termination
    - fingerprint-every-runtime2-evidence-artifact
    - prohibit-autonomous-retry-or-replay
    - keep-runtime2-diagnostics-evidence-only-and-non-masking
  must_not:
    - mutate-working-source
    - parse-roadmap
    - own-human-admin-projection-truth
    - generate-source-content
    - own-quality-policy
    - own-publication-policy
    - own-runtime-transition-policy
    - select-runtime2-work
    - add-runtime2-plan-nodes-or-branches
    - infer-semantic-pass-or-fail-from-process-exit
    - infer-progress-from-heartbeat-or-output-silence
    - inherit-ambient-environment-into-runtime2-child
    - use-shell-command-reconstruction-for-runtime2-supervision
    - silently-refresh-runtime2-execution-basis
    - autonomously-retry-or-replay-runtime2-effects
    - maintain-a-resident-runtime2-worker-pool
dependencies:
  build: []
  runtime:
    - git
    - python
interfaces:
  consumes:
    - working-source-location
    - exact-source-commit
    - command
    - runtime2-supervision-request-v1
    - human-admin-owner-snapshot-bundle-v1
  produces:
    - delegated-process-result
    - operation-journal
    - process-observation
    - heartbeat-evidence
    - rehydrated-diagnostic-context-binding
    - diagnostic-capability-result
    - runtime2-supervision-result-v1
    - runtime2-operation-journal-v1
    - runtime2-process-observation-operational-evidence-v0.1
    - runtime2-heartbeat-summary-v1
    - human-admin-projection-view-v1
documentation:
  runtime2_supervision_owner: tooling.host
  runtime2_control_owner: MCP
  runtime2_semantic_result_owner: capability-owner
  human_admin_projection_owner: presentation
  human_admin_owner_snapshot_authority: owner-local-provider-input
  human_admin_host_role: thin-read-only-dispatch
  runtime2_execution_modes:
    - SUPERVISED_PROCESS
    - ISOLATED_CAPABILITY_WORKER
  runtime2_isolation_rule: >-
    ISOLATED_CAPABILITY_WORKER is one fresh stateless process per node with only
    frozen serialized request/resource bindings. It is a process/state boundary,
    not an implicit security sandbox; stronger sandboxing is consumed only when
    the capability contract explicitly supplies a verified sandbox binding.
  legacy_dispatch_compatibility: >-
    Existing change/delivery/closure/diagnostics/first-light dispatch remains
    available but is not the canonical Runtime2 supervision path.
version:
  component: 0.10.0
  schema: 1
