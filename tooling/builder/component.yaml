schema: cerebro-component/v1
component:
  id: builder
  name: Builder
  type: tooling
  version: 1.0.0
  status: active-source
responsibility:
  primary: Bygge en deterministisk Cerebro Release fra gyldig Cerebro Source.
boundaries:
  must:
  - load-declared-components
  - build-deterministically
  - preserve-source-meaning
  must_not:
  - guess-missing-values
  - repair-invalid-source
  - change-rule-authority
  - move-rules-between-components
dependencies:
  build: []
  runtime: []
interfaces:
  consumes:
  - cerebro.yaml
  - component.yaml
  - rules.yaml
  - specification.md
  - PM-bound declarative exact15 cerebro-standard-delivery-package-input/v1
  produces:
  - release-manifest
  - compiled-rule-set
  - reference-manual
  - release-directory
  - non-authoritative cerebro-standard-delivery-manifest/v1
  - non-authoritative cerebro-change-capsule/v0.2
documentation:
  path: README.md
  standard_delivery_package:
    path: tooling/builder/standard_delivery_package.py
    modes:
    - build
    - verify
    - selftest
    boundary: Run-only generated bytes; PM admission, Source publication and S1a are separate effects.
version:
  component: 1.0.0
  schema: 1
