schema: cerebro-builder-contract/v1

builder:
  id: builder
  owner: tooling.builder
  component_path: tooling/builder/component.yaml
  status: active-source
  authority: cerebro-source
  introduced_by: PATCH-BUILDER-ARCH-001

purpose:
  - define_builder_operational_contract
  - align_physical_patch_generation_with_existing_patch_package_standard
  - prevent_ad_hoc_patch_script_generation
  - preserve_existing_builder_component_ownership

authoritative_references:
  manifest_tooling_entry: cerebro.yaml:tooling.builder
  governing_patch_standard: standards/patch-package.yaml
  builder_component: tooling/builder/component.yaml

ownership:
  owns:
    - deterministic_release_build_process
    - declarative_patch_input_consumption
    - physical_patch_package_generation
    - patch_directory_artifact_generation
    - packaged_patch_artifact_generation
    - patch_manifest_generation
    - payload_digest_generation
    - generation_baseline_capture
  must_not_own:
    - source_authority
    - source_rule_meaning
    - source_repair
    - release_publication_decision
    - runtime_mutation
    - patch_installation
    - quality_gate_decision
    - project_roadmap_decision

patch_generation_contract:
  governing_standard: standards/patch-package.yaml
  input_type: declarative_patch_input
  output_type:
    - patch_package_directory
    - packaged_patch_artifact
  authority: non_authoritative_generated_artifact

  required_input:
    - patch_identity
    - patch_version
    - target_repository
    - target_branch
    - declared_file_operations
    - declared_destination_roots
    - generation_baseline
    - payload_content

  required_output:
    - manifest
    - payload
    - sha256_digests
    - generation_baseline_record
    - package_identity
    - validation_record

  allowed_file_operations:
    - create
    - replace
    - delete

  required_generation_flow:
    - load_declarative_patch_input
    - load_governing_patch_package_standard
    - verify_declared_authority_target
    - verify_safe_relative_paths
    - verify_allowed_operations
    - capture_generation_baseline
    - generate_payload_directory
    - generate_manifest
    - generate_sha256_digests
    - validate_directory_artifact
    - generate_packaged_artifact
    - validate_packaged_artifact
    - lock_generated_output

  validation_requirements:
    - directory_form_validates_against_patch_package_standard
    - packaged_form_validates_against_patch_package_standard
    - every_payload_digest_matches_manifest
    - every_destination_is_under_declared_root
    - no_absolute_paths
    - no_parent_traversal
    - no_alternate_data_streams
    - no_shell_expansion_in_verification_commands
    - no_automatic_dependency_installation

  handoff:
    install_owner: patch-installer
    quality_owner: quality-gate
    publication_owner: publication-gate
    validator_owner: validator

standard_handoff_convergence:
  introduced_by: PATCH-007.PRE-002
  status: active
  governing_standard: standards/change-delivery.yaml
  principle: NO_USER_HANDOFF_WITHOUT_MACHINE_VERIFIED_HANDOFF_ASSURANCE
  output_contract:
    standard_delivery_unit:
      - exactly_one_bundle_zip
      - exactly_one_launcher_powershell
      - exactly_one_copyable_command
    handoff_assurance_receipt: required
  assurance_before_handoff:
    - validate_standard_shape
    - validate_launcher_and_bundle_identity
    - validate_cpatch_bundle_aware_compatibility
    - validate_powershell_parse
    - validate_runtime_semantic_failure_families
    - validate_cwd_independence
    - validate_line_ending_representation_independence
    - validate_run_to_pass_binding
    - validate_recovery_contract
    - validate_sealed_manifest_consumer_compatibility
    - validate_structural_placement_and_cardinality
    - validate_diagnostic_failure_capture_contract
    - validate_primary_failure_preservation_when_diagnostics_degrade
  failure_effect: BLOCK_HANDOFF
  execution_bridge:
    function: cpatch
    extension_mode: BUNDLE_AWARE
    parallel_bootstrap: false
    process_scoped_execution_policy_only: true
    permanent_execution_policy_change: false
  evidence:
    authority: EVIDENCE_ONLY
    output: HANDOFF_ASSURANCE_RECEIPT

diagnostic_failure_capture:
  introduced_by: PATCH-007.PRE-004
  status: active
  governing_contracts:
    - standards/change-delivery.yaml
    - standards/operational-evidence.yaml
  applies_to: STANDARD_generated_launchers
  required_runner_behavior:
    - maintain-current-stage
    - preserve-primary-exception
    - create-machine-readable-failure-seed
    - invoke-canonical-diagnostic-capture-when-available
    - persist-minimal-fallback-seed-outside-source-when-unavailable
    - keep-diagnostic-store-outside-working-source
    - preserve-bounded-rollback
    - resolve-related-capsules-on-success-when-available
  required_seed_identity:
    - patch_id
    - revision
    - baseline_commit
    - bundle_filename
    - bundle_sha256
    - launcher_filename
  required_failure_evidence:
    - stage
    - detection
    - exception_message
    - stack_when_available
    - exit_code_when_available
    - mutation_started
    - sync_started
    - backup_root
    - transcript_path_when_available
  handoff_assurance_canaries:
    - diagnostic-capture-failure-does-not-replace-primary-failure
    - no-diagnostic-write-occurs-inside-working-source
    - failure-seed-is-valid-json
    - canonical-tool-selftest-passes-when-tool-is-part-of-target-baseline
    - unresolved-capsule-can-be-auto-rehydrated
    - resolution-retains-resulting-commit
  user_role: USER_IS_NOT_THE_DIAGNOSTIC_TRANSPORT_PROCESSOR

failure_learning_and_regression_binding:
  introduced_by: PATCH-007.PRE-005
  status: active
  regression_policy_ref: tooling/change/campaign-policy.yaml
  required_before_material_handoff:
    - load_relevant_failure_and_diagnostic_evidence
    - select_applicable_failure_families
    - bind_every_machine_enforceable_prevention_to_assurance_check
    - compute_learning_basis_fingerprint
    - invalidate_candidate_if_learning_basis_changes
  failure_effect: BLOCK_HANDOFF
  success_metrics:
    authority: EVIDENCE_ONLY
    fields:
      - user_execution_attempt
      - first_pass_success
      - resolved_failure_capsule_count
      - resulting_commit
  invariant: KNOWN_APPLICABLE_FAILURE_FAMILY_WITH_MACHINE_ENFORCEABLE_PREVENTION_MUST_BE_BLOCKED_BEFORE_USER_HANDOFF

local_patch_rule:
  rule: local_patch_artifacts_must_be_generated_from_builder_contract_and_patch_package_standard
  consequence:
    - ad_hoc_physical_patch_scripts_are_invalid
    - local_execution_helpers_are_non_authoritative
    - generated_artifacts_must_not_replace_source_authority

baseline_rule:
  rule: runtime_destination_baseline_must_match_generation_baseline_before_mutation
  mismatch_result: BASELINE_MISMATCH

dependency_rule:
  rule: missing_dependency_must_not_be_auto_installed
  missing_dependency_result: BLOCKED_PREREQUISITE

result_code_reference:
  source: standards/patch-package.yaml

# BEGIN PATCH-001A.PRE-002 COMMAND AND DELIVERY MODES

command_language_binding:
  introduced_by: PATCH-001A.PRE-002
  status: active
  authority: cerebro-source
  architecture_reopened: false

  canonical_shape: COMMAND OBJECT MODE

  command_terms:
    BUILD:
      owner: mcp.operations
      builder_relevance: true
      meaning: create_or_prepare_patch_artifact
      must_not_imply:
        - apply
        - implement
        - push
        - runtime_activation

  object_resolution:
    rule: object_handle_must_resolve_to_registered_canonical_id
    if_unknown: block_or_ask
    must_not:
      - infer_patch_from_similar_name
      - auto_create_alias
      - treat_short_handle_as_canonical_id

  delivery_mode_semantics:
    rule: mode_modifies_delivery_not_patch_identity
    owner: tooling.builder
    must_not:
      - change_patch_identity
      - change_source_authority
      - define_new_patch_standard

patch_reference_registry:
  introduced_by: PATCH-001A.PRE-002
  status: active

  canonical_identity_rule:
    rule: canonical_patch_id_remains_authoritative
    applies_to:
      - manifest_patch_id
      - patch_filename
      - roadmap_reference
      - dependency_reference

  short_handle_rule:
    rule: short_handle_is_user_command_alias_only
    must_resolve_to_registered_canonical_id: true
    unknown_handle_result: block_or_ask

  format:
    main_patch:
      canonical: PATCH-NNNX
      handle: P<N>X
      example:
        canonical_id: PATCH-001A
        short_handle: P1A

    prerequisite_patch:
      canonical: PATCH-NNNX.PRE-NNN
      handle: P<N>X-PR<N>
      example:
        canonical_id: PATCH-001A.PRE-002
        short_handle: P1A-PR2

  registry:
    - canonical_id: PATCH-001A
      short_handle: P1A
      title: cerebro_architecture_contracts

    - canonical_id: PATCH-001A.PRE-001
      short_handle: P1A-PR1
      title: builder_contract_prerequisite
      status: applied
      commit: 5807dd2
      trace_alias:
        - PATCH-BUILDER-ARCH-001

    - canonical_id: PATCH-001A.PRE-002
      short_handle: P1A-PR2
      title: command_language_and_delivery_modes
      status: applied_by_this_patch

    - canonical_id: PATCH-001B
      short_handle: P1B
      title: project_roadmap_contract

    - canonical_id: PATCH-001C.PRE-001
      short_handle: P1C-PR1
      title: sealed_pshell_transport_and_source_sync_recovery
      status: verified
    - canonical_id: PATCH-001C
      short_handle: P1C
      title: bootengine_alignment

    - canonical_id: PATCH-002
      short_handle: P2
      title: universal_object_contract

    - canonical_id: PATCH-001A.PRE-009
      short_handle: P1A-PR9
      title: early_delivery_capability_and_mode_lock
      status: superseded_unapplied
      superseded_by: PATCH-001A.PRE-010

    - canonical_id: PATCH-001A.PRE-010
      short_handle: P1A-PR10
      title: delivery_aware_native_execution_hotfix
      status: applied_by_this_patch
      artifact_revision: 5
      trigger_alias:
        - ORDER66

patch_delivery_modes:
  introduced_by: PATCH-001A.PRE-002
  owner: tooling.builder
  governing_standard: standards/patch-package.yaml

  authority_rule:
    rule: execution_or_delivery_mode_does_not_change_patch_authority
    generated_artifacts_authoritative: false

  preferred_order:
    - FULL
    - EXEC
    - PSHELL

  modes:
    FULL:
      meaning: full_patch_package
      status: canonical_patch_package_delivery
      produces:
        - patch_package_directory
        - packaged_patch_artifact
      requires:
        - manifest
        - payload
        - sha256_digests
        - generation_baseline_record
        - validation_record
      must_follow:
        - standards/patch-package.yaml
        - builder_contract

    EXEC:
      meaning: executable_or_self_running_local_patch_package
      status: authorized_local_execution_delivery
      produces:
        - patch_package_with_runner_or_installer_entrypoint
      requires:
        - manifest_defined_scope
        - baseline_verification
        - digest_verification
        - explicit_user_execution
      must_not:
        - define_new_patch_standard
        - install_missing_dependencies
        - bypass_patch_package_standard

    PSHELL:
      meaning: powershell_manual_transport
      status: fallback_transport_mode
      produces:
        - visible_powershell_commands
      allowed_when:
        - file_download_delivery_fails
        - direct_connected_execution_unavailable
        - user_explicitly_selects_pshell
      requires:
        - same_declared_patch_content_as_builder_output
        - visible_mutation_steps
        - explicit_repo_path_or_workspace_binding
        - git_commands_when_available
      must_not:
        - become_canonical_patch_format
        - bypass_builder_contract
        - hide_mutation_steps
        - change_patch_identity

example_commands:
  - input: BUILD PATCH-001A FULL
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: FULL

  - input: BUILD PATCH-001A EXEC
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: EXEC

  - input: BUILD PATCH-001A PSHELL
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: PSHELL

  - input: build P1A-PR2 pshell
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A.PRE-002
      short_handle: P1A-PR2
      mode: PSHELL

# END PATCH-001A.PRE-002 COMMAND AND DELIVERY MODES


# BEGIN PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT

pshell_required_minimum_delivery:
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder
  governing_standard: standards/patch-package.yaml

  rule: PSHELL_delivery_mode_is_required_minimum_local_delivery_for_local_patches_unless_explicitly_excluded

  rationale:
    - regular_chat_has_no_local_terminal
    - Work_or_DIRECT_mode_is_not_always_available
    - downloadable_artifacts_may_fail
    - user_local_powershell_execution_is_verified_working

  constraints:
    - PSHELL_is_transport_not_patch_authority
    - PSHELL_must_use_registered_canonical_patch_id
    - PSHELL_must_use_registered_short_handle
    - PSHELL_must_not_create_new_patch_standard
    - PSHELL_must_not_hide_mutation_steps
    - PSHELL_must_follow_builder_contract_and_patch_package_standard

pshell_result_contract:
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder

  requirement:
    every_pshell_patch_must_end_with_clear_human_readable_result_block: true
    raw_git_output_is_not_sufficient_as_final_patch_feedback: true
    user_must_not_have_to_infer_patch_state_from_diff_or_git_output: true

  result_block_required_fields:
    - patch_id
    - short_handle
    - delivery_mode
    - repo_path
    - baseline_status
    - file_change_status
    - git_add_status
    - commit_status
    - push_status
    - worktree_status
    - final_state
    - user_action_required
    - next_command

  final_states:
    - SUCCESS_PUSHED
    - SUCCESS_LOCAL_COMMIT
    - SUCCESS_STAGED_ONLY
    - SUCCESS_APPLIED_NOT_STAGED
    - ALREADY_APPLIED
    - BLOCKED_USER_INPUT_REQUIRED
    - BLOCKED_GIT_REQUIRED
    - BLOCKED_BASELINE_MISMATCH
    - FAILED_NO_MUTATION
    - FAILED_PARTIAL_REQUIRES_ATTENTION

pshell_sync_receipt_contract:
  cleanup_record:
    introduced_by: PATCH-001A.PRE-004
    short_handle: P1A-PR4
    action: removed_overlapping_previous_P1A_PR3_state_contract_block
    retained_contract: PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT
    reason:
      - prevent_duplicate_pshell_result_contracts
      - preserve_single_current_pshell_sync_receipt_contract
      - remove_ambiguity_before_PATCH-001A
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder

  purpose:
    - provide_machine_friendly_patch_completion_confirmation
    - allow_user_to_report_patch_state_compactly
    - trigger_assistant_repo_refresh_before_next_patch_decision
    - bind_patch_result_to_commit_worktree_and_target_file_hash

  receipt_line:
    canonical_prefix: CEREBRO_SYNC
    format: CEREBRO_SYNC PATCH=<patch_id> HANDLE=<short_handle> MODE=<delivery_mode> STATE=<final_state> BRANCH=<branch> COMMIT=<commit> WORKTREE=<worktree> RECEIPT=<sha256>

  receipt_hash:
    algorithm: SHA256
    generated_after:
      - final_git_status_check
      - final_state_resolution
    includes:
      - patch_id
      - short_handle
      - delivery_mode
      - final_state
      - branch
      - commit
      - worktree
      - target_file_sha256_after

  assistant_behavior_on_cerebro_sync:
    - treat_sync_line_as_user_reported_execution_receipt_and_refresh_trigger
    - do_not_treat_receipt_as_source_authority
    - fetch_current_authoritative_repo_state_before_next_patch_decision
    - verify_expected_file_or_commit_when_possible
    - then_update_patch_status

# END PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT

# BEGIN PATCH-001A.PRE-006 PSHELL PAYLOAD PRESENTATION CONTRACT

pshell_payload_presentation_contract:
  introduced_by: PATCH-001A.PRE-006
  short_handle: P1A-PR6
  status: active
  owner: presentation_boundary
  scope:
    - PSHELL_delivery_mode_only

  purpose:
    - optimize_copy_workflow
    - reduce_large_code_block_visual_noise
    - separate_payload_from_explanation

  temporary_architecture:
    true

  migration_marker:
    id: FUTURE-VISUAL-MIGRATION-POINT-001
    purpose:
      - identify_temporary_PSHELL_presentation_logic
      - prevent_duplicate_future_visual_implementation
      - allow_removal_when_visual_engine_exists

  future_owner:
    components:
      - presentation_engine
      - visual_language

  current_owner:
    tooling.builder:
      responsibility:
        - expose_copyable_payload
      must_not:
        - own_visual_semantics
        - define_global_UI_rules
        - replace_visual_engine

  display_contract:
    adaptive_height: true
    maximum_display_height: true

    requirements:
      - preserve_complete_copy_payload
      - support_single_copy_action
      - support_multiple_named_code_blocks
      - separate_metadata_from_payload

  migration:
    remove_when:
      - visual_code_delivery_exists
      - presentation_runtime_supports_structured_payload_views

# END PATCH-001A.PRE-006 PSHELL PAYLOAD PRESENTATION CONTRACT

# BEGIN PATCH-001A.PRE-010 DELIVERY-AWARE NATIVE EXECUTION HOTFIX

development_delivery_preflight:
  introduced_by: PATCH-001A.PRE-010
  short_handle: P1A-PR10
  artifact_revision: 5
  owner: tooling.builder
  authority: cerebro-source
  architecture_change: false

  required_order:
    - explicit_mandate_gate
    - existing_local_capability_resolution
    - explicit_delivery_mode_resolution
    - current_context_capability_gate
    - delivery_mode_selection
    - payload_classification
    - delivery_mode_lock
    - target_host_compatibility_contract
    - physical_patch_generation
    - generated_helper_validation
    - delivery
    - delivery_access_verification

  mandate_gate:
    artifact_generation_requires_explicit_user_authorization: true

  delivery_paths:
    WORK:
      requires:
        - Work_active
        - Work_accepted
        - workspace_or_repository_tools_available

    SELF_RUNNING_FILE:
      requires:
        - file_generation_available_in_current_context
        - exact_artifact_registration_verified
        - user_download_delivery_verified_on_at_least_one_declared_surface
      declared_surfaces:
        CHAT_ATTACHMENT:
          success_requires:
            - artifact_presented_in_chat
            - user_access_verified
        LIBRARY:
          success_requires:
            - exact_artifact_registered_in_library
            - user_open_or_download_verified
          chat_attachment_may_be: DEGRADED
      surface_resolution:
        rule: any_verified_declared_level2_surface_satisfies_delivery
        prefer_chat_when_verified: true
        library_is_valid_fallback_within_level2: true
        reopen_delivery_mode_only_when_no_level2_surface_is_verified: true
      output:
        - one_self_running_local_script
      user_flow:
        - obtain_exact_artifact_from_verified_surface
        - use_cpatch_exact_file_execution_when_available
        - return_terminal_patch_receipt
      cpatch_execution_handoff:
        introduced_by: PATCH-003.PRE-005
        command_shape: "cpatch <exact_filename.ps1> <sha256>"
        canonical_run_root: 'D:\Cerebro\Run'
        discovery_roots:
          - 'D:\Cerebro\Run'
          - "current_user_windows_downloads"
        requires:
          - exact_filename
          - full_sha256
          - ps1_extension
          - CEREBRO_artifact_filename
          - file_under_declared_discovery_root
          - sha256_match_before_execution
          - powershell_parser_zero_errors
        behavior:
          - stage_verified_copy_to_canonical_run_root_when_downloaded_elsewhere
          - unblock_file_when_supported
          - execute_in_child_powershell_attached_to_same_visible_parent_terminal
          - preserve_parent_terminal_after_child_exit
          - expose_child_exit_code
          - do_not_claim_patch_success_from_process_exit_alone
        host_visibility:
          environment_signal: CEREBRO_CPATCH_HOST
          value: "1"
          meaning: parent_user_terminal_is_preserved
          generated_payload_may_skip_internal_ReadHost_when_signal_is_exactly_1: true
        fallback_when_cpatch_unavailable:
          - provide_one_copyable_exact_path_Unblock_File_and_execution_command
        must_not:
          - execute_latest_file
          - use_wildcard_patch_selection
          - scan_and_execute_arbitrary_ps1
          - execute_without_digest_verification
          - require_manual_file_relocation
          - require_file_explorer_or_run_as_powershell
      prohibited:
        - archive_without_explicit_request
        - internal_only_artifact
        - unverified_download_claim
        - treating_chat_surface_failure_as_total_level2_failure_when_library_access_is_verified
        - manual_file_relocation

    PSHELL:
      select_when:
        - Work_unavailable_or_not_accepted
        - self_running_file_delivery_unavailable_or_unverified
      output:
        - one_complete_copyable_PowerShell_payload

  delivery_mode_lock:
    required_before:
      - final_physical_patch_structure
      - physical_transport_generation
    reopen_only_on:
      - verified_capability_change
      - explicit_user_instruction
      - selected_mode_validation_failure
    must_not_change:
      - logical_architecture
      - component_ownership
      - source_authority
      - patch_identity

  delivery_state_separation:
    states:
      - artifact_created
      - artifact_published
      - artifact_delivered
      - artifact_accessible
    rule: artifact_creation_does_not_prove_user_access

native_process_execution_contract:
  introduced_by: PATCH-001A.PRE-010
  short_handle: P1A-PR10
  owner: tooling.builder
  applies_to:
    - generated_local_execution_helpers
    - EXEC_delivery_helpers
    - PSHELL_delivery_helpers

  minimum_host:
    - Windows_PowerShell_5_1

  canonical_result:
    fields:
      - executable
      - argument_tokens
      - start_status
      - exit_code
      - allowed_exit_codes
      - stdout
      - stderr
      - timeout_status
      - classification
      - success

  classifications:
    - SUCCESS
    - EXPECTED_ALTERNATIVE_EXIT
    - PROCESS_START_FAILED
    - PROCESS_EXIT_FAILED
    - NATIVE_ADAPTER_SELFTEST_FAILED

  success_resolution:
    authority: declared_allowed_exit_codes
    stderr_presence_implies_failure: false
    stdout_presence_implies_success: false

  stream_contract:
    - preserve_argument_tokens
    - capture_stdout_and_stderr_separately
    - preserve_both_streams_for_diagnostics
    - read_LASTEXITCODE_immediately_after_process_completion
    - restore_PowerShell_error_state_in_finally
    - redact_credentials_before_user_visible_reporting

  command_exit_contracts:
    git_default:
      allowed_exit_codes:
        - 0

    git_diff_quiet:
      allowed_exit_codes:
        - 0
        - 1
      meaning:
        exit_0: no_difference
        exit_1: difference_present

    git_grep:
      allowed_exit_codes:
        - 0
        - 1
      meaning:
        exit_0: match_found
        exit_1: no_match

  prohibited:
    - ProcessStartInfo_ArgumentList_dependency
    - manual_single_argument_string_construction
    - stderr_only_failure_classification
    - ErrorActionPreference_as_exit_code_authority
    - hidden_native_process_failure
    - hidden_repository_assessment_failure
    - git_fetch_special_case

  generated_helper_selftest:
    required_before_repository_assessment: true
    cases:
      - stdout_exit_0
      - stderr_exit_0
      - separated_stdout_and_stderr
      - allowed_exit_1
      - rejected_exit_7
      - missing_executable
      - argument_with_spaces

repository_assessment_contract:
  introduced_by: PATCH-001A.PRE-010
  owner: tooling.builder

  statuses:
    - VALID
    - PATH_REQUIRED
    - PATH_NOT_FOUND
    - CEREBRO_MANIFEST_MISSING
    - NOT_GIT_REPOSITORY
    - GIT_EXECUTION_FAILED
    - REMOTE_MISMATCH
    - BRANCH_MISMATCH
    - TARGET_FILE_MISSING

  requirements:
    - preserve_underlying_native_failure
    - distinguish_repository_state_from_process_state
    - use_explicit_repository_binding
    - block_before_mutation_on_non_VALID_status

order66_command:
  trigger: ORDER66
  canonical_patch: PATCH-001A.PRE-010
  short_handle: P1A-PR10
  action: start_delivery_aware_native_execution_hotfix_pipeline

  requires:
    - refresh_authoritative_source
    - verify_failed_patch_did_not_mutate_source
    - run_development_delivery_preflight
    - validate_native_execution_adapter
    - resolve_repository_state
    - build_one_selected_delivery_payload

  must_not:
    - reuse_failed_native_wrapper
    - continue_superseded_PATCH_001A_PRE_009
    - generate_unrequested_archive
    - assume_tools_from_another_context
    - continue_after_failed_adapter_selftest

structured_state_compatibility:
  introduced_by: PATCH-001A.PRE-010
  implementation_status: deferred
  future_consumers:
    - runtime
    - visual_engine
  consumable_fields:
    - mandate_status
    - capability_status
    - delivery_path
    - delivery_mode_lock
    - native_process_result
    - repository_assessment
    - delivery_state
  ownership_transfer: prohibited

# END PATCH-001A.PRE-010 DELIVERY-AWARE NATIVE EXECUTION HOTFIX

# BEGIN PATCH-001C.PRE-001 SEALED PSHELL TRANSPORT AND SOURCE SYNC RECOVERY

sealed_pshell_transport_profile:
  introduced_by: PATCH-001C.PRE-001
  short_handle: P1C-PR1
  status: active
  owner: tooling.builder
  delivery_mode: PSHELL
  profile: SEALED_V1
  architecture_change: false

  purpose:
    - remove_stateful_clipboard_handoffs
    - enforce_single_copy_single_paste_delivery
    - prevent_markdown_and_explanation_contamination
    - minimize_visible_serialization_overhead
    - preserve_deterministic_local_validation

  user_flow:
    required_actions:
      - copy_one_complete_command
      - paste_once_into_powershell
    prohibited_dependencies:
      - preserved_clipboard_state
      - manual_payload_reassembly
      - manual_hash_replacement
      - manual_command_retyping_when_avoidable

  envelope:
    payload_encoding:
      compression: gzip
      transport: base64
      decoded_text: UTF8
    visible_integrity_token:
      source: SHA256_prefix
      hexadecimal_characters: 12
      purpose: non_adversarial_transport_error_detection
    full_integrity:
      algorithm: SHA256
      computed_locally_before_receiver_call: true
      receiver_must_verify_full_digest: true
    target_binding:
      explicit_target_required: true
      allowed_root_validation_required: true
    validation_order:
      - decode
      - verify_visible_integrity_token
      - derive_full_digest
      - construct_receiver_envelope
      - verify_length
      - verify_full_digest
      - validate_target
      - parse_payload
      - atomic_install

  producer_requirements:
    - calculate_digest_from_final_serialized_bytes
    - selfvalidate_payload_before_delivery
    - distinguish_producer_digest_error_from_transport_corruption
    - emit_one_complete_copyable_command
    - keep_explanation_outside_executable_payload

  local_receiver:
    canonical_command: cerebro_receive
    implementation_template: tooling/builder/templates/pshell/Cerebro.Tools.psm1
    authority: non_authoritative_generated_helper

source_sync_recovery_contract:
  introduced_by: PATCH-001C.PRE-001
  short_handle: P1C-PR1
  status: active
  owner: tooling.builder
  implementation_template: tooling/builder/templates/pshell/cerebro_sync.ps1

  direction:
    source: verified_local_working_source
    target: authoritative_source_remote

  baseline:
    establish_with:
      - git_fetch
      - remote_tracking_ref
    must_not_use:
      - git_pull
      - git_reset_to_remote
      - automatic_merge
      - local_work_overwrite

  publication:
    stage_only_declared_paths_when_paths_are_supplied: true
    commit_only_when_staged_diff_exists: true
    push_mode: force_with_lease
    verify_remote_commit_equals_local_head: true
    allow_known_remaining_changes_only_when_explicit: true

  native_process_semantics:
    success_authority: allowed_exit_codes
    stderr_on_exit_zero: diagnostic_not_failure
    stdout_and_stderr_separate: true
    immediate_exit_code_capture: true

  machine_result:
    human_readable_result_required: true
    receipt_required: true
    full_digest_visibility:
      internal_or_authoritative_only: true
      compact_user_visible_receipt_preferred: true

# END PATCH-001C.PRE-001 SEALED PSHELL TRANSPORT AND SOURCE SYNC RECOVERY
# BEGIN PATCH-001C.PRE-002 CORRECTIVE DELIVERY PREFLIGHT

corrective_delivery_preflight:
  introduced_by: PATCH-001C.PRE-002
  short_handle: P1C-PR2
  status: active
  owner: tooling.builder
  authority: cerebro-source
  extends: development_delivery_preflight
  architecture_change: false

  existing_local_capability_resolution:
    purpose: avoid_unnecessary_transport_generation
    inspect:
      - registered_cerebro_commands
      - exported_pshell_functions
      - existing_local_scripts
      - active_patch_tools
    outcomes:
      CAPABILITY_MATCH:
        generate_new_transport: false
        action: use_existing_capability
      NO_CAPABILITY_MATCH:
        action: continue_delivery_preflight
      AMBIGUOUS_MATCH:
        action: resolve_from_active_state_or_control_stop

  explicit_delivery_mode_resolution:
    accepted_modes:
      - WORK
      - SELF_RUNNING_FILE
      - PSHELL
    explicit_valid_user_selection: honor
    invalid_or_unavailable_selection: report_and_continue_only_if_authorized
    safety_and_baseline_gates_remain_mandatory: true

  rejection_scope:
    key:
      - candidate_ref
      - development_run_ref
      - delivery_mode
    effect: mode_unavailable_for_current_run
    reopen_when:
      - explicit_user_reversal
      - verified_capability_change
      - new_development_run

  pshell_classification:
    payload_class:
      - SMALL
      - LARGE_OR_SENSITIVE
    serialization:
      - PLAIN
      - SEALED
    automatic_large_or_sensitive_triggers:
      - contains_base64_or_compressed_blob
      - creates_or_replaces_complete_file_content
      - contains_here_string
      - depends_on_backtick_line_continuation
      - partial_copy_can_mutate_source
      - partial_copy_can_create_invalid_artifact
      - exceeds_configured_character_threshold

  large_or_sensitive_inline_pshell:
    classification: last_fallback
    allowed_only_when:
      - WORK_unavailable_or_rejected
      - SELF_RUNNING_FILE_unavailable_or_unverified
      - no_existing_local_capability_matches
      - PSHELL_valid_for_target_host
      - explicit_fallback_reason_recorded

  decision_record:
    required_before:
      - final_physical_patch_structure
      - physical_transport_generation
    required_fields:
      - candidate_ref
      - existing_local_capability_result
      - selected_delivery_mode
      - payload_class
      - serialization
      - rejected_modes
      - fallback_reason
      - delivery_locked

# END PATCH-001C.PRE-002 CORRECTIVE DELIVERY PREFLIGHT
# BEGIN PATCH-001C.POST-001 STREAMLINED PATCH WORKFORM

streamlined_patch_workform:
  introduced_by: PATCH-001C.POST-001
  contract_ref: standards/development/streamlined-patch-workform.yaml
  status: locked
  owner: tooling.builder
  architecture_change: false

  required_before_physical_patch_generation:
    - locked_patch_intent
    - scope_critique_completed
    - minimal_correct_scope_resolved
    - authoritative_basis_resolved
    - repository_verified
    - expected_branch_verified
    - expected_base_commit_verified
    - clean_worktree_verified
    - target_files_resolved
    - delivery_mode_locked
    - existing_local_capability_verified
    - synchronization_capability_verified
    - acceptance_criteria_defined
    - backup_location_prepared

  implementation_policy:
    reuse_existing_methods_first: true
    no_new_solution_without_documented_gap: true
    mutation_before_readiness_gate: prohibited
    broad_scope_without_measurable_acceptance: prohibited
    user_roundtrips_after_scope_lock: minimize
    direct_GitHub_source_mutation: prohibited

  delivery_level_3:
    preferred: self_running_PSHELL
    single_payload_preferred_when_environment_verified: true
    multiple_payloads_allowed_when_safer: true
    required_payload_features:
