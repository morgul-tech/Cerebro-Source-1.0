schema: cerebro-builder-contract/v1

builder:
  id: builder
  owner: tooling.builder
  component_path: tooling/builder/component.yaml
  status: active-source
  authority: cerebro-source
  introduced_by: PATCH-BUILDER-ARCH-001

purpose:
  - define_builder_operational_contract
  - align_physical_patch_generation_with_existing_patch_package_standard
  - prevent_ad_hoc_patch_script_generation
  - preserve_existing_builder_component_ownership

authoritative_references:
  manifest_tooling_entry: cerebro.yaml:tooling.builder
  governing_patch_standard: standards/patch-package.yaml
  builder_component: tooling/builder/component.yaml

ownership:
  owns:
    - deterministic_release_build_process
    - declarative_patch_input_consumption
    - physical_patch_package_generation
    - patch_directory_artifact_generation
    - packaged_patch_artifact_generation
    - patch_manifest_generation
    - payload_digest_generation
    - generation_baseline_capture
  must_not_own:
    - source_authority
    - source_rule_meaning
    - source_repair
    - release_publication_decision
    - runtime_mutation
    - patch_installation
    - quality_gate_decision
    - project_roadmap_decision

patch_generation_contract:
  governing_standard: standards/patch-package.yaml
  input_type: declarative_patch_input
  output_type:
    - patch_package_directory
    - packaged_patch_artifact
  authority: non_authoritative_generated_artifact

  required_input:
    - patch_identity
    - patch_version
    - target_repository
    - target_branch
    - declared_file_operations
    - declared_destination_roots
    - generation_baseline
    - payload_content

  required_output:
    - manifest
    - payload
    - sha256_digests
    - generation_baseline_record
    - package_identity
    - validation_record

  allowed_file_operations:
    - create
    - replace
    - delete

  required_generation_flow:
    - load_declarative_patch_input
    - load_governing_patch_package_standard
    - verify_declared_authority_target
    - verify_safe_relative_paths
    - verify_allowed_operations
    - capture_generation_baseline
    - generate_payload_directory
    - generate_manifest
    - generate_sha256_digests
    - validate_directory_artifact
    - generate_packaged_artifact
    - validate_packaged_artifact
    - lock_generated_output

  validation_requirements:
    - directory_form_validates_against_patch_package_standard
    - packaged_form_validates_against_patch_package_standard
    - every_payload_digest_matches_manifest
    - every_destination_is_under_declared_root
    - no_absolute_paths
    - no_parent_traversal
    - no_alternate_data_streams
    - no_shell_expansion_in_verification_commands
    - no_automatic_dependency_installation

  handoff:
    install_owner: patch-installer
    quality_owner: quality-gate
    publication_owner: publication-gate
    validator_owner: validator

local_patch_rule:
  rule: local_patch_artifacts_must_be_generated_from_builder_contract_and_patch_package_standard
  consequence:
    - ad_hoc_physical_patch_scripts_are_invalid
    - local_execution_helpers_are_non_authoritative
    - generated_artifacts_must_not_replace_source_authority

baseline_rule:
  rule: runtime_destination_baseline_must_match_generation_baseline_before_mutation
  mismatch_result: BASELINE_MISMATCH

dependency_rule:
  rule: missing_dependency_must_not_be_auto_installed
  missing_dependency_result: BLOCKED_PREREQUISITE

result_code_reference:
  source: standards/patch-package.yaml

# BEGIN PATCH-001A.PRE-002 COMMAND AND DELIVERY MODES

command_language_binding:
  introduced_by: PATCH-001A.PRE-002
  status: active
  authority: cerebro-source
  architecture_reopened: false

  canonical_shape: COMMAND OBJECT MODE

  command_terms:
    BUILD:
      owner: mcp.operations
      builder_relevance: true
      meaning: create_or_prepare_patch_artifact
      must_not_imply:
        - apply
        - implement
        - push
        - runtime_activation

  object_resolution:
    rule: object_handle_must_resolve_to_registered_canonical_id
    if_unknown: block_or_ask
    must_not:
      - infer_patch_from_similar_name
      - auto_create_alias
      - treat_short_handle_as_canonical_id

  delivery_mode_semantics:
    rule: mode_modifies_delivery_not_patch_identity
    owner: tooling.builder
    must_not:
      - change_patch_identity
      - change_source_authority
      - define_new_patch_standard

patch_reference_registry:
  introduced_by: PATCH-001A.PRE-002
  status: active

  canonical_identity_rule:
    rule: canonical_patch_id_remains_authoritative
    applies_to:
      - manifest_patch_id
      - patch_filename
      - roadmap_reference
      - dependency_reference

  short_handle_rule:
    rule: short_handle_is_user_command_alias_only
    must_resolve_to_registered_canonical_id: true
    unknown_handle_result: block_or_ask

  format:
    main_patch:
      canonical: PATCH-NNNX
      handle: P<N>X
      example:
        canonical_id: PATCH-001A
        short_handle: P1A

    prerequisite_patch:
      canonical: PATCH-NNNX.PRE-NNN
      handle: P<N>X-PR<N>
      example:
        canonical_id: PATCH-001A.PRE-002
        short_handle: P1A-PR2

  registry:
    - canonical_id: PATCH-001A
      short_handle: P1A
      title: cerebro_architecture_contracts

    - canonical_id: PATCH-001A.PRE-001
      short_handle: P1A-PR1
      title: builder_contract_prerequisite
      status: applied
      commit: 5807dd2
      trace_alias:
        - PATCH-BUILDER-ARCH-001

    - canonical_id: PATCH-001A.PRE-002
      short_handle: P1A-PR2
      title: command_language_and_delivery_modes
      status: applied_by_this_patch

    - canonical_id: PATCH-001B
      short_handle: P1B
      title: project_roadmap_contract

    - canonical_id: PATCH-001C
      short_handle: P1C
      title: bootengine_alignment

    - canonical_id: PATCH-002
      short_handle: P2
      title: universal_object_contract

patch_delivery_modes:
  introduced_by: PATCH-001A.PRE-002
  owner: tooling.builder
  governing_standard: standards/patch-package.yaml

  authority_rule:
    rule: execution_or_delivery_mode_does_not_change_patch_authority
    generated_artifacts_authoritative: false

  preferred_order:
    - FULL
    - EXEC
    - PSHELL

  modes:
    FULL:
      meaning: full_patch_package
      status: canonical_patch_package_delivery
      produces:
        - patch_package_directory
        - packaged_patch_artifact
      requires:
        - manifest
        - payload
        - sha256_digests
        - generation_baseline_record
        - validation_record
      must_follow:
        - standards/patch-package.yaml
        - builder_contract

    EXEC:
      meaning: executable_or_self_running_local_patch_package
      status: authorized_local_execution_delivery
      produces:
        - patch_package_with_runner_or_installer_entrypoint
      requires:
        - manifest_defined_scope
        - baseline_verification
        - digest_verification
        - explicit_user_execution
      must_not:
        - define_new_patch_standard
        - install_missing_dependencies
        - bypass_patch_package_standard

    PSHELL:
      meaning: powershell_manual_transport
      status: fallback_transport_mode
      produces:
        - visible_powershell_commands
      allowed_when:
        - file_download_delivery_fails
        - direct_connected_execution_unavailable
        - user_explicitly_selects_pshell
      requires:
        - same_declared_patch_content_as_builder_output
        - visible_mutation_steps
        - explicit_repo_path_or_workspace_binding
        - git_commands_when_available
      must_not:
        - become_canonical_patch_format
        - bypass_builder_contract
        - hide_mutation_steps
        - change_patch_identity

example_commands:
  - input: BUILD PATCH-001A FULL
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: FULL

  - input: BUILD PATCH-001A EXEC
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: EXEC

  - input: BUILD PATCH-001A PSHELL
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A
      mode: PSHELL

  - input: build P1A-PR2 pshell
    resolves_to:
      command: BUILD
      canonical_id: PATCH-001A.PRE-002
      short_handle: P1A-PR2
      mode: PSHELL

# END PATCH-001A.PRE-002 COMMAND AND DELIVERY MODES


# BEGIN PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT

pshell_required_minimum_delivery:
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder
  governing_standard: standards/patch-package.yaml

  rule: PSHELL_delivery_mode_is_required_minimum_local_delivery_for_local_patches_unless_explicitly_excluded

  rationale:
    - regular_chat_has_no_local_terminal
    - Work_or_DIRECT_mode_is_not_always_available
    - downloadable_artifacts_may_fail
    - user_local_powershell_execution_is_verified_working

  constraints:
    - PSHELL_is_transport_not_patch_authority
    - PSHELL_must_use_registered_canonical_patch_id
    - PSHELL_must_use_registered_short_handle
    - PSHELL_must_not_create_new_patch_standard
    - PSHELL_must_not_hide_mutation_steps
    - PSHELL_must_follow_builder_contract_and_patch_package_standard

pshell_result_contract:
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder

  requirement:
    every_pshell_patch_must_end_with_clear_human_readable_result_block: true
    raw_git_output_is_not_sufficient_as_final_patch_feedback: true
    user_must_not_have_to_infer_patch_state_from_diff_or_git_output: true

  result_block_required_fields:
    - patch_id
    - short_handle
    - delivery_mode
    - repo_path
    - baseline_status
    - file_change_status
    - git_add_status
    - commit_status
    - push_status
    - worktree_status
    - final_state
    - user_action_required
    - next_command

  final_states:
    - SUCCESS_PUSHED
    - SUCCESS_LOCAL_COMMIT
    - SUCCESS_STAGED_ONLY
    - SUCCESS_APPLIED_NOT_STAGED
    - ALREADY_APPLIED
    - BLOCKED_USER_INPUT_REQUIRED
    - BLOCKED_GIT_REQUIRED
    - BLOCKED_BASELINE_MISMATCH
    - FAILED_NO_MUTATION
    - FAILED_PARTIAL_REQUIRES_ATTENTION

pshell_sync_receipt_contract:
  cleanup_record:
    introduced_by: PATCH-001A.PRE-004
    short_handle: P1A-PR4
    action: removed_overlapping_previous_P1A_PR3_state_contract_block
    retained_contract: PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT
    reason:
      - prevent_duplicate_pshell_result_contracts
      - preserve_single_current_pshell_sync_receipt_contract
      - remove_ambiguity_before_PATCH-001A
  introduced_by: PATCH-001A.PRE-003
  short_handle: P1A-PR3
  status: active
  owner: tooling.builder

  purpose:
    - provide_machine_friendly_patch_completion_confirmation
    - allow_user_to_report_patch_state_compactly
    - trigger_assistant_repo_refresh_before_next_patch_decision
    - bind_patch_result_to_commit_worktree_and_target_file_hash

  receipt_line:
    canonical_prefix: CEREBRO_SYNC
    format: CEREBRO_SYNC PATCH=<patch_id> HANDLE=<short_handle> MODE=<delivery_mode> STATE=<final_state> BRANCH=<branch> COMMIT=<commit> WORKTREE=<worktree> RECEIPT=<sha256>

  receipt_hash:
    algorithm: SHA256
    generated_after:
      - final_git_status_check
      - final_state_resolution
    includes:
      - patch_id
      - short_handle
      - delivery_mode
      - final_state
      - branch
      - commit
      - worktree
      - target_file_sha256_after

  assistant_behavior_on_cerebro_sync:
    - treat_sync_line_as_user_reported_execution_receipt_and_refresh_trigger
    - do_not_treat_receipt_as_source_authority
    - fetch_current_authoritative_repo_state_before_next_patch_decision
    - verify_expected_file_or_commit_when_possible
    - then_update_patch_status

# END PATCH-001A.PRE-003 PSHELL RESULT AND SYNC RECEIPT CONTRACT
