      - git_diff_check
      - expected_change_check
      - unexpected_change_rejection
      - automatic_cerebro_sync
      - deterministic_receipt

  completion:
    required:
      - local_validation_pass
      - one_intentional_commit
      - successful_push
      - clean_worktree
      - external_commit_verification

# END PATCH-001C.POST-001 STREAMLINED PATCH WORKFORM
# BEGIN PATCH-002.PRE-001 LEVEL 3 PAYLOAD PARTITIONING

level_3_payload_partitioning:
  introduced_by: PATCH-002.PRE-001
  contract_ref: standards/development/streamlined-patch-workform.yaml
  owner: tooling.builder
  status: locked

  selection_required_before_serialization: true
  thresholds:
    evaluate_partitioning_lines: 250
